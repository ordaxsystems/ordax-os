<!doctype html>
<html lang="pt-BR" data-meridian>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OrdaX Windows Emulator</title>
  <link rel="stylesheet" href="/system/surface/ui/meridian.tokens.css"/>
  <style>
    html,body {margin:0;width:100%;height:100%;overflow:hidden;}
    body {display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--md-canvas);color:var(--md-ink);}
    #ordax-emulator-surface {display:block;grid-row:2;min-height:0;width:100%;height:100%;border:0;}
    .ordax-emulator-controls {grid-row:1;font:12px/20px var(--md-font);background:var(--md-surface);border-bottom:1px solid var(--md-border);padding:6px 12px;}
    .ordax-emulator-controls summary {cursor:pointer;}
    .ordax-emulator-controls button {margin-top:8px;min-height:32px;border:1px solid var(--md-border);border-radius:var(--md-radius-small);background:var(--md-subtle);color:var(--md-ink);cursor:pointer;}
    .ordax-emulator-controls :is(summary,button):focus-visible {outline:2px solid var(--md-focus);outline-offset:2px;}
  </style>
</head>
<body>
  <iframe id="ordax-emulator-surface" title="OrdaX Surface Native" src="about:blank" data-surface-src="/system/composition/native/index.html"></iframe>
  <details class="ordax-emulator-controls">
    <summary>Emulador · sem kernel</summary>
    <button id="ordax-emulator-reset" type="button">Reiniciar primeiro uso</button>
    <span id="ordax-emulator-status" role="status"></span>
  </details>
  <script type="module" src="/tools/windows-emulator/main.mjs"></script>
</body>
</html>
