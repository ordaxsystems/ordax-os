name: Meridian Snapshot Regeneration Audit

on:
  pull_request:
    paths:
      - '.github/workflows/meridian-snapshot-regeneration-audit.yml'

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/public-meridian-playground-source-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run canonical public Surface snapshot generator
        run: node tools/public-site/surface_snapshot.mjs
      - name: Run canonical playground fixture generator
        run: python tools/public-site/playground_fixture.py --write
      - name: Export changed public artifacts for audited branch update
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=False
          ).decode("utf-8").strip("\0").split("\0")
          if not changed or len(changed) > 20:
              raise SystemExit("Unexpected number of public generated outputs")
          for path in sorted(changed):
              source = pathlib.PurePosixPath(path)
              if not path.startswith("sites/public/") or ".." in source.parts:
                  raise SystemExit(f"Generator unexpectedly changed nonpublic file {path!r}")
              data = pathlib.Path(path).read_bytes()
              if len(data) > 5_000_000:
                  raise SystemExit(f"Generator output exceeds capped artifact size {path}")
              digest = hashlib.sha256(data).hexdigest()
              print(f"ORDAX_GENERATED_BEGIN|{path}|{len(data)}|{digest}", flush=True)
              encoded = base64.b64encode(data).decode("ascii")
              for i in range(0, len(encoded), 4000):
                  print(f"ORDAX_GENERATED_PART|{path}|{i // 4000}|{encoded[i:i+4000]}", flush=True)
              print(f"ORDAX_GENERATED_END|{path}", flush=True)
          print(f"ORDAX_GENERATED_COMPLETE={len(changed)}", flush=True)
          PY
