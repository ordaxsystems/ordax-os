name: Memory Entitlement Client Boundary

on:
  pull_request:
    paths:
      - 'system/contracts/entitlements.mjs'
      - 'system/adapters/web/entitlements.mjs'
      - 'tests/test_memory_entitlement_web_adapter.mjs'
      - '.github/workflows/memory-entitlement-client-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/entitlements.mjs'
      - 'system/adapters/web/entitlements.mjs'
      - 'tests/test_memory_entitlement_web_adapter.mjs'
      - '.github/workflows/memory-entitlement-client-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-entitlement-client-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check system/adapters/web/entitlements.mjs
          node --check tests/test_memory_entitlement_web_adapter.mjs

      - name: Prove fail-closed same-origin entitlement resolution
        run: |
          set -euo pipefail
          node --test tests/test_memory_entitlement_web_adapter.mjs
