name: English MVP Localization Audit

on:
  push:
    branches: [main]
    paths:
      - 'system/services/i18n/**'
      - 'system/services/diagnostics/**'
      - 'system/services/intelligence/**'
      - 'system/services/notifications/**'
      - 'system/composition/native/diagnostics.mjs'
      - 'system/surface/ui/**'
      - 'system/surface/runtime/native_security_prompt_i18n.py'
      - 'system/apps/**'
      - 'system/adapters/web/browser-session.mjs'
      - 'system/adapters/native/browser-session.mjs'
      - 'system/contracts/browser-session.mjs'
      - 'system/contracts/first-run-state-store.mjs'
      - 'system/contracts/locale-profile.mjs'
      - 'system/contracts/localization.mjs'
      - 'system/contracts/notifications.mjs'
      - 'system/services/i18n/interpolation.mjs'
      - 'system/contracts/localization-pack.mjs'
      - 'system/contracts/surface-render-lifecycle.mjs'
      - 'tools/localization/**'
      - 'docs/LOCALIZATION.md'
      - 'docs/LOCALIZATION-PACKS.md'
      - 'docs/contracts/first-run.json'
      - 'docs/contracts/localization.json'
      - 'docs/contracts/localization-packs.json'
      - 'docs/contracts/app-distribution.json'
      - 'tests/test_diagnostic_summary_localization.mjs'
      - 'tests/test_english_mvp_localization_audit.mjs'
      - 'tests/test_english_surface_rendering_audit.mjs'
      - 'tests/test_localization_formatting_foundation.mjs'
      - 'tests/test_localization_interpolation_foundation.mjs'
      - 'tests/test_notification_interpolation_contract.mjs'
      - 'tests/test_notifications.mjs'
      - 'tests/test_localization_pack_contract.mjs'
      - 'tests/test_first_party_app_localization_contract.mjs'
      - 'tests/test_component_localization.mjs'
      - 'tests/test_localization_pseudo_rtl_reconvergence.mjs'
      - 'tests/test_surface_localization.mjs'
      - 'tests/test_intelligence_client_actions.mjs'
      - 'tests/test_browser_unavailable_localization.mjs'
      - 'tests/test_native_security_prompt_english_audit.py'
      - '.github/workflows/english-mvp-localization-audit.yml'
  pull_request:
    paths:
      - 'system/services/i18n/**'
      - 'system/services/diagnostics/**'
      - 'system/services/intelligence/**'
      - 'system/services/notifications/**'
      - 'system/composition/native/diagnostics.mjs'
      - 'system/surface/ui/**'
      - 'system/surface/runtime/native_security_prompt_i18n.py'
      - 'system/apps/**'
      - 'system/adapters/web/browser-session.mjs'
      - 'system/adapters/native/browser-session.mjs'
      - 'system/contracts/browser-session.mjs'
      - 'system/contracts/first-run-state-store.mjs'
      - 'system/contracts/locale-profile.mjs'
      - 'system/contracts/localization.mjs'
      - 'system/contracts/notifications.mjs'
      - 'system/services/i18n/interpolation.mjs'
      - 'system/contracts/localization-pack.mjs'
      - 'system/contracts/surface-render-lifecycle.mjs'
      - 'tools/localization/**'
      - 'docs/LOCALIZATION.md'
      - 'docs/LOCALIZATION-PACKS.md'
      - 'docs/contracts/first-run.json'
      - 'docs/contracts/localization.json'
      - 'docs/contracts/localization-packs.json'
      - 'docs/contracts/app-distribution.json'
      - 'tests/test_diagnostic_summary_localization.mjs'
      - 'tests/test_english_mvp_localization_audit.mjs'
      - 'tests/test_english_surface_rendering_audit.mjs'
      - 'tests/test_localization_formatting_foundation.mjs'
      - 'tests/test_localization_interpolation_foundation.mjs'
      - 'tests/test_notification_interpolation_contract.mjs'
      - 'tests/test_notifications.mjs'
      - 'tests/test_localization_pack_contract.mjs'
      - 'tests/test_first_party_app_localization_contract.mjs'
      - 'tests/test_component_localization.mjs'
      - 'tests/test_localization_pseudo_rtl_reconvergence.mjs'
      - 'tests/test_surface_localization.mjs'
      - 'tests/test_intelligence_client_actions.mjs'
      - 'tests/test_browser_unavailable_localization.mjs'
      - 'tests/test_native_security_prompt_english_audit.py'
      - '.github/workflows/english-mvp-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-mvp-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Audit localization contracts, complete en-US Surface and First Run catalogs
        run: |
          set -euo pipefail
          node --version
          node --check tests/test_localization_pack_contract.mjs
          node --test tests/test_localization_pack_contract.mjs
          node --check tests/test_first_party_app_localization_contract.mjs
          node --test tests/test_first_party_app_localization_contract.mjs
          node --check tests/test_component_localization.mjs
          node --test tests/test_component_localization.mjs
          node --check tests/test_localization_pseudo_rtl_reconvergence.mjs
          node --test tests/test_localization_pseudo_rtl_reconvergence.mjs
          node --check tests/test_localization_formatting_foundation.mjs
          node --test tests/test_localization_formatting_foundation.mjs
          node --check tests/test_localization_interpolation_foundation.mjs
          node --test tests/test_localization_interpolation_foundation.mjs
          node --check tests/test_notification_interpolation_contract.mjs
          node --test tests/test_notification_interpolation_contract.mjs
          node --test tests/test_notifications.mjs
          node --check tests/test_surface_localization.mjs
          node --test tests/test_surface_localization.mjs
          node --check tests/test_english_mvp_localization_audit.mjs
          node --test tests/test_english_mvp_localization_audit.mjs
          node --check tests/test_english_surface_rendering_audit.mjs
          node --test tests/test_english_surface_rendering_audit.mjs
          node --check tests/test_diagnostic_summary_localization.mjs
          node --test tests/test_diagnostic_summary_localization.mjs
          node --check tests/test_intelligence_client_actions.mjs
          node --test tests/test_intelligence_client_actions.mjs
          node --check tests/test_browser_unavailable_localization.mjs
          node --test tests/test_browser_unavailable_localization.mjs

      - name: Audit Native security prompt en-US catalog
        run: |
          set -euo pipefail
          python -m unittest tests.test_native_security_prompt_english_audit -v
