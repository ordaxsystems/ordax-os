name: Native Buildroot Real Agent Bootstrap Proof

on:
  pull_request:
    branches: ['platform/remove-alpine']
    paths:
      - '.github/workflows/native-buildroot-real-agent-proof.yml'

permissions:
  contents: read
  actions: read

jobs:
  canonical-agent-private-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout OS workflow owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout pinned canonical Runtime probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-runtime
          ref: be6db9bf01c4b00701647b0150e316f09fa6394c
          path: runtime
          persist-credentials: false
      - name: Set up host Python for read-only artifact reconciliation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download exact OS Buildroot artifact from successful producer run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ordax-independent-python-abi-473aabac980b0bda9b6ea0f4d43987738ea80674
          repository: ordaxsystems/ordax-os
          run-id: 39882367206
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/private-buildroot
      - name: Verify artifact origin and never-install flags
        env:
          PROOF_ROOT: ${{ runner.temp }}/private-buildroot
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = Path(os.environ["PROOF_ROOT"])
          receipt = json.loads((proof / "native-python-provenance.json").read_text())
          assert receipt["device_install_authorized"] is False
          assert receipt["runtime_agent_packaged"] is False
          assert receipt["private_target_build_input"]["sha256"] == "6d043cc1a74ff409aa9af5949831ea633517a0ad6d242dccd2ed0d55ad6cda4d"
          assert receipt["python_abi"]["python_sha256"] == "e2288ceba1b3400cf6b62aa6c053371cb4e32f28410494f5732aaf25517856c0"
          assert (proof / "native-python-build-input.rootfs.tar").is_file()
          PY
      - name: Exercise canonical agent with verified private musl Python
        working-directory: runtime
        env:
          PROOF_ROOT: ${{ runner.temp }}/private-buildroot
        run: |
          set -euo pipefail
          set +e
          python3 -m tools.ci.probe_native_buildroot_agent --receipt "$PROOF_ROOT/native-python-provenance.json" --private-target-tar "$PROOF_ROOT/native-python-build-input.rootfs.tar" --stage-private-target > "$RUNNER_TEMP/ordax-native-bootstrap-result.json"
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/ordax-native-bootstrap-result.json" "$status" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          exit_code = int(sys.argv[2])
          assert report.get("device_install_authorized") is False
          assert report.get("schema") == "ordax.native-buildroot-agent-bootstrap-probe/1"
          if exit_code == 0:
              assert report.get("offline_bootstrap_proven") is True
              print("OFFLINE_BOOTSTRAP_PROVEN (not an OS installation or session attestation)")
          elif exit_code == 1 and report.get("failure") == "native_missing_import":
              missing = report.get("missing_module")
              assert isinstance(missing, str) and 0 < len(missing) <= 128
              print("MEASURED_BLOCKER: native_missing_import=" + missing)
          else:
              raise SystemExit("Native bootstrap proof invalid or unexpected blocker: " + repr(report))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("Native Buildroot agent result: " + json.dumps(report, sort_keys=True) + "\n")
          PY
      - name: Archive factual proof, never release or install
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-buildroot-agent-bootstrap-diagnostic
          path: ${{ runner.temp }}/ordax-native-bootstrap-result.json
          if-no-files-found: ignore
          retention-days: 7
