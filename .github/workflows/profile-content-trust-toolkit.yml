name: Profile Content Trust Toolkit

on:
  push:
    branches: [main]
    paths:
      - 'tools/profile-content-channel/**'
      - 'docs/contracts/profile-content-trust-policy.json'
      - 'docs/contracts/profile-provisioning.json'
      - 'docs/PROFILE-CONTENT-TRUST-CEREMONY.md'
      - '.github/workflows/profile-content-trust-toolkit.yml'
  pull_request:
    paths:
      - 'tools/profile-content-channel/**'
      - 'docs/contracts/profile-content-trust-policy.json'
      - 'docs/contracts/profile-provisioning.json'
      - 'docs/PROFILE-CONTENT-TRUST-CEREMONY.md'
      - '.github/workflows/profile-content-trust-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Test Profile content channel
        run: |
          set -euo pipefail
          (cd tools/profile-content-channel && go test -count=1 ./...)
      - name: Build Windows Profile content trust toolkit
        run: |
          set -euo pipefail
          out="$PWD/out/profile-content-trust-toolkit"
          mkdir -p "$out"
          (
            cd tools/profile-content-channel
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../../out/profile-content-trust-toolkit/ordax-profile-content-channel.exe .
          )
          cp tools/profile-content-channel/windows/1-Verify-OrdaXProfileContentTrustToolkit.cmd "$out/"
          cp tools/profile-content-channel/windows/2-Initialize-OrdaXProfileContentTrust.cmd "$out/"
          cp tools/profile-content-channel/windows/3-Verify-OrdaXProfileContentTrustRecovery.cmd "$out/"
          cp tools/profile-content-channel/windows/Initialize-OrdaXProfileContentTrust.ps1 "$out/"
          cp tools/profile-content-channel/windows/Complete-OrdaXProfileContentTrust.ps1 "$out/"
          cp docs/PROFILE-CONTENT-TRUST-CEREMONY.md "$out/"
          cp docs/contracts/profile-content-trust-policy.json "$out/profile-content-trust-policy.json"
      - name: Emit hashes and provenance
        run: |
          set -euo pipefail
          out="$PWD/out/profile-content-trust-toolkit"
          (cd "$out" && sha256sum ordax-profile-content-channel.exe *.cmd *.ps1 PROFILE-CONTENT-TRUST-CEREMONY.md profile-content-trust-policy.json > SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path('out/profile-content-trust-toolkit')
          def digest(name): return hashlib.sha256((root/name).read_bytes()).hexdigest()
          policy=json.loads(pathlib.Path('docs/contracts/profile-content-trust-policy.json').read_text())
          provisioning=json.loads(pathlib.Path('docs/contracts/profile-provisioning.json').read_text())
          prerequisites={
            'trust_policy_fail_closed': (
              policy.get('$schema') == 'prototype-ordax.profile-content-trust-policy/1'
              and policy.get('status') == 'operator-ceremony-not-started'
              and policy.get('public_anchor',{}).get('pinned') is False
              and policy.get('current_gates',{}).get('profile_content_publish_allowed') is False
              and policy.get('current_gates',{}).get('profile_content_install_allowed') is False
              and policy.get('current_gates',{}).get('profile_content_activation_allowed') is False
            ),
            'receipt_inventory_executor_complete': set(provisioning.get('completed_gates',[])) >= {
              'trusted-receipt-and-inventory-commit-after-verified-stage-health',
              'trusted-profile-provisioning-executor-verifies-package-writes-receipt-and-inventory',
              'profile-health-and-rollback',
              'surface-profile-catalog-ui',
            },
            'first_public_profile_proof_still_pending': provisioning.get('next_gates') == ['first-public-profile-proof'],
            'public_install_still_blocked': provisioning.get('mvp',{}).get('public_profile_install_enabled') is False,
          }
          canonical=(os.environ['GITHUB_REPOSITORY']=='ordaxsystems/ordax-os' and os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/main')
          data={
            '$schema':'prototype-ordax.profile-content-trust-toolkit/1',
            'status':'candidate',
            'source_commit':os.environ['GITHUB_SHA'],
            'source_repository':os.environ['GITHUB_REPOSITORY'],
            'source_ref':os.environ['GITHUB_REF'],
            'source_event':os.environ['GITHUB_EVENT_NAME'],
            'key_id':'ordax-profile-content-v1',
            'canonical_profile_content_trust_ceremony_eligible': canonical and all(prerequisites.values()),
            'canonical_profile_content_trust_prerequisites':prerequisites,
            'go_version':subprocess.check_output(['go','version'],text=True).strip(),
            'private_key_included':False,
            'canonical_public_trust_included':False,
            'key_generation_requires_local_user_action':True,
            'whole_os_release_key_reuse_allowed':False,
            'runtime_component_key_reuse_allowed':False,
            'policy_sha256':digest('profile-content-trust-policy.json'),
            'ceremony_doc_sha256':digest('PROFILE-CONTENT-TRUST-CEREMONY.md'),
            'components':{
              'profile_content_signer':{'name':'ordax-profile-content-channel.exe','sha256':digest('ordax-profile-content-channel.exe')},
              'trust_initializer':{'name':'Initialize-OrdaXProfileContentTrust.ps1','sha256':digest('Initialize-OrdaXProfileContentTrust.ps1')},
              'trust_recovery_finalizer':{'name':'Complete-OrdaXProfileContentTrust.ps1','sha256':digest('Complete-OrdaXProfileContentTrust.ps1')},
            },
          }
          (root/'provenance.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
      - name: Assert toolkit is public-only and fail-closed
        run: |
          set -euo pipefail
          out="$PWD/out/profile-content-trust-toolkit"
          test -z "$(find "$out" -type f \( -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' \) -print -quit)"
          python3 - <<'PY'
          import json, os, pathlib
          p=json.loads(pathlib.Path('out/profile-content-trust-toolkit/provenance.json').read_text())
          assert p['private_key_included'] is False
          assert p['canonical_public_trust_included'] is False
          assert p['key_generation_requires_local_user_action'] is True
          assert all(isinstance(v,bool) for v in p['canonical_profile_content_trust_prerequisites'].values())
          canonical=(os.environ['GITHUB_REPOSITORY']=='ordaxsystems/ordax-os' and os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/main')
          assert p['canonical_profile_content_trust_ceremony_eligible'] is (canonical and all(p['canonical_profile_content_trust_prerequisites'].values()))
          print('PROFILE_CONTENT_TRUST_TOOLKIT_SECRET_MATERIAL=NONE')
          print('PROFILE_CONTENT_TRUST_TOOLKIT_CANONICAL_KEY_INCLUDED=NO')
          PY
      - name: Upload Profile content trust toolkit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-profile-content-trust-toolkit-${{ github.sha }}
          path: out/profile-content-trust-toolkit/
          if-no-files-found: error
          retention-days: 14

  windows-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse Profile content trust PowerShell natively
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($scriptPath in @(
            'tools/profile-content-channel/windows/Initialize-OrdaXProfileContentTrust.ps1',
            'tools/profile-content-channel/windows/Complete-OrdaXProfileContentTrust.ps1'
          )){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -ne 0){ throw "PowerShell parse failed: $scriptPath" }
          }
          Write-Host 'PROFILE_CONTENT_TRUST_POWERSHELL_PARSE=PASS'
