name: Surface Runtime Candidate

on:
  pull_request:
    paths:
      - 'bootstrap/surface-runtime/**'
      - 'bootstrap/base/alpine_core.py'
      - 'bootstrap/stable-base/source.json'
      - 'tests/test_surface_runtime_source_contract.py'
      - '.github/workflows/surface-runtime-lock-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install bounded runtime build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot erofs-utils util-linux

      - name: Validate offline runtime source contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_surface_runtime_source_contract -v
          python -m py_compile bootstrap/surface-runtime/discover_lock.py bootstrap/surface-runtime/build.py

      - name: Revalidate full transitive Alpine package lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surface-runtime"
          python bootstrap/surface-runtime/discover_lock.py             --cache-dir "$RUNNER_TEMP/surface-runtime/cache"             --out "$RUNNER_TEMP/surface-runtime/surface-runtime-lock.json"

          python - "$RUNNER_TEMP/surface-runtime/surface-runtime-lock.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result['status'] == 'verified-pinned-lock'
          assert result['first_boot_offline_required'] is True
          assert result['physical_artifact_created'] is False
          assert result['physical_write_authorized'] is False
          assert result['portable_v3_boot_handoff_candidate_connected'] is True
          assert result['physical_boot_connected'] is False
          assert result['resolved_package_count'] == len(result['apk_package_lock'])
          assert result['resolved_package_count'] >= len(result['requested_packages'])
          print('SURFACE_RUNTIME_PINNED_LOCK=PASS')
          print('SURFACE_RUNTIME_PROMOTABLE=NO')
          PY

      - name: Build candidate runtime twice
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/surface-runtime"
          python bootstrap/surface-runtime/build.py build \
            --cache-dir "$work/cache" \
            --out-dir "$work/build-a"
          python bootstrap/surface-runtime/build.py verify \
            --out-dir "$work/build-a"

          python bootstrap/surface-runtime/build.py build \
            --cache-dir "$work/cache" \
            --out-dir "$work/build-b"
          python bootstrap/surface-runtime/build.py verify \
            --out-dir "$work/build-b"

      - name: Prove byte-reproducible EROFS runtime
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/surface-runtime"
          a="$work/build-a/native-surface-runtime.erofs"
          b="$work/build-b/native-surface-runtime.erofs"

          python - \
            "$work/build-a/surface-runtime-provenance.json" \
            "$work/build-b/surface-runtime-provenance.json" \
            "$work/build-a/surface-runtime-tree.json" \
            "$work/build-b/surface-runtime-tree.json" <<'PY'
          import json, pathlib, sys
          pa, pb, ta, tb = map(pathlib.Path, sys.argv[1:])
          a = json.loads(pa.read_text())
          b = json.loads(pb.read_text())
          tree_a = json.loads(ta.read_text())
          tree_b = json.loads(tb.read_text())

          print("TREE_A_SHA256", a['tree_manifest_sha256'])
          print("TREE_B_SHA256", b['tree_manifest_sha256'])
          print("TAR_A_SHA256", a['normalized_tar_sha256'])
          print("TAR_B_SHA256", b['normalized_tar_sha256'])
          print("EROFS_A_SHA256", a['image']['sha256'])
          print("EROFS_B_SHA256", b['image']['sha256'])

          by_path_a = {entry['path']: entry for entry in tree_a['entries']}
          by_path_b = {entry['path']: entry for entry in tree_b['entries']}
          differing = [
              path for path in sorted(set(by_path_a) | set(by_path_b))
              if by_path_a.get(path) != by_path_b.get(path)
          ]
          if differing:
              print("SURFACE_RUNTIME_TREE_DIFFERENCES", len(differing))
              for path in differing[:40]:
                  print("DIFF", path)
                  print(" A", by_path_a.get(path))
                  print(" B", by_path_b.get(path))
              raise SystemExit("Surface runtime rootfs tree is not reproducible")

          assert a['status'] == b['status'] == 'candidate-not-promotable'
          assert a['tree_manifest_sha256'] == b['tree_manifest_sha256']
          assert a['normalized_tar_sha256'] == b['normalized_tar_sha256']
          assert a['image']['sha256'] == b['image']['sha256']
          assert a['image']['size'] == b['image']['size']
          assert a['apk_package_lock_count'] == b['apk_package_lock_count'] == 253
          assert a['first_boot_offline_required'] is True
          assert a['network_package_install_during_stable_boot_allowed'] is False
          assert a['machine_identity_baked_into_image'] is False
          assert b['machine_identity_baked_into_image'] is False
          assert a['fontconfig_cache_baked_into_image'] is False
          assert b['fontconfig_cache_baked_into_image'] is False
          assert a['physical_artifact_authorized'] is False
          assert a['portable_v3_boot_handoff_candidate_connected'] is True
          assert a['physical_boot_connected'] is False
          PY

          sha_a="$(sha256sum "$a" | awk '{print $1}')"
          sha_b="$(sha256sum "$b" | awk '{print $1}')"
          echo "EROFS_CURRENT_A_SHA256=$sha_a"
          echo "EROFS_CURRENT_B_SHA256=$sha_b"
          if [ "$sha_a" != "$sha_b" ]; then
            echo "First differing EROFS bytes:"
            cmp -l "$a" "$b" | head -n 32 || true
            exit 1
          fi
          cmp "$a" "$b"
          echo 'SURFACE_RUNTIME_EROFS_REPEAT_DIGEST=PASS'

      - name: Generate operator Surface provenance receipt
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/release-signing/operator_receipt.py \
            --kind surface \
            --source-commit "$GITHUB_SHA" \
            --file "native-surface-runtime.erofs=$RUNNER_TEMP/surface-runtime/build-a/native-surface-runtime.erofs" \
            --out "$RUNNER_TEMP/surface-runtime/build-a/operator-receipt.json"

      - name: Upload operator Surface EROFS only on manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: canonical-v4-operator-surface-${{ github.sha }}
          path: |
            ${{ runner.temp }}/surface-runtime/build-a/native-surface-runtime.erofs
            ${{ runner.temp }}/surface-runtime/build-a/operator-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove unpromoted runtime image bytes
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/surface-runtime"
          rm -f "$work/build-a/native-surface-runtime.erofs" "$work/build-b/native-surface-runtime.erofs"
          test ! -e "$work/build-a/native-surface-runtime.erofs"
          test ! -e "$work/build-b/native-surface-runtime.erofs"

      - name: Upload proof metadata only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: surface-runtime-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/surface-runtime/surface-runtime-lock.json
            ${{ runner.temp }}/surface-runtime/build-a/surface-runtime-provenance.json
            ${{ runner.temp }}/surface-runtime/build-b/surface-runtime-provenance.json
            ${{ runner.temp }}/surface-runtime/build-a/surface-runtime-tree.json
            ${{ runner.temp }}/surface-runtime/build-b/surface-runtime-tree.json
          if-no-files-found: error
          retention-days: 14
