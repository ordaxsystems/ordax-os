name: Service Quota Contract

on:
  pull_request:
    paths:
      - 'system/contracts/service-quota.mjs'
      - 'system/services/entitlements/**'
      - 'infra/supabase/functions/_shared/account_subscription.mjs'
      - 'infra/supabase/functions/_shared/account_transport_admission.mjs'
      - 'infra/supabase/functions/ordax-account-gateway/index.ts'
      - 'infra/supabase/product/migrations/*commerce_subscription*'
      - 'infra/supabase/product/migrations/*display_name_column_write*'
      - 'infra/supabase/product/migrations/*preferred_locale*'
      - 'infra/supabase/product/migrations/*optional_communications*'
      - 'infra/supabase/product/migrations/*account_export_preferences*'
      - 'tests/test_account_export_preferences_source.mjs'
      - 'tests/sql/test_account_optional_communications_v1.sql'
      - 'tests/test_account_optional_communications_source.mjs'
      - 'tools/account/prove_gateway_negative_boundary.mjs'
      - 'tests/test_account_gateway_release_negative_proof.mjs'
      - 'tools/account/prove_gateway_deployed_source_parity.py'
      - 'tests/test_account_gateway_deployed_source_parity.py'
      - '.github/workflows/ordax-public-account-gateway-destination.yml'
      - 'tests/test_account_logout_confirmed_revocation.mjs'
      - 'infra/supabase/functions/_shared/account_local_signout.mjs'
      - '.github/workflows/ordax-account-gateway-destination.yml'
      - 'tests/sql/test_account_preferred_locale_v1.sql'
      - 'tests/test_account_locale_gateway_source.mjs'
      - 'tests/test_account_session_display_name_source.mjs'
      - 'tests/test_account_display_name_gateway_source.mjs'
      - 'tests/test_account_export_session_flag.mjs'
      - 'tests/test_account_session_auth_dates.mjs'
      - 'tests/sql/test_account_display_name_write_v1.sql'
      - 'tests/test_account_subscription_projection.mjs'
      - 'tests/test_account_transport_admission.mjs'
      - 'tests/sql/test_account_commerce_subscription_read_v1.sql'
      - 'docs/contracts/service-quotas.json'
      - 'infra/supabase/product/migrations/*service_quota*'
      - 'tests/test_service_quota.mjs'
      - 'tests/test_service_quota_ledger.py'
      - 'tests/test_service_quota_ledger_concurrency.sh'
      - 'tests/sql/test_service_quota_ledger_v1.sql'
      - 'tests/sql/test_service_quota_usage_reduction_v1.sql'
      - '.github/workflows/service-quota-contract.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/service-quota.mjs'
      - 'system/services/entitlements/**'
      - 'infra/supabase/functions/_shared/account_subscription.mjs'
      - 'infra/supabase/functions/_shared/account_transport_admission.mjs'
      - 'infra/supabase/functions/ordax-account-gateway/index.ts'
      - 'infra/supabase/product/migrations/*commerce_subscription*'
      - 'infra/supabase/product/migrations/*display_name_column_write*'
      - 'infra/supabase/product/migrations/*preferred_locale*'
      - 'infra/supabase/product/migrations/*optional_communications*'
      - 'infra/supabase/product/migrations/*account_export_preferences*'
      - 'tests/test_account_export_preferences_source.mjs'
      - 'tests/sql/test_account_optional_communications_v1.sql'
      - 'tests/test_account_optional_communications_source.mjs'
      - 'tools/account/prove_gateway_negative_boundary.mjs'
      - 'tests/test_account_gateway_release_negative_proof.mjs'
      - 'tools/account/prove_gateway_deployed_source_parity.py'
      - 'tests/test_account_gateway_deployed_source_parity.py'
      - '.github/workflows/ordax-public-account-gateway-destination.yml'
      - 'tests/test_account_logout_confirmed_revocation.mjs'
      - 'infra/supabase/functions/_shared/account_local_signout.mjs'
      - '.github/workflows/ordax-account-gateway-destination.yml'
      - 'tests/sql/test_account_preferred_locale_v1.sql'
      - 'tests/test_account_locale_gateway_source.mjs'
      - 'tests/test_account_session_display_name_source.mjs'
      - 'tests/test_account_display_name_gateway_source.mjs'
      - 'tests/test_account_export_session_flag.mjs'
      - 'tests/test_account_session_auth_dates.mjs'
      - 'tests/sql/test_account_display_name_write_v1.sql'
      - 'tests/test_account_subscription_projection.mjs'
      - 'tests/test_account_transport_admission.mjs'
      - 'tests/sql/test_account_commerce_subscription_read_v1.sql'
      - 'docs/contracts/service-quotas.json'
      - 'infra/supabase/product/migrations/*service_quota*'
      - 'tests/test_service_quota.mjs'
      - 'tests/test_service_quota_ledger.py'
      - 'tests/test_service_quota_ledger_concurrency.sh'
      - 'tests/sql/test_service_quota_ledger_v1.sql'
      - 'tests/sql/test_service_quota_usage_reduction_v1.sql'
      - '.github/workflows/service-quota-contract.yml'

permissions:
  contents: read

jobs:
  service-quota-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate quota SSOT and runtime
        run: |
          set -euo pipefail
          node --check system/contracts/service-quota.mjs
          node --check system/services/entitlements/quota.mjs
          node --check tests/test_service_quota.mjs
          python3 -m py_compile tests/test_service_quota_ledger.py
          node - <<'NODE'
          const fs = require('fs');
          const contract = JSON.parse(fs.readFileSync('docs/contracts/service-quotas.json', 'utf8'));
          const storage = contract.prepared_resources.find((item) => item.key === 'storage.user.bytes');
          if (!storage || storage.unit !== 'bytes' || storage.commercial_value_assigned !== false) {
            throw new Error('storage.user.bytes must remain a prepared, cost-unassigned bytes quota');
          }
          NODE
          node --test tests/test_service_quota.mjs
          node --check infra/supabase/functions/_shared/account_subscription.mjs
          node --test tests/test_account_subscription_projection.mjs tests/test_account_transport_admission.mjs
          node --test tests/test_account_display_name_gateway_source.mjs
          node --test tests/test_account_export_session_flag.mjs
          node --test tests/test_account_session_auth_dates.mjs
          node --test tests/test_account_locale_gateway_source.mjs tests/test_account_session_display_name_source.mjs
          node --test tests/test_account_optional_communications_source.mjs
          node --test tests/test_account_export_preferences_source.mjs
          node --test tests/test_account_gateway_release_negative_proof.mjs
          python -m unittest tests.test_account_gateway_deployed_source_parity -v
          node --test tests/test_account_logout_confirmed_revocation.mjs
          python3 -m unittest tests.test_service_quota_ledger

      - name: Prove quota ledger on PostgreSQL 16
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_service_quota_ledger_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_service_quota_usage_reduction_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_account_commerce_subscription_read_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_account_display_name_write_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_account_preferred_locale_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_account_optional_communications_v1.sql
          bash tests/test_service_quota_ledger_concurrency.sh
