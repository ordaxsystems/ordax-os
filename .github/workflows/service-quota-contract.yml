name: Service Quota Contract

on:
  pull_request:
    paths:
      - 'system/contracts/service-quota.mjs'
      - 'system/services/entitlements/**'
      - 'docs/contracts/service-quotas.json'
      - 'infra/supabase/product/migrations/*service_quota*'
      - 'tests/test_service_quota.mjs'
      - 'tests/test_service_quota_ledger.py'
      - 'tests/sql/test_service_quota_ledger_v1.sql'
      - '.github/workflows/service-quota-contract.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/service-quota.mjs'
      - 'system/services/entitlements/**'
      - 'docs/contracts/service-quotas.json'
      - 'infra/supabase/product/migrations/*service_quota*'
      - 'tests/test_service_quota.mjs'
      - 'tests/test_service_quota_ledger.py'
      - 'tests/sql/test_service_quota_ledger_v1.sql'
      - '.github/workflows/service-quota-contract.yml'

permissions:
  contents: read

jobs:
  service-quota-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate quota SSOT and runtime
        run: |
          set -euo pipefail
          node --check system/contracts/service-quota.mjs
          node --check system/services/entitlements/quota.mjs
          node --check tests/test_service_quota.mjs
          python3 -m py_compile tests/test_service_quota_ledger.py
          node - <<'NODE'
          const fs = require('fs');
          const contract = JSON.parse(fs.readFileSync('docs/contracts/service-quotas.json', 'utf8'));
          const storage = contract.prepared_resources.find((item) => item.key === 'storage.user.bytes');
          if (!storage || storage.unit !== 'bytes' || storage.commercial_value_assigned !== false) {
            throw new Error('storage.user.bytes must remain a prepared, cost-unassigned bytes quota');
          }
          NODE
          node --test tests/test_service_quota.mjs
          python3 -m unittest tests.test_service_quota_ledger

      - name: Prove quota ledger on PostgreSQL 16
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_service_quota_ledger_v1.sql
