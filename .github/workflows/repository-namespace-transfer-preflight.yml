name: Repository Namespace Transfer Preflight

on:
  pull_request:
    paths:
      - 'docs/contracts/repository-ownership.json'
      - 'docs/contracts/repository-migration-status.json'
      - 'docs/REPOSITORY-NAMESPACE-TRANSFER-PREFLIGHT.md'
      - 'tools/verify/repository_namespace_transfer_preflight.py'
      - 'tests/test_repository_namespace_transfer_preflight.py'
      - 'tools/verify/repository_namespace_stable_release.py'
      - 'tests/test_repository_namespace_stable_release.py'
      - 'docs/contracts/release-channel.json'
      - 'bootstrap/trust/release-ed25519.json'
      - '.github/workflows/repository-namespace-transfer-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/repository-ownership.json'
      - 'docs/contracts/repository-migration-status.json'
      - 'docs/REPOSITORY-NAMESPACE-TRANSFER-PREFLIGHT.md'
      - 'tools/verify/repository_namespace_transfer_preflight.py'
      - 'tests/test_repository_namespace_transfer_preflight.py'
      - 'tools/verify/repository_namespace_stable_release.py'
      - 'tests/test_repository_namespace_stable_release.py'
      - 'docs/contracts/release-channel.json'
      - 'bootstrap/trust/release-ed25519.json'
      - '.github/workflows/repository-namespace-transfer-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-owner-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate namespace transfer source contracts
        run: |
          set -euo pipefail
          for test_file in \
            test_repository_namespace_migration.py \
            test_repository_ownership_contract.py \
            test_repository_migration_status.py \
            test_repository_namespace_transfer_preflight.py; do
            python3 -m unittest discover -v -s tests -p "$test_file"
          done
          python3 tools/verify/repository_namespace_transfer_preflight.py --max-paths 8
          python3 -m unittest discover -v -s tests -p 'test_repository_namespace_stable_release.py'
      # Either slug can trigger the job; --require-cutover still requires the ONE
      # current SSOT owner, immutable numeric repository ID and bootstrap digest.
      # This is not a dual-owner authority or a redirect fallback.
      - name: Require exact GitHub identity after canonical transfer
        if: ${{ (github.repository == 'ordaxsystems/prototipo-ordax-os' || github.repository == 'ordaxsystems/ordax-os') }}
        run: |
          set -euo pipefail
          python3 tools/verify/repository_namespace_transfer_preflight.py --require-cutover
      - name: Install pinned Go verifier after physical transfer
        if: ${{ (github.repository == 'ordaxsystems/prototipo-ordax-os' || github.repository == 'ordaxsystems/ordax-os') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      # Production-channel acceptance belongs to main, not a transfer PR.
      # The pre-merge source and repository-ID checks above stay mandatory.
      # A missing signed stable release must still fail closed after cutover.
      - name: Require published stable Ed25519-signed release after transfer
        if: ${{ (github.repository == 'ordaxsystems/prototipo-ordax-os' || github.repository == 'ordaxsystems/ordax-os') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          # GitHub metadata proves stable publication, not signature.
          python3 tools/verify/repository_namespace_stable_release.py
          url="$(python3 -c 'import json; print(json.load(open("docs/contracts/release-channel.json"))["publication"]["latest_envelope_url"])')"
          # The canonical Go Release Agent cryptographically verifies the
          # signed envelope with the pinned local trust anchor, read-only.
          (
            cd bootstrap/release-acquisition
            GOTOOLCHAIN=local CGO_ENABLED=0 go run . inspect \
              --envelope-url "$url" \
              --trust ../../bootstrap/trust/release-ed25519.json \
              --repository "$GITHUB_REPOSITORY"
          )
