name: Public Site Candidate
on:
  push:
    branches: [main]
    paths:
      - "tools/vercel/**"
      - "docs/contracts/public-site-source.json"
      - "docs/contracts/public-site*.json"
      - "api/**"
      - "lib/account-proxy-core.mjs"
      - "infra/supabase/functions/**"
      - ".github/workflows/public-site-candidate.yml"
  pull_request:
    paths:
      - "tools/vercel/**"
      - "docs/contracts/public-site-source.json"
      - "docs/contracts/public-site*.json"
      - "api/**"
      - "lib/account-proxy-core.mjs"
      - "infra/supabase/functions/**"
      - "tests/test_public*.py"
      - ".github/workflows/public-site-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-site-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          check-latest: false
      - name: Validate OS-owned Identity, gateway, policy and release contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_external_site_source \
            tests.test_public_account_edge_gateway_source \
            tests.test_auth_provider_probe \
            tests.test_account_release_provider_proof \
            tests.test_control_plane_privilege_probe \
            tests.test_account_release_database_proof \
            tests.test_account_release_session_revocation_proof \
            tests.test_public_release_catalog \
            tests.test_public_identity_backend_prep \
            tests.test_public_identity_gateway \
            tests.test_public_mcp_usage_bridge \
            tests.test_pwned_passwords \
            tests.test_supabase_account_provider \
            tests.test_supabase_lifecycle_provider \
            tests.test_account_lifecycle_edge \
            tests.test_public_site_deployment \
            tests.test_public_canonical_host_redirects \
            tests.test_public_site_network_proof \
            tests.test_vercel_identity_preflight \
            tests.test_public_legal_readiness \
            tests.test_account_legal_policy_activation \
            tests.test_account_legacy_legal_quarantine \
            tests.test_public_auth_activation_preflight \
            tests.test_public_legal_hash_consistency -v
          node --test tests/test_public_site_vercel_proxy.mjs
          node --test tests/test_public_proxy_request_context.mjs
          node --test tests/test_public_proxy_vercel_oidc.mjs
          node --test tests/test_public_auth_edge_rate_limit.mjs
          node --test tests/test_public_account_edge_bounded_body.mjs
          node --test tests/test_account_service_bridge.mjs
          node --test tests/test_account_privileged_rpc.mjs
          node --test tests/test_account_transport_admission.mjs
          node --test tests/test_account_mcp_usage_bridge.mjs
  independent-site-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Produce public static bundle from exact Site commit (no deployment)
        env:
          VERCEL_PROJECT_ID: prj_mA9ew6hOfjdqlBr1cC757iMLPQJC
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: python3 tools/vercel/build.py
      - name: Verify independent source authority and inactive services
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          receipt = json.loads((root / "out/vercel/public-site-manifest.json").read_text())
          pin = json.loads((root / "docs/contracts/public-site-source.json").read_text())
          catalog = json.loads((root / "out/vercel/releases/catalog.json").read_text())
          assert receipt["source_commit"] == pin["commit"]
          assert receipt["catalog_status"] == "empty"
          assert catalog["status"] == "empty"
          assert (root / "out/vercel/login/index.html").is_file()
          assert not (root / "sites/public").exists()
          print("OS_CONSUMES_INDEPENDENT_SITE=PASS")
          PY
