      - 'tests/test_supabase_lifecycle_provider.py'
      - 'tests/test_account_lifecycle_edge.py'
      - '.github/workflows/public-site-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate public site source and contracts
        run: |
          set -euo pipefail
          python tools/public-site/build.py check
          python tools/public-site/auth_activation_preflight.py check
          node tests/test_public_site_localization.mjs
          node --test tests/test_public_site_localization_runtime.mjs
          node --test tests/test_public_site_vercel_proxy.mjs
          node --test tests/test_public_auth_header_nav.mjs
          node --test tests/test_public_proxy_request_context.mjs
          node --test tests/test_public_proxy_vercel_oidc.mjs
          node --test tests/test_public_auth_edge_rate_limit.mjs
          node --test tests/test_public_account_edge_bounded_body.mjs
          node --test tests/test_account_service_bridge.mjs
          node --test tests/test_account_privileged_rpc.mjs
          node --test tests/test_account_transport_admission.mjs
          python -m unittest tests.test_public_account_edge_gateway_source -v
          python -m unittest tests.test_auth_provider_probe -v
          python -m unittest tests.test_account_release_provider_proof -v
          python -m unittest tests.test_control_plane_privilege_probe -v
          python -m unittest tests.test_account_release_database_proof -v
          python -m unittest tests.test_account_release_session_revocation_proof -v
          python -m unittest tests.test_public_site_contract -v
          python -m unittest tests.test_public_account_entry_ux -v
          python -m unittest tests.test_public_release_catalog -v
          python -m unittest tests.test_public_identity_backend_prep -v
          python -m unittest tests.test_public_identity_gateway -v
          python -m unittest tests.test_pwned_passwords -v
          python -m unittest tests.test_supabase_account_provider -v
          python -m unittest tests.test_supabase_lifecycle_provider -v
          python -m unittest tests.test_account_lifecycle_edge -v
          python -m unittest tests.test_public_site_runtime_smoke -v
          python -m unittest tests.test_public_site_deployment -v
          python -m unittest tests.test_vercel_identity_preflight -v
          python -m unittest tests.test_public_legal_readiness -v
          python -m unittest tests.test_account_legal_policy_activation -v
          python -m unittest tests.test_account_legacy_legal_quarantine -v
          python -m unittest tests.test_public_auth_activation_preflight -v

      - name: Build and verify deterministic public site
        run: |
          set -euo pipefail
          python tools/public-site/build.py build \
            --source-commit "$GITHUB_SHA" \
            --out-dir out/public-site
          python tools/public-site/build.py verify --out-dir out/public-site
          python tools/public-site/build.py build \
            --source-commit "$GITHUB_SHA" \
            --out-dir "$RUNNER_TEMP/public-site-repeat"
          python tools/public-site/build.py verify --out-dir "$RUNNER_TEMP/public-site-repeat"
          diff -qr out/public-site "$RUNNER_TEMP/public-site-repeat"
          echo 'PUBLIC_SITE_REPEATABILITY=PASS'
          echo 'KERNEL_REBUILD_REQUIRED=NO'
          echo 'SHARED_SYSTEM_REBUILD_REQUIRED=NO'

      - name: Upload public site candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-public-site-${{ github.sha }}
          path: out/public-site/
          if-no-files-found: error
          retention-days: 14
