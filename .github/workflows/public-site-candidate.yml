name: Public Site Candidate
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/docs/**"
      - "!site/README.md"
      - "tools/vercel/**"
      - "docs/contracts/public-site*.json"
      - "api/account-proxy.mjs"
      - "api/oauth-consent.mjs"
      - "lib/account-proxy-core.mjs"
      - "infra/supabase/functions/_shared/**"
      - "infra/supabase/functions/ordax-public-account-gateway/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/public-site-candidate.yml"
      - "system/surface/ui/**"
      - "system/surface/workspace/**"
      - "system/apps/**"
      - "system/contracts/**"
      - "system/services/apps/**"
      - "system/services/i18n/**"
      - "system/services/preferences/**"
      - "system/services/profile-packs/**"
      - "system/services/spaces/**"
      - "system/services/surface/**"
      - "system/services/system-ui/**"
      - "tools/brand/**"
      - "tools/surface-source/**"
      - "docs/contracts/surface-source.json"
      - "third_party/licenses/Inter-OFL-1.1.txt"
  pull_request:
    paths:
      - "site/**"
      - "!site/docs/**"
      - "!site/README.md"
      - "tools/vercel/**"
      - "docs/contracts/public-site*.json"
      - "api/account-proxy.mjs"
      - "api/oauth-consent.mjs"
      - "lib/account-proxy-core.mjs"
      - "infra/supabase/functions/_shared/**"
      - "infra/supabase/functions/ordax-public-account-gateway/**"
      - "package.json"
      - "package-lock.json"
      - "tests/test_public*.py"
      - ".github/workflows/public-site-candidate.yml"
      - "system/surface/ui/**"
      - "system/surface/workspace/**"
      - "system/apps/**"
      - "system/contracts/**"
      - "system/services/apps/**"
      - "system/services/i18n/**"
      - "system/services/preferences/**"
      - "system/services/profile-packs/**"
      - "system/services/spaces/**"
      - "system/services/surface/**"
      - "system/services/system-ui/**"
      - "tools/brand/**"
      - "tools/surface-source/**"
      - "docs/contracts/surface-source.json"
      - "third_party/licenses/Inter-OFL-1.1.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-site-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up Node 24 for the Site workspace
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false
      - name: Validate Site module, workspace and UI contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s site/tests -q
          npm ci --workspace=site --omit=dev --ignore-scripts --no-audit --no-fund
          node --test site/tests/*.mjs
      - name: Validate OS-owned Identity, gateway, policy and release contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_public_account_edge_gateway_source \
            tests.test_auth_provider_probe \
            tests.test_account_release_provider_proof \
            tests.test_control_plane_privilege_probe \
            tests.test_account_release_database_proof \
            tests.test_account_release_session_revocation_proof \
            tests.test_public_release_catalog \
            tests.test_public_identity_backend_prep \
            tests.test_public_identity_gateway \
            tests.test_public_mcp_usage_bridge \
            tests.test_pwned_passwords \
            tests.test_supabase_account_provider \
            tests.test_supabase_lifecycle_provider \
            tests.test_account_lifecycle_edge \
            tests.test_public_site_deployment \
            tests.test_public_canonical_host_redirects \
            tests.test_public_site_network_proof \
            tests.test_vercel_identity_preflight \
            tests.test_public_legal_readiness \
            tests.test_account_legal_policy_activation \
            tests.test_account_legacy_legal_quarantine \
            tests.test_public_auth_activation_preflight \
            tests.test_public_legal_hash_consistency -v
          node --test tests/test_public_site_vercel_proxy.mjs
          node --test tests/test_public_proxy_request_context.mjs
          node --test tests/test_public_proxy_vercel_oidc.mjs
          node --test tests/test_public_auth_edge_rate_limit.mjs
          node --test tests/test_public_account_edge_bounded_body.mjs
          node --test tests/test_account_service_bridge.mjs
          node --test tests/test_account_privileged_rpc.mjs
          node --test tests/test_account_transport_admission.mjs
          node --test tests/test_account_mcp_usage_bridge.mjs
          node --test tests/test_account_mcp_owner_bridge.mjs
  independent-site-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24 for the canonical OS presentation producer
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false
      - name: Install locked presentation dependencies (no native rebuild)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Produce Site from current OS commit (no deployment)
        env:
          VERCEL_PROJECT_ID: prj_mA9ew6hOfjdqlBr1cC757iMLPQJC
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: python3 tools/vercel/build.py
      - name: Verify the 11 public routes and static dependencies
        run: python3 site/scripts/smoke_static.py --out out/vercel
      - name: Verify local Site source and inactive services
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root / "site/scripts"))
          from build_impact import affects_site_deployment
          from canonical_artifacts import INPUTS as BRAND_INPUTS, CSS_INPUTS
          receipt = json.loads((root / "out/vercel/public-site-manifest.json").read_text())
          contract = json.loads((root / "docs/contracts/public-site-source.json").read_text())
          catalog = json.loads((root / "out/vercel/releases/catalog.json").read_text())
          assert receipt["source_commit"] == os.environ["GITHUB_SHA"]
          assert contract["repository"] == "ordaxsystems/ordax-os"
          assert receipt["catalog_status"] == "empty"
          assert catalog["status"] == "empty"
          fixture = json.loads((root / "out/vercel/assets/playground-fixture.json").read_text())
          sources = fixture["surface"]["sources"]
          assert sources and all(row["repository"] == "ordaxsystems/ordax-os"
                                 and row["commit"] == os.environ["GITHUB_SHA"]
                                 for row in sources)
          # The Vite source graph is the actual dependency inventory. No
          # handwritten mirror may silently omit a newly imported module.
          affected = {row["path"] for row in sources}
          affected.update(BRAND_INPUTS.values())
          affected.update(CSS_INPUTS)
          affected.update(("tools/brand/build.py",
                           "tools/surface-source/materialize.py",
                           "docs/contracts/surface-source.json"))
          omitted = sorted(path for path in affected if not affects_site_deployment(path))
          assert not omitted, f"Vercel could skip modified visual sources: {omitted}"
          print(f"OS_SITE_VISUAL_IMPACT=PASS source_files={len(affected)}")
          assert (root / "out/vercel/login/index.html").is_file()
          assert not (root / "sites/public").exists()
          print("OS_SITE_MONOREPO_SOURCE=PASS")
          PY
