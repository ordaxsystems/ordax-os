name: Physical Write Promotion

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/trust/**'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/portable-usb-v2.json'
      - 'docs/contracts/creator-portable-media-plan.json'
      - 'docs/contracts/physical-write-authorization.json'
      - 'docs/evidence/canonical-v4-release-proof.json'
      - 'tools/creator/physical_promotion.py'
      - 'tools/creator/authorize_physical_write.py'
      - 'tools/creator/bind_canonical_v4_release_proof.py'
      - 'tests/test_physical_promotion_boundary.py'
      - 'tests/test_canonical_v4_release_proof_binding.py'
      - 'tools/creator/core/**'
      - 'tools/creator/host/windows/**'
      - 'tools/creator/cmd/ordax-creator-physical-test/**'
      - 'tools/creator/physicalchannel/**'
      - 'tools/release-signing/cmd/ordax-physical-release-signing/**'
      - '.github/workflows/physical-write-promotion.yml'
  pull_request:
    paths:
      - 'bootstrap/trust/**'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/portable-usb-v2.json'
      - 'docs/contracts/creator-portable-media-plan.json'
      - 'docs/contracts/physical-write-authorization.json'
      - 'docs/evidence/canonical-v4-release-proof.json'
      - 'tools/creator/physical_promotion.py'
      - 'tools/creator/authorize_physical_write.py'
      - 'tools/creator/bind_canonical_v4_release_proof.py'
      - 'tests/test_physical_promotion_boundary.py'
      - 'tests/test_canonical_v4_release_proof_binding.py'
      - 'tools/creator/core/**'
      - 'tools/creator/host/windows/**'
      - 'tools/creator/cmd/ordax-creator-physical-test/**'
      - 'tools/creator/physicalchannel/**'
      - 'tools/release-signing/cmd/ordax-physical-release-signing/**'
      - '.github/workflows/physical-write-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      pre_authorization_ready: ${{ steps.gate.outputs.pre_authorization_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Regress non-destructive promotion boundaries
        run: |
          python -m unittest \
            tests.test_physical_promotion_boundary \
            tests.test_canonical_v4_release_proof_binding -v

      - name: Evaluate canonical physical promotion gates
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/physical-promotion-status.json"
          python tools/creator/physical_promotion.py --output "$status" >/dev/null
          cat "$status"
          ready="$(python - "$status" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['$schema'] == 'prototype-ordax.physical-promotion-status/2'
          assert data['legacy_physical_media_contract_authoritative'] is False
          assert data['portable_layout_authority'] == 'tools/creator/core/portable_media.go'
          assert data['consumer_key_setup_required'] is False
          assert data['development_channel_can_authorize_write'] is False
          assert isinstance(data['release_sequence'], int) and data['release_sequence'] > 0
          assert isinstance(data['pre_authorization_ready'], bool)
          assert isinstance(data['owner_authorization_required'], bool)
          assert isinstance(data['authorized_candidate_materialization_allowed'], bool)
          assert isinstance(data['authorization_context_matches_current_source'], bool)
          assert isinstance(data['authorization_context_file_count'], int)
          assert data['authorization_context_file_count'] > 10
          context_sha = data['computed_authorization_context_sha256']
          assert isinstance(context_sha, str) and len(context_sha) == 64
          int(context_sha, 16)
          assert data['authorized_candidate_materialization_allowed'] is data['ready']
          if data['ready']:
              assert data['authorization_context_matches_current_source'] is True
          assert data['next_stage'] in {
              'resolve-pre-authorization-blockers',
              'explicit-owner-authorization',
              'authorized-candidate-materialization',
          }
          if data['pre_authorization_ready'] and not data['ready']:
              assert data['owner_authorization_required'] is True
              assert data['next_stage'] == 'explicit-owner-authorization'
          if not data['pre_authorization_ready']:
              assert data['owner_authorization_required'] is False
          print('true' if data['ready'] else 'false')
          PY
          )"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          pre_authorization_ready="$(python - "$status" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print('true' if data['pre_authorization_ready'] else 'false')
          PY
          )"
          echo "pre_authorization_ready=$pre_authorization_ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo 'PHYSICAL_PROMOTION_GATE=READY'
          else
            echo 'PHYSICAL_PROMOTION_GATE=BLOCKED'
            echo 'PHYSICAL_WRITER_ARTIFACT_WILL_BE_CREATED=NO'
          fi

  build-authorized-candidate:
    needs: preflight
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Recheck promotion immediately before materialization
        run: python tools/creator/physical_promotion.py --require-ready

      - name: Test physical channel verifier and purpose-bound signer
        run: |
          set -euo pipefail
          (cd tools/creator && go test -count=1 ./physicalchannel)
          (cd tools/release-signing && go test -count=1 ./cmd/ordax-physical-release-signing)

      - name: Bind Portable writer to canonical trust and final policy contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out/physical-write-candidate"
          mkdir -p "$out"

          trust_sha="$(sha256sum bootstrap/trust/release-ed25519.json | cut -d' ' -f1)"
          minimal_sha="$(sha256sum docs/contracts/minimal-bootstrap.json | cut -d' ' -f1)"
          portable_sha="$(sha256sum docs/contracts/portable-usb-v2.json | cut -d' ' -f1)"
          creator_sha="$(sha256sum docs/contracts/creator-portable-media-plan.json | cut -d' ' -f1)"
          proof_sha="$(sha256sum docs/evidence/canonical-v4-release-proof.json | cut -d' ' -f1)"
          auth_sha="$(sha256sum docs/contracts/physical-write-authorization.json | cut -d' ' -f1)"
          release_source_commit="$(python - <<'PY'
          import json, pathlib
          auth = json.loads(pathlib.Path('docs/contracts/physical-write-authorization.json').read_text(encoding='utf-8'))
          release_binding = auth.get('release_binding')
          if not isinstance(release_binding, dict):
              raise SystemExit('canonical v4 release binding is missing')
          value = release_binding.get('source_commit')
          if not isinstance(value, str) or len(value) != 40:
              raise SystemExit('canonical v4 release source commit is missing')
          int(value, 16)
          print(value)
          PY
          )"

          python - \
            docs/contracts/physical-write-authorization.json \
            "$minimal_sha" "$trust_sha" "$portable_sha" "$creator_sha" "$proof_sha" <<'PY'
          import json, pathlib, sys
          auth = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert auth['$schema'] == 'prototype-ordax.physical-write-authorization/3'
          expected = auth['bindings']
          actual = {
              'minimal_bootstrap_sha256': sys.argv[2],
              'release_trust_sha256': sys.argv[3],
              'portable_usb_contract_sha256': sys.argv[4],
              'creator_portable_media_contract_sha256': sys.argv[5],
              'canonical_v4_release_proof_sha256': sys.argv[6],
          }
          if expected != actual:
              raise SystemExit(
                  f'authorization binding changed after preflight: expected={expected!r} actual={actual!r}'
              )
          release_binding = auth.get('release_binding')
          if not isinstance(release_binding, dict):
              raise SystemExit('canonical v4 release binding is missing')
          if release_binding.get('proof_path') != 'docs/evidence/canonical-v4-release-proof.json':
              raise SystemExit('canonical v4 release proof path is invalid')
          if release_binding.get('proof_schema') != 'prototype-ordax.portable-v4-canonical-release-proof/1':
              raise SystemExit('canonical v4 release proof schema is invalid')
          if not isinstance(release_binding.get('source_commit'), str) or len(release_binding['source_commit']) != 40:
              raise SystemExit('canonical v4 release source commit is missing')
          sequence = auth.get('release_sequence')
          if isinstance(sequence, bool) or not isinstance(sequence, int) or sequence <= 0:
              raise SystemExit('physical release_sequence is missing or invalid')
          context_sha = auth.get('authorization_context_sha256')
          if not isinstance(context_sha, str) or len(context_sha) != 64:
              raise SystemExit('physical authorization source context is missing or invalid')
          int(context_sha, 16)
          PY

          cp bootstrap/trust/release-ed25519.json "$out/release-ed25519.json"
          cp docs/contracts/minimal-bootstrap.json "$out/minimal-bootstrap.json"
          cp docs/contracts/portable-usb-v2.json "$out/portable-usb-v2.json"
          cp docs/contracts/creator-portable-media-plan.json "$out/creator-portable-media-plan.json"
          cp docs/contracts/physical-write-authorization.json "$out/physical-write-authorization.json"
          cp docs/evidence/canonical-v4-release-proof.json "$out/canonical-v4-release-proof.json"

          pushd tools/creator >/dev/null
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false -tags ordax_raw_backend \
              -ldflags="-s -w -X main.buildSourceCommit=$GITHUB_SHA -X main.buildReleaseSourceCommit=$release_source_commit -X main.buildCanonicalTrustSHA256=$trust_sha -X main.buildManifestSHA256=$minimal_sha -X main.buildPortableUSBContractSHA256=$portable_sha -X main.buildCreatorPortableContractSHA256=$creator_sha -X main.buildPhysicalWriteAuthorized=YES" \
              -o "$out/ordax-creator-physical-test.exe" \
              ./cmd/ordax-creator-physical-test
          popd >/dev/null

          for binding in "$release_source_commit" "$trust_sha" "$minimal_sha" "$portable_sha" "$creator_sha"; do
            strings "$out/ordax-creator-physical-test.exe" | grep -F "$binding" >/dev/null
          done

          python - \
            "$out/provenance.json" \
            "$trust_sha" "$minimal_sha" "$portable_sha" "$creator_sha" "$proof_sha" "$auth_sha" <<'PY'
          import json, os, pathlib, sys
          auth = json.loads(
              pathlib.Path('docs/contracts/physical-write-authorization.json').read_text(encoding='utf-8')
          )
          release_sequence = auth['release_sequence']
          data = {
              '$schema': 'prototype-ordax.physical-write-candidate/2',
              'status': 'authorized-candidate-not-published',
              'source_commit': os.environ['GITHUB_SHA'],
              'writer_source_commit': os.environ['GITHUB_SHA'],
              'release_sequence': release_sequence,
              'consumer_key_setup_required': False,
              'development_channel': False,
              'canonical_trust_sha256': sys.argv[2],
              'minimal_bootstrap_sha256': sys.argv[3],
              'portable_usb_contract_sha256': sys.argv[4],
              'creator_portable_media_contract_sha256': sys.argv[5],
              'canonical_v4_release_proof_sha256': sys.argv[6],
              'canonical_v4_release_source_commit': auth['release_binding']['source_commit'],
              'canonical_v4_release_envelope_url': auth['release_binding']['canonical_envelope_url'],
              'physical_write_authorization_sha256': sys.argv[7],
              'portable_writer_linked': True,
              'portable_application_plan_schema': 'prototype-ordax.portable-application-plan/1',
              'portable_application_operation_count': 39,
              'portable_artifact_count': 17,
              'per_artifact_readback_sha256_size': True,
              'whole_disk_raw_image_required': False,
              'target_specific_plan_required': True,
              'payload_artifacts_in_candidate': False,
              'public_creator_reachable': False,
              'physical_write_authorized_in_binary': True,
              'release_published': False,
              'private_key_in_candidate': False,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          (
            cd "$out"
            sha256sum \
              ordax-creator-physical-test.exe \
              release-ed25519.json \
              minimal-bootstrap.json \
              portable-usb-v2.json \
              creator-portable-media-plan.json \
              physical-write-authorization.json \
              canonical-v4-release-proof.json \
              provenance.json \
              > SHA256SUMS
          )

          if find "$out" -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.dpapi' \) -print -quit | grep -q .; then
            echo 'private signing material entered physical candidate' >&2
            exit 1
          fi
          if find "$out" -type f -iname '*.raw' -print -quit | grep -q .; then
            echo 'whole-disk RAW image entered final Portable writer candidate' >&2
            exit 1
          fi
          echo 'AUTHORIZED_PORTABLE_WRITER_CANDIDATE_BUILT=YES'
          echo 'WHOLE_DISK_RAW_IMAGE_IN_CANDIDATE=NO'
          echo 'PAYLOAD_ARTIFACTS_IN_WRITER_CANDIDATE=NO'
          echo 'PRIVATE_KEY_IN_CANDIDATE=NO'
          echo 'PHYSICAL_CANDIDATE_PUBLISHED=NO'

      - name: Package exact Portable writer release bytes and unsigned manifest v2
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/out/physical-write-candidate"
          release="$GITHUB_WORKSPACE/out/physical-write-release"
          mkdir -p "$release"
          bundle="$release/ordax-creator-physical-windows-amd64.zip"
          manifest="$release/creator-physical-manifest.json"

          python - "$candidate" "$bundle" "$manifest" <<'PY'
          import hashlib, json, os, pathlib, sys, zipfile

          candidate = pathlib.Path(sys.argv[1])
          bundle = pathlib.Path(sys.argv[2])
          manifest_path = pathlib.Path(sys.argv[3])
          names = [
              'ordax-creator-physical-test.exe',
              'release-ed25519.json',
              'minimal-bootstrap.json',
              'portable-usb-v2.json',
              'creator-portable-media-plan.json',
              'physical-write-authorization.json',
              'provenance.json',
              'SHA256SUMS',
          ]

          def binding(path: pathlib.Path):
              h = hashlib.sha256()
              size = 0
              with path.open('rb') as stream:
                  while True:
                      chunk = stream.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
                      size += len(chunk)
              return h.hexdigest(), size

          for name in names:
              path = candidate / name
              if not path.is_file():
                  raise SystemExit(f'missing Portable writer candidate file: {name}')
          if any(candidate.glob('*.raw')):
              raise SystemExit('Portable writer candidate unexpectedly contains whole-disk RAW bytes')

          provenance = json.loads((candidate / 'provenance.json').read_text(encoding='utf-8'))
          if provenance.get('$schema') != 'prototype-ordax.physical-write-candidate/2':
              raise SystemExit('Portable writer provenance schema is invalid')
          if provenance.get('whole_disk_raw_image_required') is not False:
              raise SystemExit('Portable writer provenance regressed to whole-disk RAW')
          if provenance.get('portable_application_operation_count') != 39:
              raise SystemExit('Portable writer provenance operation count is invalid')
          if provenance.get('portable_artifact_count') != 17:
              raise SystemExit('Portable writer provenance artifact count is invalid')

          with zipfile.ZipFile(
              bundle, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in names:
                  path = candidate / name
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (
                      (0o100755 if name.endswith('.exe') else 0o100644) << 16
                  )
                  with path.open('rb') as source, archive.open(
                      info, 'w', force_zip64=True
                  ) as target:
                      while True:
                          chunk = source.read(1024 * 1024)
                          if not chunk:
                              break
                          target.write(chunk)

          bundle_sha, bundle_size = binding(bundle)
          files = []
          for name in names:
              digest, size = binding(candidate / name)
              files.append({'name': name, 'sha256': digest, 'size': size})

          manifest = {
              '$schema': 'prototype-ordax.creator-physical-manifest/2',
              'purpose': 'creator-portable-physical-windows-amd64',
              'source_repository': 'ordaxsystems/ordax-os',
              'source_commit': os.environ['GITHUB_SHA'],
              'created_from_recipe': 'creator/physical/portable-windows/2',
              'bundle': {
                  'url': (
                      'https://github.com/ordaxsystems/ordax-os/'
                      'releases/download/creator-physical/'
                      'ordax-creator-physical-windows-amd64.zip'
                  ),
                  'sha256': bundle_sha,
                  'size': bundle_size,
              },
              'files': files,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, separators=(',', ': ')) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

          python - "$manifest" <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert m['$schema'] == 'prototype-ordax.creator-physical-manifest/2'
          assert m['purpose'] == 'creator-portable-physical-windows-amd64'
          assert m['created_from_recipe'] == 'creator/physical/portable-windows/2'
          assert len(m['files']) == 8
          assert {x['name'] for x in m['files']} == {
              'ordax-creator-physical-test.exe',
              'release-ed25519.json',
              'minimal-bootstrap.json',
              'portable-usb-v2.json',
              'creator-portable-media-plan.json',
              'physical-write-authorization.json',
              'provenance.json',
              'SHA256SUMS',
          }
          assert not any(x['name'].endswith('.raw') for x in m['files'])
          PY

          (cd tools/release-signing && go test -count=1 ./cmd/ordax-physical-release-signing)
          echo 'PORTABLE_PHYSICAL_RELEASE_PACKAGE_READY_FOR_OFFLINE_SIGNING=YES'
          echo 'PHYSICAL_RELEASE_ENVELOPE_PRESENT=NO'
          echo 'PRIVATE_KEY_REQUIRED_IN_CI=NO'

      - name: Upload authorized candidate and signing inputs for publisher review only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-authorized-physical-candidate-${{ github.sha }}
          path: |
            out/physical-write-candidate/
            out/physical-write-release/
          if-no-files-found: error
          retention-days: 7
