name: OrdaX Account Gateway Destination

on:
  # Production deployment is NEVER triggered by merging code into main.
  # The Owner must explicitly approve the exact already-reviewed main SHA.
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact reviewed main commit SHA (40 hex characters)'
        required: true
        type: string
      release_confirmation:
        description: 'Type DEPLOY_ACCOUNT_GATEWAY_PRODUCTION after Owner E2E and release approval'
        required: true
        type: string
      owner_project_rollout:
        description: 'Project MCP Owner rollout after deploying the reviewed gateway bundle'
        required: true
        type: choice
        default: unchanged
        options:
          - unchanged
          - enable
          - disable

permissions:
  contents: read

concurrency:
  group: ordax-account-gateway-destination
  cancel-in-progress: false

jobs:
  deploy-destination:
    if: >-
      github.repository == 'ordaxsystems/ordax-os'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.approved_sha == github.sha
      && inputs.release_confirmation == 'DEPLOY_ACCOUNT_GATEWAY_PRODUCTION'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject obsolete or non-main source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          CURRENT="$(git ls-remote https://github.com/ordaxsystems/ordax-os.git refs/heads/main | cut -f1)"
          test "${GITHUB_REPOSITORY}" = "ordaxsystems/ordax-os"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${ACTUAL}" = "${GITHUB_SHA}"
          test "${CURRENT}" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Resolve reviewed destination project
        shell: bash
        run: |
          set -euo pipefail
          python tools/account/resolve_account_gateway_destination.py >> "${GITHUB_ENV}"

      - name: Resolve management credential availability without printing it
        id: credential
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::ACCOUNT_GATEWAY_DESTINATION=NOT_DEPLOYED (configure repository secret SUPABASE_ACCESS_TOKEN)'
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
            exit 2
          fi
          echo 'enabled=true' >> "${GITHUB_OUTPUT}"
          echo 'ACCOUNT_GATEWAY_DEPLOY_CREDENTIAL_PRESENT=YES'
          echo 'ACCOUNT_GATEWAY_DEPLOY_CREDENTIAL_PRINTED=NO'

      - name: Set up pinned Supabase CLI
        if: steps.credential.outputs.enabled == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Verify pinned CLI and destination source contract
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.121.0"
          grep -Fq 'version: 18' infra/supabase/functions/ordax-account-gateway/index.ts
          grep -Fq '.select("space_id,owner_user_id,name,kind,state,domain,subtype")' \
            infra/supabase/functions/ordax-account-gateway/index.ts
          test -f infra/supabase/functions/_shared/account_transport_admission.mjs
          test -f infra/supabase/functions/_shared/account_mcp_usage.mjs
          grep -Fq 'if (path === ACCOUNT_MCP_USAGE_PATH && req.method === "GET")' infra/supabase/functions/ordax-account-gateway/index.ts
          grep -Fq 'Deno.env.get("ORDAX_MCP_USAGE_READ_ENABLED") !== "1"' infra/supabase/functions/ordax-account-gateway/index.ts
          grep -Fq 'const PUBLIC_SITE_ACCOUNT_ENABLED = false;' infra/supabase/functions/ordax-account-gateway/index.ts
          node --test tests/test_account_mcp_usage_bridge.mjs
          test -f infra/supabase/functions/_shared/account_mcp_owner.mjs
          grep -Fq 'ORDAX_MCP_OWNER_ACCOUNT_ENABLED' infra/supabase/functions/ordax-account-gateway/index.ts
          node --test tests/test_account_mcp_owner_bridge.mjs
          test "${ORDAX_ACCOUNT_GATEWAY_DESTINATION}" = "ordax-platform"

      - name: Deploy exact account gateway bundle to destination
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd infra
          supabase functions deploy ordax-account-gateway \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api

      - name: Apply explicit Owner Project MCP rollout
        if: steps.credential.outputs.enabled == 'true' && inputs.owner_project_rollout != 'unchanged'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ inputs.owner_project_rollout }}" in
            enable) VALUE=1 ;;
            disable) VALUE=0 ;;
            *) echo '::error::Invalid Owner Project MCP rollout'; exit 2 ;;
          esac
          supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" \
            "ORDAX_MCP_OWNER_ACCOUNT_ENABLED=${VALUE}" \
            "ORDAX_MCP_OWNER_PROJECT_ONBOARDING_ENABLED=${VALUE}" \
            "ORDAX_MCP_OWNER_GITHUB_AUTHORIZATION_ENABLED=${VALUE}" \
            "ORDAX_MCP_OWNER_PROJECT_DEVICE_BINDING_ENABLED=${VALUE}" \
            "ORDAX_MCP_OWNER_PROJECT_GRANT_ENABLED=${VALUE}"
          echo "ACCOUNT_GATEWAY_OWNER_PROJECT_ROLLOUT=${{ inputs.owner_project_rollout }}"
          echo 'ACCOUNT_GATEWAY_OWNER_PROJECT_SECRET_VALUES_PRINTED=NO'

      - name: Smoke destination gateway without changing Auth cutover
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ordax-account-gateway"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --retry-all-errors "${BASE}/health" > "${RUNNER_TEMP}/health.json"
          python - "${RUNNER_TEMP}/health.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value == {"status": "ok", "service": "ordax-account-gateway", "version": 18}
          print("ACCOUNT_GATEWAY_DESTINATION_HEALTH=PASS")
          PY

          status="$(curl --silent --show-error --output "${RUNNER_TEMP}/spaces.json" \
            --write-out '%{http_code}' "${BASE}/account/spaces")"
          test "${status}" = "401"
          python - "${RUNNER_TEMP}/spaces.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value.get("error") == "native-account-session-required"
          print("ACCOUNT_GATEWAY_DESTINATION_UNAUTH=PASS")
          PY

          # This negative proof never supplies a cookie, bearer or production account ID.
          # A direct Native transport request must be blocked before owner usage reads.
          status="$(curl --silent --show-error --output "${RUNNER_TEMP}/mcp-usage.json" \
            --write-out '%{http_code}' "${BASE}/account/usage/mcp")"
          test "${status}" = "401"
          python - "${RUNNER_TEMP}/mcp-usage.json" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value.get("error") == "native-account-session-required"
          assert "entries" not in value and "subject" not in value
          print("ACCOUNT_GATEWAY_MCP_USAGE_UNAUTH=PASS")
          PY
