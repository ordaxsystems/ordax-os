name: Account Memory Local Sync Bridge

on:
  pull_request:
    paths:
      - 'system/contracts/memory.mjs'
      - 'system/services/memory/**'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-local-bridge.mjs'
      - 'tests/test_account_memory_local_bridge.mjs'
      - '.github/workflows/account-memory-local-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/memory.mjs'
      - 'system/services/memory/**'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-local-bridge.mjs'
      - 'tests/test_account_memory_local_bridge.mjs'
      - '.github/workflows/account-memory-local-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-memory-sync-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check system/services/sync/account-memory-local-bridge.mjs
          node --check tests/test_account_memory_local_bridge.mjs

      - name: Prove local-first staging semantics
        run: |
          set -euo pipefail
          node --test tests/test_account_memory_local_bridge.mjs
