name: OrdaX Auth Email Templates

# Publishes only a tested main commit, never untrusted PR code.
on:
  workflow_run:
    workflows: ["Public Site Candidate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordax-auth-email-templates-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == 'ordaxsystems/ordax-os')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ordax-auth-templates-production
    steps:
      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Reject obsolete main or unreviewed source
        env:
          APPROVED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          CURRENT="$(git ls-remote https://github.com/ordaxsystems/ordax-os.git refs/heads/main | cut -f1)"
          test "$ACTUAL" = "$APPROVED_SHA"
          test "$APPROVED_SHA" = "$CURRENT"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false
      - name: Verify generated templates and single visual owner
        run: |
          set -euo pipefail
          python tools/brand/build.py check
          python -m unittest tests.test_brand_pipeline -v
      - name: Publish approved templates (only when management token is connected)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_TEMPLATES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::AUTH_EMAIL_TEMPLATES=NOT_PUBLISHED (configure protected environment secret SUPABASE_AUTH_TEMPLATES_TOKEN)"
            exit 0
          fi
          python tools/brand/build.py publish-emails \
            --project-ref jhfphsjptrpmtnzkpwud --approve-production-write
