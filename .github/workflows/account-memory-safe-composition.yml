name: Account Memory Safe Composition

on:
  pull_request:
    paths:
      - 'system/services/sync/account-memory-composition.mjs'
      - 'system/services/sync/account-memory-local-bridge.mjs'
      - 'system/services/sync/account-memory-session-runtime.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'tests/test_account_memory_composition.mjs'
      - '.github/workflows/account-memory-safe-composition.yml'
  push:
    branches: [main]
    paths:
      - 'system/services/sync/account-memory-composition.mjs'
      - 'system/services/sync/account-memory-local-bridge.mjs'
      - 'system/services/sync/account-memory-session-runtime.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'tests/test_account_memory_composition.mjs'
      - '.github/workflows/account-memory-safe-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-memory-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check system/services/sync/account-memory-composition.mjs
          node --check tests/test_account_memory_composition.mjs

      - name: Prove local and remote Memory composition boundaries
        run: |
          set -euo pipefail
          node --test tests/test_account_memory_composition.mjs
