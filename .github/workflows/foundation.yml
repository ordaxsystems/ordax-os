name: Foundation Contract

on:
  workflow_dispatch: # Run existing consumer validation on immutable bot PR branches
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Classify exact documentation-only diff (fail closed)
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No valid comparison -> retain full tests. Never skip on manual dispatch.
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]] ||
             [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$BASE_SHA" =~ ^0{40}$ ]] ||
             ! git fetch --no-tags --depth=1 origin "$BASE_SHA" ||
             ! git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          paths = [p.decode("utf-8") for p in
                   (Path(os.environ["RUNNER_TEMP"]) / "changed-paths").read_bytes().split(b"\0") if p]
          # Exact known-document allowlist. All code, contracts, workflows,
          # scripts, test fixtures and unknown paths must run full Foundation.
          docs = {
              "AGENTS.md", "README.md", "docs/README.md",
              "docs/DEVELOPMENT-WORKFLOW.md", "docs/DECISIONS.md",
              "docs/CURRENT-STATE.md",
          }
          full = not (paths and all(p in docs for p in paths))
          print(f"full={str(full).lower()}")
          print(f"Foundation impact: {paths!r}; full={full}", file=__import__("sys").stderr)
          PY

      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          fi

      - name: Prepare external Surface in disposable CI checkout
        if: steps.impact.outputs.full != 'false'
        uses: ./.github/actions/prepare-verified-surface

      - name: Install locked Web build dependencies
        if: steps.impact.outputs.full != 'false'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Python
        if: steps.impact.outputs.full != 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Discover and validate JSON contracts
        if: steps.impact.outputs.full != 'false'
        run: python tools/verify/json_contracts.py

      - name: Validate build contracts without compiling
        if: steps.impact.outputs.full != 'false'
        run: |
          python bootstrap/kernel/build.py check
          python bootstrap/initramfs/build.py check
          python bootstrap/native-initramfs/build.py check
          python bootstrap/network/build.py check
          python boot/esp/build.py check

      - name: Validate native graphics kernel prerequisites
        if: steps.impact.outputs.full != 'false'
        run: python tools/verify/native_graphics_prereqs.py

      - name: Validate module import boundaries
        if: steps.impact.outputs.full != 'false'
        run: python tools/verify/module_boundaries.py

      - name: Validate GitHub Actions supply chain
        if: steps.impact.outputs.full != 'false'
        run: python tools/verify/github_actions_supply_chain.py

      - name: Run foundation regressions
        if: steps.impact.outputs.full != 'false'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate canonical Native Product Connector port
        if: steps.impact.outputs.full != 'false'
        run: node --test tests/test_product_connector_adapter.mjs

      - name: Validate signed Runtime and MCP authority SSOT
        if: steps.impact.outputs.full != 'false'
        run: node --test tests/test_studio_runtime_source_lock.mjs

      - name: Validate product family version identities
        if: steps.impact.outputs.full != 'false'
        run: node --test tests/test_product_family.mjs

      - name: Validate dual update transport selection policy
        if: steps.impact.outputs.full != 'false'
        run: node --test tests/test_update_transport_selection.mjs tests/test_update_status.mjs
