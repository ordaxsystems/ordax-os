name: Foundation Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install locked Web build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Discover and validate JSON contracts
        run: python tools/verify/json_contracts.py

      - name: Validate build contracts without compiling
        run: |
          python bootstrap/kernel/build.py check
          python bootstrap/initramfs/build.py check
          python bootstrap/native-initramfs/build.py check
          python bootstrap/network/build.py check
          python boot/esp/build.py check

      - name: Validate native graphics kernel prerequisites
        run: python tools/verify/native_graphics_prereqs.py

      - name: Validate module import boundaries
        run: python tools/verify/module_boundaries.py

      - name: Validate GitHub Actions supply chain
        run: python tools/verify/github_actions_supply_chain.py

      # Temporary branch-only diagnostics. These steps are removed before merge;
      # they expose the failing method through Actions step metadata because the
      # connector cannot read the private raw job log body.
      - name: Diagnose Account contract - transport activation boundary
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_transport_proof_does_not_authorize_public_account_activation -v

      - name: Diagnose Account contract - lifecycle gates
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_promotion_still_requires_unproven_account_lifecycle_gates -v

      - name: Diagnose Account contract - live runtime closed activation
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_destination_runtime_is_live_but_public_activation_remains_closed -v

      - name: Diagnose Account contract - sync export boundary
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_live_sync_export_sql_proof_cannot_be_confused_with_public_activation -v

      - name: Diagnose Account contract - runtime evidence
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_live_gateway_and_vercel_runtime_evidence_are_current -v

      - name: Diagnose Account contract - bridge handler auth
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_named_bridge_requires_custom_handler_auth_not_platform_jwt -v

      - name: Diagnose Account contract - named bridge proof
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_named_service_bridge_is_proven_without_recording_secret_value -v

      - name: Diagnose Account contract - OIDC scope
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_oidc_source_and_production_runtime_are_both_scoped -v

      - name: Diagnose Account contract - gateway v13 boundary
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_gateway_v13_transport_is_live_without_promoting_account_activation -v

      - name: Diagnose Account contract - shared hardening
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_shared_route_and_sync_hardening_remain_deployed -v

      - name: Diagnose Account contract - migration ownership
        continue-on-error: true
        run: python -m unittest tests.test_public_auth_postgres_destination_contract.AccountPostgresCutoverContractTests.test_migration_sources_are_single_owned_and_versioned -v

      - name: Run foundation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate product family version identities
        run: node --test tests/test_product_family.mjs
