name: Verified App Install Receipt Bootstrap

on:
  pull_request:
    paths:
      - 'system/surface/runtime/native_app_install_identity.py'
      - 'system/surface/runtime/native_app_install_identity_producer.py'
      - 'system/surface/runtime/native_app_install_identity_bootstrap.py'
      - 'system/services/apps/first-party-identities.json'
      - 'tests/test_native_app_install_identity.py'
      - 'tests/test_native_app_install_identity_producer.py'
      - 'tests/test_native_app_install_identity_bootstrap.py'
      - '.github/workflows/native-app-install-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'system/surface/runtime/native_app_install_identity.py'
      - 'system/surface/runtime/native_app_install_identity_producer.py'
      - 'system/surface/runtime/native_app_install_identity_bootstrap.py'
      - 'system/services/apps/first-party-identities.json'
      - 'tests/test_native_app_install_identity.py'
      - 'tests/test_native_app_install_identity_producer.py'
      - 'tests/test_native_app_install_identity_bootstrap.py'
      - '.github/workflows/native-app-install-bootstrap.yml'

permissions:
  contents: read

jobs:
  verified-install-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            system/surface/runtime/native_app_install_identity.py \
            system/surface/runtime/native_app_install_identity_producer.py \
            system/surface/runtime/native_app_install_identity_bootstrap.py

      - name: Prove verified receipt producer and bootstrap boundary
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_native_app_install_identity \
            tests.test_native_app_install_identity_producer \
            tests.test_native_app_install_identity_bootstrap \
            -v
