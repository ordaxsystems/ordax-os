name: Windows Desktop Dev (SSOT)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'system/**'
      - 'tools/windows-emulator/**'
      - 'tools/windows-desktop/**'
      - '.github/workflows/windows-desktop-dev.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  desktop-dev:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical workspace
        run: npm ci --no-audit --no-fund
      - name: Test Native host and desktop contracts
        run: |
          node --test tests/test_desktop_network_status.mjs
          node --test tests/test_windows_emulator_native_host.mjs
          node --test tools/windows-desktop/dev-update.test.cjs
          node --test tools/windows-desktop/runtime.test.cjs tools/windows-desktop/checkout.test.cjs
      - name: Install desktop shell toolchain
        working-directory: tools/windows-desktop
        run: npm ci --no-audit --no-fund
      - name: Build unsigned Windows installer
        working-directory: tools/windows-desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify isolated NSIS installation and Native files
        shell: pwsh
        run: pwsh -NoProfile -File tools/windows-desktop/install-smoke.ps1 -Installer out/windows-desktop-installer/OrdaX-OS-Desktop-Dev-0.1.0-alpha.5-x64.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-os-desktop-dev-alpha-windows
          path: out/windows-desktop-installer/*.exe
          if-no-files-found: error
          retention-days: 14
