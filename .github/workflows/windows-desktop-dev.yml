name: Windows Desktop Dev (SSOT)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'system/**'
      - 'tools/windows-emulator/**'
      - 'tools/windows-desktop/**'
      - '.github/workflows/windows-desktop-dev.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  desktop-dev:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical workspace
        run: npm ci --no-audit --no-fund
      - name: Test Native host and desktop contracts
        run: |
          node --test tests/test_desktop_network_status.mjs
          node --test tests/test_desktop_system_metrics.mjs
          node --test tests/test_desktop_update_status.mjs
          node --test tests/test_desktop_recovery_status.mjs
          node --test tests/test_desktop_recovery_surface.mjs
          node --test tests/test_desktop_boot_gate.mjs
          node --test tests/test_windows_emulator_native_host.mjs
          node --test tools/windows-desktop/browser-host.test.cjs
          node --test tools/windows-desktop/host-startup.test.cjs
          node --test tools/windows-desktop/native-build.test.cjs
          node --test tools/windows-desktop/dev-update.test.cjs
          node --test tools/windows-desktop/runtime.test.cjs tools/windows-desktop/checkout.test.cjs
      - name: Install desktop shell toolchain
        working-directory: tools/windows-desktop
        run: npm ci --no-audit --no-fund
      - name: Test built Native asset route
        run: node --test tools/windows-emulator/desktop-built-assets.test.mjs
      - name: Compile canonical Native Surface for Windows
        run: npx vite build --config tools/windows-desktop/vite-native-build.mjs
      - name: Verify canonical compiled entry
        shell: pwsh
        run: |
          $html = "out/windows-desktop-native/system/composition/native/index.html"
          if (-not (Test-Path $html -PathType Leaf)) { throw "Native build did not produce HTML" }
          $contents = Get-Content $html -Raw
          if ($contents -notmatch '/__ordax/desktop-assets/assets/') { throw "Native bundle references not fingerprinted assets" }
          $scripts = @(Get-ChildItem "out/windows-desktop-native/assets" -File -Filter "*.js")
          if ($scripts.Count -eq 0) { throw "Native bundle has no JavaScript" }
          Write-Output ("NATIVE_BUNDLE_SMOKE=PASS assets=" + $scripts.Count)
      - name: Build unsigned Windows installer
        working-directory: tools/windows-desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify isolated NSIS installation and Native files
        shell: pwsh
        run: pwsh -NoProfile -File tools/windows-desktop/install-smoke.ps1 -Installer out/windows-desktop-installer/OrdaX-OS-Desktop-Dev-0.1.0-alpha.15-x64.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-os-desktop-dev-alpha-windows
          path: out/windows-desktop-installer/*.exe
          if-no-files-found: error
          retention-days: 14
