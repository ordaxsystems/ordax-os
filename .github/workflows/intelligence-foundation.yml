permissions:
  contents: read

jobs:
  intelligence-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate Intelligence source syntax
        run: |
          set -euo pipefail
          node --check system/contracts/intelligence.mjs
          node --check system/contracts/local-ai.mjs
          node --check system/contracts/memory.mjs
          node --check system/contracts/memory-store.mjs
          node --check system/contracts/memory-context.mjs
          node --check system/contracts/memory-capture.mjs
          node --check system/contracts/memory-mutation.mjs
          node --check system/services/preferences/memory.mjs
          node --check system/contracts/model-router.mjs
          node --check system/contracts/intelligence-artifact.mjs
          node --check system/contracts/intelligence-tool.mjs
          node --check system/contracts/semantic-index.mjs
          node --check system/contracts/profile-pack.mjs
          node --check system/contracts/profile-pack-source.mjs
          node --check system/contracts/profile-pack-restore.mjs
          node --check system/contracts/profile-pack-catalog.mjs
          node --check system/contracts/profile-taxonomy.mjs
          node --check system/services/profile-packs/taxonomy.mjs
          node --check system/services/profile-packs/taxonomy-source.mjs
          node --check system/contracts/profile-provisioning.mjs
          node --check system/contracts/profile-component-inventory.mjs
          node --check system/contracts/profile-install-receipt.mjs
          node --check system/contracts/profile-content-pack.mjs
          node --check system/contracts/profile-activation-state.mjs
          node --check tools/profile-content-proof/verify.mjs
          node --check system/profile-packs/distributions.mjs
          node --check system/services/profile-packs/catalog.mjs
          node --check system/services/profile-packs/inventory.mjs
          node --check system/adapters/native/profile-component-inventory.mjs
          node --check system/adapters/native/profile-activation-state.mjs
          find system/services/intelligence system/services/local-ai system/services/memory system/services/profile-packs -type f -name '*.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --check system/surface/ui/memory-review-controls.mjs
          node --check system/adapters/web/memory.mjs
          node --check system/adapters/native/memory.mjs
          python -m py_compile system/surface/runtime/native_memory_state.py
          python -m py_compile system/surface/runtime/native_memory_endpoint.py
          python -m py_compile system/surface/runtime/native_host_server.py
          python -m py_compile system/surface/runtime/native_local_ai_bridge.py
          python -m py_compile services/public-identity/supabase_memory.py
          python -m py_compile services/public-identity/supabase_sync.py
          python -m py_compile services/public-identity/supabase_password.py
          python -m py_compile tools/cloud-memory/prove_authenticated_atomic_sync.py
          python -m py_compile system/surface/runtime/native_profile_component_inventory.py
          python -m py_compile system/surface/runtime/native_profile_provisioning_executor.py
          python -m py_compile system/surface/runtime/native_profile_activation_state.py
          python -m py_compile system/surface/runtime/native_profile_activation_command.py
          python -m py_compile tools/local-ai-baseline/report.py
          python -m py_compile tools/local-ai-baseline/compare.py
          python -m py_compile tools/local-ai-benchmark/benchmark.py
          python -m py_compile tools/local-ai-hardware-probe/probe.py
          python -m py_compile tools/local-ai-model-catalog/render.py
          python tools/local-ai-model-catalog/render.py --check
          node --check system/apps/assistant/conversation.mjs
          node --check system/apps/intelligence-catalog.mjs
          find system/apps -path '*/ai/*.mjs' -type f -print0 | sort -z | xargs -0 -n1 node --check
          node --check system/services/memory/assistant-auto-capture.mjs
          node --check system/apps/assistant/runtime.mjs
          node --check system/apps/assistant/ui/conversation-controls.mjs
          node --check system/composition/native/account-memory.mjs
          node --check system/composition/native/account-memory-foundation.mjs
          node --check tests/test_native_account_memory_protected_composition.mjs
          node --check system/composition/native/main.mjs
          node --check system/composition/web/main.mjs
          python -m json.tool docs/contracts/intelligence.json >/dev/null
          python -m json.tool docs/contracts/local-ai.json >/dev/null
          python -m json.tool docs/contracts/memory.json >/dev/null
