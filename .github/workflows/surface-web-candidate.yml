permissions:
  contents: read

jobs:
  web-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate shared Surface source graph
        run: python tools/surface-web/build.py check

      - name: Validate zero-dependency ES modules and shared state services
        run: |
          set -euo pipefail
          node --version
          find \
            system/contracts \
            system/services/account \
            system/services/spaces \
            system/services/professional-network \
            system/services/apps \
            system/services/components \
            system/services/files \
            system/services/projects \
            system/services/personal-ordax \
            system/services/intelligence \
            system/services/preferences \
            system/services/i18n \
            system/services/sync \
            system/services/diagnostics \
            system/services/update \
            system/services/notifications \
            system/apps \
            system/surface/ui \
            system/adapters/web \
            system/adapters/mobile \
            system/adapters/native \
            system/composition/web \
            system/composition/native \
            -type f -name '*.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --test tests/test_surface_preferences.mjs
          node --test tests/test_surface_localization.mjs
          node --test tests/test_surface_app_localization.mjs
          node --test tests/test_surface_workspace.mjs
          node --test tests/test_recent_files.mjs
          node --test tests/test_projects.mjs
          node --test tests/test_projects_app.mjs
          node --test tests/test_network_draft.mjs
          node --test tests/test_network_transport_v2.mjs
          node --test tests/test_project_web_references.mjs
          node --test tests/test_browser_favorites.mjs
          node --test tests/test_browser_history.mjs
          node --test tests/test_internet_navigation.mjs
          node --test tests/test_browser_search_preferences.mjs
          node --test tests/test_browser_page_selection.mjs
