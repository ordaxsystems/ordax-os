name: Independent Site source repoint

on:
  pull_request:
    paths:
      - "tools/vercel/build.py"
      - "tools/vercel/site_source.py"
      - "docs/contracts/public-site-source.json"
      - "tests/test_external_site_source.py"
      - ".github/workflows/public-site-source-repoint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-repoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-login-from-independent-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Verify pinned source contract and isolated local source fixtures
        run: python3 -m unittest discover -s tests -p 'test_external_site_source.py' -v
      - name: Fetch exactly the pinned independent Site revision and compose Web login
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          def module(path, name):
              spec = importlib.util.spec_from_file_location(name, root / path)
              instance = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(instance)
              return instance

          source = module("tools/vercel/site_source.py", "_ordax_site_pin_ci")
          checkout, pinned = source.resolve()
          assert (checkout / "site/login/index.html").is_file()
          build = module("tools/vercel/build.py", "_ordax_web_site_ci")
          with tempfile.TemporaryDirectory() as temporary:
              build.OUTPUT = Path(temporary)
              build.compose_web_identity_bootstrap("1" * 40)
              build.write_web_deployment_manifest("1" * 40)
              manifest = json.loads((build.OUTPUT / "web-deployment-manifest.json").read_text())
              assert manifest["site_source_repository"] == "ordaxsystems/ordax-site"
              assert manifest["site_source_commit"] == pinned
              assert manifest["login_presentation_owner"] == "ordaxsystems/ordax-site:site/login/index.html"
              assert (build.OUTPUT / "login/index.html").is_file()
              assert all((build.OUTPUT / name).is_file() for name in build.WEB_IDENTITY_SUPPORT_FILES)
              assert manifest["files"]
          print(f"INDEPENDENT_SITE_WEB_LOGIN=PASS source={pinned}")
          PY
