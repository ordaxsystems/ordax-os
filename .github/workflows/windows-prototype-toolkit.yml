name: Windows Prototype Toolkit

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/**'
      - 'tools/release-signing/**'
      - 'docs/RELEASE-TRUST-CEREMONY.md'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/portable-v2-qemu-boot-proof.json'
      - 'docs/contracts/portable-v2-uefi-boot-proof.json'
      - 'docs/evidence/portable-v3-one-shot-qemu-proof.json'
      - 'docs/contracts/creator-portable-media-plan.json'
      - 'docs/contracts/physical-write-authorization.json'
      - '.github/workflows/windows-prototype-toolkit.yml'
  pull_request:
    paths:
      - 'tools/creator/**'
      - 'tools/release-signing/**'
      - 'docs/RELEASE-TRUST-CEREMONY.md'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/portable-v2-qemu-boot-proof.json'
      - 'docs/contracts/portable-v2-uefi-boot-proof.json'
      - 'docs/evidence/portable-v3-one-shot-qemu-proof.json'
      - 'docs/contracts/creator-portable-media-plan.json'
      - 'docs/contracts/physical-write-authorization.json'
      - '.github/workflows/windows-prototype-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test Creator and release-signing owners
        run: |
          set -euo pipefail
          (cd tools/creator && go test -count=1 ./...)
          (cd tools/release-signing && go test -count=1 ./...)

      - name: Assert toolkit Creator excludes physical apply and raw backend dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/creator/cmd/ordax-creator/main.go').read_text(encoding='utf-8')
          forbidden = [
              'case "apply"',
              'case "write"',
              'case "flash"',
              'applyRawDiskInternal',
              'windowsRawDiskRuntimeUnbound',
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f'Windows toolkit Creator exposes forbidden physical route markers: {found}')
          print('TOOLKIT_PUBLIC_PHYSICAL_APPLY=BLOCKED')
          PY
          pushd tools/creator >/dev/null
          deps="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -deps ./cmd/ordax-creator)"
          if grep -qx 'github.com/ordaxsystems/ordax-os/tools/creator/host/windows' <<<"$deps"; then
            echo 'Windows toolkit Creator unexpectedly links the native raw-disk host package' >&2
            exit 1
          fi

          public_files="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -f '{{range .GoFiles}}{{println .}}{{end}}' ./host/windows)"
          tagged_files="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -tags ordax_raw_backend -f '{{range .GoFiles}}{{println .}}{{end}}' ./host/windows)"
          for file in \
            raw_handle_write_windows.go \
            volume_lease_windows.go \
            elevation_windows.go \
            raw_runtime_windows.go; do
            if grep -qx "$file" <<<"$public_files"; then
              echo "public Windows build unexpectedly includes tagged raw backend file: $file" >&2
              exit 1
            fi
            if ! grep -qx "$file" <<<"$tagged_files"; then
              echo "tagged Windows raw backend build is missing expected file: $file" >&2
              exit 1
            fi
          done

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go test -c -tags ordax_raw_backend \
            -o "$RUNNER_TEMP/ordax-raw-backend.test.exe" ./host/windows
          rm -f "$RUNNER_TEMP/ordax-raw-backend.test.exe"
          popd >/dev/null
          echo 'TOOLKIT_CREATOR_LINKS_NATIVE_RAW_BACKEND=NO'
          echo 'TOOLKIT_RAW_BACKEND_BUILD_TAG_ISOLATION=PASS'

      - name: Build Windows toolkit
        run: |
          set -euo pipefail
          out="$PWD/out/windows-prototype-toolkit"
          mkdir -p "$out"
          (
            cd tools/creator
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/windows-prototype-toolkit/ordax-creator.exe ./cmd/ordax-creator
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/windows-prototype-toolkit/ordax-creator-targets.exe ./cmd/ordax-creator-targets
          )
          (
            cd tools/release-signing
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/windows-prototype-toolkit/ordax-release-signing.exe .
          )
          cp docs/RELEASE-TRUST-CEREMONY.md "$out/RELEASE-TRUST-CEREMONY.md"
          cp docs/contracts/release-trust-policy.json "$out/release-trust-policy.json"
          cp tools/release-signing/windows/1-Verify-OrdaXTrustToolkit.cmd "$out/1-Verify-OrdaXTrustToolkit.cmd"
          cp tools/release-signing/windows/2-Initialize-OrdaXTrust.cmd "$out/2-Initialize-OrdaXTrust.cmd"
          cp tools/release-signing/windows/Initialize-OrdaXReleaseTrust.ps1 "$out/Initialize-OrdaXReleaseTrust.ps1"
          cp tools/release-signing/windows/3-Verify-OrdaXTrustRecovery.cmd "$out/3-Verify-OrdaXTrustRecovery.cmd"
          cp tools/release-signing/windows/Complete-OrdaXReleaseTrust.ps1 "$out/Complete-OrdaXReleaseTrust.ps1"
          cp tools/release-signing/promote_public_trust.py "$out/promote_public_trust.py"
          cp tools/release-signing/windows/4-Sign-Initial-OrdaXRelease.cmd "$out/4-Sign-Initial-OrdaXRelease.cmd"
          cp tools/release-signing/windows/4-Sign-Initial-OrdaXRelease.ps1 "$out/4-Sign-Initial-OrdaXRelease.ps1"

      - name: Emit hashes and provenance
        run: |
          set -euo pipefail
          out="$PWD/out/windows-prototype-toolkit"
          (
            cd "$out"
            sha256sum \
              ordax-creator.exe \
              ordax-creator-targets.exe \
              ordax-release-signing.exe \
              1-Verify-OrdaXTrustToolkit.cmd \
              2-Initialize-OrdaXTrust.cmd \
              Initialize-OrdaXReleaseTrust.ps1 \
              3-Verify-OrdaXTrustRecovery.cmd \
              Complete-OrdaXReleaseTrust.ps1 \
              promote_public_trust.py \
              4-Sign-Initial-OrdaXRelease.cmd \
              4-Sign-Initial-OrdaXRelease.ps1 \
              > SHA256SUMS
          )
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('out/windows-prototype-toolkit')
          def digest(name):
              return hashlib.sha256((root / name).read_bytes()).hexdigest()

          qemu = json.loads(pathlib.Path(
              'docs/contracts/portable-v2-qemu-boot-proof.json'
          ).read_text(encoding='utf-8'))
          uefi = json.loads(pathlib.Path(
              'docs/contracts/portable-v2-uefi-boot-proof.json'
          ).read_text(encoding='utf-8'))
          one_shot = json.loads(pathlib.Path(
              'docs/evidence/portable-v3-one-shot-qemu-proof.json'
          ).read_text(encoding='utf-8'))
          portable_media = json.loads(pathlib.Path(
              'docs/contracts/creator-portable-media-plan.json'
          ).read_text(encoding='utf-8'))
          physical_auth = json.loads(pathlib.Path(
              'docs/contracts/physical-write-authorization.json'
          ).read_text(encoding='utf-8'))

          trust_prerequisites = {
              'portable_runtime_v3_direct_kernel_proven': (
                  qemu.get('status') == 'runtime-v3-qemu-direct-kernel-proof-pass'
                  and qemu.get('qemu_direct_kernel_boot_proven') is True
                  and qemu.get('release_manifest_schema') == 'prototype-ordax.release-manifest/3'
                  and qemu.get('physical_boot_proven') is False
                  and qemu.get('physical_write_authorized') is False
              ),
              'portable_runtime_v3_uefi_ovmf_proven': (
                  uefi.get('status') == 'runtime-v3-uefi-ovmf-proof-pass'
                  and uefi.get('qemu_uefi_boot_proven') is True
                  and uefi.get('release_manifest_schema') == 'prototype-ordax.release-manifest/3'
                  and uefi.get('secure_boot_proven') is False
                  and uefi.get('physical_usb_boot_proven') is False
              ),
              'portable_v3_one_shot_failure_fallback_proven': (
                  one_shot.get('$schema') == 'prototype-ordax.portable-v3-one-shot-qemu-proof/1'
                  and one_shot.get('status') == 'pass'
                  and isinstance(one_shot.get('source_commit'), str)
                  and len(one_shot.get('source_commit')) == 40
                  and all(ch in '0123456789abcdef' for ch in one_shot.get('source_commit'))
                  and subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', one_shot.get('source_commit'), os.environ['GITHUB_SHA']],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  ).returncode == 0
                  and one_shot.get('proven', {}).get('candidate_boot_selected_once') is True
                  and one_shot.get('proven', {}).get('fallback_previous_selected') is True
                  and one_shot.get('proven', {}).get('candidate_persisted_as_rejected') is True
                  and one_shot.get('proven', {}).get('candidate_file_removed') is True
                  and one_shot.get('proven', {}).get('activation_transaction_removed') is True
                  and one_shot.get('proven', {}).get('guest_disk_destroyed') is True
                  and one_shot.get('proven', {}).get('qemu_network_disabled') is True
                  and one_shot.get('not_proven', {}).get('cold_health_commit') is True
                  and one_shot.get('not_proven', {}).get('physical_usb_boot') is True
                  and one_shot.get('not_proven', {}).get('secure_boot') is True
                  and one_shot.get('safety', {}).get('physical_target_device_touched') is False
                  and one_shot.get('safety', {}).get('physical_write_authorized') is False
                  and one_shot.get('safety', {}).get('public_physical_promotion_allowed') is False
              ),
              'portable_writer_v2_implemented_fail_closed': (
                  portable_media.get('partitions') == ['ORDAX-ESP', 'ORDAX-DATA']
                  and portable_media.get('physical_writer_v2_implemented') is True
                  and portable_media.get('public_mvp_default_enabled') is False
                  and portable_media.get('physical_write_authorized') is False
                  and portable_media.get('physical_writer_v2', {}).get('public_creator_reachable') is False
                  and portable_media.get('physical_writer_v2', {}).get('physical_write_authorized') is False
              ),
              'physical_authorization_still_fail_closed': (
                  physical_auth.get('$schema') == 'prototype-ordax.physical-write-authorization/3'
                  and physical_auth.get('status') in (
                      'blocked-canonical-trust-pending',
                      'blocked-canonical-v4-release-proof-pending',
                  )
                  and physical_auth.get('physical_write_allowed') is False
                  and physical_auth.get('explicit_owner_authorization') is False
                  and physical_auth.get('authorization_context_sha256') in (None, '')
              ),
          }
          canonical_main_push = (
              os.environ['GITHUB_REPOSITORY'] == 'ordaxsystems/ordax-os'
              and os.environ['GITHUB_EVENT_NAME'] == 'push'
              and os.environ['GITHUB_REF'] == 'refs/heads/main'
          )
          data = {
              '$schema': 'prototype-ordax.windows-prototype-toolkit/2',
              'status': 'candidate',
              'source_commit': os.environ['GITHUB_SHA'],
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_ref': os.environ['GITHUB_REF'],
              'source_event': os.environ['GITHUB_EVENT_NAME'],
              'canonical_trust_ceremony_eligible': (
                  canonical_main_push and all(trust_prerequisites.values())
              ),
              'canonical_trust_prerequisites': trust_prerequisites,
              'go_version': subprocess.check_output(['go', 'version'], text=True).strip(),
              'native_windows_raw_disk_backend_source_implemented': True,
              'native_windows_raw_disk_backend_build_tag': 'ordax_raw_backend',
              'native_windows_raw_disk_backend_in_public_build': False,
              'native_windows_raw_disk_backend_publicly_reachable': False,
              'public_creator_binary_links_native_raw_backend': False,
              'public_physical_apply_implemented': False,
              'physical_write_authorized': False,
              'canonical_trust_included': False,
              'private_key_included': False,
              'key_generation_requires_local_user_action': True,
              'components': {
                  'creator': {'name': 'ordax-creator.exe', 'sha256': digest('ordax-creator.exe')},
                  'target_helper': {'name': 'ordax-creator-targets.exe', 'sha256': digest('ordax-creator-targets.exe')},
                  'release_signer': {'name': 'ordax-release-signing.exe', 'sha256': digest('ordax-release-signing.exe')},
                  'trust_initializer': {'name': 'Initialize-OrdaXReleaseTrust.ps1', 'sha256': digest('Initialize-OrdaXReleaseTrust.ps1')},
                  'trust_recovery_finalizer': {'name': 'Complete-OrdaXReleaseTrust.ps1', 'sha256': digest('Complete-OrdaXReleaseTrust.ps1')},
                  'public_trust_promoter': {'name': 'promote_public_trust.py', 'sha256': digest('promote_public_trust.py')},
              },
          }
          (root / 'provenance.json').write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Assert toolkit contains no secret material or public physical writer
        run: |
          set -euo pipefail
          out="$PWD/out/windows-prototype-toolkit"
          test -z "$(find "$out" -type f \( -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' \) -print -quit)"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('out/windows-prototype-toolkit')
          provenance = json.loads((root / 'provenance.json').read_text(encoding='utf-8'))
          assert provenance['native_windows_raw_disk_backend_source_implemented'] is True
          assert provenance['native_windows_raw_disk_backend_build_tag'] == 'ordax_raw_backend'
          assert provenance['native_windows_raw_disk_backend_in_public_build'] is False
          assert provenance['native_windows_raw_disk_backend_publicly_reachable'] is False
          assert provenance['public_creator_binary_links_native_raw_backend'] is False
          assert provenance['public_physical_apply_implemented'] is False
          assert provenance['physical_write_authorized'] is False
          assert provenance['canonical_trust_included'] is False
          assert provenance['private_key_included'] is False
          assert provenance['key_generation_requires_local_user_action'] is True
          assert provenance['source_repository'] == os.environ['GITHUB_REPOSITORY']
          assert provenance['source_ref'] == os.environ['GITHUB_REF']
          assert provenance['source_event'] == os.environ['GITHUB_EVENT_NAME']
          prerequisites = provenance['canonical_trust_prerequisites']
          assert set(prerequisites) == {
              'portable_runtime_v3_direct_kernel_proven',
              'portable_runtime_v3_uefi_ovmf_proven',
              'portable_v3_one_shot_failure_fallback_proven',
              'portable_writer_v2_implemented_fail_closed',
              'physical_authorization_still_fail_closed',
          }
          assert all(isinstance(value, bool) for value in prerequisites.values())
          canonical_main_push = (
              os.environ['GITHUB_REPOSITORY'] == 'ordaxsystems/ordax-os'
              and os.environ['GITHUB_EVENT_NAME'] == 'push'
              and os.environ['GITHUB_REF'] == 'refs/heads/main'
          )
          expected_ceremony_eligibility = canonical_main_push and all(prerequisites.values())
          assert provenance['canonical_trust_ceremony_eligible'] is expected_ceremony_eligibility
          print('TOOLKIT_SECRET_MATERIAL=NONE')
          print('TOOLKIT_PUBLIC_PHYSICAL_APPLY=BLOCKED')
          print('TOOLKIT_RAW_BACKEND_IN_PUBLIC_BUILD=NO')
          print('TOOLKIT_PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

      - name: Upload Windows prototype toolkit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-windows-prototype-toolkit-${{ github.sha }}
          path: out/windows-prototype-toolkit/
          if-no-files-found: error
          retention-days: 14

  windows-native-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/creator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Parse release trust ceremony PowerShell natively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '../release-signing/windows/Initialize-OrdaXReleaseTrust.ps1',
            '../release-signing/windows/Complete-OrdaXReleaseTrust.ps1',
            '../release-signing/windows/4-Sign-Initial-OrdaXRelease.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for ${path}: $($errors | Out-String)"
            }
          }
          Write-Host 'RELEASE_TRUST_POWERSHELL_PARSE=PASS'

      - name: Test public/default Creator Windows host adapter natively
        shell: pwsh
        run: go test -count=1 ./...

      - name: Test tagged native raw backend guards
        shell: pwsh
        run: go test -count=1 -tags ordax_raw_backend ./host/windows
