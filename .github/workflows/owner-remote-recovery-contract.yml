name: Owner Remote Recovery Contract

on:
  pull_request:
    paths:
      - "bootstrap/base-update/owner-development/**"
      - "bootstrap/dev-base/ordax-pull"
      - "bootstrap/dev-base/ordax-run"
      - "system/services/base-update/dev-helpers.sh"
      - "tests/test_dev_base_helper_refresh.py"
      - "tests/test_owner_remote_recovery.py"
      - ".github/workflows/owner-remote-recovery-contract.yml"
  push:
    branches: [main]
    paths:
      - "bootstrap/base-update/owner-development/**"
      - "bootstrap/dev-base/ordax-pull"
      - "bootstrap/dev-base/ordax-run"
      - "system/services/base-update/dev-helpers.sh"
      - "tests/test_dev_base_helper_refresh.py"
      - "tests/test_owner_remote_recovery.py"
      - ".github/workflows/owner-remote-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-remote-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Owner recovery and Development helper contracts
        run: |
          python3 tests/test_owner_remote_recovery.py
          python3 tests/test_dev_base_helper_refresh.py

      - name: Verify shell syntax of the update path
        run: |
          /bin/sh -n bootstrap/base-update/owner-development/ordax-remote
          /bin/sh -n bootstrap/dev-base/ordax-pull
          /bin/sh -n bootstrap/dev-base/ordax-run
          /bin/sh -n system/services/base-update/dev-helpers.sh

      - name: Verify exact Runtime release bytes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import tempfile
          import urllib.parse
          import urllib.request

          pin_path = pathlib.Path("bootstrap/base-update/owner-development/owner-recovery-source.json")
          pin = json.loads(pin_path.read_text(encoding="utf-8"))
          runtime = pin["runtime"]
          source_sha = runtime["source_sha"]
          url = runtime["asset_url"]
          expected_sha = runtime["sha256"]
          expected_size = int(runtime["size_bytes"])

          expected_url = (
              "https://github.com/ordaxsystems/ordax-runtime/releases/download/"
              f"owner-recovery-{source_sha}/ordax-owner-recovery-agent"
          )
          if url != expected_url:
              raise SystemExit("owner recovery asset URL is not exact-source bound")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "OrdaX-Owner-Recovery-Contract/1"},
          )
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=60) as response:
              final_url = response.geturl()
              if urllib.parse.urlparse(final_url).scheme != "https":
                  raise SystemExit("owner recovery download left HTTPS")
              with tempfile.TemporaryFile() as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
                      digest.update(chunk)
                      size += len(chunk)

          observed_sha = digest.hexdigest()
          if size != expected_size:
              raise SystemExit(
                  f"owner recovery artifact size mismatch: expected={expected_size} actual={size}"
              )
          if observed_sha != expected_sha:
              raise SystemExit(
                  "owner recovery artifact digest mismatch: "
                  f"expected={expected_sha} actual={observed_sha}"
              )

          print(f"ORDAX_OWNER_REMOTE_ARTIFACT_SIZE={size}")
          print(f"ORDAX_OWNER_REMOTE_ARTIFACT_SHA256={observed_sha}")
          PY
