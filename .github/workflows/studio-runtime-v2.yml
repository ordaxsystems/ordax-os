name: Studio Runtime v2

on:
  push:
    branches: [main]
    paths:
      - 'system/contracts/device-action-envelope-v2.mjs'
      - 'system/contracts/studio-action-context.mjs'
      - 'system/contracts/studio-runtime-v2.mjs'
      - 'tests/test_studio_runtime_v2.mjs'
      - '.github/workflows/studio-runtime-v2.yml'
  pull_request:
    paths:
      - 'system/contracts/device-action-envelope-v2.mjs'
      - 'system/contracts/studio-action-context.mjs'
      - 'system/contracts/studio-runtime-v2.mjs'
      - 'tests/test_studio_runtime_v2.mjs'
      - '.github/workflows/studio-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate versioned contract syntax
        run: |
          set -euo pipefail
          node --check system/contracts/device-action-envelope-v2.mjs
          node --check system/contracts/studio-action-context.mjs
          node --check system/contracts/studio-runtime-v2.mjs
          node --check tests/test_studio_runtime_v2.mjs

      - name: Prove no-account owner scopes and request/receipt safety
        run: |
          set -euo pipefail
          node --test tests/test_studio_runtime_v2.mjs
