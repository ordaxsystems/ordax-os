name: Creator Owner Development Git USB

on:
  push:
    branches: [main]
    paths:
      - 'boot/esp/**'
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/dev/**'
      - 'bootstrap/dev-base/**'
      - 'bootstrap/surface-runtime/**'
      - 'bootstrap/surface-runtime/**'
      - 'bootstrap/independent-base/**'
      - 'bootstrap/recovery/**'
      # Creator's published USB must cover the actual boot/Guardian/Surface
      # source snapshot. Previously a system-only main commit (including
      # Supervisor rollback fixes) did NOT refresh the Creator bundle.
      - 'system/**'
      - 'tools/creator/**'
      - 'tools/release-signing/**'
      - '!tools/release-signing/windows/**'
      - '!tools/release-signing/promote_public_trust.py'
      - '!tools/release-signing/cmd/ordax-physical-release-signing/**'
      - '!tools/release-signing/README.md'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'docs/contracts/physical-media.json'
      - 'docs/contracts/distribution-profiles.json'
      - '.github/workflows/creator-owner-dev-git.yml'
      - 'tools/ci/independent_surface_component_cache.py'
      - 'tools/ci/independent_surface_r2.sh'
      - 'tests/test_owner_surface_cache_contract.py'
      - 'tools/ci/preflight_owner_dev.py'
      - 'tests/test_ci_two_stage_release_gate.py'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_owner_external_source.py'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'bootstrap/dev/**'
      - 'bootstrap/dev-base/**'
      - 'bootstrap/surface-runtime/**'
      - 'bootstrap/surface-runtime/**'
      - 'bootstrap/independent-base/**'
      - 'system/entrypoint'
      # Boot health and update handoff must prove the real Owner USB on PRs,
      # not only on the subsequent main push (when the rollback risk is live).
      # Keep this scoped to the actual cold-boot composition entrypoints.
      - 'system/supervisor'
      - 'docs/contracts/surface-source.json'
      - 'docs/contracts/intelligence-source.json'
      - 'system/services/intelligence-source/**'
      - 'tools/intelligence-source/**'
      - '.github/actions/assemble-intelligence/**'
      - 'tools/surface-source/**'
      - 'system/surface/ui/**'
      - 'system/surface/workspace/**'
      - '.github/actions/prepare-verified-surface/**'
      - 'system/composition/native/main.mjs'
      - 'system/adapters/native/update-runtime.mjs'
      - 'tests/test_owner_usb_durable_power_transition.py'
      - 'tests/test_owner_usb_superblock_seal.py'
      - 'system/surface/bin/ordax-surface'
      - 'tests/test_owner_surface_launcher_identity.py'
      - 'system/surface/runtime/ordax_browser_host.py'
      - 'tests/test_owner_qemu_offline_handoff.py'
      - 'tools/creator/verify_owner_dev_offline_runtime.py'
      - 'tests/test_owner_dev_offline_runtime_release_gate.py'
      - '.github/workflows/creator-owner-dev-git.yml'
      - 'tools/ci/independent_surface_component_cache.py'
      - 'tools/ci/independent_surface_r2.sh'
      - 'tests/test_owner_surface_cache_contract.py'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_owner_external_source.py'
      - 'tools/creator/proof/prove_prepared_ext4_growth.sh'
      - 'tests/test_creator_payload_source_identity.py'
      # Removal or resurrection of embedded Creator Go must be proven by the
      # full disposable Owner USB/QEMU consumer before landing on main.
      - 'tools/creator/**/*.go'
      - 'tools/creator/go.mod'
      - 'tools/creator/go.sum'
      - 'tools/creator/core/README.md'
      - 'tests/test_creator_no_embedded_go.py'

permissions:
  contents: write

concurrency:
  group: creator-owner-dev-git-${{ github.ref }}
  # Preserve in-flight Owner USB cold-boot proofs for BOTH PRs and main.
  # Revisions share this branch-scoped group: GitHub keeps one running build
  # and replaces the pending run with the newest commit. Cancelling expensive
  # Buildroot/graphical proof on each PR edit hides its actual boot result.
  # Exact source SHA, immutable provenance and physical-write gates still apply.
  cancel-in-progress: false

jobs:
  owner-dev-contract:
    # Keep the real Owner preflight active while a PR is in draft.
    # No Buildroot, native image, QEMU, or physical media in this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact Owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false
      - name: Fast Owner Development preflight
        run: |
          set -euo pipefail
          bash -n tools/ci/independent_surface_r2.sh
          python3 -m unittest tests.test_owner_surface_cache_contract tests.test_ci_two_stage_release_gate -v
          python3 tools/ci/preflight_owner_dev.py

  build-and-publish:
    needs: owner-dev-contract
    # Draft PRs use fast contracts; full USB/QEMU only for a release candidate.
    # workflow_dispatch and main push remain explicit/full delivery entrypoints.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Serialize exact source build ownership with the independent producer.
    concurrency:
      group: ordax-surface-producer-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      # Exact checkout identity for push and PR; github.sha on PR is the
      # synthetic merge SHA, not the actual local source for Creator.
      ORDAX_OWNER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      ORDAX_SURFACE_PRODUCER_ENVIRONMENT: ${{ vars.ORDAX_SURFACE_PRODUCER_ENVIRONMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve immutable standalone Creator implementation
        uses: ./.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/ordax-creator-owner-source

      - name: Prepare pinned Surface from independent visual owner for exact Owner image
        uses: ./.github/actions/prepare-verified-surface

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate exact Intelligence source in disposable CI assembly
        uses: ./.github/actions/assemble-intelligence
        with:
          source-root: ${{ runner.temp }}/ordax-verified-surface-ci
          out-root: ${{ runner.temp }}/ordax-verified-intelligence-ci

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Resolve signed kernel version from canonical source
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/ci_env.py --github-env "$GITHUB_ENV"

      - name: Test Creator core
        run: |
          set -euo pipefail
          creator="${ORDAX_CREATOR_NATIVE_SOURCE:?missing independent Creator source}"
          test "${ORDAX_CREATOR_SOURCE_REPOSITORY:?}" = 'ordaxsystems/ordax-creator'
          test "$(git -C "$creator" rev-parse HEAD)" = "${ORDAX_CREATOR_SOURCE_COMMIT:?}"
          test "$(git -C "$creator" rev-parse 'HEAD^{tree}')" = "${ORDAX_CREATOR_SOURCE_TREE:?}"
          test "$(head -n 1 "$creator/go.mod")" = 'module github.com/ordaxsystems/ordax-creator'
          python3 - "$creator/version.json" "$GITHUB_ENV" <<'PY'
          import json, pathlib, re, sys
          source, github_env = map(pathlib.Path, sys.argv[1:])
          metadata = json.loads(source.read_text(encoding='utf-8'))
          version = metadata.get('version')
          if (metadata.get('$schema') != 'ordax.creator-product-version/1'
              or not isinstance(version, str)
              or re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z][a-z0-9]*(?:\.[0-9]+)?)?', version) is None):
              raise SystemExit('invalid independently pinned Creator version')
          with github_env.open('a', encoding='utf-8') as output:
              output.write(f'ORDAX_CREATOR_PRODUCT_VERSION={version}\n')
          PY
          (
            cd "$creator"
            ORDAX_OS_CONTRACTS_DIR="$GITHUB_WORKSPACE/docs/contracts" go test -count=1 ./...
            mkdir -p "$RUNNER_TEMP/owner-creator-cli"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$RUNNER_TEMP/owner-creator-cli/ordax-creator" ./cmd/ordax-creator
          )
          test -x "$RUNNER_TEMP/owner-creator-cli/ordax-creator"
          echo "OWNER_CREATOR_IMPLEMENTATION_SHA=${ORDAX_CREATOR_SOURCE_COMMIT}"
          echo "OWNER_CREATOR_IMPLEMENTATION_TREE=${ORDAX_CREATOR_SOURCE_TREE}"
          python -m unittest tests.test_owner_dev_bundle_verifier -v
          python -m unittest tests.test_owner_dev_helper_storage_profile -v
          python -m unittest tests.test_owner_published_release -v
          python -m unittest tests.test_owner_dev_offline_runtime_release_gate tests.test_owner_surface_offline_preseed tests.test_owner_surface_launcher_identity -v
          python -m unittest tests.test_owner_qemu_offline_handoff -v
          python -m unittest tests.test_first_run_contract.FirstRunContractTests.test_native_first_run_completion_survives_fresh_native_process -v
          node --test tests/test_surface_boot_screen_runtime.mjs
          node --test tests/test_browser_proof_shutdown.mjs
          python -m unittest tests.test_first_run_contract -v
          python -m unittest tests.test_owner_first_run_http_restart -v

      - name: Prove Native First Run browser journey
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node tools/surface-native/first-run-browser-smoke.mjs

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools binutils bzip2 \
            gpg gpg-agent \
            meson ninja-build gperf libcap-dev libmount-dev libblkid-dev \
            liblz4-dev libzstd-dev liblzma-dev libpcre2-dev \
            gdisk dosfstools e2fsprogs mtools util-linux erofs-utils qemu-system-x86 busybox \
            gawk cpio unzip rsync file wget curl patch gettext
          python -m pip install --disable-pip-version-check --no-cache-dir jinja2 pyelftools

      # Fail fast before boot/initramfs, kernel and Owner Base builds when the
      # single producer has not delivered a verified EROFS. No WebKit rebuild
      # is allowed in this Creator job and no provenance may be rewritten.
      - name: Resolve independent Surface artifact fingerprint for Owner
        id: owner-surface-fingerprint
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          python3 tools/ci/independent_surface_component_cache.py fingerprint --github-output "$GITHUB_OUTPUT"

      - name: Restore exact verified Surface EROFS for Owner
        id: owner-surface-artifact-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent-surface
          key: ordax-independent-surface-artifact-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.owner-surface-fingerprint.outputs.fingerprint }}

      - name: Restore verified Surface EROFS from durable R2 for Owner
        id: owner-surface-r2
        if: steps.owner-surface-artifact-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_R2_ACCOUNT_ID: '42586bf13b61436219d21def299833e4'
          ORDAX_R2_BUCKET: 'ordax-device-artifacts'
          ORDAX_R2_ACCESS_KEY_ID: ${{ secrets.ORDAX_R2_ACCESS_KEY_ID }}
          ORDAX_R2_SECRET_ACCESS_KEY: ${{ secrets.ORDAX_R2_SECRET_ACCESS_KEY }}
          ORDAX_SURFACE_FINGERPRINT: ${{ steps.owner-surface-fingerprint.outputs.fingerprint }}
          ORDAX_SOURCE_COMMIT: ${{ env.ORDAX_OWNER_SOURCE_COMMIT }}
        run: bash tools/ci/independent_surface_r2.sh restore

      # The Creator consumes only a preverified content-addressed artifact.
      # Compiler/download caches belong exclusively to the Surface producer.
      - name: Consume verified canonical offline Surface runtime
        id: owner-surface-build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ordax-independent-surface"
          if [ '${{ steps.owner-surface-artifact-cache.outputs.cache-hit }}' != true ] &&
             [ '${{ steps.owner-surface-r2.outputs.hit }}' != true ]; then
            echo "::error title=Canonical Surface EROFS missing::Run Independent Surface Runtime producer for the exact fingerprint before Creator. Never compile WebKit in the Creator consumer." >&2
            exit 1
          fi
          python3 tools/ci/independent_surface_component_cache.py verify \
            --out "$out" --integration-commit "$ORDAX_OWNER_SOURCE_COMMIT" \
            --cache-hit true --consumer \
            --receipt "$RUNNER_TEMP/owner-surface-cache-inspection.json"
          echo 'OWNER_SURFACE_RUNTIME_SOURCE=verified-content-addressed-cache'
          python3 bootstrap/surface-runtime/build.py verify --out "$out"
          mkdir -p "$RUNNER_TEMP/owner-dev-surface-runtime"
          cp -a "$out/." "$RUNNER_TEMP/owner-dev-surface-runtime/"
          python3 bootstrap/surface-runtime/build.py verify \
            --out "$RUNNER_TEMP/owner-dev-surface-runtime"

      - name: Save verified Owner Surface EROFS to shared artifact cache
        if: steps.owner-surface-build.outcome == 'success' && steps.owner-surface-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent-surface
          key: ordax-independent-surface-artifact-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.owner-surface-fingerprint.outputs.fingerprint }}

      - name: Ensure verified Owner Surface exists in durable R2 store
        if: steps.owner-surface-build.outcome == 'success' && steps.owner-surface-r2.outputs.hit != 'true'
        env:
          ORDAX_R2_ACCOUNT_ID: '42586bf13b61436219d21def299833e4'
          ORDAX_R2_BUCKET: 'ordax-device-artifacts'
          ORDAX_R2_ACCESS_KEY_ID: ${{ secrets.ORDAX_R2_ACCESS_KEY_ID }}
          ORDAX_R2_SECRET_ACCESS_KEY: ${{ secrets.ORDAX_R2_SECRET_ACCESS_KEY }}
          ORDAX_SURFACE_FINGERPRINT: ${{ steps.owner-surface-fingerprint.outputs.fingerprint }}
        run: bash tools/ci/independent_surface_r2.sh publish

      - name: Prove Owner USB ext4 alias sealing in isolated mount namespace
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Only a disposable 128 MiB loop-backed file is mounted; the test
          # runs in its own mount namespace, never against a host block disk.
          sudo env ORDAX_OWNER_USB_MOUNT_INTEGRATION=1 \
            python3 -m unittest tests.test_owner_usb_superblock_seal -v

      - name: Resolve reusable kernel fingerprint
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/owner-dev/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build kernel candidate on verified cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/owner-dev/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py out/kernel
          test -s "out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir out/kernel \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir out/kernel \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Restore verified Owner Buildroot base
        id: owner-base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/owner-independent-base
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-independent-base-owner-${{ steps.component-fingerprints.outputs.independent_base_owner }}

      - name: Build boot initramfs and Git development base
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Verify and remove ephemeral hydrated visuals BEFORE the expensive
          # rootfs compilation. The Creator seeds solely from a clean Git SSOT.
          for part in ui workspace; do
            src="$RUNNER_TEMP/ordax-verified-surface-ci/system/surface/$part"
            target="system/surface/$part"
            test -d "$src" || {
              echo "::error::OWNER_EXTERNAL_SURFACE_SOURCE_MISSING:$part" >&2; exit 1;
            }
            diff -qr "$src" "$target" || {
              echo "::error::OWNER_EXTERNAL_SURFACE_STAGING_DRIFT:$part" >&2; exit 1;
            }
            rm -rf "$target"
            test ! -e "$target" || {
              echo "::error::OWNER_EXTERNAL_SURFACE_TEMPORARY_COPY_REMAINED:$part" >&2; exit 1;
            }
          done
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::OWNER_SOURCE_CHECKOUT_DIRTY_BEFORE_BUILDROOT" >&2
            exit 1
          }
          python boot/esp/build.py check
          python boot/esp/build.py build
          python boot/esp/build.py verify
          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify
          # Single independent Buildroot Owner producer: no Alpine APK or
          # mirrored kernel. The same exact source commit binds firmware/modules.
          export ORDAX_SOURCE_COMMIT="$ORDAX_OWNER_SOURCE_COMMIT"
          export ORDAX_HOST_PYTHON="$(command -v python3)"
          export ORDAX_KERNEL_MODULES_ARCHIVE="$PWD/out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          export ORDAX_KERNEL_MODULES_RECEIPT="$RUNNER_TEMP/owner-independent-base/kernel-module-payload.json"
          export ORDAX_FIRMWARE_COVERAGE_RECEIPT="$RUNNER_TEMP/owner-independent-base/firmware-coverage.json"
          owner_cache_hit='${{ steps.owner-base-cache.outputs.cache-hit }}'
          if [ "$owner_cache_hit" != true ]; then
            owner_cache_hit=false
            echo 'ORDAX_OWNER_BASE_CACHE_MISS=build-affecting-input-or-environment'
            sudo -E python3 bootstrap/independent-base/build.py build \
              --profile owner-development --out "$RUNNER_TEMP/owner-independent-base" \
              --cache "$RUNNER_TEMP/owner-independent-cache" --jobs 4
          fi
          sudo -E python3 bootstrap/independent-base/build.py verify \
            --profile owner-development --out "$RUNNER_TEMP/owner-independent-base"
          metadata="$RUNNER_TEMP/owner-dev/metadata"
          if [ "$owner_cache_hit" = false ]; then
            sudo -E python3 tools/ci/portable_component_cache.py record \
              --component independent-base-owner \
              --out-dir "$RUNNER_TEMP/owner-independent-base" \
              --source-commit "$ORDAX_OWNER_SOURCE_COMMIT" \
              > "$metadata/owner-base-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component independent-base-owner \
            --out-dir "$RUNNER_TEMP/owner-independent-base" \
            --integration-commit "$ORDAX_OWNER_SOURCE_COMMIT" \
            --cache-hit "$owner_cache_hit" \
            --receipt "$metadata/owner-base-component-reuse.json"
          echo "ORDAX_OWNER_BASE_CACHE_HIT=$owner_cache_hit"
          sudo mkdir -p out/dev-base
          sudo -E python3 tools/dev-base-channel/independent_rootfs.py materialize \
            --rootfs "$RUNNER_TEMP/owner-independent-base/rootfs.tar" \
            --provenance "$RUNNER_TEMP/owner-independent-base/provenance.json" \
            --expected-commit "$ORDAX_OWNER_SOURCE_COMMIT" \
            --reuse-receipt "$RUNNER_TEMP/owner-dev/metadata/owner-base-component-reuse.json" \
            --destination out/dev-base/rootfs
          rootfs="$(realpath out/dev-base/rootfs)"
          # The verifier already enforces archive confinement, immutable
          # provenance, profile and source commit. Retain explicit executable
          # and no-APK release gates with actionable diagnostics.
          test ! -e "$rootfs/etc/alpine-release" || {
            echo "::error::OWNER_ROOTFS_ALPINE_RELEASE_PRESENT" >&2; exit 1;
          }
          test ! -e "$rootfs/sbin/apk" || {
            echo "::error::OWNER_ROOTFS_APK_BINARY_PRESENT" >&2; exit 1;
          }
          test ! -e "$rootfs/lib/apk" || {
            echo "::error::OWNER_ROOTFS_APK_METADATA_PRESENT" >&2; exit 1;
          }
          test -x "$rootfs/usr/bin/git" || {
            echo "::error::OWNER_ROOTFS_GIT_NOT_EXECUTABLE" >&2; exit 1;
          }
          echo 'OWNER_ROOTFS_BUILDROOT_BOOTSTRAP=VERIFIED'
          # Buildroot rootfs.tar is materialized as root and its system
          # directories deliberately remain root-owned. The canonical offline
          # Git seed also activates manifest-owned helpers under /sbin and
          # /usr/local/bin: perform that single seed as root, not with a
          # partially writable rootfs or a second helper installer.
          sudo mkdir -p "$rootfs/workspace" "$rootfs/state"
          # The full UI is materialized only in disposable CI. Do not allow
          # an untracked visual source to become Owner Git authority.
          checkout_dirty="$(git status --porcelain)"
          if [ -n "$checkout_dirty" ]; then
            printf '%s\n' "$checkout_dirty" >&2
            echo "::error::OWNER_SOURCE_CHECKOUT_DIRTY_AFTER_BUILDROOT" >&2
            exit 1
          fi
          echo 'OWNER_SOURCE_CHECKOUT=VERIFIED_CLEAN'
          # Scope Git's owner exception to this exact trusted CI checkout;
          # never use safe.directory=* or make the installed rootfs writable
          # by the runner. Newly created sparse checkout/state remain root-owned.
          sudo env \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            ORDAX_WORKTREE="$rootfs/workspace/ordax" \
            ORDAX_STATE_DIR="$rootfs/state/ordax" \
            ORDAX_UPDATE_RUN_DIR="$RUNNER_TEMP/ordax-owner-dev-seed-run" \
            ORDAX_DEV_HELPER_TARGET_ROOT="$(realpath "$rootfs")" \
            ORDAX_REPO_URL='https://github.com/ordaxsystems/ordax-os.git' \
            ORDAX_REPO_BRANCH=main \
            /bin/sh bootstrap/dev-base/ordax-pull \
              --seed-from-local "$GITHUB_WORKSPACE" "$ORDAX_OWNER_SOURCE_COMMIT"
          # The same verified visual bytes may be reused for subsequent
          # disposable CI browser tests; no file is committed to OS Git or
          # copied into the sparse Owner checkout.
          for part in ui workspace; do
            cp -a "$RUNNER_TEMP/ordax-verified-surface-ci/system/surface/$part" "system/surface/$part"
          done
          test "$(sudo git -C "$rootfs/workspace/ordax" rev-parse HEAD)" = "$ORDAX_OWNER_SOURCE_COMMIT"
          test "$(sudo git -C "$rootfs/workspace/ordax" symbolic-ref --quiet --short HEAD)" = main
          test "$(sudo git -C "$rootfs/workspace/ordax" remote get-url origin)" = 'https://github.com/ordaxsystems/ordax-os.git'
          test -z "$(sudo git -C "$rootfs/workspace/ordax" status --porcelain)"
          test -x "$rootfs/workspace/ordax/system/entrypoint"
          test "$(sudo cat "$rootfs/state/ordax/current-commit")" = "$ORDAX_OWNER_SOURCE_COMMIT"
          # Checkout and state have remained root-owned throughout bootstrap.
          # First Run must work without network. Put exactly one verified
          # visual source in the Supervisor's immutable release cache on
          # the Creator build host, NEVER a second Git tracked UI copy.
          # A candidate source is verified but MUST NOT replace the engine
          # that executes at first boot. Use external bytes only when the
          # pinned OS source lock itself has reached canonical status.
          intelligence_status=$(python3 - <<'PY'
          import json
          from pathlib import Path
          pin=json.loads(Path('docs/contracts/intelligence-source.json').read_text())
          assert pin['source_repository']=='ordaxsystems/ordax-intelligence'
          assert pin['source_only'] is True and pin['activation_authorized'] is False
          assert pin['status'] in ('integration-candidate','canonical')
          print(pin['status'])
          PY
          )
          if [ "$intelligence_status" = canonical ]; then
            prepared_source="$RUNNER_TEMP/ordax-verified-intelligence-ci"
          else
            prepared_source="$RUNNER_TEMP/ordax-verified-surface-ci"
          fi
          sudo -E python3 tools/surface-source/preseed_owner.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --assembled-root "$prepared_source" \
            --rootfs "$rootfs" \
            --os-commit "$ORDAX_OWNER_SOURCE_COMMIT"
          sudo -E /bin/sh system/services/surface-source/owner-stage.sh ready \
            "$rootfs/workspace/ordax" "$ORDAX_OWNER_SOURCE_COMMIT" \
            "$rootfs/state/ordax/releases/$ORDAX_OWNER_SOURCE_COMMIT"
          # Revalidate source status against the exact staged OS checkout.
          runtime_status=$(sudo -E /bin/sh system/services/intelligence-source/owner-stage.sh status "$rootfs/workspace/ordax" "$ORDAX_OWNER_SOURCE_COMMIT")
          test "$runtime_status" = "$intelligence_status"
          if [ "$runtime_status" = canonical ]; then
            test -s "$rootfs/state/ordax/releases/$ORDAX_OWNER_SOURCE_COMMIT/.intelligence-file-hashes"
            test -s "$rootfs/state/ordax/releases/$ORDAX_OWNER_SOURCE_COMMIT/.intelligence-source-sha"
            sudo -E /bin/sh system/services/intelligence-source/owner-stage.sh ready \
              "$rootfs/workspace/ordax" "$ORDAX_OWNER_SOURCE_COMMIT" \
              "$rootfs/state/ordax/releases/$ORDAX_OWNER_SOURCE_COMMIT"
            echo 'ORDAX_OWNER_FIRST_BOOT_INTELLIGENCE_OFFLINE_READY=YES'
          else
            test ! -e "$rootfs/state/ordax/releases/$ORDAX_OWNER_SOURCE_COMMIT/.intelligence-source-sha"
            test ! -e "$rootfs/state/ordax/releases/$ORDAX_OWNER_SOURCE_COMMIT/system/intelligence-source"
            echo 'ORDAX_OWNER_FIRST_BOOT_UNPROMOTED_INTELLIGENCE=NOT_PACKAGED'
          fi
          echo 'ORDAX_OWNER_FIRST_BOOT_EXTERNAL_SURFACE_OFFLINE_READY=YES'
          sudo touch "$rootfs/dev/null"
          cleanup_dev_null() {
            sudo rm -f "$rootfs/dev/null"
          }
          trap cleanup_dev_null EXIT
          sudo chroot "$rootfs" /usr/bin/git --version
          cleanup_dev_null
          trap - EXIT
          test -x out/dev-base/rootfs/sbin/ordax-dev-init
          test -x out/dev-base/rootfs/usr/local/bin/ordax-pull
          test -z "$(sudo find "$rootfs/dev" -mindepth 1 -print -quit)"

      - name: Save verified Owner Buildroot for reuse
        if: steps.owner-base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/owner-independent-base
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-independent-base-owner-${{ steps.component-fingerprints.outputs.independent_base_owner }}

      - name: Create ephemeral prototype trust for Creator provenance
        run: |
          set -euo pipefail
          mkdir -p out/owner-prototype bootstrap/trust
          (
            cd tools/release-signing
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/owner-prototype/ordax-release-signing .
          )
          signer="$PWD/out/owner-prototype/ordax-release-signing"
          private="$RUNNER_TEMP/owner-prototype-private.pem"
          trust="$RUNNER_TEMP/owner-prototype-trust.json"
          # Source-pinned public release trust must never be overwritten by a
          # temporary Owner/Development identity generated during CI.
          test ! -e "$private"
          test ! -e "$trust"
          "$signer" generate-key \
            --private-key "$private" \
            --trust "$trust" \
            --key-id owner-dev-${GITHUB_SHA::12}
          test -s "$private"
          test -s "$trust"
          echo "$private" > "$RUNNER_TEMP/owner-prototype-private-path"

      - name: Derive development Git bootstrap manifest
        run: |
          set -euo pipefail
          python3 tools/creator/owner_dev_manifest.py "$RUNNER_TEMP/minimal-bootstrap-owner-dev.json"

      - name: Assemble boot payload and overlay Git development base
        run: |
          set -euo pipefail
          export ORDAX_DEV_GEOMETRY_OUT="$RUNNER_TEMP/owner-dev-physical-media.json"
          bash tools/creator/owner_dev_stage.sh \
            "$RUNNER_TEMP/minimal-bootstrap-owner-dev.json" \
            "$RUNNER_TEMP/owner-prototype-payload" \
            "$RUNNER_TEMP/owner-prototype-stage" \
            "$RUNNER_TEMP/owner-creator-cli/ordax-creator" \
            "out/dev-base/rootfs" \
            "$RUNNER_TEMP/owner-dev-surface-runtime"
          echo "$RUNNER_TEMP/owner-prototype-stage" > "$RUNNER_TEMP/owner-prototype-stage-path"

      - name: Materialize and verify RAW development seed
        run: |
          set -euo pipefail
          stage="$(cat "$RUNNER_TEMP/owner-prototype-stage-path")"
          proof="$RUNNER_TEMP/owner-prototype-media"
          sudo python3 tools/creator/owner_dev_raw.py \
            --contract "$RUNNER_TEMP/owner-dev-physical-media.json" \
            --stage-root "$stage" \
            --output-root "$proof"
          sudo chown -R "$(id -u):$(id -g)" "$proof"
          python - "$proof/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['status'] == 'pass'
          assert proof['physical_write_authorized'] is False
          assert all(proof['checks'].values())
          PY

          prepared_proof="$RUNNER_TEMP/owner-prototype-prepared-ext4-proof.json"
          # A PR checkout uses the head SHA, not GitHub's synthetic merge SHA.
          # Pass that exact source identity to the canonical ext4 growth oracle.
          export ORDAX_SOURCE_COMMIT="$ORDAX_OWNER_SOURCE_COMMIT"
          # Exercise actual ext4 growth from this exact, derived Owner seed.
          # The old 768-MiB target is smaller than a graphical offline USB;
          # never bypass the prepared-media oracle or change Stable geometry.
          seed_bytes="$(stat -c '%s' "$proof/ordax-disposable.raw")"
          target_bytes="$((seed_bytes + 512 * 1024 * 1024))"
          max_target_bytes="$((7 * 1024 * 1024 * 1024))"
          if [ "$target_bytes" -gt "$max_target_bytes" ] ||
             [ "$((target_bytes % 512))" -ne 0 ]; then
            echo 'Owner USB growth proof exceeds bounded 8-GB-media test capacity' >&2
            exit 1
          fi
          bash tools/creator/proof/prove_prepared_ext4_growth.sh \
            "$proof/ordax-disposable.raw" \
            out/initramfs-work/ordax-grow-ext4 \
            "$prepared_proof" \
            "$target_bytes"
          python - "$prepared_proof" <<'PY'
          import json, os, pathlib, sys
          prepared = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert prepared['$schema'] == 'prototype-ordax.creator-prepared-ext4-growth-proof/1'
          assert prepared['status'] == 'pass'
          assert prepared['source_commit'] == os.environ['ORDAX_OWNER_SOURCE_COMMIT']
          assert prepared['ext4']['bootstrap_entrypoint_path'] == '/bootstrap/entrypoint'
          assert prepared['ext4']['bootstrap_entrypoint_mode_before'] == prepared['ext4']['bootstrap_entrypoint_mode_after']
          assert prepared['ext4']['bootstrap_entrypoint_sha256_before'] == prepared['ext4']['bootstrap_entrypoint_sha256_after']
          assert prepared['checks']['bootstrap_entrypoint_present_and_executable_before_growth'] is True
          assert prepared['checks']['bootstrap_entrypoint_present_and_executable_after_growth'] is True
          assert prepared['checks']['bootstrap_entrypoint_mode_preserved_across_growth'] is True
          assert prepared['checks']['bootstrap_entrypoint_bytes_preserved_across_growth'] is True
          assert all(prepared['checks'].values())
          assert prepared['physical_write_authorized'] is False
          assert prepared['physical_hardware_proven'] is False
          assert prepared['real_hardware_touched'] is False
          print('OWNER_PREPARED_BOOTSTRAP_ENTRYPOINT=PASS')
          PY

          echo "$proof/ordax-disposable.raw" > "$RUNNER_TEMP/owner-prototype-seed-path"

      - name: Prove actual Owner USB offline handoff in QEMU
        timeout-minutes: 15
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/owner-prototype-media"
          seed="$(cat "$RUNNER_TEMP/owner-prototype-seed-path")"
          python3 tools/creator/proof/owner_qemu_offline_boot.py \
            --raw "$seed" \
            --media-proof "$proof/proof.json" \
            --kernel "out/kernel/vmlinuz-$ORDAX_KERNEL_VERSION" \
            --initramfs out/initramfs/initramfs.cpio.gz \
            --source-commit "$ORDAX_OWNER_SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/owner-qemu-offline-handoff.json" \
            --framebuffer-out "$RUNNER_TEMP/owner-qemu-framebuffer.ppm" \
            --serial-out "$RUNNER_TEMP/owner-qemu-serial.log" \
            --second-framebuffer-out "$RUNNER_TEMP/owner-qemu-second-framebuffer.ppm" \
            --second-serial-out "$RUNNER_TEMP/owner-qemu-second-serial.log" \
            --prove-acpi-shutdown \
            --timeout-seconds 300
          python3 - "$RUNNER_TEMP/owner-qemu-offline-handoff.json" <<'PY'
          import json, sys
          proof = json.load(open(sys.argv[1], encoding="utf-8"))
          assert proof['status'] == 'pass'
          assert all(proof['checks'].values())
          assert proof['checks']['native_surface_heartbeat'] is True
          assert proof['checks']['privileged_webkit_page_loaded'] is True
          assert proof['checks']['webkit_process_not_failed'] is True
          assert proof['healthy_observation_seconds'] >= 15
          assert proof['network_device_attached'] is False
          assert proof['physical_write_authorized'] is False
          assert proof['welcome_screen_rendered_proven'] is False
          assert proof['notebook_boot_proven'] is False
          assert proof['graphical_framebuffer_varied_proven'] is True
          assert proof['guest_acpi_shutdown_proven'] is True
          assert proof['ext4_clean_after_guest_shutdown'] is True
          assert proof['second_offline_boot_proven'] is True
          assert proof['second_boot']['same_disposable_disk_reused'] is True
          assert proof['second_boot']['qemu_process_restarted'] is True
          assert all(proof['second_boot']['checks'].values())
          assert proof['second_boot']['healthy_observation_seconds'] >= 15
          assert proof['second_boot']['qemu_framebuffer']['quantized_colors'] >= 24
          assert proof['first_run_completion_persistence_proven'] is False
          assert proof['qemu_framebuffer']['quantized_colors'] >= 24
          PY

      - name: Retain actual disposable Owner QEMU framebuffer
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: owner-usb-qemu-framebuffer
          path: |
            ${{ runner.temp }}/owner-qemu-framebuffer.ppm
            ${{ runner.temp }}/owner-qemu-serial.log
            ${{ runner.temp }}/owner-qemu-second-framebuffer.ppm
            ${{ runner.temp }}/owner-qemu-second-serial.log
            ${{ runner.temp }}/owner-qemu-offline-handoff.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Build split Windows Creator bundle
        run: |
          set -euo pipefail
          seed="$(cat "$RUNNER_TEMP/owner-prototype-seed-path")"
          manifest="$RUNNER_TEMP/minimal-bootstrap-owner-dev.json"
          release="$GITHUB_WORKSPACE/out/owner-prototype/release"
          bundle="$RUNNER_TEMP/OrdaX-Creator"
          mkdir -p "$release" "$bundle"
          python3 tools/creator/theme_bridge.py --out "$bundle/ordax-design-theme.json"
          cp system/surface/ui/brand/ordax-symbol.png "$bundle/ordax-symbol.png"
          python3 tools/creator/theme_bridge.py --out "$bundle/ordax-design-theme.json" --check
          symbol_sha="$(sha256sum "$bundle/ordax-symbol.png" | cut -d' ' -f1)"
          theme_sha="$(sha256sum "$bundle/ordax-design-theme.json" | cut -d' ' -f1)"

          trust_sha="$(sha256sum "$RUNNER_TEMP/owner-prototype-trust.json" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          seed_sha="$(sha256sum "$seed" | cut -d' ' -f1)"
          seed_size="$(stat -c '%s' "$seed")"
          cp "$seed" "$bundle/ordax-bootstrap-seed.raw"

          python - "$bundle/provenance.json" "$trust_sha" "$manifest_sha" "$seed_sha" "$seed_size" "$symbol_sha" "$theme_sha" <<'PY'
          import json, os, pathlib, sys
          data = {
              '$schema': 'prototype-ordax.creator-owner-physical/1',
              'status': 'owner-prototype-write-enabled',
              'source_commit': os.environ['ORDAX_OWNER_SOURCE_COMMIT'],
              'creator_source_repository': os.environ['ORDAX_CREATOR_SOURCE_REPOSITORY'],
              'creator_source_commit': os.environ['ORDAX_CREATOR_SOURCE_COMMIT'],
              'creator_source_tree': os.environ['ORDAX_CREATOR_SOURCE_TREE'],
              'creator_version': os.environ['ORDAX_CREATOR_PRODUCT_VERSION'],
              'canonical_public_release': False,
              'ephemeral_prototype_trust': True,
              'private_key_in_package': False,
              'raw_backend_linked': True,
              'physical_write_authorized_in_binary': True,
              'system_disk_exclusion_required': True,
              'live_target_revalidation_required': True,
              'windows_uac_required': True,
              'readback_verification_required': True,
              'trust_sha256': sys.argv[2],
              'prototype_manifest_sha256': sys.argv[3],
              'seed_sha256': sys.argv[4],
              'seed_size': int(sys.argv[5]),
              'symbol_sha256': sys.argv[6],
              'theme_sha256': sys.argv[7]
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          pushd "$ORDAX_CREATOR_NATIVE_SOURCE" >/dev/null
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_raw_backend' \
              -ldflags="-s -w -X main.buildSourceCommit=$ORDAX_OWNER_SOURCE_COMMIT -X main.buildReleaseSourceCommit=$ORDAX_OWNER_SOURCE_COMMIT -X main.buildCanonicalTrustSHA256=$trust_sha -X main.buildManifestSHA256=$manifest_sha -X main.buildSeedImageSHA256=$seed_sha -X main.buildSeedImageSize=$seed_size -X main.buildStorageProfile=owner-development -X main.buildPhysicalWriteAuthorized=YES" \
              -o "$bundle/ordax-creator-physical-test.exe" \
              ./cmd/ordax-creator-physical-test
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_owner_prototype' \
              -ldflags='-s -w -H=windowsgui' \
              -o "$bundle/OrdaX-Creator.exe" \
              ./cmd/ordax-creator-app
          popd >/dev/null

          test -s "$bundle/OrdaX-Creator.exe"
          test -s "$bundle/ordax-creator-physical-test.exe"
          test -s "$bundle/ordax-bootstrap-seed.raw"
          test -s "$bundle/provenance.json"
          test -s "$bundle/ordax-symbol.png"
          test -s "$bundle/ordax-design-theme.json"

          cat > "$bundle/LEIA-ME.txt" <<'TXT'
          OrdaX Creator - Development Git USB

          1. Extraia a pasta inteira do ZIP.
          2. Execute somente OrdaX-Creator.exe.
          3. O helper ordax-creator-physical-test.exe sera elevado apenas quando a gravacao do USB for autorizada.

          Esta distribuicao separa a interface normal do componente privilegiado de escrita RAW.
          O canal owner/development ainda nao possui assinatura Authenticode configurada.

          Esta imagem USB Dev inclui Kernel, drivers, checkout local e runtime grafico offline
          verificado antes da distribuicao. Ao ligar, o OrdaX deve abrir as boas-vindas
          automaticamente, sem PowerShell ou comandos manuais no notebook.

          Na Surface: selecione o Wi-Fi (ou pule) e conclua a configuracao.
          Depois, o mecanismo integrado consulta a main, atualiza de modo transacional
          e preserva a versao anterior se a atualizacao nao for saudavel.
          A falha de internet nunca deve impedir a utilizacao da versao local.

          ordax-pull, ordax-run e ordax-rollback sao ferramentas de diagnostico/recuperacao,
          nao etapas normais do primeiro uso.
          TXT
          cp "$bundle/LEIA-ME.txt" "$release/LEIA-ME.txt"

          python - "$bundle" "$release/OrdaX-Creator-Owner-Prototype.zip" <<'PY'
          import pathlib, sys, zipfile
          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          expected = [
              'OrdaX-Creator.exe',
              'ordax-creator-physical-test.exe',
              'ordax-bootstrap-seed.raw',
              'provenance.json',
              'ordax-symbol.png',
              'ordax-design-theme.json',
              'LEIA-ME.txt',
          ]
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in expected:
                  path = source / name
                  if not path.is_file():
                      raise SystemExit(f'missing bundle file: {name}')
                  archive.write(path, arcname=f'OrdaX-Creator/{name}')
          PY

          zip_sha="$(sha256sum "$release/OrdaX-Creator-Owner-Prototype.zip" | cut -d' ' -f1)"
          zip_size="$(stat -c '%s' "$release/OrdaX-Creator-Owner-Prototype.zip")"
          printf '%s  %s\n' "$zip_sha" 'OrdaX-Creator-Owner-Prototype.zip' > "$release/SHA256SUMS.txt"
          version="${ORDAX_CREATOR_PRODUCT_VERSION:?missing verified independent Creator version}"
          python - "$release/creator-owner-update.json" "$ORDAX_OWNER_SOURCE_COMMIT" "$version" "$zip_sha" "$zip_size" <<'PY'
          import json, pathlib, sys
          output, source, version, digest, size = sys.argv[1:]
          data = {
              '$schema': 'prototype-ordax.creator-owner-bundle-update/1',
              'channel': 'owner-prototype',
              'version': version,
              'source_commit': source,
              'artifact': 'OrdaX-Creator-Owner-Prototype.zip',
              'download_url': 'https://github.com/ordaxsystems/ordax-os/releases/download/creator-owner-prototype/OrdaX-Creator-Owner-Prototype.zip',
              'sha256': digest,
              'size': int(size),
              'automatic_in_app_update': False
          }
          pathlib.Path(output).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          echo "OWNER_CREATOR_THEME_SHA256=$theme_sha"
          echo "OWNER_CREATOR_SYMBOL_SHA256=$symbol_sha"
          echo "OWNER_BUNDLE_SOURCE=$ORDAX_OWNER_SOURCE_COMMIT"
          echo "OWNER_BUNDLE_SHA256=$zip_sha"
          echo "OWNER_SEED_SHA256=$seed_sha"
          echo 'OWNER_GUI_RAW_BACKEND_LINKED=NO'
          echo 'OWNER_RAW_HELPER_SEPARATE=YES'

      - name: Verify exact Owner Development ZIP before publication
        run: |
          set -euo pipefail
          release="$GITHUB_WORKSPACE/out/owner-prototype/release"
          python tools/creator/verify_owner_dev_bundle.py \
            --archive "$release/OrdaX-Creator-Owner-Prototype.zip" \
            --metadata "$release/creator-owner-update.json" \
            --checksums "$release/SHA256SUMS.txt" \
            --source-commit "$ORDAX_OWNER_SOURCE_COMMIT" \
            --creator-version "${ORDAX_CREATOR_PRODUCT_VERSION:?}"

      - name: Destroy ephemeral private key before publish
        run: |
          set -euo pipefail
          private="$(cat "$RUNNER_TEMP/owner-prototype-private-path")"
          rm -f "$private"
          test ! -e "$private"
          rm -f "$RUNNER_TEMP/owner-prototype-trust.json"
          rm -f out/owner-prototype/ordax-release-signing

      # PR-only acceptance handoff: immutable tested ZIP, not a rolling release.
      # The owner must still select/re-enumerate the physical USB and confirm
      # the destructive action inside the canonical Windows Creator.
      - name: Retain exact-commit verified USB Dev acceptance bundle
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'ordaxsystems/ordax-os') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: owner-dev-usb-candidate-${{ env.ORDAX_OWNER_SOURCE_COMMIT }}
          path: |
            out/owner-prototype/release/OrdaX-Creator-Owner-Prototype.zip
            out/owner-prototype/release/SHA256SUMS.txt
            out/owner-prototype/release/creator-owner-update.json
            out/owner-prototype/release/LEIA-ME.txt
          if-no-files-found: error
          retention-days: 3

      - name: Publish development Creator bundle
        # Only exact main pushes may publish a full proved Creator bundle.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='ordaxsystems/ordax-os'
          release="$GITHUB_WORKSPACE/out/owner-prototype/release"
          if ! gh release view creator-owner-prototype --repo "$repo" >/dev/null 2>&1; then
            gh release create creator-owner-prototype --repo "$repo" --target "$ORDAX_OWNER_SOURCE_COMMIT" \
              --title 'OrdaX Creator - Development Git USB' --prerelease \
              --notes 'Development-only Git USB.'
          fi
          gh release upload creator-owner-prototype \
            "$release/OrdaX-Creator-Owner-Prototype.zip" "$release/SHA256SUMS.txt" \
            "$release/LEIA-ME.txt" "$release/creator-owner-update.json" \
            --repo "$repo" --clobber
          gh release delete-asset creator-owner-prototype 'OrdaX-Creator.exe' \
            --repo "$repo" --yes || true
          # The tag is the stable address of the Owner/Development channel, not
          # the source identity of the mutable asset. GitHub may deny release
          # metadata PATCH (HTTP 403) even when authorized asset upload succeeds.
          # Never depend on moving the historical tag or updating its target.
          gh api "repos/$repo/releases/tags/creator-owner-prototype" > "$RUNNER_TEMP/owner-published-release.json"
          python3 tools/creator/verify_owner_published_release.py \
            --release "$RUNNER_TEMP/owner-published-release.json" \
            --archive "$release/OrdaX-Creator-Owner-Prototype.zip" \
            --metadata "$release/creator-owner-update.json" \
            --checksums "$release/SHA256SUMS.txt" \
            --readme "$release/LEIA-ME.txt" \
            --source-commit "$ORDAX_OWNER_SOURCE_COMMIT"
          echo 'OWNER_RELEASE_PIPELINE=SPLIT_BUNDLE'
          echo 'OWNER_STANDALONE_EXE_PUBLISHED=NO'
          echo 'OWNER_SPLIT_BUNDLE_PUBLISHED=YES'

      - name: Cleanup ephemeral private material
        if: ${{ always() }}
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/owner-prototype-private-path" ]; then
            private="$(cat "$RUNNER_TEMP/owner-prototype-private-path")"
            rm -f "$private"
          fi
          # Covers failure between exclusive private-key creation and pointer creation.
          rm -f "$RUNNER_TEMP/owner-prototype-private.pem"
          rm -f "$RUNNER_TEMP/owner-prototype-trust.json"
          rm -f out/owner-prototype/ordax-release-signing
