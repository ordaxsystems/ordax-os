name: Studio Host Composition

on:
  push:
    branches: [main]
    paths:
      - 'system/composition/native/studio-host.mjs'
      - 'system/contracts/studio-runtime-v2.mjs'
      - 'system/contracts/studio-action-context.mjs'
      - 'system/contracts/device-action-envelope-v2.mjs'
      - 'system/contracts/memory.mjs'
      - 'system/contracts/intelligence.mjs'
      - 'system/contracts/localization.mjs'
      - 'system/contracts/device-capabilities.mjs'
      - 'system/contracts/project-catalog.mjs'
      - 'tests/test_studio_native_host_composition.mjs'
      - '.github/workflows/studio-host-composition.yml'
  pull_request:
    paths:
      - 'system/composition/native/studio-host.mjs'
      - 'system/contracts/studio-runtime-v2.mjs'
      - 'system/contracts/studio-action-context.mjs'
      - 'system/contracts/device-action-envelope-v2.mjs'
      - 'system/contracts/memory.mjs'
      - 'system/contracts/intelligence.mjs'
      - 'system/contracts/localization.mjs'
      - 'system/contracts/device-capabilities.mjs'
      - 'system/contracts/project-catalog.mjs'
      - 'tests/test_studio_native_host_composition.mjs'
      - '.github/workflows/studio-host-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-studio-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Studio host composition syntax
        run: |
          set -euo pipefail
          node --check system/composition/native/studio-host.mjs
          node --check tests/test_studio_native_host_composition.mjs

      - name: Prove Studio host authority and public-port boundary
        run: |
          set -euo pipefail
          node --test tests/test_studio_native_host_composition.mjs
