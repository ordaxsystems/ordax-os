name: Cloud Memory Native Runtime Restore Proof

on:
  pull_request:
    paths:
      - 'docs/contracts/cloud-memory-runtime-restore-proof.json'
      - 'system/composition/native/account-memory.mjs'
      - 'system/composition/native/account-memory-foundation.mjs'
      - 'system/composition/native/account-sync.mjs'
      - 'system/services/sync/account-runtime.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-authorized-composition.mjs'
      - 'system/services/sync/state-store-registry.mjs'
      - 'system/services/memory/runtime.mjs'
      - 'tests/test_cloud_memory_native_runtime_restore.mjs'
      - 'tests/test_cloud_memory_runtime_restore_proof_contract.py'
      - '.github/workflows/cloud-memory-native-runtime-restore-proof.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/cloud-memory-runtime-restore-proof.json'
      - 'system/composition/native/account-memory.mjs'
      - 'system/composition/native/account-memory-foundation.mjs'
      - 'system/composition/native/account-sync.mjs'
      - 'system/services/sync/account-runtime.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-authorized-composition.mjs'
      - 'system/services/sync/state-store-registry.mjs'
      - 'system/services/memory/runtime.mjs'
      - 'tests/test_cloud_memory_native_runtime_restore.mjs'
      - 'tests/test_cloud_memory_runtime_restore_proof_contract.py'
      - '.github/workflows/cloud-memory-native-runtime-restore-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Native restore proof source
        run: |
          set -euo pipefail
          node --check system/composition/native/account-sync.mjs
          node --check tests/test_cloud_memory_native_runtime_restore.mjs
          python -m py_compile tests/test_cloud_memory_runtime_restore_proof_contract.py
          python -m json.tool docs/contracts/cloud-memory-runtime-restore-proof.json >/dev/null

      - name: Prove Native fresh-install Memory restore
        run: |
          set -euo pipefail
          node --test tests/test_cloud_memory_native_runtime_restore.mjs
          python -m unittest tests.test_cloud_memory_runtime_restore_proof_contract -v
