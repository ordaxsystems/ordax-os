name: Work Coordination Native State Foundation

on:
  pull_request:
    paths:
      - 'docs/contracts/work-coordination-native-state.json'
      - 'system/contracts/work-coordination-store.mjs'
      - 'system/adapters/native/bounded-json-transport.mjs'
      - 'system/adapters/native/work-coordination-state.mjs'
      - 'system/surface/runtime/native_partitioned_json_state.py'
      - 'system/surface/runtime/native_work_coordination_state.py'
      - 'tests/test_native_bounded_json_transport.mjs'
      - 'tests/test_work_coordination_store.mjs'
      - 'tests/test_work_coordination_native_state.mjs'
      - 'tests/test_native_partitioned_json_state.py'
      - 'tests/test_native_work_coordination_state.py'
      - '.github/workflows/work-coordination-native-state.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/work-coordination-native-state.json'
      - 'system/contracts/work-coordination-store.mjs'
      - 'system/adapters/native/bounded-json-transport.mjs'
      - 'system/adapters/native/work-coordination-state.mjs'
      - 'system/surface/runtime/native_partitioned_json_state.py'
      - 'system/surface/runtime/native_work_coordination_state.py'
      - 'tests/test_native_bounded_json_transport.mjs'
      - 'tests/test_work_coordination_store.mjs'
      - 'tests/test_work_coordination_native_state.mjs'
      - 'tests/test_native_partitioned_json_state.py'
      - 'tests/test_native_work_coordination_state.py'
      - '.github/workflows/work-coordination-native-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate contract and modules
        run: |
          set -euo pipefail
          python -m json.tool docs/contracts/work-coordination-native-state.json >/dev/null
          python -m py_compile \
            system/surface/runtime/native_partitioned_json_state.py \
            system/surface/runtime/native_work_coordination_state.py
          node --check system/adapters/native/bounded-json-transport.mjs
          node --check system/adapters/native/work-coordination-state.mjs
          node --check system/contracts/work-coordination-store.mjs

      - name: Prove partitioned Native host state
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_native_partitioned_json_state \
            tests.test_native_work_coordination_state

      - name: Prove bounded Native client and CAS-only store
        run: |
          set -euo pipefail
          node --test tests/test_native_bounded_json_transport.mjs
          node --test tests/test_work_coordination_store.mjs
          node --test tests/test_work_coordination_native_state.mjs
