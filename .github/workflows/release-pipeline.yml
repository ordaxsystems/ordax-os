name: Release Pipeline Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/**'
      - 'tools/release-bundle/**'
      - 'tools/native-release-assembly/**'
      - 'tools/runtime-component-channel/**'
      - 'tools/creator/go.mod'
      - 'tools/creator/core/native_install*.go'
      - 'tools/creator/host/linux/**'
      - 'tools/creator/cmd/ordax-creator-native-targets/**'
      - 'tools/release-manifest/**'
      - 'tools/release-signing/**'
      - 'tools/verify/current_release_trust.py'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/stable-base/**'
      - 'tests/test_portable_v4_ai_handoff_contract.py'
      - 'tests/test_release_pipeline_physical_state.py'
      - 'docs/RELEASE-PIPELINE.md'
      - '.github/workflows/release-pipeline.yml'
  pull_request:
    paths:
      - 'system/**'
      - 'tools/release-bundle/**'
      - 'tools/native-release-assembly/**'
      - 'tools/runtime-component-channel/**'
      - 'tools/creator/go.mod'
      - 'tools/creator/core/native_install*.go'
      - 'tools/creator/host/linux/**'
      - 'tools/creator/cmd/ordax-creator-native-targets/**'
      - 'tools/release-manifest/**'
      - 'tools/release-signing/**'
      - 'tools/verify/current_release_trust.py'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/stable-base/**'
      - 'tests/test_portable_v4_ai_handoff_contract.py'
      - 'tests/test_release_pipeline_physical_state.py'
      - 'docs/RELEASE-PIPELINE.md'
      - '.github/workflows/release-pipeline.yml'

permissions:
  contents: read

jobs:
  pipeline-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Validate v4 boot handoff and Native release assembly contracts
        run: |
          python -m unittest tests.test_portable_v4_ai_handoff_contract -v
          python -m unittest tests.test_native_release_assembly_contract -v
          python -m unittest tests.test_build_autonomy_contract -v

      - name: Build release pipeline tools
        run: |
          set -euo pipefail
          mkdir -p out/release-pipeline
          (cd tools/release-bundle && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/release-pipeline/ordax-release-bundle .)
          (cd tools/release-manifest && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/release-pipeline/ordax-release-manifest .)
          (cd tools/release-signing && go test -count=1 ./... && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/release-pipeline/ordax-release-signing .)
          (cd bootstrap/release-acquisition && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/release-pipeline/ordax-release-agent .)

      - name: Prove real repository Native system assembly and bundle
        run: |
          set -euo pipefail
          bundle="$PWD/out/release-pipeline/ordax-release-bundle"
          work="$RUNNER_TEMP/real-native-system-bundle"
          source_a="$work/source-a"
          source_b="$work/source-b"
          mkdir -p "$work"

          python tools/native-release-assembly/build.py assemble --out "$source_a" | tee "$work/assemble-a.json"
          python tools/native-release-assembly/build.py verify --root "$source_a" | tee "$work/verify-a.json"
          python tools/native-release-assembly/build.py assemble --out "$source_b" | tee "$work/assemble-b.json"
          python tools/native-release-assembly/build.py verify --root "$source_b" | tee "$work/verify-b.json"

          cmp "$source_a/system/bin/ordax-native-install-targets" "$source_b/system/bin/ordax-native-install-targets"
          cmp "$source_a/system/bin/ordax-runtime-component-channel" "$source_b/system/bin/ordax-runtime-component-channel"
          cmp "$source_a/system/.ordax/native-release-tools.json" "$source_b/system/.ordax/native-release-tools.json"

          "$bundle" --root "$source_a" --out "$work/system-a.tar"
          "$bundle" --root "$source_b" --out "$work/system-b.tar"
          cmp "$work/system-a.tar" "$work/system-b.tar"

          python - "$work/system-a.tar" <<'PY'
          import json, pathlib, sys, tarfile
          tar_path = pathlib.Path(sys.argv[1])
          with tarfile.open(tar_path, 'r:') as archive:
              required = {
                  'system/entrypoint': 0o755,
                  'system/surface/entrypoint': 0o755,
                  'system/surface/bin/ordax-surface': 0o755,
                  'system/bin/ordax-native-install-targets': 0o755,
                  'system/bin/ordax-runtime-component-channel': 0o755,
                  'system/.ordax/native-release-tools.json': 0o644,
              }
              members = {member.name: member for member in archive.getmembers()}
              for name, mode in required.items():
                  member = members[name]
                  assert member.isfile(), name
                  assert member.mode == mode, (name, oct(member.mode))
              assert all(not member.issym() and not member.islnk() for member in members.values())

              provenance = json.loads(
                  archive.extractfile('system/.ordax/native-release-tools.json')
                  .read()
                  .decode('utf-8')
              )
              assert provenance['$schema'] == 'prototype-ordax.native-release-assembly/2'
              assert provenance['physical_apply_authorized'] is False
              assert provenance['component_publish_authorized'] is False
              assert len(provenance['injected_tools']) == 2
              tools = {tool['path']: tool for tool in provenance['injected_tools']}
              install = tools['system/bin/ordax-native-install-targets']
              assert install['role'] == 'native-install-read-only-target-discovery'
              assert install['physical_apply_authorized'] is False
              assert install['component_publish_authorized'] is False
              component = tools['system/bin/ordax-runtime-component-channel']
              assert component['role'] == 'runtime-component-verifier-and-activation-state-owner'
              assert component['physical_apply_authorized'] is False
              assert component['component_publish_authorized'] is False
          print('NATIVE_RELEASE_ASSEMBLY=PASS')
          print('REAL_SYSTEM_BUNDLE=PASS')
          print('NATIVE_INSTALL_HELPER_SIGNING_SCOPE=SYSTEM_TAR')
          print('RUNTIME_COMPONENT_VERIFIER_SIGNING_SCOPE=SYSTEM_TAR')
          print('RUNTIME_COMPONENT_PUBLISH_AUTHORIZED=NO')
          print('NATIVE_INSTALL_PHYSICAL_APPLY_AUTHORIZED=NO')
          PY

      - name: Prove source to signed envelope compatibility
        run: |
          set -euo pipefail
          bundle="$PWD/out/release-pipeline/ordax-release-bundle"
          manifest_tool="$PWD/out/release-pipeline/ordax-release-manifest"
          signer="$PWD/out/release-pipeline/ordax-release-signing"
          agent="$PWD/out/release-pipeline/ordax-release-agent"
          work="$RUNNER_TEMP/release-pipeline-proof"
          source="$work/source"
          commit="0123456789abcdef0123456789abcdef01234567"
          mkdir -p "$source/system" "$work/public"
          chmod 0755 "$work" "$source" "$source/system"
          printf '#!/bin/sh\nprintf "ordax pipeline proof\\n"\n' > "$source/system/entrypoint"
          chmod 0755 "$source/system/entrypoint"
          printf '%s\n' "$commit" > "$source/system/source-commit"
          chmod 0644 "$source/system/source-commit"

          "$bundle" --root "$source" --out "$work/public/system.tar" | tee "$work/bundle.txt"
          "$manifest_tool" \
            --artifact "$work/public/system.tar" \
            --source-commit "$commit" \
            --artifact-url "https://github.com/ordaxsystems/ordax-os/releases/download/ci-proof/system.tar" \
            --out "$work/public/release-manifest.json" | tee "$work/manifest.txt"
          "$signer" generate-key \
            --private-key "$work/private.pem" \
            --trust "$work/public/release-trust.json" \
            --key-id ci-pipeline-1
          "$signer" sign \
            --manifest "$work/public/release-manifest.json" \
            --private-key "$work/private.pem" \
            --trust "$work/public/release-trust.json" \
            --key-id ci-pipeline-1 \
            --out "$work/public/release-envelope.json" | tee "$work/sign.txt"

          verify_output="$("$agent" verify-envelope \
            --envelope "$work/public/release-envelope.json" \
            --trust "$work/public/release-trust.json")"
          printf '%s\n' "$verify_output"
          grep -q '"status": "verified"' <<<"$verify_output"
          grep -q "\"source_commit\": \"$commit\"" <<<"$verify_output"

          python - "$work/public/release-manifest.json" "$work/public/system.tar" <<'PY'
          import hashlib, json, pathlib, sys, tarfile
          manifest_path, tar_path = map(pathlib.Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text())
          payload = tar_path.read_bytes()
          artifact = manifest['artifacts'][0]
          assert artifact['sha256'] == hashlib.sha256(payload).hexdigest()
          assert artifact['size'] == len(payload)
          with tarfile.open(tar_path, 'r:') as archive:
              names = archive.getnames()
              assert 'system/entrypoint' in names
              entry = archive.getmember('system/entrypoint')
              assert entry.isfile()
              assert entry.mode == 0o755
          print('BUNDLE_MANIFEST_IDENTITY=PASS')
          PY

          rm -f "$work/private.pem"
          test ! -e "$work/private.pem"
          test ! -e "$work/public/private.pem"
          echo 'SOURCE_TO_BUNDLE=PASS'
          echo 'BUNDLE_TO_MANIFEST=PASS'
          echo 'MANIFEST_TO_SIGNED_ENVELOPE=PASS'
          echo 'SIGNED_ENVELOPE_TO_AGENT=PASS'
          echo 'CI_TEST_KEY_REMOVED=YES'
          echo 'CANONICAL_TRUST_ANCHOR=NO'
          echo 'RELEASE_PUBLISHED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Prove portable v3 multi-artifact signed protocol compatibility
        run: |
          set -euo pipefail
          manifest_tool="$PWD/out/release-pipeline/ordax-release-manifest"
          signer="$PWD/out/release-pipeline/ordax-release-signing"
          agent="$PWD/out/release-pipeline/ordax-release-agent"
          work="$RUNNER_TEMP/release-v3-pipeline-proof"
          commit="0123456789abcdef0123456789abcdef01234567"
          mkdir -p "$work"

          python - "$work/system.erofs" "$work/native-surface-runtime.erofs" <<'PY'
          import pathlib, sys
          for index, raw in enumerate(sys.argv[1:], start=1):
              data = bytearray(4096)
              data[1024:1028] = bytes([0xE2, 0xE1, 0xF5, 0xE0])
              data[-1] = index
              pathlib.Path(raw).write_bytes(data)
          PY

          "$manifest_tool" \
            --manifest-schema 3 \
            --artifact "$work/system.erofs" \
            --runtime-artifact "$work/native-surface-runtime.erofs" \
            --source-commit "$commit" \
            --artifact-url "https://example.invalid/releases/system.erofs" \
            --runtime-artifact-url "https://example.invalid/runtime/native-surface-runtime.erofs" \
            --out "$work/release-manifest-v3.json"

          "$signer" generate-key \
            --private-key "$work/private-v3.pem" \
            --trust "$work/trust-v3.json" \
            --key-id ci-v3-1
          "$signer" sign \
            --manifest "$work/release-manifest-v3.json" \
            --private-key "$work/private-v3.pem" \
            --trust "$work/trust-v3.json" \
            --key-id ci-v3-1 \
            --out "$work/release-envelope-v3.json"

          verify_output="$("$agent" verify-envelope \
            --envelope "$work/release-envelope-v3.json" \
            --trust "$work/trust-v3.json")"
          printf '%s\n' "$verify_output"
          grep -q '"status": "verified"' <<<"$verify_output"
          grep -q '"artifact_count": 2' <<<"$verify_output"

          python - "$work/release-manifest-v3.json" "$work/system.erofs" "$work/native-surface-runtime.erofs" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          system = pathlib.Path(sys.argv[2]).read_bytes()
          runtime = pathlib.Path(sys.argv[3]).read_bytes()
          assert manifest['$schema'] == 'prototype-ordax.release-manifest/3'
          assert manifest['product_mode'] == 'usb'
          assert manifest['storage_profile'] == 'portable-usb-v2'
          assert manifest['runtime_format'] == 'erofs'
          artifacts = manifest['artifacts']
          assert [a['name'] for a in artifacts] == [
              'system.erofs',
              'native-surface-runtime.erofs',
          ]
          assert [a['role'] for a in artifacts] == [
              'system-image',
              'surface-runtime',
          ]
          assert artifacts[0]['sha256'] == hashlib.sha256(system).hexdigest()
          assert artifacts[1]['sha256'] == hashlib.sha256(runtime).hexdigest()
          print('PORTABLE_V3_MULTI_ARTIFACT_IDENTITY=PASS')
          PY

          rm -f "$work/private-v3.pem"
          test ! -e "$work/private-v3.pem"
          echo 'PORTABLE_V3_SIGNED_PROTOCOL=PASS'
          echo 'PORTABLE_V3_RUNTIME_REUSE_CONTRACT=CONTENT_ADDRESSED_SHA256'
          echo 'PORTABLE_V3_ACTIVATION_ALLOWED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Prove portable v4 signed local AI protocol compatibility
        run: |
          set -euo pipefail
          manifest_tool="$PWD/out/release-pipeline/ordax-release-manifest"
          signer="$PWD/out/release-pipeline/ordax-release-signing"
          agent="$PWD/out/release-pipeline/ordax-release-agent"
          work="$RUNNER_TEMP/release-v4-pipeline-proof"
          commit="0123456789abcdef0123456789abcdef01234567"
          mkdir -p "$work"

          python - "$work/system.erofs" "$work/native-surface-runtime.erofs" "$work/local-ai-runtime.erofs" <<'PY'
          import pathlib, sys
          for index, raw in enumerate(sys.argv[1:], start=1):
              data = bytearray(4096)
              data[1024:1028] = bytes([0xE2, 0xE1, 0xF5, 0xE0])
              data[-1] = index
              pathlib.Path(raw).write_bytes(data)
          PY

          cat > "$work/source-lock.json" <<'JSON'
          {
            "$schema": "prototype-ordax.local-ai-source-lock/1",
            "engine": {
              "id": "llama.cpp",
              "repository": "https://github.com/ggml-org/llama.cpp",
              "commit": "7ab4ee7baad2d920464cbacfad4f4b07cf111fd2",
              "license": "MIT"
            },
            "model": {
              "id": "qwen3.5-0.8b-q4_0",
              "repository": "ggml-org/Qwen3.5-0.8B-GGUF",
              "filename": "Qwen3.5-0.8B-Q4_0.gguf",
              "sha256": "57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf",
              "size_bytes": 563036064,
              "license": "Apache-2.0",
              "upstream_revision": "9447f74"
            }
          }
          JSON

          "$manifest_tool" \
            --manifest-schema 4 \
            --artifact "$work/system.erofs" \
            --runtime-artifact "$work/native-surface-runtime.erofs" \
            --local-ai-artifact "$work/local-ai-runtime.erofs" \
            --local-ai-source-lock "$work/source-lock.json" \
            --source-commit "$commit" \
            --artifact-url "https://example.invalid/releases/system.erofs" \
            --runtime-artifact-url "https://example.invalid/runtime/native-surface-runtime.erofs" \
            --local-ai-artifact-url "https://example.invalid/runtime/local-ai-runtime.erofs" \
            --out "$work/release-manifest-v4.json"

          "$signer" generate-key \
            --private-key "$work/private-v4.pem" \
            --trust "$work/trust-v4.json" \
            --key-id ci-v4-1
          "$signer" sign \
            --manifest "$work/release-manifest-v4.json" \
            --private-key "$work/private-v4.pem" \
            --trust "$work/trust-v4.json" \
            --key-id ci-v4-1 \
            --out "$work/release-envelope-v4.json"

          signer_verify="$("$signer" verify-envelope \
            --envelope "$work/release-envelope-v4.json" \
            --trust "$work/trust-v4.json")"
          printf '%s\n' "$signer_verify"
          grep -q 'RELEASE_ENVELOPE_VERIFIED=YES' <<<"$signer_verify"

          agent_verify="$("$agent" verify-envelope \
            --envelope "$work/release-envelope-v4.json" \
            --trust "$work/trust-v4.json")"
          printf '%s\n' "$agent_verify"
          grep -q '"status": "verified"' <<<"$agent_verify"
          grep -q '"artifact_count": 3' <<<"$agent_verify"

          python - "$work/release-manifest-v4.json" "$work/source-lock.json" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          source_lock = pathlib.Path(sys.argv[2]).read_bytes()
          assert manifest['$schema'] == 'prototype-ordax.release-manifest/4'
          assert [a['role'] for a in manifest['artifacts']] == [
              'system-image',
              'surface-runtime',
              'local-ai-runtime',
          ]
          binding = manifest['local_ai']
          assert binding['contract'] == 'ordax.local-ai/1'
          assert binding['source_lock_sha256'] == hashlib.sha256(source_lock).hexdigest()
          assert binding['engine_source_commit'] == '7ab4ee7baad2d920464cbacfad4f4b07cf111fd2'
          assert binding['model_sha256'] == '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf'
          assert binding['model_size'] == 563036064
          print('PORTABLE_V4_SIGNED_LOCAL_AI_IDENTITY=PASS')
          PY

          rm -f "$work/private-v4.pem"
          test ! -e "$work/private-v4.pem"
          echo 'PORTABLE_V4_SIGNED_PROTOCOL=PASS'
          echo 'PORTABLE_V4_LOCAL_AI_RUNTIME_REAL_BYTES=NO'
          echo 'PORTABLE_V4_ACTIVATION_ALLOWED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Validate current canonical release trust and physical authorization state
        run: python tools/verify/current_release_trust.py
