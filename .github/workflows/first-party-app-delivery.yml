name: First-party App Delivery Foundation

on:
  push:
    branches: [main]
    paths:
      - 'system/contracts/first-party-app-delivery.mjs'
      - 'system/contracts/first-party-app-install-plan.mjs'
      - 'system/services/apps/delivery-policy.mjs'
      - 'system/services/apps/install-planner.mjs'
      - 'system/services/apps/store-catalog.mjs'
      - 'system/apps/store/**'
      - 'system/surface/ui/store-overview-controls.mjs'
      - 'system/surface/ui/store.css'
      - 'system/services/apps/mvp-delivery-policy.mjs'
      - 'system/services/apps/README.md'
      - 'docs/contracts/first-party-app-delivery.json'
      - 'docs/contracts/first-party-app-install-plan.json'
      - 'docs/contracts/app-distribution.json'
      - 'docs/contracts/mvp-app-delivery.json'
      - 'docs/contracts/first-run.json'
      - 'tests/test_first_party_app_delivery.mjs'
      - 'tests/test_first_party_app_install_planner.mjs'
      - 'tests/test_store_catalog.mjs'
      - 'tests/test_store_foundation.py'
      - 'tests/test_mvp_app_delivery.mjs'
      - '.github/workflows/first-party-app-delivery.yml'
  pull_request:
    paths:
      - 'system/contracts/first-party-app-delivery.mjs'
      - 'system/contracts/first-party-app-install-plan.mjs'
      - 'system/services/apps/delivery-policy.mjs'
      - 'system/services/apps/install-planner.mjs'
      - 'system/services/apps/store-catalog.mjs'
      - 'system/apps/store/**'
      - 'system/surface/ui/store-overview-controls.mjs'
      - 'system/surface/ui/store.css'
      - 'system/services/apps/mvp-delivery-policy.mjs'
      - 'system/services/apps/README.md'
      - 'docs/contracts/first-party-app-delivery.json'
      - 'docs/contracts/first-party-app-install-plan.json'
      - 'docs/contracts/app-distribution.json'
      - 'docs/contracts/mvp-app-delivery.json'
      - 'docs/contracts/first-run.json'
      - 'tests/test_first_party_app_delivery.mjs'
      - 'tests/test_first_party_app_install_planner.mjs'
      - 'tests/test_store_catalog.mjs'
      - 'tests/test_store_foundation.py'
      - 'tests/test_mvp_app_delivery.mjs'
      - '.github/workflows/first-party-app-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-party-app-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate contract syntax
        run: |
          set -euo pipefail
          node --check system/contracts/first-party-app-delivery.mjs
          node --check system/contracts/first-party-app-install-plan.mjs
          node --check system/services/apps/delivery-policy.mjs
          node --check system/services/apps/install-planner.mjs
          node --check system/services/apps/store-catalog.mjs
          node --check system/apps/store/app.mjs
          node --check system/surface/ui/store-overview-controls.mjs
          node --check system/services/apps/mvp-delivery-policy.mjs
          node --check tests/test_first_party_app_delivery.mjs
          node --check tests/test_first_party_app_install_planner.mjs
          node --check tests/test_store_catalog.mjs
          node --check tests/test_mvp_app_delivery.mjs
          python -m json.tool docs/contracts/first-party-app-delivery.json >/dev/null
          python -m json.tool docs/contracts/first-party-app-install-plan.json >/dev/null
          python -m json.tool docs/contracts/app-distribution.json >/dev/null
          python -m json.tool docs/contracts/mvp-app-delivery.json >/dev/null
          python -m json.tool docs/contracts/first-run.json >/dev/null

      - name: Prove delivery policy and projection invariants
        run: |
          set -euo pipefail
          node --test tests/test_first_party_app_delivery.mjs
          node --test tests/test_store_catalog.mjs
          python tests/test_store_foundation.py

      - name: Prove authority-free first-party app install planning
        run: |
          set -euo pipefail
          node --test tests/test_first_party_app_install_planner.mjs

      - name: Prove minimal MVP payload and first-online refresh policy
        run: |
          set -euo pipefail
          node --test tests/test_mvp_app_delivery.mjs
