name: First-party App Delivery Foundation

on:
  push:
    branches: [main]
    paths:
      - 'system/contracts/first-party-app-delivery.mjs'
      - 'system/contracts/file-association-manifest.mjs'
      - 'system/contracts/app-presentation-manifest.mjs'
      - 'system/apps/external-app-definition.mjs'
      - 'system/apps/runtime-catalog.mjs'
      - 'system/services/apps/verified-external-app-catalog.mjs'
      - 'system/composition/native/verified-installed-apps.mjs'
      - 'tests/test_native_verified_installed_apps.mjs'
      - 'tests/test_verified_external_app_catalog.mjs'
      - 'tests/test_app_presentation_manifest.mjs'
      - 'tests/test_external_app_definition.mjs'
      - 'system/services/files/file-open-registry.mjs'
      - 'tests/test_file_association_manifest.mjs'
      - 'tests/test_file_open_registry.mjs'
      - 'system/contracts/app-lifecycle-request.mjs'
      - 'system/contracts/app-lifecycle-plan.mjs'
      - 'system/contracts/app-artifact-acquisition-source.mjs'
      - 'system/contracts/app-store.mjs'
      - 'system/contracts/component-runtime-metadata.mjs'
      - 'system/contracts/verified-app-store-catalog.mjs'
      - 'system/services/apps/delivery-policy.mjs'
      - 'system/services/apps/external-first-party-policy.mjs'
      - 'tools/app-policy/render_external_first_party_policy.py'
      - 'tools/app-policy/render_native_store_metadata_policy.py'
      - 'system/surface/runtime/native_store_metadata_policy.py'
      - 'system/surface/runtime/native_component_slots.py'
      - 'tests/test_native_component_slots.py'
      - 'docs/contracts/runtime-component-package.json'
      - 'system/services/apps/store-lifecycle-request-service.mjs'
      - 'system/services/apps/store-update-request-batch.mjs'
      - 'tests/test_store_update_request_batch.mjs'
      - 'system/services/apps/verified-store-projection.mjs'
      - 'system/services/apps/mvp-delivery-policy.mjs'
      - 'system/services/apps/README.md'
      - 'docs/contracts/first-party-app-delivery.json'
      - 'docs/contracts/app-distribution.json'
      - 'docs/contracts/mvp-app-delivery.json'
      - 'docs/contracts/first-run.json'
      - 'tests/test_first_party_app_delivery.mjs'
      - 'tests/test_app_lifecycle_request.mjs'
      - 'tests/test_app_store_lifecycle_service.mjs'
      - 'tests/test_app_artifact_acquisition_source.mjs'
      - 'tests/test_component_runtime_metadata.mjs'
      - 'tests/test_external_first_party_policy.mjs'
      - 'tests/test_verified_app_store_catalog.mjs'
      - 'tests/test_verified_store_projection.mjs'
      - 'tests/test_mvp_app_delivery.mjs'
      - 'tests/test_native_store_catalog_composition.mjs'
      - 'tests/test_native_verified_app_store_catalog.mjs'
      - 'system/composition/native/main.mjs'
      - 'system/composition/native/store-catalog.mjs'
      - 'system/adapters/native/verified-app-store-catalog.mjs'
      - 'system/adapters/native/app-lifecycle-delegate.mjs'
      - 'tests/test_native_app_lifecycle_delegate.mjs'
      - '.github/workflows/first-party-app-delivery.yml'
  pull_request:
    paths:
      - 'system/contracts/first-party-app-delivery.mjs'
      - 'system/contracts/file-association-manifest.mjs'
      - 'system/contracts/app-presentation-manifest.mjs'
      - 'system/apps/external-app-definition.mjs'
      - 'system/apps/runtime-catalog.mjs'
      - 'system/services/apps/verified-external-app-catalog.mjs'
      - 'system/composition/native/verified-installed-apps.mjs'
      - 'tests/test_native_verified_installed_apps.mjs'
      - 'tests/test_verified_external_app_catalog.mjs'
      - 'tests/test_app_presentation_manifest.mjs'
      - 'tests/test_external_app_definition.mjs'
      - 'system/services/files/file-open-registry.mjs'
      - 'tests/test_file_association_manifest.mjs'
      - 'tests/test_file_open_registry.mjs'
      - 'system/contracts/app-lifecycle-request.mjs'
      - 'system/contracts/app-lifecycle-plan.mjs'
      - 'system/contracts/app-artifact-acquisition-source.mjs'
      - 'system/contracts/app-store.mjs'
      - 'system/contracts/component-runtime-metadata.mjs'
      - 'system/contracts/verified-app-store-catalog.mjs'
      - 'system/services/apps/delivery-policy.mjs'
      - 'system/services/apps/external-first-party-policy.mjs'
      - 'tools/app-policy/render_native_store_metadata_policy.py'
      - 'system/surface/runtime/native_store_metadata_policy.py'
      - 'system/surface/runtime/native_component_slots.py'
      - 'tests/test_native_component_slots.py'
      - 'system/services/apps/store-lifecycle-request-service.mjs'
      - 'system/services/apps/store-update-request-batch.mjs'
      - 'tests/test_store_update_request_batch.mjs'
      - 'system/services/apps/verified-store-projection.mjs'
      - 'system/services/apps/mvp-delivery-policy.mjs'
      - 'system/services/apps/README.md'
      - 'docs/contracts/first-party-app-delivery.json'
      - 'docs/contracts/app-distribution.json'
      - 'docs/contracts/mvp-app-delivery.json'
      - 'docs/contracts/first-run.json'
      - 'tests/test_first_party_app_delivery.mjs'
      - 'tests/test_app_lifecycle_request.mjs'
      - 'tests/test_app_store_lifecycle_service.mjs'
      - 'tests/test_component_runtime_metadata.mjs'
      - 'tests/test_external_first_party_policy.mjs'
      - 'tests/test_verified_app_store_catalog.mjs'
      - 'tests/test_verified_store_projection.mjs'
      - 'tests/test_mvp_app_delivery.mjs'
      - 'tests/test_native_store_catalog_composition.mjs'
      - 'tests/test_native_verified_app_store_catalog.mjs'
      - 'system/composition/native/main.mjs'
      - 'system/composition/native/store-catalog.mjs'
      - 'system/adapters/native/verified-app-store-catalog.mjs'
      - 'system/adapters/native/app-lifecycle-delegate.mjs'
      - 'tests/test_native_app_lifecycle_delegate.mjs'
      - 'tests/test_app_artifact_acquisition_source.mjs'
      - '.github/workflows/first-party-app-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-party-app-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate contract syntax
        run: |
          set -euo pipefail
          node --check system/contracts/first-party-app-delivery.mjs
          node --check system/contracts/file-association-manifest.mjs
          node --check system/contracts/app-presentation-manifest.mjs
          node --check system/apps/external-app-definition.mjs
          node --check system/apps/runtime-catalog.mjs
          node --check system/services/apps/verified-external-app-catalog.mjs
          node --check system/composition/native/verified-installed-apps.mjs
          node --check tests/test_native_verified_installed_apps.mjs
          node --check tests/test_verified_external_app_catalog.mjs
          node --check tests/test_app_presentation_manifest.mjs
          node --check tests/test_external_app_definition.mjs
          node --check system/services/files/file-open-registry.mjs
          node --check system/contracts/app-lifecycle-request.mjs
          node --check system/contracts/app-lifecycle-plan.mjs
          node --check system/contracts/app-artifact-acquisition-source.mjs
          node --check system/contracts/app-store.mjs
          node --check system/contracts/component-runtime-metadata.mjs
          node --check system/contracts/verified-app-store-catalog.mjs
          node --check system/services/apps/delivery-policy.mjs
          node --check system/services/apps/external-first-party-policy.mjs
          python -m py_compile tools/app-policy/render_external_first_party_policy.py
          python tools/app-policy/render_external_first_party_policy.py --check
          python -m py_compile tools/app-policy/render_native_store_metadata_policy.py system/surface/runtime/native_store_metadata_policy.py system/surface/runtime/native_component_slots.py
          python tools/app-policy/render_native_store_metadata_policy.py --check
          node --check system/services/apps/store-lifecycle-request-service.mjs
          node --check system/services/apps/store-update-request-batch.mjs
          node --check tests/test_store_update_request_batch.mjs
          node --check system/services/apps/verified-store-projection.mjs
          node --check system/adapters/native/verified-app-store-catalog.mjs
          node --check system/adapters/native/app-lifecycle-delegate.mjs
          node --check system/composition/native/main.mjs
          node --check system/composition/native/store-catalog.mjs
          node --check system/services/apps/mvp-delivery-policy.mjs
          node --check tests/test_first_party_app_delivery.mjs
          node --check tests/test_file_association_manifest.mjs
          node --check tests/test_file_open_registry.mjs
          node --check tests/test_app_store_contract.mjs
          node --check tests/test_app_lifecycle_request.mjs
          node --check tests/test_app_store_lifecycle_service.mjs
          node --check tests/test_app_artifact_acquisition_source.mjs
          node --check tests/test_component_runtime_metadata.mjs
          node --check tests/test_external_first_party_policy.mjs
          node --check tests/test_verified_app_store_catalog.mjs
          node --check tests/test_verified_store_projection.mjs
          node --check tests/test_native_verified_app_store_catalog.mjs
          node --check tests/test_native_app_lifecycle_delegate.mjs
          node --check tests/test_native_store_catalog_composition.mjs
          node --check tests/test_mvp_app_delivery.mjs
          python -m json.tool docs/contracts/first-party-app-delivery.json >/dev/null
          python -m json.tool docs/contracts/app-distribution.json >/dev/null
          python -m json.tool docs/contracts/mvp-app-delivery.json >/dev/null
          python -m json.tool docs/contracts/first-run.json >/dev/null

      - name: Prove delivery policy and projection invariants
        run: |
          set -euo pipefail
          node --test tests/test_first_party_app_delivery.mjs
          node --test tests/test_file_association_manifest.mjs
          node --test tests/test_file_open_registry.mjs
          node --test tests/test_app_presentation_manifest.mjs
          node --test tests/test_external_app_definition.mjs
          node --test tests/test_verified_external_app_catalog.mjs
          node --test tests/test_native_verified_installed_apps.mjs
          node --test tests/test_app_store_contract.mjs
          node --test tests/test_app_lifecycle_request.mjs
          node --test tests/test_app_store_lifecycle_service.mjs
          node --test tests/test_store_update_request_batch.mjs
          node --test tests/test_app_artifact_acquisition_source.mjs
          node --test tests/test_component_runtime_metadata.mjs
          node --test tests/test_external_first_party_policy.mjs
          node --test tests/test_verified_app_store_catalog.mjs
          node --test tests/test_verified_store_projection.mjs
          python -m unittest tests/test_native_component_slots.py
          node --test tests/test_native_app_lifecycle_delegate.mjs
          node --test tests/test_native_verified_app_store_catalog.mjs
          node --test tests/test_native_store_catalog_composition.mjs

      - name: Prove minimal MVP payload and first-online refresh policy
        run: |
          set -euo pipefail
          node --test tests/test_mvp_app_delivery.mjs
