name: Portable v2 QEMU Boot Proof

on:
  push:
    branches: [main]
    paths:
      - 'system/**'
      - '!system/**/*.md'
      - '!system/surface/ui/**'
      - '!system/surface/workspace/**'
      - 'bootstrap/base/**'
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/**/*.md'
      - 'bootstrap/stable-base/**'
      - 'bootstrap/surface-runtime/**'
      - 'system/surface/runtime/packages.txt'
      - 'system/surface/runtime/media_runtime_probe.py'
      - '!bootstrap/surface-runtime/**/*.md'
      - 'bootstrap/local-ai-runtime/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/entrypoint'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'tests/test_bootstrap_current_verification.py'
      - 'tests/test_portable_verified_boot_selection.py'
      - 'tests/test_portable_media_discovery.py'
      - 'tests/test_portable_activation_state_helper.py'
      - 'tests/test_portable_exact_runtime_handoff.py'
      - 'bootstrap/portable-v2/**'
      - 'bootstrap/release-acquisition/**'
      - '!bootstrap/release-acquisition/**/*.md'
      - 'bootstrap/recovery/entrypoint'
      - 'bootstrap/config/release-envelope-url'
      - 'tools/release-bundle/**'
      - 'tools/portable-release-image/**'
      - 'tools/release-manifest/**'
      - 'tools/release-signing/**'
      - '!tools/release-signing/windows/**'
      - '!tools/release-signing/promote_public_trust.py'
      - '!tools/release-signing/cmd/ordax-physical-release-signing/**'
      - '!tools/release-signing/README.md'
      - 'docs/contracts/portable-v2-qemu-boot-proof.json'
      - 'docs/contracts/portable-v2-uefi-boot-proof.json'
      - 'docs/contracts/portable-v3-cold-health-qemu-proof-spec.json'
      - 'boot/portable-v2/**'
      - 'boot/esp/**'
      - 'docs/contracts/portable-bootstrap-v2.json'
      - 'docs/contracts/portable-boot-handoff.json'
      - 'docs/MINIMAL-USB-BOOTSTRAP.md'
      - 'tests/test_portable_v2_qemu_boot_proof_contract.py'
      - 'tests/test_initramfs_upstream_authentication.py'
      - 'tests/test_portable_qemu_kernel_source_ssot.py'
      - 'tests/test_kernel_ci_env.py'
      - 'tests/test_portable_v2_uefi_boot_proof_contract.py'
      - 'tests/test_portable_v3_cold_health_qemu_proof.py'
      - 'tests/test_stable_release_activation_transaction.py'
      - 'tests/test_portable_v4_ai_handoff_contract.py'
      - 'tests/test_portable_component_cache.py'
      - 'tests/test_portable_component_reuse_workflow.py'
      - 'tools/ci/portable_component_cache.py'
      - 'tools/ci/portable_qemu_impact.py'
      - 'tests/test_portable_qemu_impact.py'
      - '.github/workflows/portable-v2-qemu-boot-proof.yml'
  pull_request:
    paths:
      - 'system/**'
      - '!system/**/*.md'
      - '!system/surface/ui/**'
      - '!system/surface/workspace/**'
      - 'bootstrap/base/**'
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/**/*.md'
      - 'bootstrap/stable-base/**'
      - 'bootstrap/surface-runtime/**'
      - 'system/surface/runtime/packages.txt'
      - 'system/surface/runtime/media_runtime_probe.py'
      - '!bootstrap/surface-runtime/**/*.md'
      - 'bootstrap/local-ai-runtime/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/entrypoint'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'tests/test_bootstrap_current_verification.py'
      - 'tests/test_portable_verified_boot_selection.py'
      - 'tests/test_portable_media_discovery.py'
      - 'tests/test_portable_activation_state_helper.py'
      - 'tests/test_portable_exact_runtime_handoff.py'
      - 'bootstrap/portable-v2/**'
      - 'bootstrap/release-acquisition/**'
      - '!bootstrap/release-acquisition/**/*.md'
      - 'bootstrap/recovery/entrypoint'
      - 'bootstrap/config/release-envelope-url'
      - 'tools/release-bundle/**'
      - 'tools/portable-release-image/**'
      - 'tools/release-manifest/**'
      - 'tools/release-signing/**'
      - '!tools/release-signing/windows/**'
      - '!tools/release-signing/promote_public_trust.py'
      - '!tools/release-signing/cmd/ordax-physical-release-signing/**'
      - '!tools/release-signing/README.md'
      - 'docs/contracts/portable-v2-qemu-boot-proof.json'
      - 'docs/contracts/portable-v2-uefi-boot-proof.json'
      - 'docs/contracts/portable-v3-cold-health-qemu-proof-spec.json'
      - 'boot/portable-v2/**'
      - 'boot/esp/**'
      - 'docs/contracts/portable-bootstrap-v2.json'
      - 'docs/contracts/portable-boot-handoff.json'
      - 'docs/MINIMAL-USB-BOOTSTRAP.md'
      - 'tests/test_portable_v2_qemu_boot_proof_contract.py'
      - 'tests/test_initramfs_upstream_authentication.py'
      - 'tests/test_portable_qemu_kernel_source_ssot.py'
      - 'tests/test_kernel_ci_env.py'
      - 'tests/test_portable_v2_uefi_boot_proof_contract.py'
      - 'tests/test_portable_v3_cold_health_qemu_proof.py'
      - 'tests/test_stable_release_activation_transaction.py'
      - 'tests/test_portable_v4_ai_handoff_contract.py'
      - 'tests/test_portable_component_cache.py'
      - 'tests/test_portable_component_reuse_workflow.py'
      - 'tools/ci/portable_component_cache.py'
      - 'tools/ci/portable_qemu_impact.py'
      - 'tests/test_portable_qemu_impact.py'
      - '.github/workflows/portable-v2-qemu-boot-proof.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      base_source:
        type: string
        description: 'stable (default) or isolated independent Buildroot candidate'
        required: false
        default: stable
      force_run:
        type: boolean
        description: 'force heavy Portable/QEMU proof for explicit reusable-workflow callers'
        required: false
        default: true


concurrency:
  # Called workflows inherit github.workflow from their caller. Use a distinct
  # namespace so the official proof cannot cancel its invoking workflow.
  group: canonical-portable-v2-${{ inputs.base_source || 'stable' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  impact:
    name: Portable v2 QEMU Impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.impact.outputs.required }}
      reason: ${{ steps.impact.outputs.reason }}
      changed_count: ${{ steps.impact.outputs.changed_count }}
    steps:
      - name: Checkout exact source commit for impact classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify Portable/QEMU causal impact
        id: impact
        env:
          ORDAX_IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          ORDAX_IMPACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ORDAX_FORCE_QEMU: ${{ inputs.force_run || false }}
          ORDAX_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          force=()
          if [ "$ORDAX_EVENT_NAME" = "workflow_dispatch" ] || [ "$ORDAX_FORCE_QEMU" = "true" ]; then
            force=(--force)
          fi
          python3 tools/ci/portable_qemu_impact.py classify \
            --base "$ORDAX_IMPACT_BASE" \
            --head "$ORDAX_IMPACT_HEAD" \
            "${force[@]}" \
            --github-output "$GITHUB_OUTPUT"

  qemu-portable-v2:
    needs: impact
    if: needs.impact.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Resolve canonical kernel ABI for build artifacts
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/ci_env.py --github-env "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Install bounded local AI build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cmake curl erofs-utils g++ git iproute2 libc6-dev ninja-build openssl util-linux

      - name: Validate portable-v2 QEMU contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_portable_v2_qemu_boot_proof_contract -v
          python -m unittest tests.test_initramfs_upstream_authentication -v
          python -m unittest tests.test_portable_qemu_kernel_source_ssot -v
          python -m unittest tests.test_kernel_ci_env -v
          python -m unittest tests.test_portable_v4_ai_handoff_contract -v
          python -m unittest tests.test_portable_v3_cold_health_qemu_proof -v
          python -m unittest tests.test_portable_component_cache tests.test_portable_component_reuse_workflow -v
          python -m unittest tests.test_portable_qemu_impact -v
          python -m unittest discover -s tests -p 'test_bootstrap_current_verification.py' -v
          python -m unittest discover -s tests -p 'test_portable_verified_boot_selection.py' -v
          python -m unittest discover -s tests -p 'test_portable_media_discovery.py' -v
          python -m unittest discover -s tests -p 'test_portable_activation_state_helper.py' -v
          python -m unittest discover -s tests -p 'test_portable_exact_runtime_handoff.py' -v
          sh -n bootstrap/entrypoint
          sh -n bootstrap/initramfs/portable_init.sh

      - name: Resolve reusable component fingerprints
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          work="$RUNNER_TEMP/portable-v2-qemu"
          mkdir -p "$work/bin" "$work/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified local AI component
        id: local-ai-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/local-ai-runtime
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-local-ai-${{ steps.component-fingerprints.outputs.local_ai }}

      - name: Build and verify exact local AI runtime on cache miss
        if: steps.local-ai-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          python bootstrap/local-ai-runtime/build.py build \
            --cache-dir "$work/local-ai-runtime-cache" \
            --out-dir "$work/local-ai-runtime" \
            > "$work/metadata/local-ai-runtime-build.json"
          python bootstrap/local-ai-runtime/build.py verify \
            --out-dir "$work/local-ai-runtime" \
            > "$work/metadata/local-ai-runtime-build-verify.json"

      - name: Verify local AI component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          cache_hit='${{ steps.local-ai-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/local-ai-runtime/build.py verify \
            --out-dir "$work/local-ai-runtime" \
            > "$work/metadata/local-ai-runtime-verify.json"
          test -s "$work/local-ai-runtime/local-ai-runtime.erofs"
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component local-ai \
              --out-dir "$work/local-ai-runtime" \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$work/metadata/local-ai-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component local-ai \
            --out-dir "$work/local-ai-runtime" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$work/metadata/local-ai-component-reuse.json"

      - name: Save verified local AI component
        if: steps.local-ai-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/local-ai-runtime
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-local-ai-${{ steps.component-fingerprints.outputs.local_ai }}

      - name: Install remaining portable-v2 build and QEMU proof dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools bzip2 \
            e2fsprogs proot gdisk dosfstools \
            exfatprogs exfat-fuse qemu-system-x86 ovmf \
            meson gperf libcap-dev libmount-dev libblkid-dev \
            liblz4-dev libzstd-dev liblzma-dev libpcre2-dev
          command -v qemu-system-x86_64
          command -v mkfs.exfat
          command -v mount.exfat-fuse
          test -e /usr/share/OVMF/OVMF_CODE.fd || test -e /usr/share/OVMF/OVMF_CODE_4M.fd
          python -m pip install --disable-pip-version-check --no-cache-dir jinja2 pyelftools

      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build exact kernel and kernel modules on cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          python bootstrap/kernel/build.py build \
            --jobs 4 \
            --work-dir "$work/kernel-work" \
            --out-dir "$work/kernel"

      - name: Verify kernel component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py "$work/kernel"
          test -s "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION"
          test -s "$work/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          grep -Fx 'CONFIG_VIRTIO=y' "$work/kernel/kernel-$ORDAX_KERNEL_VERSION.config"
          grep -Fx 'CONFIG_VIRTIO_PCI=y' "$work/kernel/kernel-$ORDAX_KERNEL_VERSION.config"
          grep -Fx 'CONFIG_DRM_VIRTIO_GPU=y' "$work/kernel/kernel-$ORDAX_KERNEL_VERSION.config"
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir "$work/kernel" \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$work/metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir "$work/kernel" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$work/metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build and verify exact Stable Base or experimental independent candidate
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ORDAX_BASE_PROOF_SOURCE: ${{ inputs.base_source || 'stable' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          case "$ORDAX_BASE_PROOF_SOURCE" in
            stable)
              sudo -E env ORDAX_SOURCE_COMMIT="$ORDAX_SOURCE_COMMIT" \
                python bootstrap/stable-base/build.py build \
                  --kernel-modules "$work/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar" \
                  --out-dir "$work/stable-base" \
                  --cache-dir "$work/stable-base-cache" \
                  > "$work/metadata/stable-base-build.json"
              sudo chown -R "$(id -u):$(id -g)" "$work/stable-base"
              python bootstrap/stable-base/build.py verify \
                --out-dir "$work/stable-base" \
                > "$work/metadata/stable-base-verify.json"
              ;;
            independent)
              # Disposable CI adapter; the current Stable owner is never mutated.
              sudo apt-get install -y --no-install-recommends \
                gawk cpio unzip rsync file wget patch
              module_archive="$work/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
              base_out="$work/independent-base"
              test -f "$module_archive"
              test ! -L "$module_archive"
              export ORDAX_HOST_PYTHON="$(command -v python3)"
              export ORDAX_KERNEL_MODULES_ARCHIVE="$module_archive"
              export ORDAX_KERNEL_MODULES_RECEIPT="$base_out/kernel-module-selection.json"
              python3 bootstrap/independent-base/build.py build \
                --out "$base_out" \
                --cache "$work/independent-base-cache" --jobs 4 \
                > "$work/metadata/independent-base-build.json"
              python3 bootstrap/independent-base/build.py verify \
                --out "$base_out" \
                > "$work/metadata/independent-base-verify.json"
              mkdir -p "$work/stable-base"
              cp -- "$base_out/independent-base.erofs" \
                "$work/stable-base/stable-base.erofs"
              test "$(sha256sum "$work/stable-base/stable-base.erofs" | awk '{print $1}')" = \
                "$(sha256sum "$base_out/independent-base.erofs" | awk '{print $1}')"
              echo 'ORDAX_INDEPENDENT_OFFICIAL_BOOT_SOURCE=BUILDROOT_VERIFIED'
              ;;
            *)
              echo "unsupported portable base proof source" >&2
              exit 1
              ;;
          esac

      - name: Restore verified Surface runtime component
        id: surface-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/surface-runtime
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-surface-${{ steps.component-fingerprints.outputs.surface }}

      - name: Build exact offline Surface runtime on cache miss
        if: steps.surface-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          sudo -E env ORDAX_SOURCE_COMMIT="$ORDAX_SOURCE_COMMIT" \
            python bootstrap/surface-runtime/build.py build \
              --out-dir "$work/surface-runtime" \
              --cache-dir "$work/surface-runtime-cache" \
              > "$work/metadata/surface-runtime-build.json"
          sudo chown -R "$(id -u):$(id -g)" "$work/surface-runtime"

      - name: Verify Surface component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          cache_hit='${{ steps.surface-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/surface-runtime/build.py verify \
            --out-dir "$work/surface-runtime" \
            > "$work/metadata/surface-runtime-verify.json"
          test -s "$work/surface-runtime/native-surface-runtime.erofs"
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component surface \
              --out-dir "$work/surface-runtime" \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$work/metadata/surface-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component surface \
            --out-dir "$work/surface-runtime" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$work/metadata/surface-component-reuse.json"

      - name: Save verified Surface runtime component
        if: steps.surface-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/surface-runtime
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-surface-${{ steps.component-fingerprints.outputs.surface }}

      - name: Restore verified release-agent component
        id: release-agent-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/release-agent
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-release-agent-${{ steps.component-fingerprints.outputs.release_agent }}

      - name: Test exact release-agent source
        run: |
          set -euo pipefail
          (cd bootstrap/release-acquisition && go test -count=1 ./...)

      - name: Build exact release agent on cache miss
        if: steps.release-agent-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          mkdir -p "$work/release-agent"
          (
            cd bootstrap/release-acquisition
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$work/release-agent/ordax-release-agent" .
          )

      - name: Verify release-agent component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          cache_hit='${{ steps.release-agent-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          test -s "$work/release-agent/ordax-release-agent"
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component release-agent \
              --out-dir "$work/release-agent" \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$work/metadata/release-agent-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component release-agent \
            --out-dir "$work/release-agent" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$work/metadata/release-agent-component-reuse.json"

      - name: Save verified release-agent component
        if: steps.release-agent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/release-agent
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-release-agent-${{ steps.component-fingerprints.outputs.release_agent }}

      - name: Build exact bootstrap capsule
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          mkdir -p "$work/bin" "$work/capsule"
          cp -- "$work/release-agent/ordax-release-agent" "$work/bin/ordax-release-agent"
          python bootstrap/portable-v2/capsule/build.py build \
            --release-agent "$work/bin/ordax-release-agent" \
            --out "$work/capsule/bootstrap.erofs" \
            > "$work/metadata/capsule-build.json"
          python bootstrap/portable-v2/capsule/build.py verify \
            --release-agent "$work/bin/ordax-release-agent" \
            --image "$work/capsule/bootstrap.erofs" \
            > "$work/metadata/capsule-verify.json"

      - name: Build one initramfs pinned to the exact capsule and Stable Base
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          python bootstrap/initramfs/build.py build \
            --jobs 4 \
            --work-dir "$work/initramfs-work" \
            --out-dir "$work/initramfs" \
            --portable-bootstrap-capsule "$work/capsule/bootstrap.erofs" \
            --portable-stable-base "$work/stable-base/stable-base.erofs" \
            > "$work/metadata/initramfs-build.json"
          python bootstrap/initramfs/build.py verify \
            --out-dir "$work/initramfs" \
            > "$work/metadata/initramfs-verify.json"

      - name: Build candidate v4 with local AI and previous signed portable release v3
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          previous="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! printf '%s' "$previous" | grep -Eq '^[0-9a-f]{40}$' || [ "$previous" = "0000000000000000000000000000000000000000" ]; then
            previous="$(git rev-parse "$commit^")"
          fi
          test "$previous" != "$commit"
          git cat-file -e "$previous^{commit}"
          printf '%s\n' "$previous" > "$work/previous-commit.txt"
          portable="$work/portable/.ordax"
          release="$portable/releases/$commit"
          previous_release="$portable/releases/$previous"
          runtime_image="$work/surface-runtime/native-surface-runtime.erofs"
          runtime_sha="$(sha256sum "$runtime_image" | awk '{print $1}')"
          runtime_store="$portable/runtimes/sha256/$runtime_sha"
          ai_image="$work/local-ai-runtime/local-ai-runtime.erofs"
          ai_sha="$(sha256sum "$ai_image" | awk '{print $1}')"
          ai_store="$portable/ai-runtimes/sha256/$ai_sha"
          mkdir -p "$release" "$previous_release" "$runtime_store" "$ai_store"

          (
            cd tools/release-bundle
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -o "$work/bin/release-bundle" .
          )
          (
            cd tools/release-manifest
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -o "$work/bin/release-manifest" .
          )
          (
            cd tools/release-signing
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -o "$work/bin/release-signing" .
          )

          "$work/bin/release-bundle" \
            --root "$PWD" \
            --out "$work/system.tar"
          python tools/portable-release-image/build.py build \
            --tar "$work/system.tar" \
            --out "$release/system.erofs" \
            > "$work/metadata/release-image.json"

          cp "$runtime_image" "$runtime_store/native-surface-runtime.erofs"
          cp "$ai_image" "$ai_store/local-ai-runtime.erofs"
          printf '%s\n' "$runtime_sha" > "$release/surface-runtime.sha256"
          printf '%s\n' "$ai_sha" > "$release/local-ai-runtime.sha256"

          "$work/bin/release-manifest" \
            --manifest-schema 4 \
            --artifact "$release/system.erofs" \
            --runtime-artifact "$runtime_image" \
            --local-ai-artifact "$ai_image" \
            --local-ai-source-lock system/services/local-ai/source-lock.json \
            --source-commit "$commit" \
            --artifact-url "https://example.invalid/releases/$commit/system.erofs" \
            --runtime-artifact-url "https://example.invalid/runtimes/$runtime_sha/native-surface-runtime.erofs" \
            --local-ai-artifact-url "https://example.invalid/ai-runtimes/$ai_sha/local-ai-runtime.erofs" \
            --out "$release/release-manifest.json"

          "$work/bin/release-signing" generate-key \
            --private-key "$work/private.pem" \
            --trust "$work/release-trust.json" \
            --key-id ci-portable-v4-qemu
          "$work/bin/release-signing" sign \
            --manifest "$release/release-manifest.json" \
            --private-key "$work/private.pem" \
            --trust "$work/release-trust.json" \
            --key-id ci-portable-v4-qemu \
            --out "$release/release-envelope.json"
          "$work/bin/release-signing" verify-envelope \
            --envelope "$release/release-envelope.json" \
            --trust "$work/release-trust.json"
          "$work/bin/ordax-release-agent" verify-portable-v4-exact \
            --trust "$work/release-trust.json" \
            --root "$portable" \
            --expected-commit "$commit" \
            > "$work/metadata/release-v4-exact-verify.json"

          previous_source="$work/previous-source"
          rm -rf "$previous_source"
          git worktree add --detach "$previous_source" "$previous"
          previous_bundle="$work/previous-bundle"
          mkdir -p "$previous_bundle"
          "$work/bin/release-bundle" \
            --root "$previous_source" \
            --out "$previous_bundle/system.tar"
          python tools/portable-release-image/build.py build \
            --tar "$previous_bundle/system.tar" \
            --out "$previous_release/system.erofs" \
            > "$work/metadata/previous-release-image.json"
          printf '%s\n' "$runtime_sha" > "$previous_release/surface-runtime.sha256"
          "$work/bin/release-manifest" \
            --manifest-schema 3 \
            --artifact "$previous_release/system.erofs" \
            --runtime-artifact "$runtime_image" \
            --source-commit "$previous" \
            --artifact-url "https://example.invalid/releases/$previous/system.erofs" \
            --runtime-artifact-url "https://example.invalid/runtimes/$runtime_sha/native-surface-runtime.erofs" \
            --out "$previous_release/release-manifest.json"
          "$work/bin/release-signing" sign \
            --manifest "$previous_release/release-manifest.json" \
            --private-key "$work/private.pem" \
            --trust "$work/release-trust.json" \
            --key-id ci-portable-v4-qemu \
            --out "$previous_release/release-envelope.json"
          "$work/bin/release-signing" verify-envelope \
            --envelope "$previous_release/release-envelope.json" \
            --trust "$work/release-trust.json"
          "$work/bin/ordax-release-agent" verify-portable-v3-exact \
            --trust "$work/release-trust.json" \
            --root "$portable" \
            --expected-commit "$previous" \
            > "$work/metadata/previous-release-v3-exact-verify.json"
          git worktree remove --force "$previous_source"

          python - "$release/release-manifest.json" "$previous_release/release-manifest.json" "$runtime_sha" "$ai_sha" <<'PY'
          import json, pathlib, sys
          candidate = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          previous = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          runtime_sha = sys.argv[3]
          ai_sha = sys.argv[4]
          assert candidate['$schema'] == 'prototype-ordax.release-manifest/4'
          assert [a['role'] for a in candidate['artifacts']] == [
              'system-image', 'surface-runtime', 'local-ai-runtime'
          ]
          assert candidate['artifacts'][1]['sha256'] == runtime_sha
          assert candidate['artifacts'][2]['sha256'] == ai_sha
          assert candidate['local_ai']['contract'] == 'ordax.local-ai/1'
          assert previous['$schema'] == 'prototype-ordax.release-manifest/3'
          assert [a['role'] for a in previous['artifacts']] == ['system-image', 'surface-runtime']
          assert previous['artifacts'][1]['sha256'] == runtime_sha
          assert candidate['source_commit'] != previous['source_commit']
          print('PORTABLE_V4_CANDIDATE_WITH_V3_PREVIOUS=VERIFIED')
          PY

          rm -f "$work/private.pem"
          test ! -e "$work/private.pem"
          echo "PORTABLE_V4_CANDIDATE_SOURCE_COMMIT=$commit"
          echo "PORTABLE_V3_PREVIOUS_SOURCE_COMMIT=$previous"

      - name: Build persistent ext4 state with current and known-good
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          state="$work/persistent-state.img"
          current="$work/current.txt"
          known="$work/known-good.txt"
          printf '%s\n' "$commit" > "$current"
          printf '%s\n' "$commit" > "$known"

          truncate -s 268435456 "$state"
          mkfs.ext4 -q -F -L ORDAX-STATE "$state"
          debugfs -w -R 'mkdir /ordax' "$state"
          debugfs -w -R 'mkdir /ordax/base' "$state"
          debugfs -w -R 'mkdir /ordax/base/upper' "$state"
          debugfs -w -R 'mkdir /ordax/base/work' "$state"
          debugfs -w -R 'mkdir /ordax/portable-release' "$state"
          debugfs -w -R 'mkdir /ordax/runtime' "$state"
          debugfs -w -R 'mkdir /home' "$state"
          debugfs -w -R "write $current /ordax/portable-release/current" "$state"
          debugfs -w -R "write $known /ordax/portable-release/known-good" "$state"
          e2fsck -fn "$state"

      - name: Build armed one-shot Portable activation state
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          candidate="${{ github.event.pull_request.head.sha || github.sha }}"
          previous="$(cat "$work/previous-commit.txt")"
          portable="$work/portable/.ordax"
          state="$work/persistent-state-one-shot.img"
          current="$work/one-shot-current.txt"
          known="$work/one-shot-known-good.txt"
          mountpoint="$work/one-shot-state-mount"

          printf '%s\n' "$previous" > "$current"
          printf '%s\n' "$previous" > "$known"
          truncate -s 268435456 "$state"
          mkfs.ext4 -q -F -L ORDAX-STATE "$state"
          debugfs -w -R 'mkdir /ordax' "$state"
          debugfs -w -R 'mkdir /ordax/base' "$state"
          debugfs -w -R 'mkdir /ordax/base/upper' "$state"
          debugfs -w -R 'mkdir /ordax/base/work' "$state"
          debugfs -w -R 'mkdir /ordax/portable-release' "$state"
          debugfs -w -R 'mkdir /ordax/runtime' "$state"
          debugfs -w -R 'mkdir /home' "$state"
          debugfs -w -R "write $current /ordax/portable-release/current" "$state"
          debugfs -w -R "write $known /ordax/portable-release/known-good" "$state"

          mkdir -p "$mountpoint"
          sudo mount -t ext4 -o loop,rw "$state" "$mountpoint"
          trap 'sudo umount "$mountpoint" >/dev/null 2>&1 || true' EXIT
          prepared="$(sudo "$work/initramfs-work/ordax-portable-state" \
            prepare "$mountpoint" "$portable" "$candidate")"
          test "$prepared" = "$candidate"
          sudo sync
          sudo umount "$mountpoint"
          trap - EXIT
          e2fsck -fn "$state"

          echo 'PORTABLE_V4_TO_V3_ONE_SHOT_STATE_ARMED=YES'
          echo "PORTABLE_V4_ONE_SHOT_PREVIOUS_V3=$previous"
          echo "PORTABLE_V4_ONE_SHOT_CANDIDATE=$candidate"

      - name: Boot portable-v2 candidate PID1 in QEMU
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          rm -rf "$work/qemu-proof"
          mkdir -p "$work/qemu-proof"
          proof_runner=bootstrap/portable-v2/qemu_boot.py
          proof_extra=()
          if [ "${{ inputs.base_source || 'stable' }}" = independent ]; then
            proof_runner=bootstrap/independent-base/portable_boot_proof.py
            proof_extra=(--base-out "$work/independent-base" --output-dir "$work/qemu-proof/bridge")
            echo 'ORDAX_INDEPENDENT_PORTABLE_BRIDGE=EXECUTING'
          fi
          sudo -E python3 "$proof_runner" "${proof_extra[@]}" \
            --kernel "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION" \
            --initramfs "$work/initramfs/initramfs.cpio.gz" \
            --initramfs-provenance "$work/initramfs/initramfs-provenance.json" \
            --capsule "$work/capsule/bootstrap.erofs" \
            --stable-base "$work/stable-base/stable-base.erofs" \
            --state-image "$work/persistent-state.img" \
            --portable-root "$work/portable/.ordax" \
            --trust "$work/release-trust.json" \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --out "$work/qemu-proof/proof.json"
          sudo chown -R "$(id -u):$(id -g)" "$work/qemu-proof"

          python - "$work/qemu-proof/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof['status'] == 'pass'
          assert proof['qemu_direct_kernel_boot_proven'] is True
          assert proof['qemu_uefi_boot_proven'] is False
          assert proof['physical_usb_boot_proven'] is False
          assert proof['physical_target_device_touched'] is False
          assert proof['physical_write_authorized'] is False
          assert proof['public_physical_promotion_allowed'] is False
          assert proof['candidate_pid1_default_changed'] is False
          assert proof['network_required_for_first_boot'] is False
          assert proof['guest_disk']['retained'] is False
          assert proof['artifacts']['release_manifest_schema'] == 4
          assert isinstance(proof['artifacts']['local_ai_runtime_sha256'], str)
          assert len(proof['artifacts']['local_ai_runtime_sha256']) == 64
          assert 'ORDAX_LOCAL_AI_RUNTIME_HANDOFF=VERIFIED' in proof['serial_markers']
          assert any(marker.startswith('ORDAX_LOCAL_AI_RUNTIME_SHA256=') for marker in proof['serial_markers'])
          assert 'ORDAX_LOCAL_AI_BACKEND=STARTED' in proof['serial_markers']
          assert all(proof['checks'].values())
          print('PORTABLE_V4_QEMU_DIRECT_KERNEL_BOOT=PASS')
          print('PORTABLE_V2_UEFI_BOOT_PROVEN=NO')
          print('PORTABLE_V2_PHYSICAL_BOOT_PROVEN=NO')
          print('PORTABLE_V2_PUBLIC_PROMOTION=NO')
          PY

      - name: Prove armed candidate one-shot fallback in QEMU
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          previous="$(cat "$work/previous-commit.txt")"
          rm -rf "$work/qemu-one-shot-proof"
          mkdir -p "$work/qemu-one-shot-proof"

          proof_runner=bootstrap/portable-v2/qemu_boot.py
          proof_extra=()
          if [ "${{ inputs.base_source || 'stable' }}" = independent ]; then
            proof_runner=bootstrap/independent-base/portable_boot_proof.py
            proof_extra=(--base-out "$work/independent-base" --output-dir "$work/qemu-one-shot-proof/bridge")
            echo 'ORDAX_INDEPENDENT_PORTABLE_BRIDGE=EXECUTING'
          fi
          sudo -E python3 "$proof_runner" "${proof_extra[@]}" \
            --kernel "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION" \
            --initramfs "$work/initramfs/initramfs.cpio.gz" \
            --initramfs-provenance "$work/initramfs/initramfs-provenance.json" \
            --capsule "$work/capsule/bootstrap.erofs" \
            --stable-base "$work/stable-base/stable-base.erofs" \
            --state-image "$work/persistent-state-one-shot.img" \
            --portable-root "$work/portable/.ordax" \
            --trust "$work/release-trust.json" \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --previous-commit "$previous" \
            --out "$work/qemu-one-shot-proof/proof.json"
          sudo chown -R "$(id -u):$(id -g)" "$work/qemu-one-shot-proof"

          python - "$work/qemu-one-shot-proof/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          activation = proof['activation_one_shot']
          assert proof['status'] == 'pass'
          assert proof['armed_candidate_one_shot_proven'] is True
          assert activation['proven'] is True
          assert activation['candidate_boot_count'] == 1
          assert activation['fallback_boot_count'] == 1
          assert activation['cold_health_commit_proven'] is False
          assert activation['failure_fallback_proven'] is True
          assert activation['rejected_state_proven'] is True
          assert all(activation['checks'].values())
          assert proof['physical_usb_boot_proven'] is False
          assert proof['physical_target_device_touched'] is False
          assert proof['physical_write_authorized'] is False
          assert proof['public_physical_promotion_allowed'] is False
          assert proof['guest_disk']['retained'] is False
          assert proof['artifacts']['release_manifest_schema'] == 4
          assert isinstance(proof['artifacts']['local_ai_runtime_sha256'], str)
          assert 'ORDAX_PORTABLE_RELEASE_MANIFEST_SCHEMA=4' in proof['serial_markers']
          assert 'ORDAX_PORTABLE_RELEASE_MANIFEST_SCHEMA=3' in proof['serial_markers']
          assert 'ORDAX_LOCAL_AI_RUNTIME_HANDOFF=VERIFIED' in proof['serial_markers']
          print('PORTABLE_V4_TO_V3_QEMU_ONE_SHOT_FALLBACK=PASS')
          print('PORTABLE_V4_QEMU_COLD_HEALTH_COMMIT_PROVEN=NO')
          print('PORTABLE_V4_PHYSICAL_BOOT_PROVEN=NO')
          PY

      - name: Prove invalid Ed25519 candidate, durable rollback and read-only rescue in QEMU
        if: ${{ inputs.base_source == 'independent' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          previous="$(cat "$work/previous-commit.txt")"
          mkdir -p "$work/qemu-signed-fault-proof"
          sudo -E python3 bootstrap/independent-base/signed_release_failure_qemu.py \
            --kernel "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION" \
            --initramfs "$work/initramfs/initramfs.cpio.gz" \
            --initramfs-provenance "$work/initramfs/initramfs-provenance.json" \
            --capsule "$work/capsule/bootstrap.erofs" \
            --stable-base "$work/stable-base/stable-base.erofs" \
            --state-image "$work/persistent-state-one-shot.img" \
            --portable-root "$work/portable/.ordax" \
            --trust "$work/release-trust.json" \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --previous-commit "$previous" \
            --out "$work/qemu-signed-fault-proof/proof.json"
          sudo chown -R "$(id -u):$(id -g)" "$work/qemu-signed-fault-proof"
          python3 - "$work/qemu-signed-fault-proof/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof['status'] == 'pass'
          assert all(proof['checks'].values())
          assert proof['physical_device_touched'] is False
          assert proof['physical_promotion_authorized'] is False
          print('ORDAX_INDEPENDENT_SIGNED_RELEASE_FAILURE_QEMU=PASS')
          PY

      - name: Keep cold-health promotion as physical Stable/MVP gate
        run: |
          set -euo pipefail
          echo "PORTABLE_V4_QEMU_COLD_HEALTH_COMMIT_PROVEN=NO"
          echo "COLD_HEALTH_COMMIT_PROOF=REQUIRES_PHYSICAL_STABLE_MVP_NO_SYNTHETIC_CI"

      - name: Build pinned systemd-boot for portable UEFI proof
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          python boot/esp/build.py check
          python boot/esp/build.py build \
            --work-dir "$work/esp-work" \
            --out-dir "$work/esp"
          python boot/esp/build.py verify --out-dir "$work/esp"
          test -s "$work/esp/systemd-bootx64.efi"

      - name: Validate portable UEFI proof contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_portable_v2_uefi_boot_proof_contract -v

      - name: Boot same portable-v2 disk through OVMF and systemd-boot
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-v2-qemu"
          rm -rf "$work/uefi-proof"
          mkdir -p "$work/uefi-proof"
          sudo -E python3 bootstrap/portable-v2/uefi_boot.py \
            --kernel "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION" \
            --initramfs "$work/initramfs/initramfs.cpio.gz" \
            --initramfs-provenance "$work/initramfs/initramfs-provenance.json" \
            --capsule "$work/capsule/bootstrap.erofs" \
            --stable-base "$work/stable-base/stable-base.erofs" \
            --state-image "$work/persistent-state.img" \
            --portable-root "$work/portable/.ordax" \
            --trust "$work/release-trust.json" \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --bootloader "$work/esp/systemd-bootx64.efi" \
            --loader-conf boot/portable-v2/loader/loader.conf \
            --normal-entry boot/portable-v2/loader/entries/ordax-portable.conf \
            --recovery-entry boot/portable-v2/loader/entries/ordax-portable-recovery.conf \
            --out "$work/uefi-proof/proof.json"
          sudo chown -R "$(id -u):$(id -g)" "$work/uefi-proof"

          python - "$work/uefi-proof/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof['status'] == 'pass'
          assert proof['qemu_uefi_boot_proven'] is True
          assert proof['secure_boot_proven'] is False
          assert proof['physical_usb_boot_proven'] is False
          assert proof['public_physical_promotion_allowed'] is False
          assert proof['physical_target_device_touched'] is False
          assert proof['physical_write_authorized'] is False
          assert proof['guest_disk']['retained'] is False
          assert proof['ovmf_vars']['retained'] is False
          assert proof['artifacts']['release_manifest_schema'] == 4
          assert isinstance(proof['artifacts']['local_ai_runtime_sha256'], str)
          assert len(proof['artifacts']['local_ai_runtime_sha256']) == 64
          assert 'ORDAX_LOCAL_AI_RUNTIME_HANDOFF=VERIFIED' in proof['serial_markers']
          assert any(marker.startswith('ORDAX_LOCAL_AI_RUNTIME_SHA256=') for marker in proof['serial_markers'])
          assert all(proof['checks'].values())
          print('PORTABLE_V4_QEMU_UEFI_BOOT=PASS')
          print('PORTABLE_V2_SECURE_BOOT_PROVEN=NO')
          print('PORTABLE_V2_PHYSICAL_BOOT_PROVEN=NO')
          print('PORTABLE_V2_PUBLIC_PROMOTION=NO')
          PY

      - name: Upload proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-v2-qemu-boot-proof-${{ github.event.pull_request.head.sha || github.sha }}
