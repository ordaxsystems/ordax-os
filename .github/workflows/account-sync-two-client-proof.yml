name: Account Sync Two Client Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-two-client-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORDAX_PROOF_ACCOUNT_EMAIL: ${{ secrets.ORDAX_PROOF_ACCOUNT_EMAIL }}
      ORDAX_PROOF_ACCOUNT_PASSWORD: ${{ secrets.ORDAX_PROOF_ACCOUNT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require dedicated proof account secrets without printing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORDAX_PROOF_ACCOUNT_EMAIL:-}" || {
            echo 'ORDAX_PROOF_ACCOUNT_EMAIL secret is required for this manual proof.' >&2
            exit 2
          }
          test -n "${ORDAX_PROOF_ACCOUNT_PASSWORD:-}" || {
            echo 'ORDAX_PROOF_ACCOUNT_PASSWORD secret is required for this manual proof.' >&2
            exit 2
          }
          echo 'ACCOUNT_SYNC_PROOF_CREDENTIALS_PRESENT=YES'
          echo 'ACCOUNT_SYNC_PROOF_CREDENTIALS_PRINTED=NO'

      - name: Prove two independent account-sync sessions
        env:
          ORDAX_PROOF_RECEIPT_PATH: ${{ runner.temp }}/account-sync-two-client-proof.json
        run: python tools/account-sync/prove_two_clients.py

      - name: Validate sanitized receipt shape
        shell: bash
        run: |
          set -euo pipefail
          python - "$ORDAX_PROOF_RECEIPT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["$schema"] == "prototype-ordax.account-sync-two-client-proof/1"
          assert data["status"] == "pass"
          assert data["proof_scope"] == "two-independent-sessions-same-account"
          assert data["proof_object_tombstoned"] is True
          assert data["credentials_persisted"] is False
          assert data["account_identifier_recorded"] is False
          assert data["sensitive_auth_material_recorded"] is False
          assert isinstance(data["create_cursor"], int)
          assert isinstance(data["delete_cursor"], int)
          assert data["delete_cursor"] > data["create_cursor"]
          assert data["source_commit"] == data["source_commit"].lower()
          assert len(data["source_commit"]) == 40
          int(data["source_commit"], 16)
          forbidden = {"email", "password", "access_token", "refresh_token", "cookie"}
          serialized = json.dumps(data, sort_keys=True).lower()
          for value in forbidden:
              assert value not in serialized
          print("ACCOUNT_SYNC_TWO_CLIENT_RECEIPT=PASS_SANITIZED")
          PY

      - name: Upload sanitized continuity proof only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: account-sync-two-client-proof-${{ github.sha }}
          path: ${{ runner.temp }}/account-sync-two-client-proof.json
          if-no-files-found: error
          retention-days: 14
