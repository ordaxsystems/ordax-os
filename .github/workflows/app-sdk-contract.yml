name: App SDK Contract Bundle

on:
  pull_request:
    paths:
      - "system/contracts/**"
      - "sdk/app-sdk-v1/**"
      - "tools/app-sdk/**"
      - "tools/ci/app_sdk_impact.mjs"
      - "tests/test_causal_workflow_impact.mjs"
      - "tests/test_app_sdk_app_data.mjs"
      - "tests/test_app_sdk_application_actions.mjs"
      - "tests/test_application_action_manifest.mjs"
      - "tests/test_application_action_provider.mjs"
      - "tests/test_app_sdk_projects_ports.mjs"
      - "tests/test_app_sdk_studio_ports.mjs"
      - "tests/test_app_sdk_browser_ports.mjs"
      - "tests/test_app_sdk_network_draft.mjs"
      - "tests/test_app_sdk_space_experience.mjs"
      - "tests/test_app_sdk_files_ports.mjs"
      - "tests/test_app_sdk_assistant_public_contracts.mjs"
      - "tools/verify/internet_sdk_readiness.py"
      - "tests/test_internet_sdk_readiness.py"
      - "system/apps/internet/**"
      - ".github/workflows/app-sdk-contract.yml"
  push:
    branches: [main]
    paths:
      - "system/contracts/**"
      - "sdk/app-sdk-v1/**"
      - "tools/app-sdk/**"
      - "tools/ci/app_sdk_impact.mjs"
      - "tests/test_causal_workflow_impact.mjs"
      - "tests/test_app_sdk_app_data.mjs"
      - "tests/test_app_sdk_application_actions.mjs"
      - "tests/test_application_action_manifest.mjs"
      - "tests/test_application_action_provider.mjs"
      - "tests/test_app_sdk_projects_ports.mjs"
      - "tests/test_app_sdk_studio_ports.mjs"
      - "tests/test_app_sdk_browser_ports.mjs"
      - "tests/test_app_sdk_network_draft.mjs"
      - "tests/test_app_sdk_space_experience.mjs"
      - "tests/test_app_sdk_files_ports.mjs"
      - "tests/test_app_sdk_assistant_public_contracts.mjs"
      - "tools/verify/internet_sdk_readiness.py"
      - "tests/test_internet_sdk_readiness.py"
      - "system/apps/internet/**"
      - ".github/workflows/app-sdk-contract.yml"

permissions:
  contents: read

jobs:
  app-sdk-impact:
    name: App SDK Causal Impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.classify.outputs.required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout exact source with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify available Node runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
      - name: Classify public App SDK impact
        id: classify
        env:
          ORDAX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ORDAX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci/app_sdk_impact.mjs classify --base "$ORDAX_BASE_SHA" --head "$ORDAX_HEAD_SHA"

  app-sdk-contract:
    needs: app-sdk-impact
    if: needs.app-sdk-impact.outputs.required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate bundle JSON
        run: python3 -m json.tool sdk/app-sdk-v1/bundle.json >/dev/null

      - name: Prove deterministic contract export
        run: python3 tools/app-sdk/export.py --check

      - name: Verify published bundle digest
        working-directory: sdk/app-sdk-v1
        run: sha256sum --check bundle.sha256

      - name: Prove App Data publication is contract-only
        run: node --test tests/test_app_sdk_app_data.mjs

      - name: Prove Application Action manifest remains proposal-only
        run: node --test tests/test_application_action_manifest.mjs

      - name: Prove Application Action publication remains authority-free
        run: node --test tests/test_app_sdk_application_actions.mjs

      - name: Prove Application Action provider is typed and authority-free
        run: node --test tests/test_application_action_provider.mjs

      - name: Prove Projects public ports and authority boundary
        run: node --test tests/test_app_sdk_projects_ports.mjs

      - name: Prove Studio public ports and authority boundary
        run: node --test tests/test_app_sdk_studio_ports.mjs

      - name: Prove Browser public ports do not grant privileged engine authority
        run: node --test tests/test_app_sdk_browser_ports.mjs

      - name: Prove Internet is not silently reintroduced into OS source
        run: python3 -m unittest tests.test_internet_sdk_readiness -v

      - name: Checkout pinned Internet source for public App SDK proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ordaxsystems/ordax-os
          ref: 9362b61f8b2107ae6c1d8a239922d5483e988299
          path: .ordax-internet-source
          persist-credentials: false

      - name: Validate original Internet public boundary, never the removed OS source
        run: python3 .ordax-internet-source/tools/verify/internet_sdk_readiness.py --require-public

      - name: Prove Network Draft SDK preserves canonical Space-boundary contract
        run: node --test tests/test_app_sdk_network_draft.mjs

      - name: Prove Space Experience SDK keeps owner authority and Food KDS mapping
        run: node --test tests/test_app_sdk_space_experience.mjs

      - name: Prove Files recent port is public metadata without host authority
        run: |
          node --test tests/test_app_sdk_files_ports.mjs
          node --test tests/test_app_sdk_assistant_public_contracts.mjs
