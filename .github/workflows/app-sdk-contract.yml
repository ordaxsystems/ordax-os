name: App SDK Contract Bundle

on:
  pull_request:
    paths:
      - "system/contracts/**"
      - "sdk/app-sdk-v1/**"
      - "tools/app-sdk/**"
      - "tests/test_app_sdk_app_data.mjs"
      - "tests/test_app_sdk_application_actions.mjs"
      - "tests/test_application_action_manifest.mjs"
      - "tests/test_application_action_provider.mjs"
      - "tests/test_app_sdk_studio_ports.mjs"
      - "tests/test_app_sdk_browser_ports.mjs"
      - ".github/workflows/app-sdk-contract.yml"
  push:
    branches: [main]
    paths:
      - "system/contracts/**"
      - "sdk/app-sdk-v1/**"
      - "tools/app-sdk/**"
      - "tests/test_app_sdk_app_data.mjs"
      - "tests/test_app_sdk_application_actions.mjs"
      - "tests/test_application_action_manifest.mjs"
      - "tests/test_application_action_provider.mjs"
      - "tests/test_app_sdk_studio_ports.mjs"
      - "tests/test_app_sdk_browser_ports.mjs"
      - ".github/workflows/app-sdk-contract.yml"

permissions:
  contents: read

jobs:
  app-sdk-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate bundle JSON
        run: python3 -m json.tool sdk/app-sdk-v1/bundle.json >/dev/null

      - name: Prove deterministic contract export
        run: python3 tools/app-sdk/export.py --check

      - name: Verify published bundle digest
        working-directory: sdk/app-sdk-v1
        run: sha256sum --check bundle.sha256

      - name: Prove App Data publication is contract-only
        run: node --test tests/test_app_sdk_app_data.mjs

      - name: Prove Application Action manifest remains proposal-only
        run: node --test tests/test_application_action_manifest.mjs

      - name: Prove Application Action publication remains authority-free
        run: node --test tests/test_app_sdk_application_actions.mjs

      - name: Prove Application Action provider is typed and authority-free
        run: node --test tests/test_application_action_provider.mjs

      - name: Prove Projects public ports and authority boundary
        run: node --test tests/test_app_sdk_projects_ports.mjs

      - name: Prove Studio public ports and authority boundary
        run: node --test tests/test_app_sdk_studio_ports.mjs

      - name: Prove Browser public ports do not grant privileged engine authority
        run: node --test tests/test_app_sdk_browser_ports.mjs
