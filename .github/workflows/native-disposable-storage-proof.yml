name: Native Disposable Storage Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/core/native_*.go'
      - 'tools/creator/core/storage_*.go'
      - 'tools/creator/cmd/ordax-creator/**'
      - 'tools/creator/proof/native_disposable.py'
      - 'docs/contracts/native-installation.json'
      - 'docs/contracts/native-disposable-proof.json'
      - 'docs/contracts/storage-architecture.json'
      - 'docs/NATIVE-INSTALLATION.md'
      - '.github/workflows/native-disposable-storage-proof.yml'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_native_disposable_external_source.py'
  pull_request:
    paths:
      - 'tools/creator/core/native_*.go'
      - 'tools/creator/core/storage_*.go'
      - 'tools/creator/cmd/ordax-creator/**'
      - 'tools/creator/proof/native_disposable.py'
      - 'docs/contracts/native-installation.json'
      - 'docs/contracts/native-disposable-proof.json'
      - 'docs/contracts/storage-architecture.json'
      - 'docs/NATIVE-INSTALLATION.md'
      - '.github/workflows/native-disposable-storage-proof.yml'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_native_disposable_external_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-native-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve exact standalone Creator implementation
        uses: ./.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/ordax-creator-native-proof

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Assert native source ownership and safety invariants
        run: python3 -m unittest tests.test_creator_native_disposable_external_source -v

      - name: Install disposable proof tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdisk \
            dosfstools \
            cryptsetup \
            btrfs-progs
          command -v sgdisk
          command -v mkfs.vfat
          command -v cryptsetup
          command -v mkfs.btrfs
          command -v btrfs
          command -v blkid

      - name: Test pinned independent Creator Native planning and compile CLI
        run: |
          set -euo pipefail
          creator="${ORDAX_CREATOR_NATIVE_SOURCE:?missing pinned Creator checkout}"
          test "${ORDAX_CREATOR_SOURCE_REPOSITORY:?}" = 'ordaxsystems/ordax-creator'
          test "$(git -C "$creator" rev-parse HEAD)" = "${ORDAX_CREATOR_SOURCE_COMMIT:?}"
          test "$(git -C "$creator" rev-parse 'HEAD^{tree}')" = "${ORDAX_CREATOR_SOURCE_TREE:?}"
          test "$(head -n 1 "$creator/go.mod")" = 'module github.com/ordaxsystems/ordax-creator'
          (
            cd "$creator"
            ORDAX_OS_CONTRACTS_DIR="$GITHUB_WORKSPACE/docs/contracts" \
              go test -count=1 ./core ./host/linux ./cmd/ordax-creator
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$RUNNER_TEMP/ordax-native-plan-cli" ./cmd/ordax-creator
          )
          test -x "$RUNNER_TEMP/ordax-native-plan-cli"
          echo 'NATIVE_CREATOR_CLI_SOURCE=PINNED_INDEPENDENT'
          echo 'NATIVE_CREATOR_DISK_WRITES=NOT_AUTHORIZED'

      - name: Generate canonical Native materialization plan
        run: |
          set -euo pipefail
          target_bytes="$(python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('docs/contracts/native-disposable-proof.json').read_text())
          print(contract['target_bytes'])
          PY
          )"
          creator="$RUNNER_TEMP/ordax-native-plan-cli"
          test -x "$creator"
          "$creator" plan-native-materialization \
            --target-bytes "$target_bytes" > "$RUNNER_TEMP/native-materialization-plan.json"

          python3 - "$RUNNER_TEMP/native-materialization-plan.json" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert plan['schema'] == 'prototype-ordax.native-materialization-plan/1'
          assert plan['status'] == 'plan-only'
          assert plan['physical_write_allowed'] is False
          assert plan['disposable_proof_only'] is True
          assert plan['boot_integration_status'] == 'pending-native-luks2-btrfs-bootstrap'
          assert [p['name'] for p in plan['partitions']] == ['ORDAX-ESP', 'ORDAX-POOL']
          assert plan['partitions'][1]['encryption'] == 'luks2'
          assert plan['partitions'][1]['filesystem'] == 'btrfs'
          print('NATIVE_MATERIALIZATION_PLAN=PASS')
          print('NATIVE_PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

      - name: Prove disposable GPT FAT32 LUKS2 Btrfs layout
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/native-storage-proof"
          metadata="$RUNNER_TEMP/native-storage-proof-metadata"
          mkdir -p "$metadata"
          sudo -E python3 tools/creator/proof/native_disposable.py \
            --contract docs/contracts/native-disposable-proof.json \
            --plan "$RUNNER_TEMP/native-materialization-plan.json" \
            --output-root "$output"

          # Keep RAW/container bytes inside the root-only proof directory. Export
          # only immutable proof metadata into an ordinary runner-owned path.
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0644 \
            "$output/proof.json" "$metadata/proof.json"
          python3 - "$metadata/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof['status'] == 'pass'
          assert proof['physical_write_authorized'] is False
          assert proof['physical_device_touched'] is False
          assert proof['bootable_proven'] is False
          assert proof['boot_integration_status'] == 'pending-native-luks2-btrfs-bootstrap'
          assert [p['name'] for p in proof['partitions']] == ['ORDAX-ESP', 'ORDAX-POOL']
          assert proof['partitions'][0]['filesystem'] == {'type': 'vfat', 'label': 'ORDAX-ESP'}
          pool = proof['partitions'][1]
          assert pool['type_guid'] == 'ca7d7ccb-63ed-4c53-861c-1742536059cc'
          assert pool['encryption'] == 'luks2'
          assert pool['filesystem']['type'] == 'btrfs'
          assert pool['filesystem']['label'] == 'ORDAX-POOL'
          assert pool['product_mode'] == 'native-disk'
          assert all(proof['checks'].values())
          print('NATIVE_DISPOSABLE_STORAGE_PROOF=PASS')
          print('NATIVE_BOOTABLE_PROOF=NO')
          print('NATIVE_PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

      - name: Destroy disposable bytes and ephemeral secrets
        if: always()
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/native-storage-proof"
          metadata="$RUNNER_TEMP/native-storage-proof-metadata/proof.json"
          if sudo test -d "$output"; then
            sudo test ! -e "$output/.ephemeral-luks-key"
            sudo rm -rf "$output"
          fi
          test ! -e "$output"
          if [ -e "$metadata" ]; then
            test "$(stat -c '%a' "$metadata")" = "644"
          fi
          echo 'NATIVE_DISPOSABLE_RAW_RETAINED=NO'
          echo 'NATIVE_LUKS_KEY_RETAINED=NO'
          echo 'NATIVE_PROOF_METADATA_ONLY=YES'

      - name: Upload proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-disposable-storage-proof-${{ github.sha }}
          path: ${{ runner.temp }}/native-storage-proof-metadata/proof.json
          if-no-files-found: error
          retention-days: 14
