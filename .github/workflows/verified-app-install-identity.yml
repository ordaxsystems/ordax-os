name: Verified App Install Identity

on:
  pull_request:
    paths:
      - 'system/surface/runtime/native_app_install_identity.py'
      - 'system/surface/runtime/native_app_install_identity_producer.py'
      - 'system/services/apps/first-party-identities.json'
      - 'docs/contracts/verified-app-install-identity.json'
      - 'tests/test_native_app_install_identity.py'
      - 'tests/test_native_app_install_identity_producer.py'
      - 'tests/test_first_party_identity_inventory.mjs'
      - '.github/workflows/verified-app-install-identity.yml'
  push:
    branches: [main]
    paths:
      - 'system/surface/runtime/native_app_install_identity.py'
      - 'system/surface/runtime/native_app_install_identity_producer.py'
      - 'system/services/apps/first-party-identities.json'
      - 'docs/contracts/verified-app-install-identity.json'
      - 'tests/test_native_app_install_identity.py'
      - 'tests/test_native_app_install_identity_producer.py'
      - 'tests/test_first_party_identity_inventory.mjs'
      - '.github/workflows/verified-app-install-identity.yml'

permissions:
  contents: read

jobs:
  verified-install-identity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate source and contract syntax
        run: |
          set -euo pipefail
          python3 -m py_compile system/surface/runtime/native_app_install_identity.py
          python3 -m py_compile system/surface/runtime/native_app_install_identity_producer.py
          python3 -m json.tool system/services/apps/first-party-identities.json >/dev/null
          python3 -m json.tool docs/contracts/verified-app-install-identity.json >/dev/null

      - name: Prove first-party identity inventory matches component catalog
        run: node --test tests/test_first_party_identity_inventory.mjs

      - name: Prove verified identity receipt boundary and dormant producer
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_native_app_install_identity \
            tests.test_native_app_install_identity_producer \
            -v
