name: External source lock integration (Owner/Dev)
# Only proposes immutable OS lock PRs; never installs/activates/releases.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/source-integration/**'
      - 'tools/source_integration_test_adapter.py'
      - 'tests/test_source_integration_advance.py'
      - '.github/workflows/external-source-lock-integration.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: source-lock-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prove immutable source and no activation
        run: python3 -m unittest discover -s tests -p test_source_integration_advance.py -v
  source-candidates:
    if: github.event_name != 'pull_request'
    # Native GITHUB_TOKEN may update an existing owner PR and dispatch its CI;
    # a new PR requires a short-lived token minted from the scoped GitHub App.
    # Do not publish an orphan branch when Actions PR creation is disabled.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        owner: [surface, intelligence]
    steps:
      - name: Checkout canonical OS main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: os
      - name: Resolve upstream repository from OS lock
        id: external
        env:
          OWNER: ${{ matrix.owner }}
        run: |
          set -euo pipefail
          case "$OWNER" in
            surface) lock=docs/contracts/surface-source.json; workflow=validate-source-integration.yml ;;
            intelligence) lock=docs/contracts/intelligence-source.json; workflow=ci.yml ;;
            *) exit 2 ;;
          esac
          repository="$(jq -er '.source_repository' "os/$lock")"
          test "$repository" = "ordaxsystems/ordax-$OWNER"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "upstream_workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream main with full ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.external.outputs.repository }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - name: Validate exact source using OS materializer
        id: candidate
        env:
          OWNER: ${{ matrix.owner }}
          LOCK: ${{ steps.external.outputs.lock }}
        run: |
          set -euo pipefail
          # The upstream's main push CI is path-filtered. Ignore later
          # documentation-only commits, pinning the immutable source-changing
          # first-parent main commit that actually received the owner CI.
          source_sha="$(python3 os/tools/source-integration/advance.py \
            --root os --owner "$OWNER" --source-dir upstream --select-source)"
          test "$source_sha" = "$(git -C upstream rev-parse "$source_sha")"
          git -C upstream checkout --detach "$source_sha"
          python3 os/tools/source-integration/advance.py --root os --owner "$OWNER" --source-dir upstream --apply
          if git -C os diff --quiet -- "$LOCK"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            test "$(git -C os diff --name-only | wc -l)" -eq 1
            test "$(git -C os diff --name-only)" = "$LOCK"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Require successful upstream main CI at exact SHA
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ steps.external.outputs.repository }}
          UPSTREAM_WORKFLOW: ${{ steps.external.outputs.upstream_workflow }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$REPOSITORY/actions/workflows/$UPSTREAM_WORKFLOW/runs" \
            -f branch=main -f head_sha="$SHA" -f per_page=100 \
            | jq -e --arg sha "$SHA" '
              [.workflow_runs[] | select(
                .head_sha == $sha and .head_branch == "main" and
                .event == "push" and .status == "completed" and
                .conclusion == "success"
              )] | length > 0
            '
      - name: Resolve exactly one pending PR for the source owner
        if: steps.candidate.outputs.changed == 'true'
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ matrix.owner }}
          LOCK: ${{ steps.external.outputs.lock }}
        run: |
          set -euo pipefail
          # Paginate all PRs. Looking only at the first 100 can silently miss
          # an existing integration and create duplicate or conflicting PRs.
          matches="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -c --arg owner "$OWNER" --arg repo "$GITHUB_REPOSITORY" '
              [.[][] | select(.head.repo.full_name == $repo and .base.ref == "main")
               | select(.head.ref == ("automation/advance-" + $owner)
                        or (.head.ref | startswith("automation/advance-" + $owner + "-"))
                        or (.head.ref | startswith("fix/" + $owner + "-source-lock-")))
               | {number, branch:.head.ref, sha:.head.sha}]'
          )"
          count="$(jq 'length' <<< "$matches")"
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple owner integration PRs exist; manual reconciliation required"
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            number="$(jq -r '.[0].number' <<< "$matches")"
            branch="$(jq -r '.[0].branch' <<< "$matches")"
            head_sha="$(jq -r '.[0].sha' <<< "$matches")"
            # Update only a verified single-lock bot PR. Never modify an
            # unrelated work branch disguised with the integration prefix.
            gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json files |
              jq -e --arg lock "$LOCK" '([.files[].path] == [$lock])' > /dev/null
            echo "existing=true" >> "$GITHUB_OUTPUT"
            case "$branch" in
              fix/"$OWNER"-source-lock-*) echo "manual=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "manual=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
            echo "manual=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect scoped GitHub App credentials for a new PR
        if: steps.candidate.outputs.changed == 'true' && steps.pending.outputs.existing == 'false'
        id: integration_auth
        env:
          CLIENT_ID_PRESENT: ${{ secrets.ORDAX_INTEGRATION_APP_CLIENT_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.ORDAX_INTEGRATION_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          # Never pass an incomplete App identity to the action or fall back silently.
          if [ "$CLIENT_ID_PRESENT" != "$PRIVATE_KEY_PRESENT" ]; then
            echo "::error::GitHub App credentials must be configured as a pair"
            exit 1
          fi
          echo "app=$CLIENT_ID_PRESENT" >> "$GITHUB_OUTPUT"
      - name: Mint short-lived GitHub App installation token for a new PR
        if: steps.integration_auth.outputs.app == 'true'
        id: integration_app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ORDAX_INTEGRATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORDAX_INTEGRATION_APP_PRIVATE_KEY }}
          owner: ordaxsystems
          repositories: ordax-os
          permission-contents: write
          permission-pull-requests: write
          # Revocation on job completion is the action's default.
      - name: Create or fast-forward the single owner lock PR
        id: publish
        if: steps.candidate.outputs.changed == 'true'
        working-directory: os
        env:
          GH_TOKEN: ${{ steps.integration_app.outputs.token || github.token }}
          NATIVE_FALLBACK: ${{ steps.integration_app.outputs.token == '' }}
          EXISTING: ${{ steps.pending.outputs.existing }}
          MANUAL: ${{ steps.pending.outputs.manual }}
          PR_NUMBER: ${{ steps.pending.outputs.number }}
          PR_BRANCH: ${{ steps.pending.outputs.branch }}
          PR_HEAD_SHA: ${{ steps.pending.outputs.head_sha }}
          OWNER: ${{ matrix.owner }}
          LOCK: ${{ steps.external.outputs.lock }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          SOURCE_REPO: ${{ steps.external.outputs.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          # A native Actions token can push branches but this repository does
          # not authorize it to create pull requests. Preflight BEFORE git
          # switch/commit/push, so a missing integration credential never
          # leaves another orphan automation/advance-* branch behind.
          if [ "$EXISTING" != true ] && [ "$NATIVE_FALLBACK" = true ]; then
            echo "::error::New source-lock PR requires ORDAX_INTEGRATION_APP_CLIENT_ID and ORDAX_INTEGRATION_APP_PRIVATE_KEY; native GitHub Actions cannot create PRs. No branch was pushed."
            exit 1
          fi
          candidate_lock="$RUNNER_TEMP/ordax-owner-$OWNER-candidate-lock.json"
          test "$(git diff --name-only)" = "$LOCK"
          cp -- "$LOCK" "$candidate_lock"
          main_sha="$(git rev-parse HEAD)"
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$remote_main" ]; then
            echo "::error::OS main advanced during verification; next run must validate the current source lock"
            exit 1
          fi
          # Manually reviewed single-lock PRs are not automation write targets.
          # Accept only an exact already-reviewed immutable HEAD; a differing
          # candidate requires manual reconciliation rather than forced changes.
          if [ "$EXISTING" = true ] && [ "$MANUAL" = true ]; then
            if gh api "repos/$GITHUB_REPOSITORY/contents/$LOCK?ref=$PR_HEAD_SHA" \
                --jq .content | base64 --decode | cmp - "$candidate_lock"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "native=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Verified source is already pending in existing manual owner PR; no branch, PR or review text changed"
              exit 0
            fi
            echo "::error::Manual owner source-lock PR differs from verified candidate; reconcile before proceeding (no branch was pushed)"
            exit 1
          fi
          git config user.name "ordax-source-integration[bot]"
          git config user.email "ordax-source-integration@users.noreply.github.com"
          gh auth setup-git
          recovering=false
          if [ "$EXISTING" = true ]; then
            branch="$PR_BRANCH"
            git restore -- "$LOCK"
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -c "$branch" "refs/remotes/origin/$branch"
            if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
              echo "::error::Pending PR moved while being checked; refuse stale update"
              exit 1
            fi
            cp -- "$candidate_lock" "$LOCK"
            if git diff --quiet -- "$LOCK"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "native=false" >> "$GITHUB_OUTPUT"
              echo "Owner PR already contains the verified source SHA"
              exit 0
            fi
          else
            # Each upstream candidate has one immutable branch identity.
            # A failed gh pr create after git push may leave that branch
            # without a PR. Recover only an exact verified, never-reviewed
            # single-lock commit; do not reopen rejected/closed PRs.
            branch="automation/advance-$OWNER-$SOURCE_SHA"
            git switch -c "$branch"
            existing_tip="$(git ls-remote --heads origin "refs/heads/$branch")"
            if [ -n "$existing_tip" ]; then
              existing_sha="$(printf '%s\n' "$existing_tip" | cut -f1)"
              existing_ref="$(printf '%s\n' "$existing_tip" | cut -f2)"
              test "$existing_ref" = "refs/heads/$branch"
              git fetch --no-tags origin "refs/heads/$branch"
              if ! git merge-base --is-ancestor "$existing_sha" "$main_sha"; then
                # Exact single-parent ancestry and exact lock bytes are
                # mandatory before recovering a stranded bot push.
                parents="$(git rev-list --parents -n 1 "$existing_sha")"
                if [ "$(wc -w <<< "$parents")" -ne 2 ]; then
                  echo "::error::Unmerged owner branch is not a single-parent commit; refuse recovery"
                  exit 1
                fi
                parent_sha="$(awk '{print $2}' <<< "$parents")"
                if ! git merge-base --is-ancestor "$parent_sha" "$main_sha" \
                    || [ "$(git diff --name-only "$parent_sha" "$existing_sha")" != "$LOCK" ] \
                    || ! git show "$existing_sha:$LOCK" | cmp - "$candidate_lock"; then
                  echo "::error::Unmerged owner branch differs from verified lock/ancestry; refuse recovery"
                  exit 1
                fi
                # Closed/unmerged and already-merged PR heads must not be
                # silently recreated. Server-side head filter plus pagination.
                prior_count="$(gh api --paginate --slurp -X GET \
                  "repos/$GITHUB_REPOSITORY/pulls" -f state=all \
                  -f head="ordaxsystems:$branch" -f per_page=100 | \
                  jq -er --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" \
                    '[.[][] | select(.head.repo.full_name == $repo and .head.ref == $branch)] | length')"
                if [ "$prior_count" -ne 0 ]; then
                  echo "::error::Owner branch has PR history; refuse re-creation of a reviewed branch"
                  exit 1
                fi
                remote_tip="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
                if [ "$remote_tip" != "$existing_sha" ]; then
                  echo "::error::Owner recovery branch moved during verification"
                  exit 1
                fi
                recovering=true
                echo "::notice::Recovered only the exact stranded source-lock branch; creating its missing PR"
              else
                echo "::notice::Previously merged owner branch will fast-forward"
              fi
            fi
          fi
          if [ "$recovering" != true ]; then
            git add -- "$LOCK"
            test "$(git diff --cached --name-only)" = "$LOCK"
            git commit -m "chore($OWNER): integrate source ${SOURCE_SHA:0:12}"
            # Only a normal fast-forward is permitted; no force-push.
            git push origin "HEAD:refs/heads/$branch"
          fi
          # A recovered branch was already pushed; only the missing PR is
          # created after verifying no past PR ever used that exact head.
          printf -v body 'Owner: %s@%s\n\nOnly %s changed. Exact upstream main CI and existing OS materializer passed. No physical update, Stable release, Intelligence activation or second updater.\n\nMerge only after OS consumer tests, health and rollback gates pass.' \
            "$SOURCE_REPO" "$SOURCE_SHA" "$LOCK"
          if [ "$EXISTING" = true ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --title "chore($OWNER): integrate verified source" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore($OWNER): integrate verified source" --body "$body"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$NATIVE_FALLBACK" = true ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Canonical consumer workflows will validate the new immutable PR head"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch original consumer CI for GitHub-token-created/updated PR
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ matrix.owner }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          set -euo pipefail
          workflows=(foundation.yml)
          case "$OWNER" in
            surface)
              workflows+=(surface-source-consumer.yml owner-surface-source.yml)
              ;;
            intelligence)
              workflows+=(intelligence-source.yml owner-intelligence-source.yml)
              ;;
            *) exit 2 ;;
          esac
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done
          echo "Dispatched existing consumer CI on $BRANCH; no auto-merge or physical promotion."
