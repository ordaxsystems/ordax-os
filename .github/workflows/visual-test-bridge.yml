name: Visual Test Bridge (Windows, isolated)
on:
  pull_request:
    paths:
      - 'tools/visual-test-bridge/**'
      - '.github/workflows/visual-test-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-test-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/visual-test-bridge/package-lock.json
      - name: Install locked, development-only bridge dependencies
        shell: pwsh
        run: npm ci --prefix tools/visual-test-bridge --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Validate bridge security and image difference contracts
        shell: pwsh
        run: npm test --prefix tools/visual-test-bridge
      - name: Provision pinned headless Chromium for bridge adapter integration
        working-directory: tools/visual-test-bridge
        shell: pwsh
        run: npx playwright install chromium
      - name: Exercise real headless Chromium adapter (not OrdaX E2E)
        shell: pwsh
        run: node --test tools/visual-test-bridge/bridge.browser.test.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-test-bridge-adapter-evidence
          path: out/visual-test-bridge/**
          if-no-files-found: ignore
          retention-days: 14

  installed-desktop:
    name: Isolated installed OrdaX Desktop (20 full visual E2E journeys)
    needs: bridge
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/visual-test-bridge/package-lock.json
      - name: Install visual adapter tooling without downloading a second Chromium
        run: npm ci --prefix tools/visual-test-bridge --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Resolve latest completed, successful main-only Windows NSIS source
        shell: pwsh
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'X-GitHub-Api-Version'='2022-11-28'}
          $repo=$env:GITHUB_REPOSITORY
          if($repo -cne 'ordaxsystems/ordax-os'){throw 'Unexpected repository'}
          $runs=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs?branch=main&event=push&per_page=100" -Headers $headers
          $source=@($runs.workflow_runs | Where-Object {
            $_.name -like 'Windows Desktop Dev*' -and $_.head_branch -ceq 'main' -and
            $_.status -eq 'completed' -and $_.conclusion -eq 'success' -and
            $_.head_repository.full_name -ceq $repo
          } | Select-Object -First 1)
          if($source.Count -ne 1){throw 'No successful trusted Windows Desktop main workflow run'}
          $run=$source[0]
          if($run.head_sha -cnotmatch '^[0-9a-f]{40}
          $artifacts=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$($run.id)/artifacts" -Headers $headers
          $artifact=@($artifacts.artifacts | Where-Object {
            $_.name -ceq 'ordax-os-desktop-dev-alpha-windows' -and $_.expired -eq $false -and
            $_.size_in_bytes -gt 10000000 -and $_.digest -match '^sha256:[0-9a-f]{64}$'
          })
          if($artifact.Count -ne 1){throw 'Missing unique verified NSIS artifact'}
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "source_sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          Write-Output "VISUAL_INSTALLED_INPUT_MAIN_SHA=$($run.head_sha)"
          Write-Output "VISUAL_INSTALLED_INPUT_RUN_ID=$($run.id)"
      - name: Download one existing, already-compiled NSIS from main
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ordax-os-desktop-dev-alpha-windows
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: out/visual-test-bridge/installer
      - name: Install verified Desktop in isolated runner and run 20 real full navigation journeys
        shell: pwsh
        env:
          ORDAX_VISUAL_SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          ORDAX_VISUAL_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $installers=@(Get-ChildItem out/visual-test-bridge/installer -Filter '*.exe' -File)
          if($installers.Count -ne 1){throw 'Expected exactly one NSIS installer'}
          & .\tools\visual-test-bridge\installed-e2e.ps1 -Installer $installers[0].FullName -ExpectedSourceSha $env:ORDAX_VISUAL_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'Installed OrdaX visual suite failed'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-test-bridge-installed-windows-evidence
          path: |
            out/visual-test-bridge/installed/**
          if-no-files-found: warn
          retention-days: 7
){throw 'Invalid installed source SHA'}
          # Cheap preflight on this EXACT installed-source SHA, before fetching a 600MB+ NSIS.
          # This is NOT a substitute for the actual 20 full Playwright journeys.
          # The First Run owner already implements the canonical four-stage Desktop mode
          # in PR #2343. Never fake that mode in the renderer or consume a draft artifact.
          $mainPath='system/composition/native/main.mjs'
          $committed=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/contents/$mainPath?ref=$($run.head_sha)" -Headers $headers
          if($committed.type -cne 'file' -or $committed.encoding -cne 'base64'){throw 'Installed Native composition source not attested'}
          $contents=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($committed.content -replace '\s','')))
          if(-not $contents.Contains('productMode: windowsDesktopHost ? "desktop" : "usb"')){
            throw "Installed NSIS source $($run.head_sha) predates canonical Desktop First Run; OS PR #2343 must merge and pass Windows release gates before costly installed visual E2E"
          }
          $artifacts=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$($run.id)/artifacts" -Headers $headers
          $artifact=@($artifacts.artifacts | Where-Object {
            $_.name -ceq 'ordax-os-desktop-dev-alpha-windows' -and $_.expired -eq $false -and
            $_.size_in_bytes -gt 10000000 -and $_.digest -match '^sha256:[0-9a-f]{64}$'
          })
          if($artifact.Count -ne 1){throw 'Missing unique verified NSIS artifact'}
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "source_sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          Write-Output "VISUAL_INSTALLED_INPUT_MAIN_SHA=$($run.head_sha)"
          Write-Output "VISUAL_INSTALLED_INPUT_RUN_ID=$($run.id)"
      - name: Download one existing, already-compiled NSIS from main
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ordax-os-desktop-dev-alpha-windows
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: out/visual-test-bridge/installer
      - name: Install verified Desktop in isolated runner and run 20 real clean E2Es
        shell: pwsh
        env:
          ORDAX_VISUAL_SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          ORDAX_VISUAL_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $installers=@(Get-ChildItem out/visual-test-bridge/installer -Filter '*.exe' -File)
          if($installers.Count -ne 1){throw 'Expected exactly one NSIS installer'}
          & .\tools\visual-test-bridge\installed-e2e.ps1 -Installer $installers[0].FullName -ExpectedSourceSha $env:ORDAX_VISUAL_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'Installed OrdaX visual suite failed'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-test-bridge-installed-windows-evidence
          path: |
            out/visual-test-bridge/installed/**
          if-no-files-found: warn
          retention-days: 7
