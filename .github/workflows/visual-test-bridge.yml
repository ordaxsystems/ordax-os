name: Visual Test Bridge (Windows, isolated)
on:
  pull_request:
    paths:
      - 'tools/visual-test-bridge/**'
      - '.github/workflows/visual-test-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-test-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/visual-test-bridge/package-lock.json
      - name: Install locked, development-only bridge dependencies
        shell: pwsh
        run: npm ci --prefix tools/visual-test-bridge --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Validate bridge security and image difference contracts
        shell: pwsh
        run: npm test --prefix tools/visual-test-bridge
      - name: Provision pinned headless Chromium for bridge adapter integration
        working-directory: tools/visual-test-bridge
        shell: pwsh
        run: npx playwright install chromium
      - name: Exercise real headless Chromium adapter (not OrdaX E2E)
        shell: pwsh
        run: node --test tools/visual-test-bridge/bridge.browser.test.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-test-bridge-adapter-evidence
          path: out/visual-test-bridge/**
          if-no-files-found: ignore
          retention-days: 14
