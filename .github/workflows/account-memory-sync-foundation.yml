name: Account Memory Sync Foundation

on:
  push:
    branches: [main]
    paths:
      - 'docs/ACCOUNT-SYNC-AND-PLANS.md'
      - 'docs/contracts/foundation.json'
      - 'docs/contracts/memory.json'
      - 'docs/contracts/sync-model.json'
      - 'infra/supabase/functions/ordax-account-gateway/memory-sync-policy.mjs'
      - 'infra/supabase/product/migrations/20260929122500_account_memory_sync_guard_v1.sql'
      - 'system/contracts/memory.mjs'
      - 'system/contracts/sync-state-store.mjs'
      - 'system/contracts/sync-transport.mjs'
      - 'system/services/memory/**'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-runtime.mjs'
      - 'tests/test_account_memory_backend_guard.py'
      - 'tests/test_account_memory_gateway_policy.mjs'
      - 'tests/test_account_memory_sync_runtime.mjs'
      - 'tests/test_account_memory_sync_state.mjs'
      - 'tests/test_account_memory_sync_orchestration.mjs'
      - 'tests/test_account_sync_runtime.mjs'
      - 'tests/test_sync_model_contract.py'
      - '.github/workflows/account-memory-sync-foundation.yml'
  pull_request:
    paths:
      - 'docs/ACCOUNT-SYNC-AND-PLANS.md'
      - 'docs/contracts/foundation.json'
      - 'docs/contracts/memory.json'
      - 'docs/contracts/sync-model.json'
      - 'infra/supabase/functions/ordax-account-gateway/memory-sync-policy.mjs'
      - 'infra/supabase/product/migrations/20260929122500_account_memory_sync_guard_v1.sql'
      - 'system/contracts/memory.mjs'
      - 'system/contracts/sync-state-store.mjs'
      - 'system/contracts/sync-transport.mjs'
      - 'system/services/memory/**'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-runtime.mjs'
      - 'tests/test_account_memory_backend_guard.py'
      - 'tests/test_account_memory_gateway_policy.mjs'
      - 'tests/test_account_memory_sync_runtime.mjs'
      - 'tests/test_account_memory_sync_state.mjs'
      - 'tests/test_account_memory_sync_orchestration.mjs'
      - 'tests/test_account_sync_runtime.mjs'
      - 'tests/test_sync_model_contract.py'
      - '.github/workflows/account-memory-sync-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-memory-sync-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate Memory sync contracts and source syntax
        run: |
          set -euo pipefail
          node --check system/contracts/memory.mjs
          node --check system/contracts/sync-state-store.mjs
          node --check system/contracts/sync-transport.mjs
          node --check system/services/sync/account-memory-runtime.mjs
          node --check system/services/sync/account-runtime.mjs
          node --check infra/supabase/functions/ordax-account-gateway/memory-sync-policy.mjs
          node --check tests/test_account_memory_gateway_policy.mjs
          node --check tests/test_account_memory_sync_runtime.mjs
          node --check tests/test_account_memory_sync_state.mjs
          node --check tests/test_account_memory_sync_orchestration.mjs
          python -m py_compile tests/test_account_memory_backend_guard.py
          python -m json.tool docs/contracts/foundation.json >/dev/null
          python -m json.tool docs/contracts/memory.json >/dev/null
          python -m json.tool docs/contracts/sync-model.json >/dev/null

      - name: Run Memory sync foundation tests
        run: |
          set -euo pipefail
          node --test tests/test_account_memory_gateway_policy.mjs
          node --test tests/test_account_memory_sync_runtime.mjs
          node --test tests/test_account_memory_sync_state.mjs
          node --test tests/test_account_memory_sync_orchestration.mjs
          node --test tests/test_account_sync_runtime.mjs
          python -m unittest tests.test_account_memory_backend_guard -v
          python -m unittest tests.test_sync_model_contract -v
