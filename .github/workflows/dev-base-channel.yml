name: Development Base Channel

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/independent-base/**'
      - 'bootstrap/base/firmware_policy.py'
      - 'docs/contracts/hardware-support-matrix.json'
      - 'bootstrap/dev-base/**'
      - 'bootstrap/recovery/**'
      - 'tools/dev-base-channel/**'
      - 'system/services/base-update/dev_channel.py'
      - 'system/services/base-update/dev-impact.awk'
      - 'system/services/base-update/dev-helper-manifest.tsv'
      - 'tools/ci/portable_component_cache.py'
      - 'tests/test_dev_base_channel.py'
      - 'tests/test_portable_component_cache.py'
      - 'tests/test_creator_kernel_reuse_workflows.py'
      - '.github/workflows/dev-base-channel.yml'
  pull_request:
    paths:
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/independent-base/**'
      - 'bootstrap/base/firmware_policy.py'
      - 'docs/contracts/hardware-support-matrix.json'
      - 'bootstrap/dev-base/**'
      - 'bootstrap/recovery/**'
      - 'tools/dev-base-channel/**'
      - 'system/services/base-update/dev_channel.py'
      - 'system/services/base-update/dev-impact.awk'
      - 'system/services/base-update/dev-helper-manifest.tsv'
      - 'tools/ci/portable_component_cache.py'
      - 'tests/test_dev_base_channel.py'
      - 'tests/test_portable_component_cache.py'
      - 'tests/test_creator_kernel_reuse_workflows.py'
      - '.github/workflows/dev-base-channel.yml'
  workflow_dispatch:
    inputs:
      publish_owner_candidate:
        description: 'Publish an exact-commit development Base for isolated Owner USB physical validation'
        required: true
        default: false
        type: boolean
      owner_validation_pr:
        description: 'Draft PR number for non-main validation; omit on main'
        required: false
        type: number

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate development Base channel
        run: |
          set -euo pipefail
          python tools/dev-base-channel/build.py check
          python -m unittest tests.test_dev_base_channel -v

      - name: Install disposable rootfs selector proof dependency
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox-static

      - name: Prove versioned rootfs pivot and invalid-candidate rejection
        run: |
          set -euo pipefail
          sudo bash tools/dev-base-channel/prove-rootfs-selector.sh

      - name: Classify complete main push before entering the heavy producer queue
        id: scope
        if: github.event_name == 'push'
        env:
          ORDAX_BEFORE_SHA: ${{ github.event.before }}
          ORDAX_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile

          before = os.environ["ORDAX_BEFORE_SHA"]
          head = os.environ["ORDAX_HEAD_SHA"]
          publish = True  # Missing history, API truncation or errors fail closed.
          try:
              valid = lambda s: re.fullmatch(r"[0-9a-f]{40}", s) and int(s, 16) != 0
              if not valid(before) or not valid(head):
                  raise ValueError("invalid push revision")
              current = subprocess.check_output(["git", "rev-parse", "HEAD"], timeout=10).decode().strip()
              if current != head:
                  raise ValueError("checkout differs from push HEAD")
              probe = subprocess.run(
                  ["git", "cat-file", "-e", before + "^{commit}"], capture_output=True, timeout=10
              )
              if probe.returncode == 0:
                  output = subprocess.check_output(
                      ["git", "diff", "--name-only", "-z", "--no-renames", before, head, "--"],
                      timeout=30,
                  )
                  paths = [s for s in output.decode("utf-8").split("\0") if s]
              else:
                  # Shallow history: compare the exact push range using the
                  # authenticated read-only GitHub API, never only HEAD^.
                  repo = os.environ["GITHUB_REPOSITORY"]
                  if re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) is None:
                      raise ValueError("invalid repository")
                  result = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/compare/{before}...{head}"], timeout=40
                  )
                  data = json.loads(result.decode("utf-8"))
                  files = data.get("files")
                  if (
                      not isinstance(files, list)
                      or len(files) >= 300
                      or not isinstance(data.get("total_commits"), int)
                      or data["total_commits"] > 250
                      or data.get("base_commit", {}).get("sha") != before
                      or data.get("head_commit", {}).get("sha") != head
                      or data.get("merge_base_commit", {}).get("sha") != before
                      or data.get("status") != "ahead"
                  ):
                      raise ValueError("unverifiable/truncated push comparison")
                  paths = []
                  for file in files:
                      paths.append(file["filename"])
                      if file.get("previous_filename"):
                          paths.append(file["previous_filename"])
              if not paths:
                  raise ValueError("empty push comparison")
              # Consume the same policy as the running Owner Supervisor.
              # GitHub comparison paths must be losslessly representable as
              # lines; ambiguous input falls through to the conservative gate.
              if any(not isinstance(path, str) or "\n" in path or "\r" in path
                     for path in paths):
                  raise ValueError("invalid changed path")
              manifest = subprocess.check_output(
                  ["git", "show", head + ":system/services/base-update/dev-helper-manifest.tsv"],
                  timeout=10,
              )
              with tempfile.TemporaryDirectory() as temp:
                  from pathlib import Path
                  manifest_path = Path(temp) / "dev-helper-manifest.tsv"
                  manifest_path.write_bytes(manifest)
                  impact = subprocess.check_output(
                      ["awk", "-f", "system/services/base-update/dev-impact.awk", str(manifest_path), "-"],
                      input=("\n".join(paths) + "\n").encode("utf-8"), timeout=20,
                  ).decode("ascii").strip()
              if impact not in ("0", "1"):
                  raise ValueError("invalid canonical Base impact response")
              publish = impact == "1"
          except (OSError, ValueError, KeyError, TypeError, AttributeError, UnicodeError, subprocess.SubprocessError) as exc:
              print("DEV_BASE_SCOPE=UNVERIFIABLE:" + type(exc).__name__)
              publish = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"publish={str(publish).lower()}\n")
          print("DEV_BASE_BYTES_CHANGED=" + str(publish).upper())
          PY

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.publish == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.publish_owner_candidate == true &&
      github.actor == 'ordaxos-admin')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Serialize cold-cache Owner component producers for one exact source.
    concurrency:
      group: ordax-surface-producer-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Authorize exact Owner validation dispatch or confirmed main push
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = 'workflow_dispatch' ]; then
            test "${GITHUB_ACTOR:-}" = 'ordaxos-admin'
            if [ "${GITHUB_REF:-}" = 'refs/heads/main' ]; then
              # Authorized manual backfill for a missing exact-main binary release.
              # Build nothing if the immutable exact SHA was already published.
              current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
              test "$current_main" = "$GITHUB_SHA"
              tag="ordax-dev-base-$GITHUB_SHA"
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
                echo 'DEV_BASE_OWNER_BACKFILL=ALREADY_PUBLISHED'
                echo 'publish=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "DEV_BASE_OWNER_MAIN_BACKFILL=$GITHUB_SHA"
              echo 'DEV_BASE_OWNER_VALIDATION_EXACT_HEAD=PASS'
            else
              pr='${{ inputs.owner_validation_pr }}'
              case "$pr" in
                ''|*[!0-9]*) echo 'invalid owner validation PR number' >&2; exit 1 ;;
              esac
              pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
              test "$(jq -r '.head.sha' <<<"$pr_json")" = "$GITHUB_SHA"
              test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
              test "$(jq -r '.base.ref' <<<"$pr_json")" = 'main'
              test "$(jq -r '.draft' <<<"$pr_json")" = 'true'
              echo "DEV_BASE_OWNER_VALIDATION_PR=$pr"
              echo 'DEV_BASE_OWNER_VALIDATION_EXACT_HEAD=PASS'
            fi
          else
            test "${GITHUB_EVENT_NAME:-}" = 'push'
            test "${GITHUB_REF:-}" = 'refs/heads/main'
          fi
          # This job was admitted only after verify's fail-closed range gate.
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo 'DEV_BASE_BYTES_CHANGED=true'

      - name: Set up Python
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install measured Base build dependencies
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config binutils bzip2 \
            e2fsprogs util-linux erofs-utils gawk cpio unzip rsync \
            file wget curl patch gettext musl-tools

      - name: Resolve reusable kernel fingerprint
        if: steps.changes.outputs.publish == 'true'
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dev-base-channel/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        if: steps.changes.outputs.publish == 'true'
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build kernel candidate on verified cache miss
        if: steps.changes.outputs.publish == 'true' && steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel component and exact integration binding
        if: steps.changes.outputs.publish == 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/dev-base-channel/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py out/kernel
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir out/kernel \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir out/kernel \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.changes.outputs.publish == 'true' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Restore verified Owner Buildroot for Development Base
        if: steps.changes.outputs.publish == 'true'
        id: owner-base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/dev-rootfs
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-independent-base-owner-${{ steps.component-fingerprints.outputs.independent_base_owner }}

      - name: Build exact-commit development Base and initramfs
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          module_tar="$(find out/kernel -maxdepth 1 -type f -name 'kernel-modules-*.tar' -print -quit)"
          test -n "$module_tar"
          # The native Owner USB mountattr helper compiles against the exact
          # headers_install exported by the pinned initramfs kernel builder.
          # Build that canonical UAPI before building the development rootfs.
          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify
          test -f out/initramfs-work/kernel-uapi-install/include/linux/mount.h

          # The immutable Development Base channel consumes exactly the same
          # Buildroot Owner output and kernel module evidence as Creator Dev.
          # Do not construct an Alpine/proot rootfs or unpack/repack the tar.
          mkdir -p "$RUNNER_TEMP/dev-base-channel/owner-receipts"
          export ORDAX_SOURCE_COMMIT="$GITHUB_SHA"
          export ORDAX_HOST_PYTHON="$(command -v python3)"
          export ORDAX_KERNEL_MODULES_ARCHIVE="$(realpath "$module_tar")"
          export ORDAX_KERNEL_MODULES_RECEIPT="$RUNNER_TEMP/dev-base-channel/owner-receipts/kernel-module-selection.json"
          export ORDAX_FIRMWARE_COVERAGE_RECEIPT="$RUNNER_TEMP/dev-base-channel/owner-receipts/firmware-coverage.json"
          owner_cache_hit='${{ steps.owner-base-cache.outputs.cache-hit }}'
          if [ "$owner_cache_hit" != true ]; then
            owner_cache_hit=false
            echo 'ORDAX_OWNER_BASE_CACHE_MISS=build-affecting-input-or-environment'
            # The canonical Buildroot owner forbids building beneath ROOT.
            # Produce outside the checkout, then atomically expose its verified
            # artifacts at the pre-existing channel/cache consumer path.
            owner_build_out="$RUNNER_TEMP/dev-base-channel/owner-build-output"
            test ! -e "$owner_build_out"
            test ! -e out/dev-rootfs
            sudo -E python3 bootstrap/independent-base/build.py build \
              --profile owner-development --out "$owner_build_out" \
              --cache "$RUNNER_TEMP/dev-base-channel/buildroot-cache" --jobs 4
            sudo chown -R "$(id -u):$(id -g)" "$owner_build_out"
            python3 bootstrap/independent-base/build.py verify \
              --profile owner-development --out "$owner_build_out"
            mkdir -p out
            mv "$owner_build_out" out/dev-rootfs
          fi
          python3 bootstrap/independent-base/build.py verify \
            --profile owner-development --out out/dev-rootfs
          # post-build publishes the independent module selection receipt at
          # ORDAX_KERNEL_MODULES_RECEIPT, not into the Buildroot output root.
          # On a verified Buildroot cache hit post-build does not run; derive
          # the same receipt from the archived rootfs, then reverify it against
          # the canonical kernel archive and policy in module_parity.py.
          embedded_selection="$RUNNER_TEMP/dev-base-channel/owner-receipts/kernel-module-selection-embedded.json"
          python3 bootstrap/independent-base/module_parity.py extract-selection --rootfs-tar out/dev-rootfs/rootfs.tar --out "$embedded_selection"
          test -s "$embedded_selection"
          if [ -e "$ORDAX_KERNEL_MODULES_RECEIPT" ]; then
            test ! -L "$ORDAX_KERNEL_MODULES_RECEIPT"
            cmp -s "$ORDAX_KERNEL_MODULES_RECEIPT" "$embedded_selection"
          else
            cp "$embedded_selection" "$ORDAX_KERNEL_MODULES_RECEIPT"
          fi
          parity="out/dev-rootfs/kernel-module-parity.json"
          test ! -L "$parity"
          rm -f "$parity"
          python3 bootstrap/independent-base/module_parity.py verify \
            --kernel-modules "$ORDAX_KERNEL_MODULES_ARCHIVE" \
            --selection-receipt "$ORDAX_KERNEL_MODULES_RECEIPT" \
            --rootfs-tar "out/dev-rootfs/rootfs.tar" \
            --base-provenance "out/dev-rootfs/provenance.json" \
            --out "$parity"
          if [ "$owner_cache_hit" = false ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component independent-base-owner --out-dir out/dev-rootfs \
              --source-commit "$GITHUB_SHA" \
              > "$RUNNER_TEMP/dev-base-channel/owner-receipts/owner-base-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component independent-base-owner --out-dir out/dev-rootfs \
            --integration-commit "$GITHUB_SHA" --cache-hit "$owner_cache_hit" \
            --receipt "$RUNNER_TEMP/dev-base-channel/owner-receipts/owner-base-component-reuse.json"
          echo "ORDAX_OWNER_BASE_CACHE_HIT=$owner_cache_hit"

      # Cache only after kernel parity and provenance have been verified;
      # downstream publication failures must not trigger a new Buildroot run.
      - name: Save verified Owner Buildroot for other consumers
        if: steps.changes.outputs.publish == 'true' && steps.owner-base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/dev-rootfs
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-independent-base-owner-${{ steps.component-fingerprints.outputs.independent_base_owner }}

      - name: Prove and assemble exact-commit development Base
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test -s out/dev-rootfs/provenance.json
          test -s out/dev-rootfs/rootfs.tar
          python3 tools/dev-base-channel/prove_independent_rootfs.py \
            --rootfs out/dev-rootfs/rootfs.tar \
            --provenance out/dev-rootfs/provenance.json \
            --expected-commit "$GITHUB_SHA" \
            --reuse-receipt "$RUNNER_TEMP/dev-base-channel/owner-receipts/owner-base-component-reuse.json" \
            --receipt "$RUNNER_TEMP/dev-base-channel/owner-receipts/channel-compatibility.json"

          python tools/dev-base-channel/build.py build \
            --source-commit "$GITHUB_SHA" \
            --kernel-dir out/kernel \
            --kernel-reuse-receipt "$RUNNER_TEMP/dev-base-channel/metadata/kernel-component-reuse.json" \
            --owner-reuse-receipt "$RUNNER_TEMP/dev-base-channel/owner-receipts/owner-base-component-reuse.json" \
            --initramfs-dir out/initramfs \
            --rootfs-dir out/dev-rootfs \
            --out-dir out/dev-base
          python tools/dev-base-channel/build.py verify --out-dir out/dev-base

      - name: Publish immutable exact-commit Base candidate
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='ordaxsystems/ordax-os'
          tag="ordax-dev-base-$GITHUB_SHA"
          out='out/dev-base'

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "OrdaX Development Base $GITHUB_SHA" \
              --prerelease \
              --notes 'Git-first development Base candidate. Exact source commit plus SHA-256 bound kernel, initramfs and development rootfs. Kernel/initramfs activation uses the inactive A/B slot; rootfs activation is slot-coupled to the matching one-shot A/B candidate and inherits the existing health promotion gate.'
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for asset in dev-base.json vmlinuz initrd.gz rootfs.tar; do
            if gh release view "$tag" --repo "$repo" --json assets \
                --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release download "$tag" --repo "$repo" \
                --pattern "$asset" --dir "$tmp"
              local_hash="$(sha256sum "$out/$asset" | awk '{print $1}')"
              remote_hash="$(sha256sum "$tmp/$asset" | awk '{print $1}')"
              test "$local_hash" = "$remote_hash"
              rm -f "$tmp/$asset"
            else
              gh release upload "$tag" "$out/$asset#$asset" --repo "$repo"
            fi
          done

          echo "DEV_BASE_TAG=$tag"
          echo "DEV_BASE_SOURCE_COMMIT=$GITHUB_SHA"
          echo 'DEV_BASE_MANUAL_USB_REWRITE_REQUIRED=NO'
          echo 'DEV_BASE_ACTIVATION=INACTIVE_SLOT_NEXT_BOOT'
          echo 'DEV_BASE_ROOTFS_CANDIDATE=YES'
          echo 'DEV_BASE_ROOTFS_ACTIVATION=SLOT_COUPLED_ONE_SHOT'
