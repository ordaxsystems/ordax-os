name: Development Base Channel

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/dev-base/**'
      - 'bootstrap/recovery/**'
      - 'tools/dev-base-channel/**'
      - 'system/services/base-update/dev_channel.py'
      - 'tools/ci/portable_component_cache.py'
      - 'tests/test_dev_base_channel.py'
      - 'tests/test_portable_component_cache.py'
      - 'tests/test_creator_kernel_reuse_workflows.py'
      - '.github/workflows/dev-base-channel.yml'
  pull_request:
    paths:
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/dev-base/**'
      - 'bootstrap/recovery/**'
      - 'tools/dev-base-channel/**'
      - 'system/services/base-update/dev_channel.py'
      - 'tools/ci/portable_component_cache.py'
      - 'tests/test_dev_base_channel.py'
      - 'tests/test_portable_component_cache.py'
      - 'tests/test_creator_kernel_reuse_workflows.py'
      - '.github/workflows/dev-base-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate development Base channel
        run: |
          set -euo pipefail
          python tools/dev-base-channel/build.py check
          python -m unittest tests.test_dev_base_channel -v

      - name: Install disposable rootfs selector proof dependency
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox-static

      - name: Prove versioned rootfs pivot and invalid-candidate rejection
        run: |
          set -euo pipefail
          sudo bash tools/dev-base-channel/prove-rootfs-selector.sh

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Detect Base-byte changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            publish=true
          else
            while IFS= read -r path; do
              case "$path" in
                bootstrap/kernel/candidates/*|bootstrap/kernel/candidate_pipeline.py|bootstrap/kernel/update_engine.py|bootstrap/kernel/module_archive.py)
                  ;;
                bootstrap/dev-base/ordax-dev-init|bootstrap/dev-base/ordax-diagnose|bootstrap/dev-base/ordax-network|bootstrap/dev-base/ordax-pull|bootstrap/dev-base/ordax-rollback|bootstrap/dev-base/ordax-run|bootstrap/recovery/entrypoint)
                  ;;
                bootstrap/kernel/*|bootstrap/initramfs/*|bootstrap/dev-base/*|bootstrap/recovery/*|tools/dev-base-channel/*)
                  publish=true
                  break
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD --)
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "DEV_BASE_BYTES_CHANGED=$publish"

      - name: Set up Python
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install measured Base build dependencies
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools binutils bzip2 \
            e2fsprogs util-linux proot

      - name: Resolve reusable kernel fingerprint
        if: steps.changes.outputs.publish == 'true'
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dev-base-channel/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        if: steps.changes.outputs.publish == 'true'
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build kernel candidate on verified cache miss
        if: steps.changes.outputs.publish == 'true' && steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel component and exact integration binding
        if: steps.changes.outputs.publish == 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/dev-base-channel/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py out/kernel
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir out/kernel \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir out/kernel \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.changes.outputs.publish == 'true' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build exact-commit development Base and initramfs
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          module_tar="$(find out/kernel -maxdepth 1 -type f -name 'kernel-modules-*.tar' -print -quit)"
          test -n "$module_tar"
          sudo env GITHUB_SHA="$GITHUB_SHA" \
            python bootstrap/dev-base/build.py \
              --kernel-modules "$module_tar" \
              --out-dir out/dev-rootfs
          sudo chown -R "$(id -u):$(id -g)" out/dev-rootfs
          test -f out/dev-rootfs/provenance.json
          test -d out/dev-rootfs/rootfs

          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify

          python tools/dev-base-channel/build.py build \
            --source-commit "$GITHUB_SHA" \
            --kernel-dir out/kernel \
            --initramfs-dir out/initramfs \
            --rootfs-dir out/dev-rootfs \
            --out-dir out/dev-base
          python tools/dev-base-channel/build.py verify --out-dir out/dev-base

      - name: Publish immutable exact-commit Base candidate
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='ordaxsystems/ordax-os'
          tag="ordax-dev-base-$GITHUB_SHA"
          out='out/dev-base'

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "OrdaX Development Base $GITHUB_SHA" \
              --prerelease \
              --notes 'Git-first development Base candidate. Exact source commit plus SHA-256 bound kernel, initramfs and development rootfs. Kernel/initramfs activation uses the inactive A/B slot; rootfs activation is slot-coupled to the matching one-shot A/B candidate and inherits the existing health promotion gate.'
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for asset in dev-base.json vmlinuz initrd.gz rootfs.tar; do
            if gh release view "$tag" --repo "$repo" --json assets \
                --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release download "$tag" --repo "$repo" \
                --pattern "$asset" --dir "$tmp"
              local_hash="$(sha256sum "$out/$asset" | awk '{print $1}')"
              remote_hash="$(sha256sum "$tmp/$asset" | awk '{print $1}')"
              test "$local_hash" = "$remote_hash"
              rm -f "$tmp/$asset"
            else
              gh release upload "$tag" "$out/$asset#$asset" --repo "$repo"
            fi
          done

          echo "DEV_BASE_TAG=$tag"
          echo "DEV_BASE_SOURCE_COMMIT=$GITHUB_SHA"
          echo 'DEV_BASE_MANUAL_USB_REWRITE_REQUIRED=NO'
          echo 'DEV_BASE_ACTIVATION=INACTIVE_SLOT_NEXT_BOOT'
          echo 'DEV_BASE_ROOTFS_CANDIDATE=YES'
          echo 'DEV_BASE_ROOTFS_ACTIVATION=SLOT_COUPLED_ONE_SHOT'
