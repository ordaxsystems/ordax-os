name: Independent Portable v2 Integration (experimental)

on:
  pull_request:
    paths:
      - 'bootstrap/independent-base/**'
      - 'tests/test_independent_portable_boot_integration.py'
      - '.github/workflows/independent-portable-v2-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical-portable-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without persistence of credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate official portable contracts and fail-closed bridge
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_independent_base_experiment tests.test_independent_portable_boot_integration -v
          python3 -m py_compile bootstrap/independent-base/build.py bootstrap/independent-base/portable_boot_proof.py
          sh -n bootstrap/independent-base/post-build.sh
          sh -n bootstrap/stable-base/ordax-stable-init
          sh -n bootstrap/initramfs/portable_init.sh
          python3 bootstrap/independent-base/build.py check
      - name: Protect production owners
        run: |
          set -euo pipefail
          test -f bootstrap/portable-v2/qemu_boot.py
          test -f bootstrap/initramfs/portable_base_verify.sh
          test -f bootstrap/initramfs/portable_init.sh
          test -f bootstrap/stable-base/ordax-stable-init
          echo 'ORDAX_INDEPENDENT_PORTABLE_V2_CONTRACT=PASS'
          echo 'ORDAX_INDEPENDENT_PORTABLE_V2_QEMU=NOT_YET_PROVEN'
