name: Account Close Cleanup Foundation v2

on:
  pull_request:
    paths:
      - 'infra/supabase/product/migrations/20261005183000_account_close_cleanup_foundation_v2.sql'
      - 'docs/contracts/account-close-cleanup.json'
      - 'tests/test_account_close_cleanup_reconvergence.py'
      - '.github/workflows/account-close-cleanup-foundation-v2.yml'
  push:
    branches: [main]
    paths:
      - 'infra/supabase/product/migrations/20261005183000_account_close_cleanup_foundation_v2.sql'
      - 'docs/contracts/account-close-cleanup.json'
      - 'tests/test_account_close_cleanup_reconvergence.py'
      - '.github/workflows/account-close-cleanup-foundation-v2.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate account-close cleanup source contract
        run: |
          set -euo pipefail
          python -m json.tool docs/contracts/account-close-cleanup.json >/dev/null
          python -m unittest tests.test_account_close_cleanup_reconvergence -v
