name: Public Site Selective Deployment

# Dormant until the existing production Site is switched from automatic Git
# deployments to this single authenticated GitHub Actions release authority.
on:
  workflow_run:
    workflows: ["Public Site Candidate"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-site-selective-production
  cancel-in-progress: false
jobs:
  publish-verified-site:
    if: >-
      ${{
        vars.ORDAX_SITE_SELECTIVE_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'ordaxsystems/ordax-os'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production – ordax-os-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish only a verified canonical Site change
        env:
          ORDAX_SITE_SELECTIVE_DEPLOY_ENABLED: 'true'
          ORDAX_SITE_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 tools/vercel/selective_site_delivery.py
