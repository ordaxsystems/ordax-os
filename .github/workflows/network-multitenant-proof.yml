name: Network Multi-tenant SQL Proof

on:
  push:
    branches: [main]
    paths:
      - 'infra/supabase/product/migrations/20261001040000_network_directory_communities_v1.sql'
      - 'infra/supabase/product/migrations/20261001043000_network_groups_messages_v1.sql'
      - 'infra/supabase/product/migrations/20261001044500_network_inbox_groups_v1.sql'
      - 'infra/supabase/product/migrations/20261001050000_network_security_hardening_v1.sql'
      - 'infra/supabase/product/migrations/20261001051500_network_group_owner_lifecycle_v1.sql'
      - 'tests/sql/test_network_multitenant_hardening.sql'
      - 'tests/test_network_multitenant_proof_contract.py'
      - '.github/workflows/network-multitenant-proof.yml'
  pull_request:
    paths:
      - 'infra/supabase/product/migrations/20261001040000_network_directory_communities_v1.sql'
      - 'infra/supabase/product/migrations/20261001043000_network_groups_messages_v1.sql'
      - 'infra/supabase/product/migrations/20261001044500_network_inbox_groups_v1.sql'
      - 'infra/supabase/product/migrations/20261001050000_network_security_hardening_v1.sql'
      - 'infra/supabase/product/migrations/20261001051500_network_group_owner_lifecycle_v1.sql'
      - 'tests/sql/test_network_multitenant_hardening.sql'
      - 'tests/test_network_multitenant_proof_contract.py'
      - '.github/workflows/network-multitenant-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-multitenant-sql-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Execute Network multi-tenant proof on ephemeral PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/test_network_multitenant_hardening.sql

      - name: Guard Network proof contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_multitenant_proof_contract -v
