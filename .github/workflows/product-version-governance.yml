name: OrdaX Product Version Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact OS source and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version governance syntax and contracts
        run: |
          set -euo pipefail
          node --check system/contracts/product-version-governance.mjs
          node --check tools/verify/product_version_changes.mjs
          node --test tests/test_product_version_governance.mjs tests/test_product_version_changes.mjs
      - name: Verify only an explicit product-version change must advance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] && [[ ! "${BASE_SHA}" =~ ^0{40}$ ]]; then
            node tools/verify/product_version_changes.mjs "${BASE_SHA}"
          else
            node tools/verify/product_version_changes.mjs
          fi

# This gate validates an explicitly versioned product composition. It runs on
# every main-targeting PR so it can be required by branch protection while
# allowing docs-only and unrelated source changes to pass without a version
# bump. It never grants publication, signing, Stable promotion, USB writes or
# installation.
