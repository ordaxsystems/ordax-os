name: Windows Compatibility Wine Full Build Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_full_build_proof.py'
      - 'tests/test_windows_compat_unixlib_link_policy.py'
      - 'tests/test_windows_compat_runtime_dependency_discovery.py'
      - 'tests/test_windows_compat_runtime_first_hit_guard.py'
      - 'tests/test_windows_compat_runtime_first_hit_proof.py'
      - 'tests/test_windows_compat_runtime_loader_invariance.py'
      - 'tests/test_windows_compat_runtime_dependency_evidence.py'
      - 'tests/test_windows_compat_runtime_dependency_closure.py'
      - 'tests/test_windows_compat_runtime_dependency_closure_guard.py'
      - 'tests/test_windows_compat_runtime_dependency_closure_evidence.py'
      - 'tests/test_windows_compat_runtime_unixlib_preload_source.py'
      - 'tests/test_windows_compat_runtime_unixlib_preload_runtime_guard.py'
      - '.github/workflows/windows-compat-wine-full-build-proof.yml'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_full_build_proof.py'
      - 'tests/test_windows_compat_unixlib_link_policy.py'
      - 'tests/test_windows_compat_runtime_dependency_discovery.py'
      - 'tests/test_windows_compat_runtime_first_hit_guard.py'
      - 'tests/test_windows_compat_runtime_first_hit_proof.py'
      - 'tests/test_windows_compat_runtime_loader_invariance.py'
      - 'tests/test_windows_compat_runtime_dependency_evidence.py'
      - 'tests/test_windows_compat_runtime_dependency_closure.py'
      - 'tests/test_windows_compat_runtime_dependency_closure_guard.py'
      - 'tests/test_windows_compat_runtime_dependency_closure_evidence.py'
      - 'tests/test_windows_compat_runtime_unixlib_preload_source.py'
      - 'tests/test_windows_compat_runtime_unixlib_preload_runtime_guard.py'
      - '.github/workflows/windows-compat-wine-full-build-proof.yml'

permissions:
  contents: read

jobs:
  full-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install bounded resolver dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot
          docker version

      - name: Validate locked full build and runtime dependency proof boundaries
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/validate_build_version_lock.py
          python bootstrap/windows-compat-runtime/validate_apk_content_lock.py
          python bootstrap/windows-compat-runtime/unixlib_link_policy.py check
          python bootstrap/windows-compat-runtime/container_full_build_probe.py check
          python bootstrap/windows-compat-runtime/runtime_unixlib_preload_source_probe.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_probe.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_first_hit_guard.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_loader_invariance_guard.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_evidence_finalize.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_closure_probe.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_closure_loader_guard.py check
          python bootstrap/windows-compat-runtime/runtime_dependency_closure_evidence_finalize.py check
          python -m unittest tests.test_windows_compat_build_version_lock -v
          python -m unittest tests.test_windows_compat_apk_content_lock -v
          python -m unittest tests.test_windows_compat_full_build_proof -v
          python -m unittest tests.test_windows_compat_unixlib_link_policy -v
          python -m unittest tests.test_windows_compat_runtime_unixlib_preload_source -v
          python -m unittest tests.test_windows_compat_runtime_unixlib_preload_runtime_guard -v
          python -m unittest tests.test_windows_compat_runtime_dependency_discovery -v
          python -m unittest tests.test_windows_compat_runtime_first_hit_guard -v
          python -m unittest tests.test_windows_compat_runtime_first_hit_proof -v
          python -m unittest tests.test_windows_compat_runtime_loader_invariance -v
          python -m unittest tests.test_windows_compat_runtime_dependency_evidence -v
          python -m unittest tests.test_windows_compat_runtime_dependency_closure -v
          python -m unittest tests.test_windows_compat_runtime_dependency_closure_guard -v
          python -m unittest tests.test_windows_compat_runtime_dependency_closure_evidence -v

      - name: Reconstruct locked inputs, build Wine, and prove guarded DT_NEEDED closure without executing it
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-wine-full-build-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/container_full_build_probe.py build \
            --work-dir "$work" \
            --jobs 2 \
            --out "$proof_dir/full-build-proof.json"
          python - <<'PY' "$proof_dir/full-build-proof.json"
          import json
          import pathlib
          import re
          import sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['$schema'] == 'prototype-ordax.windows-compat-full-build-proof/2'
          gates = proof['gates']
          for gate in (
              'source_lock_verified',
              'version_lock_verified',
              'apk_content_lock_verified',
              'offline_content_replay_passed',
              'proot_full_build_rejected_by_diagnostic',
              'locked_rootfs_container_imported',
              'container_network_disabled',
              'container_rootfs_read_only',
              'container_capabilities_dropped',
              'compiler_execution_reproven_inside_container',
              'configure_completed',
              'full_build_proof_passed',
              'staged_install_completed',
          ):
              assert gates[gate] is True, gate
          assert gates['runtime_dependency_inventory_complete'] is False
          assert gates['binary_artifact_pinned'] is False
          assert gates['activation_authorized'] is False
          assert gates['execution_authorized'] is False
          assert gates['windows_payload_executed'] is False
          assert gates['wine_executed'] is False
          content_lock = json.loads(pathlib.Path('bootstrap/windows-compat-runtime/apk-content-lock.json').read_text(encoding='utf-8'))
          version_lock = json.loads(pathlib.Path('bootstrap/windows-compat-runtime/build-version-lock.json').read_text(encoding='utf-8'))
          assert proof['apk_content_manifest_sha256'] == content_lock['external_apk_set']['canonical_manifest_sha256']
          assert proof['resolved_closure_sha256'] == version_lock['resolved_closure']['canonical_json_sha256']
          link = proof['unixlib_link_policy']
          assert link['$schema'] == 'prototype-ordax.windows-compat-unixlib-link-policy-proof/1'
          assert link['status'] == 'origin-runpath-build-policy-proven-not-runtime-pinned'
          assert re.fullmatch(r'[0-9a-f]{64}', link['evidence_sha256'])
          assert link['preflight']['dt_rpath'] is None
          assert link['preflight']['dt_runpath'] == '$ORIGIN'
          assert 'win32u.so' in link['preflight']['dt_needed']
          for gate in (
              'source_archive_identity_bound',
              'configure_anchor_verified',
              'generated_makefile_unixldflags_verified',
              'preflight_elf_verified',
              'dt_runpath_origin_verified',
              'dt_rpath_absent',
          ):
              assert link['gates'][gate] is True, gate
          for gate in (
              'ambient_ld_library_path_used',
              'global_wine_library_path_fallback_used',
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          ):
              assert link['gates'][gate] is False, gate
          staging = proof['staging']
          assert staging['entry_count'] > 0
          assert staging['regular_file_count'] > 0
          assert staging['total_regular_bytes'] > 0
          assert re.fullmatch(r'[0-9a-f]{64}', staging['canonical_manifest_sha256'])
          print('Wine locked-container full build proof: PASS')
          print('Unixlib link policy:', link['evidence_sha256'])
          print('Unixlib preflight RUNPATH:', link['preflight']['dt_runpath'])
          print('staged entries:', staging['entry_count'])
          print('staged manifest:', staging['canonical_manifest_sha256'])
          PY
          test -f "$work/wine-source-cache/wine-11.0.tar.xz"
          python bootstrap/windows-compat-runtime/runtime_unixlib_preload_source_probe.py prove \
            --source-archive "$work/wine-source-cache/wine-11.0.tar.xz" \
            --out "$proof_dir/runtime-unixlib-preload-source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_first_hit_guard.py verify \
            --stage-dir "$work/container-build/stage" \
            --rootfs "$work/content/resolver-rootfs" \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --unixlib-preload-source-proof "$proof_dir/runtime-unixlib-preload-source-proof.json" \
            --out "$proof_dir/runtime-first-hit-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_loader_invariance_guard.py verify \
            --stage-dir "$work/container-build/stage" \
            --rootfs "$work/content/resolver-rootfs" \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --unixlib-preload-source-proof "$proof_dir/runtime-unixlib-preload-source-proof.json" \
            --out "$proof_dir/runtime-loader-invariance-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_probe.py discover \
            --stage-dir "$work/container-build/stage" \
            --rootfs "$work/content/resolver-rootfs" \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --unixlib-preload-source-proof "$proof_dir/runtime-unixlib-preload-source-proof.json" \
            --out "$proof_dir/runtime-dependency-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_evidence_finalize.py finalize \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --first-hit-proof "$proof_dir/runtime-first-hit-proof.json" \
            --loader-invariance-proof "$proof_dir/runtime-loader-invariance-proof.json" \
            --dependency-proof "$proof_dir/runtime-dependency-proof.json" \
            --out "$proof_dir/runtime-dependency-evidence-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_closure_probe.py discover \
            --stage-dir "$work/container-build/stage" \
            --rootfs "$work/content/resolver-rootfs" \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --direct-dependency-proof "$proof_dir/runtime-dependency-proof.json" \
            --unixlib-preload-source-proof "$proof_dir/runtime-unixlib-preload-source-proof.json" \
            --out "$proof_dir/runtime-dependency-closure-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_closure_loader_guard.py verify \
            --stage-dir "$work/container-build/stage" \
            --rootfs "$work/content/resolver-rootfs" \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --direct-dependency-proof "$proof_dir/runtime-dependency-proof.json" \
            --direct-evidence-proof "$proof_dir/runtime-dependency-evidence-proof.json" \
            --closure-proof "$proof_dir/runtime-dependency-closure-proof.json" \
            --unixlib-preload-source-proof "$proof_dir/runtime-unixlib-preload-source-proof.json" \
            --out "$proof_dir/runtime-dependency-closure-loader-guard-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dependency_closure_evidence_finalize.py finalize \
            --direct-evidence-proof "$proof_dir/runtime-dependency-evidence-proof.json" \
            --closure-proof "$proof_dir/runtime-dependency-closure-proof.json" \
            --closure-loader-guard-proof "$proof_dir/runtime-dependency-closure-loader-guard-proof.json" \
            --out "$proof_dir/runtime-dependency-closure-evidence-proof.json"
          python - <<'PY' \
            "$proof_dir/full-build-proof.json" \
            "$proof_dir/runtime-unixlib-preload-source-proof.json" \
            "$proof_dir/runtime-dependency-evidence-proof.json" \
            "$proof_dir/runtime-dependency-closure-proof.json" \
            "$proof_dir/runtime-dependency-closure-loader-guard-proof.json" \
            "$proof_dir/runtime-dependency-closure-evidence-proof.json"
          import json
          import pathlib
          import re
          import sys
          full, preload_source, direct_evidence, closure, guard, evidence = [
              json.loads(pathlib.Path(item).read_text(encoding='utf-8')) for item in sys.argv[1:]
          ]
          runtime_id = full['runtime_id']
          stage_sha = full['staging']['canonical_manifest_sha256']
          assert preload_source['runtime_id'] == runtime_id
          assert re.fullmatch(r'[0-9a-f]{64}', preload_source['evidence_sha256'])
          assert direct_evidence['runtime_id'] == closure['runtime_id'] == guard['runtime_id'] == evidence['runtime_id'] == runtime_id
          assert direct_evidence['staging_manifest_sha256'] == closure['staging_manifest_sha256'] == guard['staging_manifest_sha256'] == evidence['staging_manifest_sha256'] == stage_sha
          preload_edges = [
              edge
              for context in closure['contexts'].values()
              for edge in context['edges']
              if edge.get('resolution_kind') == 'source-proven-dependency-attach-preload'
          ]
          assert preload_edges
          assert all(edge['unixlib_preload_source_evidence_sha256'] == preload_source['evidence_sha256'] for edge in preload_edges)
          assert guard['counts']['dependency_attach_preload_hits'] == len(preload_edges)
          for digest in (
              closure['closure_sha256'],
              guard['validation_sha256'],
              evidence['evidence_sha256'],
          ):
              assert re.fullmatch(r'[0-9a-f]{64}', digest)
          assert closure['counts']['edges'] > 0
          assert closure['counts']['external_packages'] > 0
          assert guard['counts']['edges_checked'] == closure['counts']['edges']
          assert guard['counts']['edges_checked'] == guard['counts']['stage_hits'] + guard['counts']['rootfs_hits']
          assert guard['counts']['identity_soname_pairs'] > 0
          gates = evidence['gates']
          for gate in (
              'direct_dependency_evidence_verified',
              'transitive_dt_needed_closure_verified',
              'closure_first_pathname_hit_verified',
              'closure_shortname_reuse_invariance_verified',
              'closure_origin_alias_context_verified',
              'external_transitive_dt_needed_closure_verified',
          ):
              assert gates[gate] is True, gate
          assert gates['dynamic_load_inventory_complete'] is False
          assert gates['external_transitive_closure_verified'] is False
          assert gates['runtime_dependency_inventory_complete'] is False
          assert gates['runtime_package_content_hashes_pinned'] is False
          assert gates['binary_artifact_pinned'] is False
          assert gates['activation_authorized'] is False
          assert gates['execution_authorized'] is False
          assert gates['wine_executed'] is False
          assert gates['windows_payload_executed'] is False
          print('Wine guarded transitive DT_NEEDED closure evidence: PASS')
          print('unixlib preload source:', preload_source['evidence_sha256'])
          print('closure preload edges:', len(preload_edges))
          print('closure nodes:', closure['counts']['nodes'])
          print('closure edges:', closure['counts']['edges'])
          print('external packages:', closure['counts']['external_packages'])
          print('closure:', closure['closure_sha256'])
          print('loader guard:', guard['validation_sha256'])
          print('evidence:', evidence['evidence_sha256'])
          PY

      - name: Upload full build and guarded runtime dependency metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-wine-runtime-dependency-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/full-build-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-unixlib-preload-source-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-first-hit-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-loader-invariance-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-dependency-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-dependency-evidence-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-dependency-closure-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-dependency-closure-loader-guard-proof.json
            ${{ runner.temp }}/windows-compat-wine-full-build-proof/runtime-dependency-closure-evidence-proof.json
          if-no-files-found: error