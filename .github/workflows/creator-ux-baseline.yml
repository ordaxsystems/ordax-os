name: Creator UX Baseline

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/cmd/ordax-creator-app/**'
      - 'tools/creator/README.md'
      - 'docs/contracts/creator-ux-baseline.json'
      - '.github/workflows/creator-ux-baseline.yml'
      - '.github/workflows/creator-owner-dev-git.yml'
  pull_request:
    paths:
      - 'tools/creator/cmd/ordax-creator-app/**'
      - 'tools/creator/README.md'
      - 'docs/contracts/creator-ux-baseline.json'
      - '.github/workflows/creator-ux-baseline.yml'
      - '.github/workflows/creator-owner-dev-git.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test guided Creator experience model
        run: |
          set -euo pipefail
          pushd tools/creator >/dev/null
          go test -count=1 ./cmd/ordax-creator-app
          popd >/dev/null
          echo 'CREATOR_GUIDED_EXPERIENCE_TESTS=PASS'

      - name: Compile split Windows owner boundaries
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ordax-creator-split-smoke"
          mkdir -p "$out"
          pushd tools/creator >/dev/null
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_raw_backend' \
              -o "$out/ordax-creator-physical-test.exe" \
              ./cmd/ordax-creator-physical-test
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_owner_prototype' \
              -ldflags='-H=windowsgui' \
              -o "$out/OrdaX-Creator.exe" \
              ./cmd/ordax-creator-app
          popd >/dev/null
          test -s "$out/ordax-creator-physical-test.exe"
          test -s "$out/OrdaX-Creator.exe"
          echo 'CREATOR_SPLIT_WINDOWS_CROSS_BUILD=PASS'

      - name: Verify Creator UX contract and implementation anchors
        run: |
          python - <<'PY'
          import json, pathlib

          root = pathlib.Path('.')
          contract = json.loads((root / 'docs/contracts/creator-ux-baseline.json').read_text(encoding='utf-8'))
          assert contract['$schema'] == 'prototype-ordax.creator-ux-baseline/2'
          assert contract['status'] == 'minimum-rufus-class-baseline'
          assert contract['user_required_inputs'] == ['usb_target']
          assert contract['user_optional_preferences'] == ['locale']
          assert all(contract['requirements'].values())

          localization_contract = contract['localization']
          assert localization_contract == {
              'owner': 'creator',
              'source_locale': 'pt-BR',
              'bundled_locales': ['pt-BR', 'en-US'],
              'initial_locale_source': 'windows-user-locale',
              'fallback_locale': 'pt-BR',
              'user_selection_persisted': True,
              'catalog_parity_required': True,
              'placeholder_parity_required': True,
              'raw_diagnostic_hidden_from_user_copy': True,
              'additional_locales_component_scoped': True,
          }
          assert contract['owner_distribution'] == {
              'format': 'split-zip-bundle',
              'artifact': 'OrdaX-Creator-Owner-Prototype.zip',
              'gui_raw_backend_separate': True,
              'standalone_gui_published': False,
              'bundle_extraction_required': True,
          }
          assert contract['owner_update'] == {
              'manifest_schema': 'prototype-ordax.creator-owner-bundle-update/1',
              'artifact': 'OrdaX-Creator-Owner-Prototype.zip',
              'automatic_in_app_update': False,
              'anti_downgrade_check': True,
              'unsupported_automatic_update_fails_closed': True,
          }

          base = root / 'tools/creator/cmd/ordax-creator-app'
          files = {
              'main': (base / 'main_windows.go').read_text(encoding='utf-8'),
              'experience': (base / 'experience_model.go').read_text(encoding='utf-8'),
              'visuals': (base / 'guided_visual_windows.go').read_text(encoding='utf-8'),
              'boot_help': (base / 'boot_help.go').read_text(encoding='utf-8'),
              'physical': (base / 'physical_flow_windows.go').read_text(encoding='utf-8'),
              'portable': (base / 'portable_physical_flow_windows.go').read_text(encoding='utf-8'),
              'progress': (base / 'physical_progress_windows.go').read_text(encoding='utf-8'),
              'update': (base / 'update_check_windows.go').read_text(encoding='utf-8'),
              'backend': (base / 'backend_resolution_windows.go').read_text(encoding='utf-8'),
              'split_owner': (base / 'owner_prototype_backend_enabled_windows.go').read_text(encoding='utf-8'),
              'localization': (base / 'localization.go').read_text(encoding='utf-8'),
              'locale_windows': (base / 'localization_windows.go').read_text(encoding='utf-8'),
              'locale_audit': (base / 'localization_source_audit_test.go').read_text(encoding='utf-8'),
              'release': (root / '.github/workflows/creator-owner-dev-git.yml').read_text(encoding='utf-8'),
              'docs': (root / 'tools/creator/README.md').read_text(encoding='utf-8'),
          }

          required = {
              'main': [
                  'idLocaleCombo', 'creatorSupportedLocales()', 'saveCreatorLocalePreference(locale)',
                  'renderCreatorLocaleUI()', 'beginUpdateCheck(false)',
                  'len(state.Targets) == 1', 'cbSetCurSel', 'paintGuidedVisual(hwnd)',
                  'creatorBootHelpText()', 'msgHeaderTitle', 'msgActionCreate',
              ],
              'experience': [
                  'ErrorMessageID', 'msgConnectDetail', 'msgReviewBody', 'msgCreatingTitle',
                  'msgActionBootHelp', 'Illustration', 'creatorMessageFor(locale, id, nil)',
              ],
              'visuals': [
                  'drawStepRail', 'drawUSBIllustration', 'currentGuidedExperience',
                  'creatorStepReview', 'creatorStepCreating', 'creatorStepComplete', 'creatorStepBlocked',
                  'procGetSysColor', 'procDrawTextW', 'procEllipse', 'procRectangle',
              ],
              'boot_help': ['creatorT(msgBootHelp)'],
              'physical': [
                  'runElevatedAndWait', 'SystemDisk', 'PrototypeSafe', 'DestructiveAuthorization',
                  'msgPhysicalWriteFailedDetail', 'msgWriteConfirmBody', 'setProgressComplete()',
                  'progressPollMillis', 'applyPhysicalProgressSnapshot',
              ],
              'portable': [
                  'case "legacy-owner":', 'case "portable-public":', 'creatorcore.PlanPortableMedia',
                  'creatorcore.PlanPortableApplication', 'PortableApplicationPlanCanonicalBytes',
                  '"prepare-portable"', '"apply-portable"', '"--source"',
                  'validatePortablePhysicalPreparation', 'WholeDiskRawImageRequired',
                  'msgPortablePlanStatus', 'msgPortableElevationHint', 'msgPortableVerifiedHint',
              ],
              'progress': [
                  'msgProgressWritingStatus', 'msgProgressVerifyingStatus', 'CompletedBytes', 'TotalBytes',
                  'creatorTValues', 'setProgressPercent', 'formatting-data',
              ],
              'update': [
                  'creator-owner-update.json', 'prototype-ordax.creator-owner-bundle-update/1',
                  'OrdaX-Creator-Owner-Prototype.zip', 'AutomaticInAppUpdate bool',
                  'ownerUpdateIsForward', '/compare/', 'msgUpdateBundleManualBody',
                  'manifest.AutomaticInAppUpdate',
                  'automatic in-app bundle update is not supported by this Creator',
              ],
              'localization': [
                  'creatorLocalePTBR', 'creatorLocaleENUS', 'creatorSourceLocale',
                  'creatorPTBRMessages', 'creatorENUSMessages', 'creatorMessageFor',
                  'resolveCreatorLocale', 'msgFieldLanguage', 'msgUpdateAvailableAction',
              ],
              'locale_windows': [
                  'GetUserDefaultLocaleName', 'prototype-ordax.creator-locale-preference/1',
                  'loadCreatorLocalePreference', 'saveCreatorLocalePreference', 'MoveFileExW',
                  'moveFileWriteThrough',
              ],
              'locale_audit': [
                  'TestCreatorUserFacingCallsDoNotEmbedCopyLiterals', 'creatorUIStringArgs',
                  'use Creator localization owner',
              ],
              'backend': ['ownerPrototypePhysicalBackend()', 'return finishRefreshState(result, ownerDirectory)'],
              'split_owner': [
                  'windows && ordax_owner_prototype && !ordax_single_exe',
                  'ordax-creator-physical-test.exe', 'ordax-bootstrap-seed.raw', 'provenance.json',
              ],
              'docs': [
                  'Creator localization owner', 'independently from the OrdaX Surface',
                  '`pt-BR` and `en-US`', 'Unsupported locale identifiers fall back deterministically to `pt-BR`',
                  'prototype-ordax.creator-owner-bundle-update/1', '`automatic_in_app_update=false`',
              ],
              'release': [
                  'name: Creator Owner Development Git USB', "-tags 'ordax_raw_backend'",
                  "-tags 'ordax_owner_prototype'", 'OrdaX-Creator-Owner-Prototype.zip',
                  'prototype-ordax.creator-owner-bundle-update/1', "'automatic_in_app_update': False",
                  "delete-asset creator-owner-prototype 'OrdaX-Creator.exe'",
                  'OWNER_RELEASE_PIPELINE=SPLIT_BUNDLE', 'OWNER_STANDALONE_EXE_PUBLISHED=NO',
                  'OWNER_SPLIT_BUNDLE_PUBLISHED=YES',
              ],
          }
          for name, anchors in required.items():
              for anchor in anchors:
                  assert anchor in files[name], f'missing Creator {name} anchor: {anchor}'

          # User-facing Portuguese copy belongs in the locale catalog, never in state/presentation owners.
          for forbidden in ['Etapa 1 de 4', 'Não remova o pendrive', 'Como iniciar pelo USB']:
              assert forbidden not in files['experience']
          assert 'menu de boot/UEFI' not in files['boot_help']
          assert 'Gravando OrdaX no pendrive' not in files['progress']
          assert 'Atualizar agora' not in files['update']
          for legacy_updater_anchor in [
              'ownerSelfUpdateHelperCommand',
              'prototype-ordax.creator-self-update/1',
              'stageAndLaunchOwnerSelfUpdate',
              'waitForUpdateHealth',
          ]:
              assert legacy_updater_anchor not in files['update'], f'legacy single-EXE updater remains reachable: {legacy_updater_anchor}'

          release = files['release']
          assert 'workflow_run:' not in release
          assert 'ordax_single_exe' not in release
          assert 'owner_payload/ordax-bootstrap-seed.raw.gz' not in release
          assert '"prepare"' not in files['portable']
          assert '"apply"' not in files['portable']
          assert 'ordax-bootstrap-seed.raw' not in files['portable']
          assert 'webview' not in files['visuals'].lower()
          assert 'http://' not in files['visuals'].lower() and 'https://' not in files['visuals'].lower()
          assert 'http://' not in files['boot_help'].lower() and 'https://' not in files['boot_help'].lower()

          owner_pos = files['backend'].index('ownerPrototypePhysicalBackend()')
          dev_pos = files['backend'].index('creatorupdate.Ensure')
          assert owner_pos < dev_pos

          print('CREATOR_UX_BASELINE=PASS')
          print('CREATOR_LOCALIZATION_OWNER=PASS')
          print('CREATOR_LOCALIZATION_BASELINE=pt-BR,en-US')
          print('CREATOR_USER_REQUIRED_INPUT=usb_target')
          print('CREATOR_OPTIONAL_PREFERENCE=locale')
          print('CREATOR_RELEASE_PIPELINE=SPLIT_BUNDLE')
          print('CREATOR_AUTOMATIC_IN_APP_BUNDLE_UPDATE=NO')
          PY
