name: Creator UX Baseline

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/cmd/ordax-creator-app/**'
      - 'docs/contracts/creator-ux-baseline.json'
      - '.github/workflows/creator-ux-baseline.yml'
      - '.github/workflows/creator-owner-dev-git.yml'
  pull_request:
    paths:
      - 'tools/creator/cmd/ordax-creator-app/**'
      - 'docs/contracts/creator-ux-baseline.json'
      - '.github/workflows/creator-ux-baseline.yml'
      - '.github/workflows/creator-owner-dev-git.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test guided Creator experience model
        run: |
          set -euo pipefail
          pushd tools/creator >/dev/null
          go test -count=1 ./cmd/ordax-creator-app
          popd >/dev/null
          echo 'CREATOR_GUIDED_EXPERIENCE_TESTS=PASS'

      - name: Compile split Windows owner boundaries
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ordax-creator-split-smoke"
          mkdir -p "$out"
          pushd tools/creator >/dev/null
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_raw_backend' \
              -o "$out/ordax-creator-physical-test.exe" \
              ./cmd/ordax-creator-physical-test
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_owner_prototype' \
              -ldflags='-H=windowsgui' \
              -o "$out/OrdaX-Creator.exe" \
              ./cmd/ordax-creator-app
          popd >/dev/null
          test -s "$out/ordax-creator-physical-test.exe"
          test -s "$out/OrdaX-Creator.exe"
          echo 'CREATOR_SPLIT_WINDOWS_CROSS_BUILD=PASS'

      - name: Verify Creator UX contract and implementation anchors
        run: |
          python - <<'PY'
          import json, pathlib

          contract = json.loads(pathlib.Path('docs/contracts/creator-ux-baseline.json').read_text(encoding='utf-8'))
          assert contract['$schema'] == 'prototype-ordax.creator-ux-baseline/1'
          assert contract['status'] == 'minimum-rufus-class-baseline'
          assert contract['user_selectable_inputs'] == ['usb_target']
          assert all(contract['requirements'].values())

          main = pathlib.Path('tools/creator/cmd/ordax-creator-app/main_windows.go').read_text(encoding='utf-8')
          experience = pathlib.Path('tools/creator/cmd/ordax-creator-app/experience_model.go').read_text(encoding='utf-8')
          visuals = pathlib.Path('tools/creator/cmd/ordax-creator-app/guided_visual_windows.go').read_text(encoding='utf-8')
          boot_help = pathlib.Path('tools/creator/cmd/ordax-creator-app/boot_help.go').read_text(encoding='utf-8')
          physical = pathlib.Path('tools/creator/cmd/ordax-creator-app/physical_flow_windows.go').read_text(encoding='utf-8')
          portable_physical = pathlib.Path('tools/creator/cmd/ordax-creator-app/portable_physical_flow_windows.go').read_text(encoding='utf-8')
          progress = pathlib.Path('tools/creator/cmd/ordax-creator-app/physical_progress_windows.go').read_text(encoding='utf-8')
          update = pathlib.Path('tools/creator/cmd/ordax-creator-app/update_check_windows.go').read_text(encoding='utf-8')
          backend = pathlib.Path('tools/creator/cmd/ordax-creator-app/backend_resolution_windows.go').read_text(encoding='utf-8')
          split_owner = pathlib.Path('tools/creator/cmd/ordax-creator-app/owner_prototype_backend_enabled_windows.go').read_text(encoding='utf-8')
          release_workflow = pathlib.Path('.github/workflows/creator-owner-dev-git.yml').read_text(encoding='utf-8')

          required_main = [
              'Criar OrdaX', 'Recarregar USB', 'Atualizações',
              'beginUpdateCheck(false)', 'markOwnerUpdateHealthy()',
              'msctls_progress32', 'len(state.Targets) == 1', 'cbSetCurSel',
              'case wmPaint:', 'paintGuidedVisual(hwnd)', '900, 390',
              'invalidateGuidedVisual()', 'idBootHelp', 'creatorBootHelpText()',
              'Como iniciar pelo USB',
          ]
          required_experience = [
              'Etapa 1 de 4', 'Etapa 2 de 4', 'Etapa 3 de 4',
              'Os discos internos do computador não são oferecidos como destino pelo Creator.',
              'O pendrive selecionado será apagado',
              'Não remova o pendrive',
              'Como iniciar pelo USB',
              'Illustration',
          ]
          required_visuals = [
              'drawStepRail', 'drawUSBIllustration', 'currentGuidedExperience',
              'creatorStepReview', 'creatorStepCreating', 'creatorStepComplete', 'creatorStepBlocked',
              'procGetSysColor', 'procDrawTextW', 'procEllipse', 'procRectangle',
              'invalidateGuidedVisual',
          ]
          required_boot_help = [
              'menu de boot/UEFI', 'USB/UEFI', 'SSD ou HD interno', 'não instala',
          ]
          required_physical = [
              'Aguardando autorização do Windows',
              'runElevatedAndWait', 'SystemDisk', 'PrototypeSafe',
              'DestructiveAuthorization', 'verificação por leitura',
              'setProgressComplete()',
              'Pendrive OrdaX criado e verificado.',
              'O pendrive OrdaX foi criado, passou pela verificação de leitura',
              'progressPollMillis', 'applyPhysicalProgressSnapshot',
          ]
          required_portable_physical = [
              'case "legacy-owner":',
              'case "portable-public":',
              'creatorcore.PlanPortableMedia',
              'creatorcore.PlanPortableApplication',
              'PortableApplicationPlanCanonicalBytes',
              '"prepare-portable"',
              '"apply-portable"',
              '"--source"',
              'validatePortablePhysicalPreparation',
              'WholeDiskRawImageRequired',
              'physicalchannel.PortablePayloadSourcePath',
              'payload Portable assinado possui schema incompatível',
          ]
          required_progress = [
              'Gravando OrdaX no pendrive',
              'Verificando a gravação por leitura',
              'CompletedBytes', 'TotalBytes',
              'setProgressPercent', 'formatting-data',
          ]
          required_update = [
              'creator-owner-update.json',
              'Atualizar agora',
              'beginUpdateCheck',
              'prototype-ordax.creator-owner-update/2',
              '/OrdaX-Creator.exe',
              'ownerSelfUpdateHelperCommand',
              'prototype-ordax.creator-self-update/1',
              'ownerUpdateIsForward',
              '/compare/',
              'downloadOwnerUpdate',
              'SHA-256 da atualização não corresponde',
              'waitForUpdateHealth',
              'rollback acionado',
              'markOwnerUpdateHealthy',
              'retryRename',
          ]
          required_backend = [
              'ownerPrototypePhysicalBackend()',
              'return finishRefreshState(result, ownerDirectory)',
          ]
          required_split_owner = [
              'windows && ordax_owner_prototype && !ordax_single_exe',
              'ordax-creator-physical-test.exe',
              'ordax-bootstrap-seed.raw',
              'provenance.json',
          ]
          required_release_workflow = [
              'name: Creator Owner Development Git USB',
              "bootstrap/dev-base/**",
              "-tags 'ordax_raw_backend'",
              "-tags 'ordax_owner_prototype'",
              'ordax-creator-physical-test.exe',
              'ordax-bootstrap-seed.raw',
              'OrdaX-Creator-Owner-Prototype.zip',
              'prototype-ordax.creator-owner-bundle-update/1',
              "delete-asset creator-owner-prototype 'OrdaX-Creator.exe'",
              'OrdaX Creator - Development Git USB',
              'OWNER_RELEASE_PIPELINE=SPLIT_BUNDLE',
              'OWNER_STANDALONE_EXE_PUBLISHED=NO',
              'OWNER_SPLIT_BUNDLE_PUBLISHED=YES',
              'Destroy ephemeral private key before publish',
          ]

          for text in required_main:
              assert text in main, f'missing Creator main UX anchor: {text}'
          for text in required_experience:
              assert text in experience, f'missing guided Creator experience anchor: {text}'
          for text in required_visuals:
              assert text in visuals, f'missing native Creator visual anchor: {text}'
          for text in required_boot_help:
              assert text in boot_help, f'missing interactive boot guidance anchor: {text}'
          for text in required_physical:
              assert text in physical, f'missing Creator physical UX/safety anchor: {text}'
          for text in required_portable_physical:
              assert text in portable_physical, f'missing Creator Portable physical anchor: {text}'
          for text in required_progress:
              assert text in progress, f'missing Creator progress anchor: {text}'
          for text in required_update:
              assert text in update, f'missing Creator legacy self-update anchor: {text}'
          for text in required_backend:
              assert text in backend, f'missing owner isolation anchor: {text}'
          for text in required_split_owner:
              assert text in split_owner, f'missing split owner Creator anchor: {text}'
          for text in required_release_workflow:
              assert text in release_workflow, f'missing Git-first owner release anchor: {text}'

          assert 'workflow_run:' not in release_workflow, 'owner release must not depend on a workflow_run publication chain'
          assert 'ordax_single_exe' not in release_workflow, 'owner development release must not link the GUI and RAW writer into one executable'
          assert 'owner_payload/ordax-bootstrap-seed.raw.gz' not in release_workflow, 'owner development GUI must not embed the raw seed'
          assert '"prepare"' not in portable_physical, 'public Portable flow must not call legacy prepare'
          assert '"apply"' not in portable_physical, 'public Portable flow must not call legacy apply'
          assert 'ordax-bootstrap-seed.raw' not in portable_physical, 'public Portable flow must not depend on raw seed'
          assert 'webview' not in visuals.lower(), 'native guided visuals must not add a WebView dependency'
          assert 'http://' not in visuals.lower() and 'https://' not in visuals.lower(), 'native guided visuals must not require network assets'
          assert 'http://' not in boot_help.lower() and 'https://' not in boot_help.lower(), 'boot guidance must stay inside the Creator'

          owner_pos = backend.index('ownerPrototypePhysicalBackend()')
          dev_pos = backend.index('creatorupdate.Ensure')
          assert owner_pos < dev_pos

          print('CREATOR_UX_BASELINE=PASS')
          print('CREATOR_GUIDED_EXPERIENCE=PASS')
          print('CREATOR_NATIVE_GUIDED_VISUALS=PASS')
          print('CREATOR_INTERACTIVE_BOOT_GUIDANCE=PASS')
          print('CREATOR_USER_REQUIRED_INPUT=usb_target')
          print('CREATOR_VISIBLE_UPDATE_CONTROL=YES')
          print('CREATOR_POST_UAC_STATUS_TRANSITION=YES')
          print('CREATOR_PROGRESS_INDICATOR=YES')
          print('CREATOR_PROGRESS_BYTES=YES')
          print('CREATOR_SINGLE_STANDALONE_EXE=NO')
          print('CREATOR_OWNER_ZIP_REQUIRED=YES')
          print('CREATOR_GUI_RAW_BACKEND_LINKED=NO')
          print('CREATOR_RAW_HELPER_SEPARATE=YES')
          print('CREATOR_UPDATE_ARTIFACT=OrdaX-Creator-Owner-Prototype.zip')
          print('CREATOR_RELEASE_PIPELINE=GIT_FIRST_DEV_SPLIT_BUNDLE')
          PY
