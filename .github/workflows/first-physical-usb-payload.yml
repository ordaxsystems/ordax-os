name: First Physical USB Payload

on:
  pull_request:
    paths:
      - '.github/workflows/first-physical-usb-payload.yml'
      - '.github/actions/resolve-creator-source/**'
      - '.github/actions/assemble-surface/**'
      - 'docs/contracts/surface-source.json'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_first_physical_usb_payload_ssot.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-physical-usb-payload.yml'
      - '.github/actions/resolve-creator-source/**'
      - '.github/actions/assemble-surface/**'
      - 'docs/contracts/surface-source.json'
      - 'docs/contracts/native-release-assembly.json'
  workflow_dispatch:
    inputs:
      target_bytes:
        description: Exact capacity in bytes of the selected removable USB.
        required: true
        default: "8053063680"
        type: string

permissions:
  contents: read

jobs:
  # Migration CI verifies external source, 17-source Core and the consent
  # gate. It never treats a mutable APK index as an immutable signed release.
  validate-independent-core:
    if: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve canonical standalone Creator
        uses: ./.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/physical-dev-creator-source
      - name: Prepare verified visual source for OS policy
        uses: ./.github/actions/prepare-verified-surface
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify independent 17-source contracts and blocked physical consent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_first_physical_usb_payload_ssot -v
          python3 -m unittest tests.test_pre_usb_nova_ordax_audit -v
          python3 tools/creator/physical_promotion.py --repo-root . --output "$RUNNER_TEMP/preauthorization.json" > /dev/null
          python3 - "$RUNNER_TEMP/preauthorization.json" <<'PY'
          import json, pathlib, sys
          status = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if not (status['pre_authorization_ready'] is True
                  and status['ready'] is False
                  and status['authorization_blockers'] == ['explicit-physical-write-authorization-missing']
                  and status['authorized_candidate_materialization_allowed'] is False):
              raise SystemExit('physical consent unexpectedly changed')
          print('PHYSICAL_PREAUTHORIZATION=ELIGIBLE_NOT_AUTHORIZED')
          PY
          creator="${ORDAX_CREATOR_NATIVE_SOURCE:?missing pinned Creator source}"
          test "${ORDAX_CREATOR_SOURCE_REPOSITORY:?}" = 'ordaxsystems/ordax-creator'
          test "$(git -C "$creator" rev-parse HEAD)" = "${ORDAX_CREATOR_SOURCE_COMMIT:?}"
          test "$(git -C "$creator" rev-parse 'HEAD^{tree}')" = "${ORDAX_CREATOR_SOURCE_TREE:?}"
          (
            cd "$creator"
            ORDAX_OS_CONTRACTS_DIR="$GITHUB_WORKSPACE/docs/contracts" \
              go test -count=1 ./core ./cmd/ordax-creator \
              -run 'TestBindPortableSources(CoreInventory|RejectsIncompleteExtraOrUnsafeInput|RejectsSymlinkedRoot)$'
          )
          echo 'CREATOR_17_SOURCE_DEV_GATE=PASS_READ_ONLY'
          echo 'PHYSICAL_TARGET_DEVICE_TOUCHED=NO'

  # A physical candidate is built only after explicit Owner consent. Never
  # silently rebuild historical signed bytes using newer Alpine packages.
  payload:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WRITER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BYTES: ${{ inputs.target_bytes || '8053063680' }}

    steps:
      - name: Checkout current operator contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: operator
          persist-credentials: false


      - name: Bind writer source to exact authorized operator context
        shell: bash
        run: |
          set -euo pipefail
          # The release SHA is independent; the physical writer may not come
          # from an older or newer policy revision than this operator checkout.
          if [[ "$WRITER_SOURCE_COMMIT" != "$ORDAX_SOURCE_COMMIT" ]]; then
            echo 'Physical writer source differs from authorized operator context' >&2
            exit 1
          fi
          echo 'PHYSICAL_WRITER_CONTEXT_MATCH=PASS'

      - name: Assemble exact verified external Surface for read-only physical policy
        uses: ./operator/.github/actions/assemble-surface
        with:
          source-root: ${{ github.workspace }}/operator
          out-root: ${{ runner.temp }}/physical-verified-surface

      - name: Stage verified visual source only in disposable operator checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C operator ls-files -- system/surface/ui system/surface/workspace)"
          for part in ui workspace; do
            src="$RUNNER_TEMP/physical-verified-surface/system/surface/$part"
            dst="operator/system/surface/$part"
            test -d "$src" && test ! -L "$src"
            test ! -e "$dst" && test ! -L "$dst"
            cp -a "$src" "$dst"
            diff -qr "$src" "$dst"
          done
          test -s operator/system/surface/ui/first-run.mjs
          test -s operator/system/surface/ui/local-session-lock.mjs
          test -s operator/system/surface/ui/settings-overview-controls.mjs
          test -s operator/system/surface/ui/system-overview-controls.mjs
          test -z "$(git -C operator ls-files -- system/surface/ui system/surface/workspace)"
          echo 'PHYSICAL_POLICY_SURFACE_SOURCE=PINNED_EXTERNAL_DISPOSABLE'
          echo 'PHYSICAL_POLICY_SURFACE_TRACKED_COPY=NO'

      - name: Validate official physical promotion gate before resolving payload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 operator/tools/creator/physical_promotion.py --repo-root operator --require-ready > /dev/null
          echo 'OFFICIAL_PHYSICAL_PROMOTION=READY'

      - name: Resolve exact signed release from authorization SSOT
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          auth = json.loads(pathlib.Path(
              'operator/docs/contracts/physical-write-authorization.json'
          ).read_text(encoding='utf-8'))
          physical_mode = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          if (
              auth.get('$schema') != 'prototype-ordax.physical-write-authorization/3'
              or auth.get('status') != (
                  'authorized' if physical_mode else 'blocked-explicit-physical-authorization-pending'
              )
              or auth.get('physical_write_allowed') is not physical_mode
              or auth.get('explicit_owner_authorization') is not physical_mode
              or auth.get('scope') != 'first-real-stable-mvp-usb-proof'
              or (not physical_mode and auth.get('authorization_context_sha256') is not None)
          ):
              raise SystemExit('canonical physical authorization does not match workflow mode')

          binding = auth.get('release_binding')
          if not isinstance(binding, dict):
              raise SystemExit('canonical release binding is missing')
          source = binding.get('source_commit')
          envelope = binding.get('canonical_envelope_url')
          if not isinstance(source, str) or re.fullmatch(r'[0-9a-f]{40}', source) is None:
              raise SystemExit('canonical source commit is invalid')
          expected_url = (
              'https://github.com/ordaxsystems/ordax-os/releases/download/'
              f'ordax-stable-v4-{source}/release-envelope.json'
          )
          if envelope != expected_url:
              raise SystemExit('canonical release envelope URL is invalid')

          proof_bytes = pathlib.Path(
              'operator/docs/evidence/canonical-v4-release-proof.json'
          ).read_bytes()
          proof_sha = hashlib.sha256(proof_bytes).hexdigest()
          bindings = auth.get('bindings')
          if (
              not isinstance(bindings, dict)
              or bindings.get('canonical_v4_release_proof_sha256') != proof_sha
          ):
              raise SystemExit('canonical release proof digest mismatch')
          proof = json.loads(proof_bytes)
          if (
              proof.get('source_commit') != source
              or proof.get('canonical_envelope_url') != envelope
              or proof.get('signed_handoff_verified') is not True
              or proof.get('canonical_materialization_verified') is not True
          ):
              raise SystemExit('canonical release proof identity or verification mismatch')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'release_source_commit={source}\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'RELEASE_SOURCE_COMMIT={source}\n')
              out.write(f'ENVELOPE_URL={envelope}\n')
          print('CANONICAL_RELEASE_FROM_AUTHORIZATION_SSOT=PASS')
          PY

      - name: Checkout exact canonical release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.canonical.outputs.release_source_commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Resolve independent Creator source pinned by operator contract
        uses: ./operator/.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/ordax-creator-first-physical-source
          source-root: ${{ github.workspace }}/operator

      - name: Test independent Creator Core before heavyweight release builds
        shell: bash
        run: |
          set -euo pipefail
          creator="${ORDAX_CREATOR_NATIVE_SOURCE:?}"
          test "${ORDAX_CREATOR_SOURCE_REPOSITORY:?}" = 'ordaxsystems/ordax-creator'
          test "$(git -C "$creator" rev-parse HEAD)" = "${ORDAX_CREATOR_SOURCE_COMMIT:?}"
          test "$(git -C "$creator" rev-parse 'HEAD^{tree}')" = "${ORDAX_CREATOR_SOURCE_TREE:?}"
          test "$(head -n 1 "$creator/go.mod")" = 'module github.com/ordaxsystems/ordax-creator'
          (
            cd "$creator"
            ORDAX_OS_CONTRACTS_DIR="$GITHUB_WORKSPACE/operator/docs/contracts" \
              go test -count=1 ./core ./cmd/ordax-creator \
              -run 'TestBindPortableSources(CoreInventory|RejectsIncompleteExtraOrUnsafeInput|RejectsSymlinkedRoot)$'
            mkdir -p "$RUNNER_TEMP/first-physical-creator-cli"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$RUNNER_TEMP/first-physical-creator-cli/ordax-creator" ./cmd/ordax-creator
          )
          test -x "$RUNNER_TEMP/first-physical-creator-cli/ordax-creator"
          echo 'PORTABLE_17_SOURCE_CORE_SSOT=PASS_NON_DESTRUCTIVE'
          echo "PORTABLE_CORE_CREATOR_SHA=${ORDAX_CREATOR_SOURCE_COMMIT}"

      - name: Validate authorization, commits and target geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          from urllib.parse import urlsplit

          release_commit = os.environ['RELEASE_SOURCE_COMMIT']
          writer_commit = os.environ['WRITER_SOURCE_COMMIT']
          target_raw = os.environ['TARGET_BYTES']
          envelope_url = os.environ['ENVELOPE_URL']

          for label, value in (
              ('release_source_commit', release_commit),
              ('writer_source_commit', writer_commit),
          ):
              if re.fullmatch(r'[0-9a-f]{40}', value) is None:
                  raise SystemExit(f'{label} must be exact lowercase 40-hex')

          try:
              target_bytes = int(target_raw)
          except ValueError as exc:
              raise SystemExit('target_bytes must be an integer') from exc
          if target_bytes <= 0 or target_bytes % 512 != 0:
              raise SystemExit('target_bytes must be positive and 512-byte aligned')

          parsed = urlsplit(envelope_url)
          if (
              parsed.scheme != 'https'
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit('envelope_url must be stable public HTTPS')

          auth = json.loads(
              pathlib.Path('operator/docs/contracts/physical-write-authorization.json').read_text(
                  encoding='utf-8'
              )
          )
          if auth.get('$schema') != 'prototype-ordax.physical-write-authorization/3':
              raise SystemExit('physical-write authorization schema is not v3')
          physical_mode = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          if auth.get('status') != (
              'authorized' if physical_mode else 'blocked-explicit-physical-authorization-pending'
          ):
              raise SystemExit('physical-write authorization is incompatible with workflow mode')
          if auth.get('physical_write_allowed') is not physical_mode:
              raise SystemExit('physical write permission does not match workflow mode')
          if auth.get('explicit_owner_authorization') is not physical_mode:
              raise SystemExit('owner authorization does not match workflow mode')
          if auth.get('scope') != 'first-real-stable-mvp-usb-proof':
              raise SystemExit('physical authorization scope mismatch')

          binding = auth.get('release_binding')
          if not isinstance(binding, dict):
              raise SystemExit('canonical release binding is missing')
          if binding.get('source_commit') != release_commit:
              raise SystemExit('requested release commit differs from current authorization')
          if binding.get('canonical_envelope_url') != envelope_url:
              raise SystemExit('requested envelope URL differs from current authorization')

          proof = json.loads(
              pathlib.Path('operator/docs/evidence/canonical-v4-release-proof.json').read_text(
                  encoding='utf-8'
              )
          )
          if proof.get('source_commit') != release_commit:
              raise SystemExit('canonical proof source commit mismatch')
          if proof.get('canonical_envelope_url') != envelope_url:
              raise SystemExit('canonical proof envelope URL mismatch')
          if proof.get('signed_handoff_verified') is not True:
              raise SystemExit('canonical signed handoff proof is not verified')
          if proof.get('canonical_materialization_verified') is not True:
              raise SystemExit('canonical materialization proof is not verified')

          print('FIRST_USB_AUTHORIZATION=PASS' if physical_mode else 'FIRST_USB_PROOF_ONLY=PASS')
          print(f'RELEASE_SOURCE_COMMIT={release_commit}')
          print(f'WRITER_SOURCE_COMMIT={writer_commit}')
          print(f'TARGET_BYTES={target_bytes}')
          PY

          test "$(git -C release-source rev-parse HEAD)" = "$RELEASE_SOURCE_COMMIT"
          test "$(git -C operator rev-parse HEAD)" = "$ORDAX_SOURCE_COMMIT"

      - name: Resolve exact release kernel ABI through canonical owner
        shell: bash
        run: |
          set -euo pipefail
          python3 operator/bootstrap/kernel/ci_env.py \
            --source-contract release-source/bootstrap/kernel/source.json \
            --github-env "$GITHUB_ENV"

      - name: Install exact build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils bison bzip2 cmake curl dwarves dosfstools e2fsprogs erofs-utils exfat-fuse exfatprogs flex gdisk \
            g++ gcc gcc-13 git gperf kmod libblkid-dev libcap-dev libelf-dev \
            liblz4-dev libmount-dev libpcre2-dev libssl-dev liblzma-dev \
            libzstd-dev make meson musl-tools ninja-build openssl perl pkg-config \
            proot util-linux xz-utils
          python -m pip install --disable-pip-version-check --no-cache-dir \
            jinja2 pyelftools

      - name: Build and verify exact kernel
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          mkdir -p "$work/kernel" "$work/metadata"
          export ORDAX_SOURCE_COMMIT="$RELEASE_SOURCE_COMMIT"
          python bootstrap/kernel/build.py build \
            --jobs 4 \
            --work-dir "$work/kernel-work" \
            --out-dir "$work/kernel"
          python bootstrap/kernel/verify.py "$work/kernel"
          test -s "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION"
          test -s "$work/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"

      - name: Build and verify exact Stable Base
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          sudo -E env ORDAX_SOURCE_COMMIT="$RELEASE_SOURCE_COMMIT" \
            python bootstrap/stable-base/build.py build \
              --kernel-modules "$work/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar" \
              --out-dir "$work/stable-base" \
              --cache-dir "$work/stable-base-cache" \
              > "$work/metadata/stable-base-build.json"
          sudo chown -R "$(id -u):$(id -g)" "$work/stable-base"
          python bootstrap/stable-base/build.py verify \
            --out-dir "$work/stable-base" \
            > "$work/metadata/stable-base-verify.json"
          test -s "$work/stable-base/stable-base.erofs"

      - name: Build and verify exact bootstrap capsule
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          mkdir -p "$work/bin" "$work/capsule"
          (
            cd bootstrap/release-acquisition
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$work/bin/ordax-release-agent" .
          )
          python bootstrap/portable-v2/capsule/build.py build \
            --release-agent "$work/bin/ordax-release-agent" \
            --out "$work/capsule/bootstrap.erofs" \
            > "$work/metadata/capsule-build.json"
          python bootstrap/portable-v2/capsule/build.py verify \
            --release-agent "$work/bin/ordax-release-agent" \
            --image "$work/capsule/bootstrap.erofs" \
            > "$work/metadata/capsule-verify.json"
          test -s "$work/capsule/bootstrap.erofs"

      - name: Build and verify initramfs pinned to capsule and Stable Base
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          export ORDAX_SOURCE_COMMIT="$RELEASE_SOURCE_COMMIT"
          python bootstrap/initramfs/build.py build \
            --jobs 4 \
            --work-dir "$work/initramfs-work" \
            --out-dir "$work/initramfs" \
            --portable-bootstrap-capsule "$work/capsule/bootstrap.erofs" \
            --portable-stable-base "$work/stable-base/stable-base.erofs" \
            > "$work/metadata/initramfs-build.json"
          python bootstrap/initramfs/build.py verify \
            --out-dir "$work/initramfs" \
            > "$work/metadata/initramfs-verify.json"
          test -s "$work/initramfs/initramfs.cpio.gz"

      - name: Build and verify pinned systemd-boot
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          python boot/esp/build.py check
          python boot/esp/build.py build \
            --work-dir "$work/esp-work" \
            --out-dir "$work/esp"
          python boot/esp/build.py verify --out-dir "$work/esp"
          test -s "$work/esp/systemd-bootx64.efi"

      - name: Build exact persistent state image
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          state="$work/persistent-state.img"
          current="$work/current.txt"
          known="$work/known-good.txt"
          printf '%s\n' "$RELEASE_SOURCE_COMMIT" > "$current"
          printf '%s\n' "$RELEASE_SOURCE_COMMIT" > "$known"

          truncate -s 268435456 "$state"
          mkfs.ext4 -q -F -L ORDAX-STATE "$state"
          debugfs -w -R 'mkdir /ordax' "$state"
          debugfs -w -R 'mkdir /ordax/base' "$state"
          debugfs -w -R 'mkdir /ordax/base/upper' "$state"
          debugfs -w -R 'mkdir /ordax/base/work' "$state"
          debugfs -w -R 'mkdir /ordax/portable-release' "$state"
          debugfs -w -R 'mkdir /ordax/runtime' "$state"
          debugfs -w -R 'mkdir /home' "$state"
          debugfs -w -R "write $current /ordax/portable-release/current" "$state"
          debugfs -w -R "write $known /ordax/portable-release/known-good" "$state"
          e2fsck -fn "$state"

      - name: Materialize and verify canonical Stable v4 release bytes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          root="$work/canonical"
          mkdir -m 700 "$root"

          "$work/bin/ordax-release-agent" materialize-portable-v4 \
            --envelope-url "$ENVELOPE_URL" \
            --trust operator/bootstrap/trust/release-ed25519.json \
            --expected-commit "$RELEASE_SOURCE_COMMIT" \
            --root "$root"

          "$work/bin/ordax-release-agent" verify-portable-v4-exact \
            --trust operator/bootstrap/trust/release-ed25519.json \
            --expected-commit "$RELEASE_SOURCE_COMMIT" \
            --root "$root"

          for forbidden in current known-good candidate activation-transaction.json; do
            test ! -e "$root/$forbidden"
          done

      - name: Assemble the exact 17-source physical payload
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/first-physical-payload"
          out="$work/out"
          release="$work/canonical/releases/$RELEASE_SOURCE_COMMIT"
          surface_sha="$(tr -d '\r\n' < "$release/surface-runtime.sha256")"
          ai_sha="$(tr -d '\r\n' < "$release/local-ai-runtime.sha256")"

          mkdir -p "$out/sources"
          cp "$work/esp/systemd-bootx64.efi" "$out/sources/systemd-boot"
          cp release-source/boot/portable-v2/loader/loader.conf "$out/sources/loader-config"
          cp release-source/boot/portable-v2/loader/entries/ordax-portable.conf "$out/sources/loader-normal"
          cp release-source/boot/portable-v2/loader/entries/ordax-portable-recovery.conf "$out/sources/loader-recovery"
          cp "$work/kernel/vmlinuz-$ORDAX_KERNEL_VERSION" "$out/sources/kernel"
          cp "$work/initramfs/initramfs.cpio.gz" "$out/sources/initramfs"
          cp "$work/capsule/bootstrap.erofs" "$out/sources/bootstrap-capsule"
          cp operator/bootstrap/trust/release-ed25519.json "$out/sources/release-trust"
          cp "$work/stable-base/stable-base.erofs" "$out/sources/stable-base"
          cp "$work/persistent-state.img" "$out/sources/persistent-state"
          cp "$release/system.erofs" "$out/sources/system-image"
          cp "$work/canonical/runtimes/sha256/$surface_sha/native-surface-runtime.erofs" "$out/sources/surface-runtime-image"
          cp "$release/surface-runtime.sha256" "$out/sources/surface-runtime-ref"
          cp "$work/canonical/ai-runtimes/sha256/$ai_sha/local-ai-runtime.erofs" "$out/sources/local-ai-runtime-image"
          cp "$release/local-ai-runtime.sha256" "$out/sources/local-ai-runtime-ref"
          cp "$release/release-manifest.json" "$out/sources/release-manifest"
          cp "$release/release-envelope.json" "$out/sources/release-envelope"

          creator="$RUNNER_TEMP/first-physical-creator-cli/ordax-creator"
          test -x "$creator"
          "$creator" bind-portable-sources --sources-root "$out/sources" > "$out/bindings.json"
          python3 - "$out/bindings.json" <<'PY'
          import json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          ids = [item['id'] for item in binding['artifacts']]
          if (binding['$schema'] != 'prototype-ordax.portable-media-bindings/1'
              or len(ids) != 17 or len(set(ids)) != 17):
              raise SystemExit('invalid independent Creator source binding output')
          print('PHYSICAL_PAYLOAD_SOURCE_COUNT=17')
          print('PHYSICAL_PAYLOAD_SOURCE_BINDINGS=INDEPENDENT_CORE_SSOT')
          PY

      - name: Generate exact target-specific media and application plans
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/first-physical-payload/out"

          creator="$RUNNER_TEMP/first-physical-creator-cli/ordax-creator"
          test -x "$creator"

          "$creator" plan-portable-media \
            --target-bytes "$TARGET_BYTES" \
            --source-commit "$RELEASE_SOURCE_COMMIT" \
            --bindings "$out/bindings.json" \
            > "$out/portable-media-plan.json"

          "$creator" plan-portable-application \
            --plan "$out/portable-media-plan.json" \
            > "$out/portable-application-plan.json"

          python3 - "$out/portable-media-plan.json" "$out/portable-application-plan.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          media = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          app = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected_commit = os.environ['RELEASE_SOURCE_COMMIT']
          target_bytes = int(os.environ['TARGET_BYTES'])

          assert media['$schema'] == 'prototype-ordax.portable-media-plan/1'
          assert media['source_commit'] == expected_commit
          assert media['target_bytes'] == target_bytes
          assert len(media['artifacts']) == 17
          assert media['physical_write_authorized'] is False

          assert app['$schema'] == 'prototype-ordax.portable-application-plan/1'
          assert app['source_commit'] == expected_commit
          assert app['target_bytes'] == target_bytes
          assert len(app['operations']) == 39
          assert app['whole_disk_raw_image_required'] is False
          assert app['physical_device_bound'] is False
          assert app['physical_write_authorized'] is False
          assert app['public_promotion_allowed'] is False

          materialize = [op for op in app['operations'] if op['kind'] == 'materialize-artifact']
          readback = [op for op in app['operations'] if op['kind'] == 'readback-sha256-size']
          assert len(materialize) == 17
          assert len(readback) == 17
          print('PORTABLE_MEDIA_PLAN=PASS')
          print('PORTABLE_APPLICATION_OPERATIONS=39')
          print('PORTABLE_ARTIFACT_READBACKS=17')
          PY

      - name: Record non-destructive operator bundle provenance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/first-physical-payload/out"
          python3 - "$out/provenance.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          auth = json.loads(
              pathlib.Path('operator/docs/contracts/physical-write-authorization.json').read_text(
                  encoding='utf-8'
              )
          )
          proof = json.loads(
              pathlib.Path('operator/docs/evidence/canonical-v4-release-proof.json').read_text(
                  encoding='utf-8'
              )
          )
          payload = {
              '$schema': 'prototype-ordax.first-physical-usb-payload/1',
              'status': 'target-specific-plan-ready-not-written',
              'release_source_commit': os.environ['RELEASE_SOURCE_COMMIT'],
              'writer_source_commit': os.environ['WRITER_SOURCE_COMMIT'],
              'target_bytes': int(os.environ['TARGET_BYTES']),
              'canonical_envelope_url': os.environ['ENVELOPE_URL'],
              'release_sequence': auth['release_sequence'],
              'authorization_context_sha256': auth['authorization_context_sha256'],
              'canonical_v4_release_proof_sha256': auth['bindings']['canonical_v4_release_proof_sha256'],
              'canonical_trust_sha256': proof['canonical_trust_sha256'],
              'artifact_count': 17,
              'application_operation_count': 39,
              'whole_disk_raw_image_required': False,
              'private_key_in_bundle': False,
              'physical_target_selected': False,
              'target_specific_destructive_confirmation_recorded': False,
              'physical_write_performed': False,
              'public_stable_promoted': False,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          (
            cd "$out"
            find sources -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum bindings.json portable-media-plan.json portable-application-plan.json provenance.json
          ) > "$out/SHA256SUMS"

          echo 'FIRST_PHYSICAL_USB_PAYLOAD=READY'
          echo 'PHYSICAL_TARGET_SELECTED=NO'
          echo 'PHYSICAL_WRITE_PERFORMED=NO'

      - name: Upload first physical USB operator payload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-first-physical-payload-${{ steps.canonical.outputs.release_source_commit }}-${{ inputs.target_bytes }}
          path: ${{ runner.temp }}/first-physical-payload/out/
          if-no-files-found: error
          retention-days: 7

      - name: Destroy temporary signed release and 17 source files
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP/first-physical-payload" ]; then
            sudo rm -rf -- "$RUNNER_TEMP/first-physical-payload"
          fi
          test ! -e "$RUNNER_TEMP/first-physical-payload"
          echo 'TEMPORARY_V4_SOURCE_BYTES_DESTROYED=YES'
