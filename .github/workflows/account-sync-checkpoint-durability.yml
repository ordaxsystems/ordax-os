name: Account Sync Checkpoint Durability

on:
  pull_request:
    paths:
      - 'system/contracts/sync-checkpoint-store.mjs'
      - 'system/adapters/native/sync-checkpoint.mjs'
      - 'system/adapters/web/sync-checkpoint.mjs'
      - 'system/services/sync/session-checkpoint-store.mjs'
      - 'system/services/sync/account-runtime.mjs'
      - 'system/services/sync/workspace-metadata.mjs'
      - 'system/adapters/native/workspace.mjs'
      - 'system/surface/ui/surface-state.mjs'
      - 'system/surface/ui/surface.mjs'
      - 'system/composition/native/main.mjs'
      - 'tests/test_workspace_identity_isolation.mjs'
      - 'tests/test_workspace_persistence_contract.py'
      - 'tests/test_account_sync_and_identity_v1.py'
      - 'tools/account-sync/prove_two_clients.py'
      - '.github/workflows/account-sync-two-client-proof.yml'
      - 'tests/test_account_memory_reinstall_restore.mjs'
      - 'tests/test_native_sync_checkpoint_durability.mjs'
      - '.github/workflows/account-sync-checkpoint-durability.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/sync-checkpoint-store.mjs'
      - 'system/adapters/native/sync-checkpoint.mjs'
      - 'system/adapters/web/sync-checkpoint.mjs'
      - 'system/services/sync/session-checkpoint-store.mjs'
      - 'system/services/sync/account-runtime.mjs'
      - 'system/services/sync/workspace-metadata.mjs'
      - 'system/adapters/native/workspace.mjs'
      - 'system/surface/ui/surface-state.mjs'
      - 'system/surface/ui/surface.mjs'
      - 'system/composition/native/main.mjs'
      - 'tests/test_workspace_identity_isolation.mjs'
      - 'tests/test_workspace_persistence_contract.py'
      - 'tests/test_account_sync_and_identity_v1.py'
      - 'tools/account-sync/prove_two_clients.py'
      - '.github/workflows/account-sync-two-client-proof.yml'
      - 'tests/test_account_memory_reinstall_restore.mjs'
      - 'tests/test_native_sync_checkpoint_durability.mjs'
      - '.github/workflows/account-sync-checkpoint-durability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate checkpoint durability source syntax
        run: |
          set -euo pipefail
          node --check system/contracts/sync-checkpoint-store.mjs
          node --check system/adapters/native/sync-checkpoint.mjs
          node --check system/adapters/web/sync-checkpoint.mjs
          node --check system/services/sync/session-checkpoint-store.mjs
          node --check system/services/sync/account-runtime.mjs
          node --check tests/test_account_memory_reinstall_restore.mjs
          node --check tests/test_native_sync_checkpoint_durability.mjs
          node --check tests/test_workspace_identity_isolation.mjs
          node --check system/adapters/native/workspace.mjs
          node --check system/services/sync/workspace-metadata.mjs
          node --check system/surface/ui/surface-state.mjs
          node --check system/surface/ui/surface.mjs
          node --check system/composition/native/main.mjs

      - name: Prove restore checkpoint is durable before continuity activates
        run: |
          set -euo pipefail
          node --test tests/test_native_sync_checkpoint_durability.mjs
          node --test tests/test_account_memory_reinstall_restore.mjs
          node --test tests/test_account_sync_runtime.mjs
          node --test tests/test_workspace_identity_isolation.mjs
          python -m unittest tests.test_workspace_persistence_contract
          python -m unittest tests.test_account_sync_and_identity_v1
          node --test tests/test_account_memory_sync_orchestration.mjs
