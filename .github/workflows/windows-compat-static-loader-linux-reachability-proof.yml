name: Windows Compatibility Static Loader Linux Reachability Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/source.json'
      - 'bootstrap/windows-compat-runtime/build.py'
      - 'bootstrap/windows-compat-runtime/build-version-lock.json'
      - 'bootstrap/windows-compat-runtime/apk-content-lock.json'
      - 'bootstrap/windows-compat-runtime/toolchain.json'
      - 'bootstrap/windows-compat-runtime/full-build-execution-substrate.json'
      - 'bootstrap/windows-compat-runtime/full_build_probe.py'
      - 'bootstrap/windows-compat-runtime/container_full_build_probe.py'
      - 'bootstrap/windows-compat-runtime/locked_rootfs_container.py'
      - 'bootstrap/windows-compat-runtime/generated_idl_header_barrier.py'
      - 'bootstrap/windows-compat-runtime/runtime-dynamic-load-discovery.json'
      - 'bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py'
      - 'bootstrap/windows-compat-runtime/runtime-static-loader-targets.json'
      - 'bootstrap/windows-compat-runtime/runtime_static_loader_target_classifier.py'
      - 'bootstrap/windows-compat-runtime/runtime-static-loader-linux-reachability.json'
      - 'bootstrap/windows-compat-runtime/runtime_static_loader_linux_reachability_probe.py'
      - 'tests/test_windows_compat_build_version_lock.py'
      - 'tests/test_windows_compat_apk_content_lock.py'
      - 'tests/test_windows_compat_full_build_proof.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_static_loader_targets.py'
      - 'tests/test_windows_compat_runtime_static_loader_linux_reachability.py'
      - '.github/workflows/windows-compat-static-loader-linux-reachability-proof.yml'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/source.json'
      - 'bootstrap/windows-compat-runtime/build.py'
      - 'bootstrap/windows-compat-runtime/build-version-lock.json'
      - 'bootstrap/windows-compat-runtime/apk-content-lock.json'
      - 'bootstrap/windows-compat-runtime/toolchain.json'
      - 'bootstrap/windows-compat-runtime/full-build-execution-substrate.json'
      - 'bootstrap/windows-compat-runtime/full_build_probe.py'
      - 'bootstrap/windows-compat-runtime/container_full_build_probe.py'
      - 'bootstrap/windows-compat-runtime/locked_rootfs_container.py'
      - 'bootstrap/windows-compat-runtime/generated_idl_header_barrier.py'
      - 'bootstrap/windows-compat-runtime/runtime-dynamic-load-discovery.json'
      - 'bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py'
      - 'bootstrap/windows-compat-runtime/runtime-static-loader-targets.json'
      - 'bootstrap/windows-compat-runtime/runtime_static_loader_target_classifier.py'
      - 'bootstrap/windows-compat-runtime/runtime-static-loader-linux-reachability.json'
      - 'bootstrap/windows-compat-runtime/runtime_static_loader_linux_reachability_probe.py'
      - 'tests/test_windows_compat_build_version_lock.py'
      - 'tests/test_windows_compat_apk_content_lock.py'
      - 'tests/test_windows_compat_full_build_proof.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_static_loader_targets.py'
      - 'tests/test_windows_compat_runtime_static_loader_linux_reachability.py'
      - '.github/workflows/windows-compat-static-loader-linux-reachability-proof.yml'

permissions:
  contents: read

jobs:
  static-loader-linux-reachability-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install bounded resolver dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot
          docker version

      - name: Validate full-build and static-reachability contracts
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/validate_build_version_lock.py
          python bootstrap/windows-compat-runtime/validate_apk_content_lock.py
          python bootstrap/windows-compat-runtime/container_full_build_probe.py check
          python bootstrap/windows-compat-runtime/build.py check
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py check
          python bootstrap/windows-compat-runtime/runtime_static_loader_target_classifier.py check
          python bootstrap/windows-compat-runtime/runtime_static_loader_linux_reachability_probe.py check
          python -m unittest tests.test_windows_compat_build_version_lock -v
          python -m unittest tests.test_windows_compat_apk_content_lock -v
          python -m unittest tests.test_windows_compat_full_build_proof -v
          python -m unittest tests.test_windows_compat_runtime_dynamic_load_source -v
          python -m unittest tests.test_windows_compat_runtime_static_loader_targets -v
          python -m unittest tests.test_windows_compat_runtime_static_loader_linux_reachability -v

      - name: Reconstruct locked inputs, build Wine, and prove static loader Linux reachability
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-static-loader-linux-reachability-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"

          python bootstrap/windows-compat-runtime/container_full_build_probe.py build \
            --work-dir "$work" \
            --jobs 2 \
            --out "$proof_dir/full-build-proof.json"

          python - <<'PY' "$proof_dir/full-build-proof.json"
          import json
          import pathlib
          import re
          import sys

          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['$schema'] == 'prototype-ordax.windows-compat-full-build-proof/2'
          assert proof['status'] == 'full-build-proven-in-locked-container-staged-not-runtime-pinned-not-executable'
          gates = proof['gates']
          required_true = {
              'source_lock_verified',
              'version_lock_verified',
              'apk_content_lock_verified',
              'offline_content_replay_passed',
              'proot_full_build_rejected_by_diagnostic',
              'locked_rootfs_container_imported',
              'container_network_disabled',
              'container_rootfs_read_only',
              'container_capabilities_dropped',
              'compiler_execution_reproven_inside_container',
              'configure_completed',
              'generated_idl_header_barrier_completed',
              'full_build_proof_passed',
              'staged_install_completed',
          }
          required_false = {
              'runtime_dependency_inventory_complete',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'windows_payload_executed',
              'wine_executed',
          }
          assert set(gates) == required_true | required_false
          assert all(gates[key] is True for key in required_true)
          assert all(gates[key] is False for key in required_false)
          assert proof['compiler']['triplet'] == 'x86_64-alpine-linux-musl'
          staging = proof['staging']
          assert staging['entry_count'] > 0
          assert staging['regular_file_count'] > 0
          assert staging['total_regular_bytes'] > 0
          assert re.fullmatch(r'[0-9a-f]{64}', staging['canonical_manifest_sha256'])
          print('Wine locked-container full build: PASS')
          print('staged entries:', staging['entry_count'])
          print('staged manifest:', staging['canonical_manifest_sha256'])
          PY

          python bootstrap/windows-compat-runtime/build.py fetch-source \
            --cache-dir "$work/wine-source-cache" \
            --proof-out "$proof_dir/source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py discover \
            --archive "$work/wine-source-cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --out "$proof_dir/runtime-dynamic-load-source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_static_loader_target_classifier.py classify \
            --dynamic-source-proof "$proof_dir/runtime-dynamic-load-source-proof.json" \
            --out "$proof_dir/runtime-static-loader-target-proof.json"
          python bootstrap/windows-compat-runtime/runtime_static_loader_linux_reachability_probe.py verify \
            --source-archive "$work/wine-source-cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --dynamic-source-proof "$proof_dir/runtime-dynamic-load-source-proof.json" \
            --static-classification-proof "$proof_dir/runtime-static-loader-target-proof.json" \
            --full-build-proof "$proof_dir/full-build-proof.json" \
            --build-output-dir "$work/container-build/wine-output" \
            --stage-dir "$work/container-build/stage" \
            --out "$proof_dir/runtime-static-loader-linux-reachability-proof.json"

          python - <<'PY' \
            "$proof_dir/full-build-proof.json" \
            "$proof_dir/runtime-dynamic-load-source-proof.json" \
            "$proof_dir/runtime-static-loader-target-proof.json" \
            "$proof_dir/runtime-static-loader-linux-reachability-proof.json"
          import json
          import pathlib
          import re
          import sys

          full, dynamic, static, reachability = [
              json.loads(pathlib.Path(path).read_text(encoding='utf-8')) for path in sys.argv[1:]
          ]
          assert dynamic['runtime_id'] == static['runtime_id'] == reachability['runtime_id'] == full['runtime_id']
          assert dynamic['counts']['direct_loader_calls'] == 48
          assert static['counts']['static_callsites'] == 6
          assert static['counts']['host_platforms'] == {'android': 5, 'macos': 1}
          assert reachability['$schema'] == 'prototype-ordax.windows-compat-runtime-static-loader-linux-reachability-proof/1'
          assert reachability['status'] == 'static-loader-linux-reachability-verified-all-static-callsites-host-disabled-not-dynamic-inventory-complete'
          assert reachability['compiler_triplet'] == 'x86_64-alpine-linux-musl'
          assert reachability['configure_host'] == 'x86_64-alpine-linux-musl'
          assert reachability['configure_host_os'] == 'linux-musl'
          assert reachability['staging_manifest_sha256'] == full['staging']['canonical_manifest_sha256']
          assert reachability['counts'] == {
              'modules': 2,
              'reachable_static_callsites': 0,
              'static_callsites': 6,
              'unreachable_host_disabled_static_callsites': 6,
          }
          assert all(item['reachability'] == 'unreachable-host-disabled' for item in reachability['modules'])
          assert all(not item['staged_artifact_hits'] for item in reachability['modules'])
          assert all(item['reachability'] == 'unreachable-host-disabled' for item in reachability['callsites'])
          assert re.fullmatch(r'[0-9a-f]{64}', reachability['evidence_sha256'])
          gates = reachability['gates']
          required_true = {
              'source_archive_verified',
              'dynamic_source_recomputed',
              'static_classification_recomputed',
              'full_build_proof_verified',
              'configure_host_identity_verified',
              'configure_host_selection_semantics_verified',
              'generated_disabled_subdirs_verified',
              'staging_manifest_recomputed',
              'linux_build_reachability_verified',
              'static_target_runtime_resolution_complete',
          }
          required_false = {
              'configured_soname_caller_loader_context_complete',
              'runtime_computed_target_resolution_complete',
              'wrapper_call_graph_complete',
              'generated_source_inventory_complete',
              'dynamic_load_inventory_complete',
              'external_transitive_closure_verified',
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          }
          assert set(gates) == required_true | required_false
          assert all(gates[key] is True for key in required_true)
          assert all(gates[key] is False for key in required_false)
          print('Wine static loader Linux reachability: PASS')
          print('static callsites proven unreachable:', reachability['counts']['unreachable_host_disabled_static_callsites'])
          print('evidence:', reachability['evidence_sha256'])
          PY

      - name: Upload full-build and static-loader reachability metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-static-loader-linux-reachability-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-static-loader-linux-reachability-proof/full-build-proof.json
            ${{ runner.temp }}/windows-compat-static-loader-linux-reachability-proof/source-proof.json
            ${{ runner.temp }}/windows-compat-static-loader-linux-reachability-proof/runtime-dynamic-load-source-proof.json
            ${{ runner.temp }}/windows-compat-static-loader-linux-reachability-proof/runtime-static-loader-target-proof.json
            ${{ runner.temp }}/windows-compat-static-loader-linux-reachability-proof/runtime-static-loader-linux-reachability-proof.json
          if-no-files-found: error
