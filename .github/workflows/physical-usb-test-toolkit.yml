name: Physical USB Backend Safety

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/**'
      - 'tests/test_owner_dev_helper_storage_profile.py'
      - 'tests/test_portable_windows_gpt_idempotence.py'
      - '.github/workflows/physical-usb-test-toolkit.yml'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_physical_backend_external_source.py'
  pull_request:
    paths:
      - 'tools/creator/**'
      - 'tests/test_owner_dev_helper_storage_profile.py'
      - 'tests/test_portable_windows_gpt_idempotence.py'
      - '.github/workflows/physical-usb-test-toolkit.yml'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_physical_backend_external_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-physical-backend-safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve independent Creator with immutable source and tree
        uses: ./.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/ordax-creator-physical-safety

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Regress external-source safety workflow boundary
        run: python -m unittest tests.test_creator_physical_backend_external_source -v

      - name: Regress independent Owner split-helper profile and Windows GPT idempotence
        run: |
          python -m unittest tests.test_owner_dev_helper_storage_profile -v
          python -m unittest tests.test_portable_windows_gpt_idempotence -v

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test Creator and tagged raw backend
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = $env:ORDAX_CREATOR_NATIVE_SOURCE
          if (-not $source -or -not (Test-Path -LiteralPath $source)) { throw 'independent Creator checkout missing' }
          if ($env:ORDAX_CREATOR_SOURCE_REPOSITORY -ne 'ordaxsystems/ordax-creator') { throw 'Creator repository authority mismatch' }
          if ((git -C $source rev-parse HEAD).Trim() -ne $env:ORDAX_CREATOR_SOURCE_COMMIT) { throw 'independent Creator SHA mismatch' }
          if ((git -C $source rev-parse 'HEAD^{tree}').Trim() -ne $env:ORDAX_CREATOR_SOURCE_TREE) { throw 'independent Creator tree mismatch' }
          if ((Get-Content -LiteralPath (Join-Path $source 'go.mod') -TotalCount 1).Trim() -ne 'module github.com/ordaxsystems/ordax-creator') { throw 'independent Go module mismatch' }
          $env:ORDAX_OS_CONTRACTS_DIR = Join-Path $env:GITHUB_WORKSPACE 'docs/contracts'
          Push-Location $source
          try {
            go test -count=1 ./...
            if ($LASTEXITCODE -ne 0) { throw 'standalone Creator core tests failed' }
            go test -count=1 -tags ordax_raw_backend ./host/windows
            if ($LASTEXITCODE -ne 0) { throw 'Windows raw backend tests failed' }
            go test -count=1 -tags ordax_raw_backend ./cmd/ordax-creator-physical-test
            if ($LASTEXITCODE -ne 0) { throw 'Windows physical helper tests failed' }
          } finally {
            Pop-Location
          }
          Write-Host 'CREATOR_PHYSICAL_SOURCE=PINNED_INDEPENDENT'

      - name: Build unbound raw backend test executable
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out/physical-backend-safety'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $source = $env:ORDAX_CREATOR_NATIVE_SOURCE
          if (-not $source -or -not (Test-Path -LiteralPath $source)) { throw 'independent Creator checkout missing' }
          $binary = Join-Path $out 'ordax-creator-physical-test.exe'
          $env:ORDAX_OS_CONTRACTS_DIR = Join-Path $env:GITHUB_WORKSPACE 'docs/contracts'
          Push-Location $source
          try {
            go build -trimpath -buildvcs=false -tags ordax_raw_backend `
              -ldflags='-s -w' `
              -o $binary `
              ./cmd/ordax-creator-physical-test
            if ($LASTEXITCODE -ne 0) { throw 'standalone physical test helper build failed' }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'standalone helper missing after build' }

      - name: Prove unbound backend remains fail closed
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'out/physical-backend-safety/ordax-creator-physical-test.exe'
          $status = & $exe status | ConvertFrom-Json
          if ($status.raw_backend_linked -ne $true) { throw 'tagged raw backend is not linked' }
          if ($status.portable_writer_linked -ne $true) { throw 'Portable writer is not linked into tagged backend' }
          if ($status.portable_writer_ready -ne $false) { throw 'unbound Portable writer unexpectedly reports ready' }
          if ($status.build.ready -ne $false) { throw 'unbound backend unexpectedly reports ready' }
          if ($status.build.physical_write_authorized -ne $false) { throw 'unbound backend unexpectedly authorizes physical write' }

          $prepareOutput = & $exe prepare --confirm ('0' * 64) --seed missing.raw --out missing-out.raw 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'unbound prepare unexpectedly succeeded' }
          if (($prepareOutput -join "`n") -notmatch 'inspection-only') { throw 'prepare did not fail closed' }

          $applyOutput = & $exe apply --confirm ('0' * 64) --image missing.raw --sha256 ('0' * 64) --size 512 --authorize ('0' * 64) 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'unbound apply unexpectedly succeeded' }
          if (($applyOutput -join "`n") -notmatch 'inspection-only') { throw 'apply did not fail closed' }
          $global:LASTEXITCODE = 0

          $portablePrepare = & $exe prepare-portable --confirm ('0' * 64) --plan missing-plan.json 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'unbound prepare-portable unexpectedly succeeded' }
          if (($portablePrepare -join "`n") -notmatch 'not authorized') { throw 'prepare-portable did not fail closed on authorization' }
          $global:LASTEXITCODE = 0

          $portableApply = & $exe apply-portable --confirm ('0' * 64) --plan missing-plan.json --authorize ('0' * 64) 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'unbound apply-portable unexpectedly succeeded' }
          if (($portableApply -join "`n") -notmatch 'not authorized') { throw 'apply-portable did not fail closed on authorization' }
          $global:LASTEXITCODE = 0

          Write-Host 'RAW_BACKEND_INTERNAL_CI=PASS'
          Write-Host 'PORTABLE_WRITER_LINKED=YES'
          Write-Host 'PORTABLE_WRITER_READY=NO'
          Write-Host 'RAW_BACKEND_READY=NO'
          Write-Host 'PHYSICAL_WRITE_AUTHORIZED=NO'
          Write-Host 'END_USER_TOOLKIT_PUBLISHED=NO'
          Write-Host 'PUBLISHER_SIGNING_TOOL_IN_CONSUMER_ARTIFACT=NO'

      - name: Prove Portable writer implements plan not whole-disk RAW
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = $env:ORDAX_CREATOR_NATIVE_SOURCE
          if (-not $source) { throw 'independent Creator checkout missing' }
          $runtime = Get-Content -LiteralPath (Join-Path $source 'host/windows/portable_apply_windows.go') -Raw
          $core = Get-Content -LiteralPath (Join-Path $source 'core/portable_application_executor.go') -Raw
          foreach ($required in @(
            'ExecutePortableApplication',
            'Clear-Disk',
            'Initialize-Disk',
            'ORDAX-ESP',
            'ORDAX-DATA',
            'Format-Volume',
            'FAT32',
            'exFAT',
            'Readback',
            'revalidatePortableTarget'
          )) {
            if ($runtime -notmatch [regex]::Escape($required)) {
              throw "Portable writer is missing required boundary: $required"
            }
          }
          if ($runtime -match 'PreparePhysicalStorageImage') {
            throw 'Portable writer regressed to whole-disk RAW preparation'
          }
          if ($core -notmatch 'requires 39 operations' -or
              $core -notmatch 'exactly 17 artifact materializations and readbacks') {
            throw 'Core Portable executor no longer fixes the canonical 39-operation policy'
          }
          Write-Host 'PORTABLE_WRITER_WHOLE_DISK_RAW=NO'
          Write-Host 'PORTABLE_WRITER_OPERATION_POLICY=39'
          Write-Host 'PORTABLE_WRITER_ARTIFACT_READBACKS=17'

      - name: Ensure no end-user toolkit is emitted
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'out/physical-usb-test-toolkit') {
            throw 'legacy end-user physical toolkit was unexpectedly recreated'
          }
          Write-Host 'LEGACY_PHYSICAL_USB_TOOLKIT=RETIRED'
