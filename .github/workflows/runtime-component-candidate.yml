      - 'system/surface/runtime/native_store_catalog_acquisition.py'
      - 'tests/test_native_store_catalog_acquisition.py'
      - 'system/surface/runtime/native_app_artifact_store.py'
      - 'system/surface/runtime/native_app_artifact_acquisition.py'
      - 'tests/test_native_app_artifact_acquisition.py'
      - 'system/surface/runtime/native_app_lifecycle_executor.py'
      - 'tests/test_native_app_lifecycle_executor.py'
      - 'tests/test_native_app_artifact_store.py'
      - 'system/surface/runtime/native_host_server.py'
      - 'tests/test_native_store_catalog_host.py'
      - 'tests/test_native_store_catalog.py'
      - 'tests/test_native_store_lifecycle_host.py'
      - 'docs/contracts/runtime-component-package.json'
      - 'docs/contracts/runtime-component-trust-policy.json'
      - 'system/trust/**'
      - 'system/apps/internet/**'
      - 'system/components/**'
      - 'system/services/local-ai/**'
      - 'system/services/intelligence/**'
      - 'system/contracts/surface-render-lifecycle.mjs'
      - 'system/contracts/browser-*.mjs'
      - 'system/contracts/component-*.mjs'
      - 'system/contracts/file-space.mjs'
      - 'system/contracts/project-*.mjs'
      - 'system/services/components/**'
      - 'tools/component-package/**'
