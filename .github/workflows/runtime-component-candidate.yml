      - 'system/surface/runtime/native_component_slots.py'
      - 'system/surface/runtime/native_component_pending_decision.py'
      - 'tests/test_native_component_pending_decision.py'
      - 'tests/test_native_component_slots.py'
      - 'tests/test_component_probation_loader.mjs'
      - 'tests/test_component_probation_orchestrator.mjs'
      - 'tests/test_native_component_probation_composition.mjs'
      - 'tests/test_component_promotion_policy.mjs'
      - 'tests/test_component_pending_decision_plan.mjs'
      - 'tests/test_native_component_probation.py'
      - 'tools/source_graph.py'
      - 'tests/test_runtime_component_package.py'
      - 'tests/test_runtime_component_trust_promotion.py'
      - '.github/workflows/runtime-component-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internet-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Validate package and signed-slot regressions
        run: |
          set -euo pipefail
          node --version
          python -m unittest tests.test_runtime_component_package -v
          python -m unittest tests.test_runtime_component_trust_promotion -v
          node --test tests/test_component_probation_loader.mjs
          node --test tests/test_component_probation_orchestrator.mjs
          node --test tests/test_native_component_probation_composition.mjs
          node --test tests/test_component_promotion_policy.mjs
          node --test tests/test_component_pending_decision_plan.mjs
          python -m unittest tests.test_native_component_slots -v
          python -m unittest tests.test_native_component_pending_decision -v
          python -m unittest tests.test_native_component_probation -v
          python -m unittest tests.test_dynamic_component_probation_contract -v
          node --test tests/test_native_app_lifecycle_delegate.mjs
          python -m py_compile system/surface/runtime/native_store_catalog.py system/surface/runtime/native_host_server.py
          python -m py_compile system/surface/runtime/native_store_https_origin.py tests/test_native_store_https_origin.py
          python -m py_compile system/surface/runtime/native_store_catalog.py system/surface/runtime/native_store_catalog_acquisition.py system/surface/runtime/native_app_artifact_store.py system/surface/runtime/native_app_artifact_acquisition.py system/surface/runtime/native_app_lifecycle_executor.py system/surface/runtime/native_host_server.py
          python -m py_compile system/surface/runtime/native_component_slots.py
          python -m py_compile system/surface/runtime/native_component_pending_decision.py
          python -m unittest tests.test_native_store_catalog -v
          python -m unittest tests.test_native_store_https_origin -v
          python -m unittest tests.test_native_store_catalog_acquisition -v
          python -m unittest tests.test_native_app_artifact_store -v
          python -m unittest tests.test_native_app_artifact_acquisition -v
          python -m unittest tests.test_native_app_lifecycle_executor -v
          python -m unittest tests.test_native_store_catalog_host -v
          python -m unittest tests.test_native_store_lifecycle_host -v
          python tools/component-package/build.py check --component internet
          python tools/component-package/build.py check --component local-ai-service
          python tools/component-package/build.py check --component ordax-intelligence
          (
            cd tools/runtime-component-channel
            go test -count=1 ./...
          )

      - name: Build deterministic Internet candidate twice
        run: |
          set -euo pipefail
          mkdir -p out/runtime-components "$RUNNER_TEMP/runtime-components-repeat"
          python tools/component-package/build.py build \
            --component internet \
            --source-commit "$GITHUB_SHA" \
            --out out/runtime-components/internet.zip
          python tools/component-package/build.py verify \
            --package out/runtime-components/internet.zip

          python tools/component-package/build.py build \
            --component internet \
            --source-commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/runtime-components-repeat/internet.zip"
          python tools/component-package/build.py verify \
            --package "$RUNNER_TEMP/runtime-components-repeat/internet.zip"

          cmp out/runtime-components/internet.zip "$RUNNER_TEMP/runtime-components-repeat/internet.zip"
          sha256sum out/runtime-components/internet.zip
          python tools/component-package/build.py describe \
            --package out/runtime-components/internet.zip \
            --out out/runtime-components/runtime-component-release.json
          echo 'RUNTIME_COMPONENT_REPEATABILITY=PASS'
          echo 'RUNTIME_COMPONENT_DIRECT_ACTIVATION_ALLOWED=NO'
          echo 'RUNTIME_COMPONENT_PUBLISHED=NO'

      - name: Build deterministic Intelligence package candidates twice
        run: |
          set -euo pipefail
          mkdir -p out/runtime-components "$RUNNER_TEMP/runtime-components-repeat"
          for component in local-ai-service ordax-intelligence; do
            python tools/component-package/build.py build \
              --component "$component" \
              --source-commit "$GITHUB_SHA" \
              --out "out/runtime-components/$component.zip"
            python tools/component-package/build.py verify \
              --package "out/runtime-components/$component.zip"
            python tools/component-package/build.py build \
              --component "$component" \
              --source-commit "$GITHUB_SHA" \
              --out "$RUNNER_TEMP/runtime-components-repeat/$component.zip"
            python tools/component-package/build.py verify \
              --package "$RUNNER_TEMP/runtime-components-repeat/$component.zip"
            cmp "out/runtime-components/$component.zip" \
              "$RUNNER_TEMP/runtime-components-repeat/$component.zip"
            sha256sum "out/runtime-components/$component.zip"
          done
          echo 'INTELLIGENCE_COMPONENT_PACKAGING_REPEATABILITY=PASS'
          echo 'INTELLIGENCE_COMPONENT_ACTIVATION_ALLOWED=NO'

      - name: Prove signed envelope and immutable slot staging
        run: |
          set -euo pipefail
          release_mode="$(python -c 'import json; print(json.load(open("out/runtime-components/runtime-component-release.json", encoding="utf-8"))["component"]["release_mode"])')"
          if [ "$release_mode" = "git-app" ]; then
            echo 'RUNTIME_COMPONENT_SIGNED_STAGING=SKIPPED_GIT_APP'
            echo 'RUNTIME_COMPONENT_ACTIVATED=NO'
            exit 0
          fi

          channel="$PWD/out/runtime-components/ordax-runtime-component-channel"
          (
            cd tools/runtime-component-channel
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/runtime-components/ordax-runtime-component-channel .
          )

          work="$RUNNER_TEMP/runtime-component-signing-proof"
          slots="$RUNNER_TEMP/runtime-component-slots"
          mkdir -p "$work" "$slots"
          chmod 0700 "$work"

          "$channel" generate-key \
            --private-key "$work/private.pem" \
            --trust out/runtime-components/runtime-component-trust.json \
            --key-id runtime-components-ci-test-1

          "$channel" sign \
            --release out/runtime-components/runtime-component-release.json \
            --private-key "$work/private.pem" \
            --trust out/runtime-components/runtime-component-trust.json \
            --key-id runtime-components-ci-test-1 \
            --out out/runtime-components/runtime-component-envelope.json

          "$channel" verify-envelope \
            --envelope out/runtime-components/runtime-component-envelope.json \
            --trust out/runtime-components/runtime-component-trust.json

          stage_output="$("$channel" stage \
            --envelope out/runtime-components/runtime-component-envelope.json \
            --trust out/runtime-components/runtime-component-trust.json \
            --package out/runtime-components/internet.zip \
            --root "$slots")"
          printf '%s\n' "$stage_output"
          grep -q 'RUNTIME_COMPONENT_STAGED=YES' <<<"$stage_output"
          grep -q 'PENDING_HEALTH_REQUIRED=YES' <<<"$stage_output"
          grep -q 'ACTIVATED=NO' <<<"$stage_output"

          slot="$slots/internet/versions/0.3.0/$GITHUB_SHA"
          "$channel" verify-slot \
            --slot "$slot" \
            --trust out/runtime-components/runtime-component-trust.json

          rm -f "$work/private.pem"
          test ! -e "$work/private.pem"
          echo 'RUNTIME_COMPONENT_SIGNED_PROTOCOL=PASS'
          echo 'RUNTIME_COMPONENT_IMMUTABLE_SLOT_STAGING=PASS'
          echo 'RUNTIME_COMPONENT_PRIVATE_KEY_REMOVED=YES'
          echo 'RUNTIME_COMPONENT_CANONICAL_TRUST=NO'
          echo 'RUNTIME_COMPONENT_ACTIVATED=NO'

      - name: Upload runtime component candidate proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-runtime-component-internet-${{ github.sha }}
          path: |
            out/runtime-components/internet.zip
            out/runtime-components/local-ai-service.zip
            out/runtime-components/ordax-intelligence.zip
            out/runtime-components/runtime-component-release.json
            out/runtime-components/runtime-component-envelope.json
            out/runtime-components/runtime-component-trust.json
          if-no-files-found: error
          retention-days: 14
