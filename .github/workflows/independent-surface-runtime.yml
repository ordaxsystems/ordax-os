name: Independent Surface Runtime

on:
  pull_request:
    paths:
      - 'bootstrap/independent-surface-runtime/**'
      - 'bootstrap/independent-base/source.json'
      - 'bootstrap/kernel/source.json'
      - 'tests/test_independent_surface_runtime.py'
      - '.github/workflows/independent-surface-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Alpine-free Surface migration contract
        run: |
          python3 -m unittest tests.test_independent_surface_runtime -v
          python3 -m py_compile \
            bootstrap/independent-surface-runtime/build.py \
            bootstrap/independent-surface-runtime/prepare_config.py
          python3 bootstrap/independent-surface-runtime/prepare_config.py check
          python3 bootstrap/independent-surface-runtime/build.py check

  buildroot-surface:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install only Surface Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc perl bison flex gawk cpio unzip rsync file \
            wget curl patch git xz-utils erofs-utils util-linux
      - name: Restore exact Surface compiler cache
        id: surface-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent-surface-ccache
          key: ordax-independent-surface-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap/independent-surface-runtime/configs/ordax_surface_defconfig', 'bootstrap/independent-base/source.json', 'bootstrap/kernel/source.json') }}
      - name: Bind Buildroot toolchain headers to canonical OrdaX kernel SSOT
        run: |
          python3 bootstrap/independent-surface-runtime/prepare_config.py materialize \
            --out bootstrap/independent-surface-runtime/configs/ordax_surface_defconfig
          grep -Fx 'BR2_KERNEL_HEADERS_VERSION=y' \
            bootstrap/independent-surface-runtime/configs/ordax_surface_defconfig
          expected="$(python3 -c 'import json; print(json.load(open("bootstrap/kernel/source.json"))["version"])')"
          grep -Fx "BR2_DEFAULT_KERNEL_VERSION=\"$expected\"" \
            bootstrap/independent-surface-runtime/configs/ordax_surface_defconfig
      - name: Resolve exact Kconfig before expensive graphical build
        env:
          BR2_CCACHE_DIR: ${{ runner.temp }}/ordax-independent-surface-ccache
        run: |
          python3 bootstrap/independent-surface-runtime/prepare_config.py preflight \
            --cache "$RUNNER_TEMP/ordax-independent-surface-cache"
      - name: Build and verify Buildroot/musl Surface runtime
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BR2_CCACHE_DIR: ${{ runner.temp }}/ordax-independent-surface-ccache
        run: |
          python3 bootstrap/independent-surface-runtime/build.py build \
            --out "$RUNNER_TEMP/ordax-independent-surface" \
            --cache "$RUNNER_TEMP/ordax-independent-surface-cache" \
            --jobs 4
          python3 bootstrap/independent-surface-runtime/build.py verify \
            --out "$RUNNER_TEMP/ordax-independent-surface"
      - name: Save exact Surface compiler cache
        if: always() && steps.surface-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent-surface-ccache
          key: ${{ steps.surface-ccache.outputs.cache-primary-key }}
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-independent-surface-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ordax-independent-surface/provenance.json
            ${{ runner.temp }}/ordax-independent-surface/native-surface-runtime-buildroot.erofs
          if-no-files-found: warn
          retention-days: 7
