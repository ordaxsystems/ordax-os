name: Portable USB v2 Disposable Proof

on:
  push:
    branches: [main]
    paths:
      - 'docs/contracts/portable-usb-v2.json'
      - 'docs/contracts/storage-architecture.json'
      - 'docs/PHYSICAL-MEDIA.md'
      - 'tools/creator/core/storage_profiles.go'
      - 'tools/creator/core/portable_media.go'
      - 'tools/creator/core/portable_media_test.go'
      - 'tools/creator/core/storage_profiles_test.go'
      - 'tools/creator/cmd/ordax-creator/main.go'
      - 'tools/creator/proof/portable_usb_v2.py'
      - 'tools/creator/proof/portable_prepared_media.py'
      - 'docs/contracts/creator-portable-media-plan.json'
      - 'tests/test_creator_portable_prepared_media.py'
      - 'tests/test_portable_usb_v2_contract.py'
      - 'tests/test_storage_architecture_contract.py'
      - '.github/workflows/portable-usb-v2-proof.yml'
      - '.github/workflows/first-physical-usb-payload.yml'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_portable_external_source.py'
  pull_request:
    paths:
      - 'docs/contracts/portable-usb-v2.json'
      - 'docs/contracts/storage-architecture.json'
      - 'docs/PHYSICAL-MEDIA.md'
      - 'tools/creator/core/storage_profiles.go'
      - 'tools/creator/core/portable_media.go'
      - 'tools/creator/core/portable_media_test.go'
      - 'tools/creator/core/storage_profiles_test.go'
      - 'tools/creator/cmd/ordax-creator/main.go'
      - 'tools/creator/proof/portable_usb_v2.py'
      - 'tools/creator/proof/portable_prepared_media.py'
      - 'docs/contracts/creator-portable-media-plan.json'
      - 'tests/test_creator_portable_prepared_media.py'
      - 'tests/test_portable_usb_v2_contract.py'
      - 'tests/test_storage_architecture_contract.py'
      - '.github/workflows/portable-usb-v2-proof.yml'
      - '.github/workflows/first-physical-usb-payload.yml'
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'tests/test_creator_portable_external_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-usb-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve canonical independent Creator source
        uses: ./.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/ordax-creator-portable-proof

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Regress portable independent source and physical safety
        run: python3 -m unittest tests.test_creator_portable_external_source -v

      - name: Install disposable portable-storage tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdisk \
            dosfstools \
            exfatprogs \
            exfat-fuse \
            erofs-utils \
            e2fsprogs \
            util-linux
          command -v sgdisk
          command -v mkfs.vfat
          command -v mkfs.exfat
          command -v mount.exfat-fuse
          command -v mkfs.erofs
          command -v fsck.erofs
          command -v mkfs.ext4
          command -v debugfs
          command -v losetup

      - name: Validate portable USB contracts and Creator planner
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_portable_usb_v2_contract \
            tests.test_storage_architecture_contract \
            tests.test_creator_portable_prepared_media -v
          creator="${ORDAX_CREATOR_NATIVE_SOURCE:?missing external Creator checkout}"
          test "${ORDAX_CREATOR_SOURCE_REPOSITORY:?}" = 'ordaxsystems/ordax-creator'
          test "$(git -C "$creator" rev-parse HEAD)" = "${ORDAX_CREATOR_SOURCE_COMMIT:?}"
          test "$(git -C "$creator" rev-parse 'HEAD^{tree}')" = "${ORDAX_CREATOR_SOURCE_TREE:?}"
          test "$(head -n 1 "$creator/go.mod")" = 'module github.com/ordaxsystems/ordax-creator'
          (
            cd "$creator"
            ORDAX_OS_CONTRACTS_DIR="$GITHUB_WORKSPACE/docs/contracts" \
              go test -count=1 ./core ./cmd/ordax-creator
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$RUNNER_TEMP/portable-creator-cli" ./cmd/ordax-creator
          )
          test -x "$RUNNER_TEMP/portable-creator-cli"
          echo 'PORTABLE_CREATOR_SOURCE=PINNED_INDEPENDENT'
          echo 'PORTABLE_PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Generate exact Creator portable target plan
        run: |
          set -euo pipefail
          target_bytes="$(python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('docs/contracts/portable-usb-v2.json').read_text())
          print(contract['target_bytes'])
          PY
          )"
          creator_cli="$RUNNER_TEMP/portable-creator-cli"
          test -x "$creator_cli"
          "$creator_cli" plan-portable --target-bytes "$target_bytes" \
            > "$RUNNER_TEMP/portable-usb-v2-plan.json"

          python3 - "$RUNNER_TEMP/portable-usb-v2-plan.json" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert plan['profile'] == 'portable-usb'
          assert plan['payload_name'] == 'ORDAX-DATA'
          assert plan['esp_bytes'] == 512 * 1024 * 1024
          assert plan['payload_last_lba'] == plan['last_usable_lba']
          print('PORTABLE_USB_V2_PLAN=PASS')
          PY

      - name: Prove Creator Core final artifact plan on disposable prepared media
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/creator-portable-prepared"
          fixtures="$root/fixtures"
          mkdir -p "$fixtures" "$root/metadata"
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          target_bytes="$(python3 - <<'PY'
          import json, pathlib
          contract = json.loads(pathlib.Path('docs/contracts/portable-usb-v2.json').read_text())
          print(contract['target_bytes'])
          PY
          )"

          # Fixture names are test-only; the independent Creator is the sole
          # owner of the canonical 17-source identity, size and SHA-256 binding.
          python3 - "$fixtures" <<'PY'
          import pathlib, sys
          fixtures = pathlib.Path(sys.argv[1])
          ids = [
              'systemd-boot', 'loader-config', 'loader-normal', 'loader-recovery',
              'kernel', 'initramfs', 'bootstrap-capsule', 'release-trust',
              'stable-base', 'persistent-state', 'system-image',
              'surface-runtime-image', 'surface-runtime-ref',
              'local-ai-runtime-image', 'local-ai-runtime-ref',
              'release-manifest', 'release-envelope',
          ]
          assert len(ids) == 17 and len(set(ids)) == 17
          for index, artifact_id in enumerate(ids):
              payload = (
                  f'ORDAX_PORTABLE_V2_CREATOR_FIXTURE={artifact_id}\n'
                  f'INDEX={index}\n'
              ).encode()
              (fixtures / artifact_id).write_bytes(payload)
          PY
          creator_cli="$RUNNER_TEMP/portable-creator-cli"
          test -x "$creator_cli"
          "$creator_cli" bind-portable-sources --sources-root "$fixtures" \
            > "$root/bindings.json"
          binding_proof="$("$creator_cli" verify-portable-sources \
            --sources-root "$fixtures" --bindings "$root/bindings.json")"
          printf '%s\n' "$binding_proof"
          grep -qx 'PORTABLE_SOURCES_VERIFIED=YES' <<<"$binding_proof"
          grep -qx 'PORTABLE_SOURCE_COUNT=17' <<<"$binding_proof"
          grep -qx 'PHYSICAL_WRITE_AUTHORIZED=NO' <<<"$binding_proof"
          echo 'PORTABLE_FIXTURE_BINDINGS=INDEPENDENT_CORE_SSOT'

          "$creator_cli" plan-portable-media \
            --target-bytes "$target_bytes" \
            --source-commit "$commit" \
            --bindings "$root/bindings.json" > "$root/plan.json"

          # Derive readback source transport from the independently verified
          # binding JSON, not from a second hard-coded 17-ID list.
          python3 - "$root/bindings.json" "$fixtures" <<'PY' > "$root/source-ids.txt"
          import json, pathlib, re, stat, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          root = pathlib.Path(sys.argv[2])
          ids = [entry['id'] for entry in binding['artifacts']]
          if (binding['$schema'] != 'prototype-ordax.portable-media-bindings/1'
              or len(ids) != 17 or len(set(ids)) != 17):
              raise SystemExit('invalid canonical 17-source binding')
          for artifact_id in ids:
              if re.fullmatch(r'[a-z0-9][a-z0-9-]*', artifact_id) is None:
                  raise SystemExit('unsafe source ID')
              path = root / artifact_id
              if not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit('non-regular fixture source')
              print(artifact_id)
          PY
          mapfile -t source_ids < "$root/source-ids.txt"
          test "${#source_ids[@]}" -eq 17
          args=()
          for id in "${source_ids[@]}"; do
            args+=(--source "$id=$fixtures/$id")
          done

          sudo -E python3 tools/creator/proof/portable_prepared_media.py \
            --plan "$root/plan.json" \
            "${args[@]}" \
            --out "$root/portable-prepared.raw" \
            --proof "$root/metadata/prepared-proof.json"

          sudo chown "$(id -u):$(id -g)" "$root/metadata/prepared-proof.json"
          python3 - "$root/metadata/prepared-proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof['status'] == 'pass'
          assert proof['artifact_count'] == 17
          assert proof['partitions'] == ['ORDAX-ESP', 'ORDAX-DATA']
          assert proof['physical_target_device_touched'] is False
          assert proof['physical_write_authorized'] is False
          assert proof['public_physical_promotion_allowed'] is False
          assert all(proof['checks'].values())
          print('CREATOR_PORTABLE_V2_PREPARED_MEDIA=PASS')
          print('PHYSICAL_TARGET_DEVICE_TOUCHED=NO')
          print('PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

          sudo rm -f "$root/portable-prepared.raw"
          test ! -e "$root/portable-prepared.raw"

      - name: Prove host-neutral portable application transaction plan
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/creator-portable-prepared"
          test -s "$root/plan.json"
          creator_cli="$RUNNER_TEMP/portable-creator-cli"
          test -x "$creator_cli"
          "$creator_cli" plan-portable-application --plan "$root/plan.json" \
            > "$root/application-plan.json"

          python3 - "$root/application-plan.json" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert plan['$schema'] == 'prototype-ordax.portable-application-plan/1'
          assert plan['status'] == 'planned-not-authorized'
          assert plan['profile'] == 'portable-usb'
          assert [p['name'] for p in plan['partitions']] == ['ORDAX-ESP', 'ORDAX-DATA']
          assert [p['filesystem'] for p in plan['partitions']] == ['fat32', 'exfat']
          assert plan['whole_disk_raw_image_required'] is False
          assert plan['physical_device_bound'] is False
          assert plan['physical_write_authorized'] is False
          assert plan['public_promotion_allowed'] is False
          assert len(plan['operations']) == 39
          materialize = [op for op in plan['operations'] if op['kind'] == 'materialize-artifact']
          readback = [op for op in plan['operations'] if op['kind'] == 'readback-sha256-size']
          assert len(materialize) == 17
          assert len(readback) == 17
          by_id = {op['artifact_id']: op for op in materialize}
          assert by_id['surface-runtime-image']['partition'] == 'ORDAX-DATA'
          assert '/.ordax/runtimes/sha256/' in by_id['surface-runtime-image']['target_path']
          assert by_id['surface-runtime-image']['target_path'].endswith('/native-surface-runtime.erofs')
          assert by_id['surface-runtime-ref']['partition'] == 'ORDAX-DATA'
          assert by_id['surface-runtime-ref']['target_path'].endswith('/surface-runtime.sha256')
          assert by_id['local-ai-runtime-image']['partition'] == 'ORDAX-DATA'
          assert '/.ordax/ai-runtimes/sha256/' in by_id['local-ai-runtime-image']['target_path']
          assert by_id['local-ai-runtime-image']['target_path'].endswith('/local-ai-runtime.erofs')
          assert by_id['local-ai-runtime-ref']['partition'] == 'ORDAX-DATA'
          assert by_id['local-ai-runtime-ref']['target_path'].endswith('/local-ai-runtime.sha256')
          assert all(
              op['readback_required']
              for op in plan['operations']
              if op['kind'] in {'materialize-artifact', 'readback-sha256-size'}
          )
          print('CREATOR_PORTABLE_APPLICATION_PLAN=PASS')
          print('PHYSICAL_DEVICE_BOUND=NO')
          print('PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

      - name: Prove FAT32 exFAT EROFS and ext4-in-file storage
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/portable-usb-v2-proof"
          metadata="$RUNNER_TEMP/portable-usb-v2-metadata"
          mkdir -p "$metadata"
          sudo -E python3 tools/creator/proof/portable_usb_v2.py \
            --contract docs/contracts/portable-usb-v2.json \
            --plan "$RUNNER_TEMP/portable-usb-v2-plan.json" \
            --output-root "$output"

          sudo install -o "$(id -u)" -g "$(id -g)" -m 0644 \
            "$output/proof.json" "$metadata/proof.json"

          python3 - "$metadata/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert proof['status'] == 'pass'
          assert proof['physical_write_authorized'] is False
          assert proof['physical_device_touched'] is False
          assert proof['bootable_proven'] is False
          assert [p['name'] for p in proof['partitions']] == ['ORDAX-ESP', 'ORDAX-DATA']
          assert [p['filesystem']['type'] for p in proof['partitions']] == ['vfat', 'exfat']
          assert proof['contained_artifacts']['release']['filesystem'] == 'erofs'
          assert proof['contained_artifacts']['persistent_state']['filesystem'] == 'ext4'
          assert proof['contained_artifacts']['persistent_state']['overlayfs_upper_owner'] is True
          assert all(proof['checks'].values())
          print('PORTABLE_USB_V2_DISPOSABLE_PROOF=PASS')
          print('PORTABLE_USB_V2_BOOTABLE_PROVEN=NO')
          print('PORTABLE_USB_V2_PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

      - name: Destroy disposable RAW bytes
        if: always()
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/portable-usb-v2-proof"
          if sudo test -d "$output"; then
            sudo rm -rf "$output"
          fi
          test ! -e "$output"
          echo 'PORTABLE_USB_V2_RAW_RETAINED=NO'
          echo 'PORTABLE_USB_V2_PROOF_METADATA_ONLY=YES'

      - name: Upload proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-usb-v2-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/portable-usb-v2-metadata/proof.json
            ${{ runner.temp }}/creator-portable-prepared/metadata/prepared-proof.json
          if-no-files-found: error
          retention-days: 14
