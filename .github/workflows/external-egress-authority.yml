name: External Egress Authority

on:
  push:
    branches: [main]
    paths:
      - 'system/contracts/external-egress-grant.mjs'
      - 'system/services/personal-ordax/external-egress-grants.mjs'
      - 'system/services/personal-ordax/action-gateway.mjs'
      - 'tests/test_external_egress_grant.mjs'
      - 'tests/test_external_egress_grant_authority.mjs'
      - 'tests/test_external_egress_action_gateway.mjs'
      - 'tests/test_personal_ordax_action_gateway.mjs'
      - 'docs/EXTERNAL-EGRESS-AUTHORITY.md'
      - '00-PLANOS-PRIORITARIOS/plans/SEC-001-EXTERNAL-EGRESS-AUTHORITY.md'
      - '.github/workflows/external-egress-authority.yml'
  pull_request:
    paths:
      - 'system/contracts/external-egress-grant.mjs'
      - 'system/services/personal-ordax/external-egress-grants.mjs'
      - 'system/services/personal-ordax/action-gateway.mjs'
      - 'tests/test_external_egress_grant.mjs'
      - 'tests/test_external_egress_grant_authority.mjs'
      - 'tests/test_external_egress_action_gateway.mjs'
      - 'tests/test_personal_ordax_action_gateway.mjs'
      - 'docs/EXTERNAL-EGRESS-AUTHORITY.md'
      - '00-PLANOS-PRIORITARIOS/plans/SEC-001-EXTERNAL-EGRESS-AUTHORITY.md'
      - '.github/workflows/external-egress-authority.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'

      - name: Run external egress authority regressions
        run: |
          node --test tests/test_external_egress_grant.mjs
          node --test tests/test_external_egress_grant_authority.mjs
          node --test tests/test_external_egress_action_gateway.mjs
          node --test tests/test_personal_ordax_action_gateway.mjs
