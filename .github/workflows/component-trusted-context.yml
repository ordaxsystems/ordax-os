name: Component Trusted Context

on:
  pull_request:
    paths:
      - 'system/composition/native/component-workspace-ports.mjs'
      - 'system/composition/native/component-pending-host.mjs'
      - 'tests/test_native_files_probation_context.mjs'
      - 'tests/test_component_mount_health_probe.mjs'
      - 'tests/test_native_files_trusted_context.mjs'
      - 'system/services/components/verified-host-context.mjs'
      - 'system/services/components/runtime-loader.mjs'
      - 'system/services/components/current-slot-loader.mjs'
      - 'tests/test_verified_current_component_runtime.mjs'
      - 'tests/test_component_trusted_context_composition.mjs'
      - 'tests/test_native_app_data_composition_bootstrap.mjs'
      - '.github/workflows/component-trusted-context.yml'
  push:
    branches: [main]
    paths:
      - 'system/composition/native/component-workspace-ports.mjs'
      - 'system/composition/native/component-pending-host.mjs'
      - 'tests/test_native_files_probation_context.mjs'
      - 'tests/test_component_mount_health_probe.mjs'
      - 'tests/test_native_files_trusted_context.mjs'
      - 'system/services/components/verified-host-context.mjs'
      - 'system/services/components/runtime-loader.mjs'
      - 'system/services/components/current-slot-loader.mjs'
      - 'tests/test_verified_current_component_runtime.mjs'
      - 'tests/test_component_trusted_context_composition.mjs'
      - 'tests/test_native_app_data_composition_bootstrap.mjs'
      - '.github/workflows/component-trusted-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate trusted context modules
        run: |
          set -euo pipefail
          node --check system/services/components/verified-host-context.mjs
          node --check system/services/components/runtime-loader.mjs
          node --check system/services/components/current-slot-loader.mjs
          node --check tests/test_verified_current_component_runtime.mjs
          node --check tests/test_component_trusted_context_composition.mjs
          node --check tests/test_native_app_data_composition_bootstrap.mjs
          node --check system/composition/native/component-workspace-ports.mjs
          node --check system/composition/native/component-pending-host.mjs
          node --check tests/test_native_files_trusted_context.mjs
          node --check tests/test_native_files_probation_context.mjs
          node --check tests/test_component_mount_health_probe.mjs

      - name: Prove bounded trusted context composition
        run: |
          set -euo pipefail
          node --test tests/test_component_trusted_context_composition.mjs
          node --test tests/test_verified_current_component_runtime.mjs
          node --test tests/test_native_app_data_composition_bootstrap.mjs
          node --test tests/test_native_files_trusted_context.mjs
          node --test tests/test_native_files_probation_context.mjs
          node --test tests/test_component_mount_health_probe.mjs
