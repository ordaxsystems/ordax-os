name: Windows Compatibility Wine Configure Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_configure_proof.py'
      - '.github/workflows/windows-compat-wine-configure-proof.yml'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_configure_proof.py'
      - '.github/workflows/windows-compat-wine-configure-proof.yml'

permissions:
  contents: read

jobs:
  configure-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install proof host dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot

      - name: Validate configure proof contract
        run: |
          python bootstrap/windows-compat-runtime/configure_probe.py check
          python -m unittest tests.test_windows_compat_configure_proof -v

      - name: Configure Wine in pinned Alpine 3.22.5 rootfs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-wine-configure-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/configure_probe.py probe \
            --work-dir "$work" \
            --proof-out "$proof_dir/configure-proof.json"
          python - <<'PY' "$proof_dir/configure-proof.json"
          import json
          import pathlib
          import re
          import sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['configure_proof_passed'] is True
          assert proof['package_versions_pinned'] is False
          assert proof['full_build_proof_passed'] is False
          assert proof['binary_artifact_pinned'] is False
          assert proof['activation_authorized'] is False
          assert proof['execution_authorized'] is False
          assert len(proof['resolved_build_packages']) == 39
          assert len(proof['resolved_installed_packages']) >= len(proof['resolved_build_packages'])
          version = re.compile(r'^[A-Za-z0-9][A-Za-z0-9+._~:-]{0,255}$')
          for name, value in proof['resolved_installed_packages'].items():
              assert name and version.fullmatch(value), (name, value)
          print('native compiler:', proof['native_compiler_triplet'])
          print('requested build packages:', len(proof['resolved_build_packages']))
          print('full installed package graph:', len(proof['resolved_installed_packages']))
          PY

      - name: Upload configure proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-wine-configure-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/windows-compat-wine-configure-proof/configure-proof.json
          if-no-files-found: error
