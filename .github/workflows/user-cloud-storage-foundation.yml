name: User Cloud Storage Foundation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'system/contracts/user-cloud-storage.mjs'
      - 'system/services/user-cloud-storage/**'
      - 'docs/contracts/user-cloud-storage.json'
      - 'docs/contracts/mvp-account-cloud.json'
      - 'docs/contracts/entitlements.json'
      - 'infra/supabase/product/migrations/20261003071000_user_cloud_storage_foundation_v1.sql'
      - 'tests/test_user_cloud_storage.mjs'
      - 'tests/test_user_cloud_storage_source.py'
      - 'tests/test_mvp_account_cloud_contract.py'
      - '.github/workflows/user-cloud-storage-foundation.yml'

permissions:
  contents: read

jobs:
  user-cloud-storage-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate source syntax and machine contracts
        run: |
          set -euo pipefail
          node --check system/contracts/user-cloud-storage.mjs
          node --check system/services/user-cloud-storage/policy.mjs
          python -m json.tool docs/contracts/user-cloud-storage.json >/dev/null
          python -m json.tool docs/contracts/mvp-account-cloud.json >/dev/null
          python -m json.tool docs/contracts/entitlements.json >/dev/null

      - name: Prove provider-neutral reservation and finalization policy
        run: node --test tests/test_user_cloud_storage.mjs

      - name: Prove least-privilege metadata and MVP gate contracts
        run: |
          python -m unittest tests.test_user_cloud_storage_source -v
          python -m unittest tests.test_mvp_account_cloud_contract -v
