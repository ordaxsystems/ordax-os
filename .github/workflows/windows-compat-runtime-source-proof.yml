name: Windows Compatibility Runtime Source Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_loader_wrapper_discovery.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_loader_wrapper_discovery.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate source and dynamic-load discovery contracts
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/build.py check
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py check
          python bootstrap/windows-compat-runtime/runtime_loader_wrapper_discovery_probe.py check

      - name: Run fail-closed regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_windows_compat_runtime_source -v
          python -m unittest tests.test_windows_compat_runtime_dynamic_load_source -v
          python -m unittest tests.test_windows_compat_runtime_loader_wrapper_discovery -v

      - name: Fetch exact Wine source and inventory direct plus named-wrapper loader sites
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-runtime-source-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/build.py fetch-source \
            --cache-dir "$tmp/cache" \
            --proof-out "$proof_dir/source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py discover \
            --archive "$tmp/cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --out "$proof_dir/runtime-dynamic-load-source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_loader_wrapper_discovery_probe.py discover \
            --archive "$tmp/cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --dynamic-source-proof "$proof_dir/runtime-dynamic-load-source-proof.json" \
            --out "$proof_dir/runtime-loader-wrapper-discovery-proof.json"
          python - <<'PY' \
            "$proof_dir/source-proof.json" \
            "$proof_dir/runtime-dynamic-load-source-proof.json" \
            "$proof_dir/runtime-loader-wrapper-discovery-proof.json"
          import json
          import pathlib
          import re
          import sys

          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          dynamic = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          wrappers = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          assert source['$schema'] == 'prototype-ordax.windows-compat-source-proof/1'
          assert source['build_performed'] is False
          assert source['activation_authorized'] is False
          assert source['execution_authorized'] is False
          assert source['version'] == '11.0'
          assert dynamic['$schema'] == 'prototype-ordax.windows-compat-runtime-dynamic-load-source-proof/1'
          assert dynamic['runtime_id'] == source['runtime_id']
          assert dynamic['source_archive_sha256'] == source['archive_sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', dynamic['inventory_sha256'])
          counts = dynamic['counts']
          assert counts['direct_loader_calls'] == 48
          assert counts['calls_by_api'] == {'dlmopen': 0, 'dlopen': 48}

          assert wrappers['$schema'] == 'prototype-ordax.windows-compat-runtime-loader-wrapper-discovery-proof/1'
          assert wrappers['runtime_id'] == dynamic['runtime_id']
          assert wrappers['source_archive_sha256'] == dynamic['source_archive_sha256']
          assert wrappers['dynamic_source_inventory_sha256'] == dynamic['inventory_sha256']
          assert wrappers['c_archive_manifest_sha256'] == dynamic['c_archive_manifest_sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', wrappers['evidence_sha256'])
          wrapper_counts = wrappers['counts']
          assert wrapper_counts['c_archive_members_scanned'] == counts['c_archive_members_scanned']
          assert wrapper_counts['parsed_top_level_functions'] > 0
          assert wrapper_counts['direct_loader_calls'] == counts['direct_loader_calls'] == 48
          assert wrapper_counts['direct_loader_functions'] > 0
          assert wrapper_counts['transitive_named_wrapper_functions'] >= 0
          assert wrapper_counts['named_wrapper_edges'] >= 0
          assert wrapper_counts['ambiguous_global_callee_names'] >= 0
          gates = wrappers['gates']
          for gate in (
              'dynamic_source_proof_recomputed',
              'all_direct_loader_calls_mapped_to_functions',
              'named_wrapper_candidates_discovered',
              'named_wrapper_transitive_fixpoint_reached',
          ):
              assert gates[gate] is True, gate
          for gate in (
              'ambiguous_global_symbol_resolution_complete',
              'function_pointer_aliases_complete',
              'macro_expansion_call_graph_complete',
              'conditional_preprocessor_call_graph_complete',
              'generated_source_inventory_complete',
              'wrapper_call_graph_complete',
              'dynamic_load_inventory_complete',
              'external_transitive_closure_verified',
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          ):
              assert gates[gate] is False, gate
          print('Wine source proof:', source['archive_sha256'])
          print('direct loader calls:', counts['direct_loader_calls'])
          print('direct loader functions:', wrapper_counts['direct_loader_functions'])
          print('named wrapper functions:', wrapper_counts['transitive_named_wrapper_functions'])
          print('named wrapper edges:', wrapper_counts['named_wrapper_edges'])
          print('ambiguous global callee names:', wrapper_counts['ambiguous_global_callee_names'])
          print('dynamic-load inventory:', dynamic['inventory_sha256'])
          print('wrapper evidence:', wrappers['evidence_sha256'])
          PY

      - name: Upload source, direct loader, and named-wrapper metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-runtime-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-runtime-source-proof/source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-dynamic-load-source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-loader-wrapper-discovery-proof.json
          if-no-files-found: error
