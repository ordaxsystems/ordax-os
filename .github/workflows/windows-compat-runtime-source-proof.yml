name: Windows Compatibility Runtime Source Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_configured_soname_caller_modules.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_configured_soname_caller_modules.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate source, dynamic-load, and caller-module contracts
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/build.py check
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py check
          python bootstrap/windows-compat-runtime/runtime_configured_soname_caller_module_probe.py check

      - name: Run fail-closed regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_windows_compat_runtime_source -v
          python -m unittest tests.test_windows_compat_runtime_dynamic_load_source -v
          python -m unittest tests.test_windows_compat_runtime_configured_soname_caller_modules -v

      - name: Fetch exact Wine source and prove configured SONAME caller source modules
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-runtime-source-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/build.py fetch-source \
            --cache-dir "$tmp/cache" \
            --proof-out "$proof_dir/source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py discover \
            --archive "$tmp/cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --out "$proof_dir/runtime-dynamic-load-source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_configured_soname_caller_module_probe.py prove \
            --source-archive "$tmp/cache/wine-11.0.tar.xz" \
            --dynamic-source-proof "$proof_dir/runtime-dynamic-load-source-proof.json" \
            --out "$proof_dir/runtime-configured-soname-caller-module-proof.json"
          python - <<'PY' \
            "$proof_dir/source-proof.json" \
            "$proof_dir/runtime-dynamic-load-source-proof.json" \
            "$proof_dir/runtime-configured-soname-caller-module-proof.json"
          import json
          import pathlib
          import re
          import sys

          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          dynamic = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          callers = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          assert source['$schema'] == 'prototype-ordax.windows-compat-source-proof/1'
          assert source['build_performed'] is False
          assert source['activation_authorized'] is False
          assert source['execution_authorized'] is False
          assert source['version'] == '11.0'
          assert dynamic['$schema'] == 'prototype-ordax.windows-compat-runtime-dynamic-load-source-proof/1'
          assert dynamic['runtime_id'] == source['runtime_id']
          assert dynamic['source_archive_sha256'] == source['archive_sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', dynamic['inventory_sha256'])
          counts = dynamic['counts']
          assert counts['direct_loader_calls'] == 48
          assert counts['configured_soname_symbol_targets'] == 32
          assert len(counts['configured_soname_symbols']) == 24

          assert callers['$schema'] == 'prototype-ordax.windows-compat-runtime-configured-soname-caller-module-proof/1'
          assert callers['runtime_id'] == dynamic['runtime_id']
          assert callers['source_archive_sha256'] == source['archive_sha256']
          assert callers['dynamic_source_inventory_sha256'] == dynamic['inventory_sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', callers['evidence_sha256'])
          caller_counts = callers['counts']
          assert caller_counts['configured_soname_callsites'] == 32
          assert caller_counts['configured_soname_symbols'] == 24
          assert caller_counts['caller_module_directories'] == 18
          assert caller_counts['caller_module_identities'] == 18
          assert caller_counts['translation_units'] == 25
          assert len(callers['modules']) == 18
          assert len(callers['callsites']) == 32
          gates = callers['gates']
          for gate in (
              'dynamic_source_proof_verified',
              'caller_module_makefiles_bound',
              'caller_translation_unit_membership_verified',
              'configured_soname_caller_source_module_mapping_complete',
          ):
              assert gates[gate] is True, gate
          for gate in (
              'caller_binary_staged_identity_verified',
              'caller_rpath_runpath_verified',
              'caller_loader_search_order_verified',
              'caller_loader_context_resolution_complete',
              'runtime_computed_target_resolution_complete',
              'wrapper_call_graph_complete',
              'generated_source_inventory_complete',
              'dynamic_load_inventory_complete',
              'external_transitive_closure_verified',
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          ):
              assert gates[gate] is False, gate
          print('Wine source proof:', source['archive_sha256'])
          print('direct loader calls:', counts['direct_loader_calls'])
          print('configured SONAME callsites:', caller_counts['configured_soname_callsites'])
          print('configured SONAME symbols:', caller_counts['configured_soname_symbols'])
          print('caller source modules:', caller_counts['caller_module_directories'])
          print('caller translation units:', caller_counts['translation_units'])
          print('dynamic-load inventory:', dynamic['inventory_sha256'])
          print('caller-module evidence:', callers['evidence_sha256'])
          PY

      - name: Upload source, dynamic-load, and caller-module metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-runtime-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-runtime-source-proof/source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-dynamic-load-source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-configured-soname-caller-module-proof.json
          if-no-files-found: error
