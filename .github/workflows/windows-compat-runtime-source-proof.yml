name: Windows Compatibility Runtime Source Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_static_loader_targets.py'
      - 'tests/test_windows_compat_runtime_static_loader_linux_reachability.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_static_loader_targets.py'
      - 'tests/test_windows_compat_runtime_static_loader_linux_reachability.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate source and dynamic-load discovery contracts
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/build.py check
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py check
          python bootstrap/windows-compat-runtime/runtime_static_loader_target_classifier.py check
          python bootstrap/windows-compat-runtime/runtime_static_loader_linux_reachability_probe.py check

      - name: Run fail-closed regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_windows_compat_runtime_source -v
          python -m unittest tests.test_windows_compat_runtime_dynamic_load_source -v
          python -m unittest tests.test_windows_compat_runtime_static_loader_targets -v
          python -m unittest tests.test_windows_compat_runtime_static_loader_linux_reachability -v

      - name: Fetch exact Wine source and classify static loader sites
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-runtime-source-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/build.py fetch-source \
            --cache-dir "$tmp/cache" \
            --proof-out "$proof_dir/source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py discover \
            --archive "$tmp/cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --out "$proof_dir/runtime-dynamic-load-source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_static_loader_target_classifier.py classify \
            --dynamic-source-proof "$proof_dir/runtime-dynamic-load-source-proof.json" \
            --out "$proof_dir/runtime-static-loader-target-proof.json"
          python - <<'PY' \
            "$proof_dir/source-proof.json" \
            "$proof_dir/runtime-dynamic-load-source-proof.json" \
            "$proof_dir/runtime-static-loader-target-proof.json"
          import json
          import pathlib
          import re
          import sys

          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          dynamic = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          static = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          assert source['$schema'] == 'prototype-ordax.windows-compat-source-proof/1'
          assert source['build_performed'] is False
          assert source['activation_authorized'] is False
          assert source['execution_authorized'] is False
          assert dynamic['$schema'] == 'prototype-ordax.windows-compat-runtime-dynamic-load-source-proof/1'
          assert re.fullmatch(r'[0-9a-f]{64}', dynamic['inventory_sha256'])
          counts = dynamic['counts']
          assert counts['static_string_targets'] == 6
          assert static['$schema'] == 'prototype-ordax.windows-compat-runtime-static-loader-target-classification-proof/1'
          assert static['runtime_id'] == dynamic['runtime_id']
          assert static['dynamic_source_inventory_sha256'] == dynamic['inventory_sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', static['evidence_sha256'])
          static_counts = static['counts']
          assert static_counts['static_callsites'] == counts['static_string_targets'] == 6
          assert static_counts['classification_rules'] == 5
          assert static_counts['host_platforms'] == {'android': 5, 'macos': 1}
          assert static_counts['categories'] == {
              'android-host-library': 4,
              'macos-framework': 1,
              'ntdll-bootstrap-path': 1,
          }
          gates = static['gates']
          assert gates['dynamic_source_proof_verified'] is True
          assert gates['all_static_loader_targets_classified'] is True
          assert gates['all_classification_rules_observed'] is True
          for gate in (
              'linux_build_reachability_verified',
              'static_target_runtime_resolution_complete',
              'dynamic_load_inventory_complete',
              'external_transitive_closure_verified',
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          ):
              assert gates[gate] is False, gate
          print('Wine source proof:', source['archive_sha256'])
          print('direct loader calls:', counts['direct_loader_calls'])
          print('static loader callsites:', static_counts['static_callsites'])
          print('static host platforms:', static_counts['host_platforms'])
          print('static categories:', static_counts['categories'])
          print('dynamic-load inventory:', dynamic['inventory_sha256'])
          print('static-target evidence:', static['evidence_sha256'])
          PY

      - name: Upload source and static-loader metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-runtime-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-runtime-source-proof/source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-dynamic-load-source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-static-loader-target-proof.json
          if-no-files-found: error
