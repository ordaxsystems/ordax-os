name: Windows Compatibility Runtime Source Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_generated_source_producers.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - 'tests/test_windows_compat_runtime_dynamic_load_source.py'
      - 'tests/test_windows_compat_runtime_generated_source_producers.py'
      - '.github/workflows/windows-compat-runtime-source-proof.yml'
      - 'docs/APPLICATION-COMPATIBILITY.md'
      - 'docs/contracts/application-compatibility.json'
      - 'platform/compliance/declared-inputs.json'

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate source, dynamic-load, and generated-source producer contracts
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/build.py check
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py check
          python bootstrap/windows-compat-runtime/runtime_generated_source_producer_probe.py check

      - name: Run fail-closed regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_windows_compat_runtime_source -v
          python -m unittest tests.test_windows_compat_runtime_dynamic_load_source -v
          python -m unittest tests.test_windows_compat_runtime_generated_source_producers -v

      - name: Fetch exact Wine source, inventory direct loader sites, and prove generated C producer classes
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-runtime-source-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/build.py fetch-source \
            --cache-dir "$tmp/cache" \
            --proof-out "$proof_dir/source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_dynamic_load_source_probe.py discover \
            --archive "$tmp/cache/wine-11.0.tar.xz" \
            --source-proof "$proof_dir/source-proof.json" \
            --out "$proof_dir/runtime-dynamic-load-source-proof.json"
          python bootstrap/windows-compat-runtime/runtime_generated_source_producer_probe.py prove \
            --source-archive "$tmp/cache/wine-11.0.tar.xz" \
            --out "$proof_dir/runtime-generated-source-producer-proof.json"
          python - <<'PY' \
            "$proof_dir/source-proof.json" \
            "$proof_dir/runtime-dynamic-load-source-proof.json" \
            "$proof_dir/runtime-generated-source-producer-proof.json"
          import json
          import pathlib
          import re
          import sys

          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          dynamic = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          generated = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          assert source['$schema'] == 'prototype-ordax.windows-compat-source-proof/1'
          assert source['build_performed'] is False
          assert source['activation_authorized'] is False
          assert source['execution_authorized'] is False
          assert source['version'] == '11.0'
          assert dynamic['$schema'] == 'prototype-ordax.windows-compat-runtime-dynamic-load-source-proof/1'
          assert dynamic['runtime_id'] == source['runtime_id']
          assert dynamic['source_archive_sha256'] == source['archive_sha256']
          counts = dynamic['counts']
          assert counts['direct_loader_calls'] == 48
          assert counts['configured_soname_symbol_targets'] == 32
          assert counts['dynamic_expression_targets'] == 10
          assert counts['static_string_targets'] == 6

          assert generated['$schema'] == 'prototype-ordax.windows-compat-runtime-generated-source-producer-proof/1'
          assert generated['runtime_id'] == source['runtime_id']
          assert generated['source_archive_sha256'] == source['archive_sha256']
          assert generated['makedep_path'] == 'tools/makedep.c'
          assert re.fullmatch(r'[0-9a-f]{64}', generated['makedep_sha256'])
          assert re.fullmatch(r'[0-9a-f]{64}', generated['evidence_sha256'])
          assert generated['counts'] == {'producer_rules': 9}
          assert len(generated['producer_rules']) == 9
          assert len({item['id'] for item in generated['producer_rules']}) == 9
          gates = generated['gates']
          for gate in (
              'source_archive_verified',
              'makedep_source_bound',
              'generated_c_producer_classes_classified',
              'all_producer_rules_observed',
          ):
              assert gates[gate] is True, gate
          for gate in (
              'generated_source_instances_inventoried',
              'generated_source_outputs_scanned',
              'generated_source_inventory_complete',
              'wrapper_call_graph_complete',
              'dynamic_load_inventory_complete',
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          ):
              assert gates[gate] is False, gate
          print('Wine source proof:', source['archive_sha256'])
          print('direct loader calls:', counts['direct_loader_calls'])
          print('generated C producer rules:', generated['counts']['producer_rules'])
          print('generated producer evidence:', generated['evidence_sha256'])
          PY

      - name: Upload source, direct dynamic-load, and generated-producer metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-runtime-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-runtime-source-proof/source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-dynamic-load-source-proof.json
            ${{ runner.temp }}/windows-compat-runtime-source-proof/runtime-generated-source-producer-proof.json
          if-no-files-found: error
