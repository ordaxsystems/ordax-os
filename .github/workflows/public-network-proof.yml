name: OrdaX Public DNS and HTTPS Proof

on:
  pull_request:
    paths:
      - '.github/workflows/public-network-proof.yml'
      - 'tools/public-site/probe_public_network.py'
      - 'tests/test_public_site_network_proof.py'
      - 'docs/contracts/public-site-deployment.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-network-proof.yml'
      - 'tools/public-site/probe_public_network.py'
      - 'tests/test_public_site_network_proof.py'
      - 'docs/contracts/public-site-deployment.json'
  workflow_dispatch:
  # Independent uptime check even when no source files have changed.
  # GitHub schedules are best-effort; this is not a real-time SLA monitor.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  public-network-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false
      - name: Validate network probe locally without real requests
        run: python -m unittest tests.test_public_site_network_proof -v
      - name: Prove DNS and public HTTPS from independent runner
        run: python tools/public-site/probe_public_network.py
