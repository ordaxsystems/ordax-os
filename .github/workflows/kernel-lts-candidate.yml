name: Kernel LTS Candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'bootstrap/kernel/build.py'
      - 'bootstrap/kernel/verify_upstream_signature.py'
      - 'bootstrap/kernel/candidate_pipeline.py'
      - 'bootstrap/kernel/update_engine.py'
      - 'bootstrap/kernel/candidates/**'
      - 'bootstrap/kernel/config/ordax.fragment'
      - 'tests/test_kernel_build_authentication_gate.py'
      - 'tests/test_kernel_upstream_signature.py'
      - 'tests/test_kernel_module_release_abi.py'
      - 'tests/test_kernel_candidate_pipeline.py'
      - 'tests/test_kernel_update_engine.py'
      - 'tests/test_kernel_candidate_ci_scope.py'
      - '.github/workflows/kernel-lts-candidate.yml'
      - '.github/workflows/kernel-lts-update-proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposed-kernel-contract:
    # Source selection and regression tests must pass on draft PRs, without
    # installing toolchains or compiling a candidate kernel.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      available: ${{ steps.candidate.outputs.available }}
      source_contract: ${{ steps.candidate.outputs.source_contract }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout exact candidate source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Resolve selected LTS source contract
        id: candidate
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/candidate_pipeline.py select --github-output "$GITHUB_OUTPUT"
          python3 -m unittest discover -s tests -p 'test_kernel_candidate_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_kernel_update_engine.py' -v
          python3 -m unittest discover -s tests -p 'test_kernel_candidate_ci_scope.py' -v

  proposed-kernel-build:
    needs: proposed-kernel-contract
    if: needs.proposed-kernel-contract.outputs.available == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact candidate source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact proposed-kernel build and signature dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config gnupg

      - name: Validate active kernel and selected signed candidate
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/build.py check
          python3 bootstrap/kernel/build.py check \
            --source-contract "${{ needs.proposed-kernel-contract.outputs.source_contract }}"
          python3 -m unittest discover -s tests -p 'test_kernel_build_authentication_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_kernel_upstream_signature.py' -v
          python3 -m unittest discover -s tests -p 'test_kernel_module_release_abi.py' -v

      - name: Build authenticated staged kernel and modules
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/build.py build \
            --source-contract "${{ needs.proposed-kernel-contract.outputs.source_contract }}" \
            --jobs 4 \
            --work-dir out/kernel-next-work \
            --out-dir out/kernel-next
          python3 bootstrap/kernel/verify.py out/kernel-next

      - name: Verify candidate identity, upstream signature and exact artifact digests
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/candidate_pipeline.py prove \
            --out-dir out/kernel-next \
            --source-commit "$ORDAX_SOURCE_COMMIT"

      - name: Upload staged candidate only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-kernel-${{ needs.proposed-kernel-contract.outputs.version }}-staged-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/kernel-next/
          if-no-files-found: error
          retention-days: 14
