name: Independent Base Experiment

on:
  push:
    # Only explicitly marked migration-branch commits activate the heavy jobs.
    branches: ['integration/dev-usb-buildroot-surface-20261024']
    paths:
      - 'bootstrap/independent-base/**'
      - 'tests/test_independent_native_component.py'
      - '.github/workflows/independent-base-experiment.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'bootstrap/base/firmware_policy.py'
      - 'bootstrap/kernel/module_archive.py'
      - 'bootstrap/independent-base/**'
      - '!bootstrap/independent-base/**/*.md'
      - 'bootstrap/kernel/build.py'
      - 'bootstrap/kernel/verify.py'
      - 'bootstrap/kernel/verify_upstream_signature.py'
      - 'bootstrap/kernel/source.json'
      - 'bootstrap/kernel/config/ordax.fragment'
      - 'system/services/base-update/dev_channel.py'
      - 'tools/dev-base-channel/**'
      - 'tests/test_dev_base_symlink_policy.py'
      - 'tests/test_independent_dev_channel_compatibility.py'
      - 'tests/test_independent_rootfs_export.py'
      - 'docs/contracts/hardware-support-matrix.json'
      - 'docs/contracts/kernel-build-environment.json'
      - 'tools/ci/portable_component_cache.py'
      - '.github/workflows/independent-base-experiment.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Independent Base profile to prove
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - owner-development
          - stable-mvp

permissions:
  contents: read
  actions: read  # Read only exact successful kernel artifact from existing canonical workflow.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'none' }}
  # Preserve a running costly Buildroot proof when a new PR revision arrives.
  # The latest queued revision remains source-bound and must still be checked.
  cancel-in-progress: false

jobs:
  independent-base-contract:
    # Validate the Owner Buildroot profile on draft PRs without building the
    # kernel/rootfs or starting QEMU. The release job must depend on this gate.
    # Heavy push proof remains explicit on the single active integration branch.
    if: ${{ github.event_name != 'push' || (github.ref == 'refs/heads/integration/dev-usb-buildroot-surface-20261024' && contains(github.event.head_commit.message, '[stable-mvp-proof]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python for pinned contract tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select integration profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          profile=minimal
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            profile="$DISPATCH_PROFILE"
          elif [ "$EVENT_NAME" = pull_request ]; then
            # Any PR exercising Independent Base must prove the Owner USB target;
            # the minimal profile remains selectable explicitly by dispatch.
            profile=owner-development
          elif [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/integration/dev-usb-buildroot-surface-20261024 ]; then
            # Isolated non-promotable Stable parity. Kernel cache miss must abort.
            profile=stable-mvp
          fi
          case "$profile" in
            minimal|owner-development|stable-mvp) ;;
            *) echo "unsupported Independent Base profile: $profile" >&2; exit 1 ;;
          esac
          printf 'ORDAX_INDEPENDENT_PROFILE=%s\n' "$profile" >> "$GITHUB_ENV"
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"
          printf 'ORDAX_INDEPENDENT_PROFILE=%s\n' "$profile"
      - name: Verify isolated contract and regressions
        run: |
          set -euo pipefail
          # All three Kconfig/profile boundaries are cheap and independent
          # of the selected expensive Buildroot/QEMU producer profile.
          python3 bootstrap/independent-base/build.py check --profile minimal
          python3 bootstrap/independent-base/build.py check --profile owner-development
          python3 bootstrap/independent-base/build.py check --profile stable-mvp
          python3 bootstrap/independent-base/build.py check-component
          python3 -m unittest \
            tests.test_alpine_removal_boundary \
            tests.test_dev_base_symlink_policy \
            tests.test_independent_dev_channel_compatibility \
            tests.test_independent_base_experiment \
            tests.test_independent_rootfs_inventory \
            tests.test_independent_rootfs_export \
            tests.test_independent_network_parity \
            tests.test_independent_owner_profile \
            tests.test_kernel_module_archive \
            tests.test_independent_kernel_module_workflow \
            tests.test_firmware_policy_neutral \
            tests.test_independent_heavy_workflow -v
          python3 -m py_compile \
            bootstrap/base/firmware_policy.py \
            bootstrap/kernel/module_archive.py \
            bootstrap/independent-base/module_parity.py \
            bootstrap/independent-base/build.py \
            bootstrap/independent-base/qemu_proof.py \
            system/services/base-update/dev_channel.py \
            tools/dev-base-channel/prove_independent_rootfs.py \
            tests/test_dev_base_symlink_policy.py \
            tests/test_independent_dev_channel_compatibility.py \
            tests/test_independent_rootfs_export.py \
            tests/test_independent_heavy_workflow.py
          sh -n bootstrap/independent-base/post-build.sh
          sh -n bootstrap/independent-base/post-image.sh
          sh -n bootstrap/independent-base/overlay/sbin/ordax-independent-probe-init

  buildroot-qemu:
    needs: independent-base-contract
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && github.ref == 'refs/heads/integration/dev-usb-buildroot-surface-20261024' && contains(github.event.head_commit.message, '[stable-mvp-proof]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Serialize first cold-cache Owner Buildroot build with Creator/Surface.
    # After the first verified save, later consumers can reuse the same bytes.
    concurrency:
      group: ordax-surface-producer-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python for pinned build and QEMU proof
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux build, EROFS and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-13 g++ bc perl bison flex openssl libssl-dev \
            libelf-dev dwarves kmod xz-utils pkg-config \
            gawk cpio unzip rsync file binutils wget curl patch git \
            erofs-utils e2fsprogs util-linux qemu-system-x86
      - name: Bind validated Base profile from contract job
        env:
          CONTRACT_PROFILE: ${{ needs.independent-base-contract.outputs.profile }}
        run: |
          set -euo pipefail
          case "$CONTRACT_PROFILE" in
            minimal|owner-development|stable-mvp) ;;
            *) echo 'Base contract profile absent or invalid' >&2; exit 1 ;;
          esac
          printf 'ORDAX_INDEPENDENT_PROFILE=%s\n' "$CONTRACT_PROFILE" >> "$GITHUB_ENV"
      - name: Resolve reusable kernel fingerprint
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/portable-v2-qemu/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"
      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}
      - name: Reuse exact successful kernel candidate artifact on scoped cache miss
        id: kernel-artifact
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' && env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A PR-scoped cache is intentionally invisible to workflow_dispatch.
          # Reuse only an artifact from the successful canonical kernel workflow
          # for this exact source commit, never an arbitrary archive or tag.
          artifact_name="ordax-kernel-${ORDAX_SOURCE_COMMIT}"
          artifact_list="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f "name=${artifact_name}" -F per_page=100)"
          export ORDAX_KERNEL_ARTIFACT_NAME="$artifact_name"
          run_id="$(printf '%s' "$artifact_list" | python3 -c '
          import json, os, sys
          matches = [a for a in json.load(sys.stdin).get("artifacts", [])
                     if a.get("name") == os.environ["ORDAX_KERNEL_ARTIFACT_NAME"]
                     and a.get("expired") is False
                     and (a.get("workflow_run") or {}).get("head_sha") == os.environ["ORDAX_SOURCE_COMMIT"]]
          if len(matches) != 1:
              raise SystemExit("exact kernel artifact must exist once for the current source commit")
          print(matches[0]["workflow_run"]["id"])
          ')"
          run_info="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          printf '%s' "$run_info" | python3 -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if (run.get("head_sha") != os.environ["ORDAX_SOURCE_COMMIT"]
              or run.get("path") != ".github/workflows/kernel-candidate.yml"
              or run.get("conclusion") != "success"
              or run.get("status") != "completed"):
              raise SystemExit("kernel artifact source run is not the exact successful canonical producer")
          '
          kernel_dir="$RUNNER_TEMP/portable-v2-qemu/kernel"
          test ! -e "$kernel_dir" && test ! -L "$kernel_dir"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$kernel_dir"
          python3 bootstrap/kernel/verify.py "$kernel_dir"
          export ORDAX_KERNEL_ARTIFACT_DIR="$kernel_dir"
          python3 -c '
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          out = Path(os.environ["ORDAX_KERNEL_ARTIFACT_DIR"])
          source_path = root / "bootstrap/kernel/source.json"
          source = json.loads(source_path.read_text(encoding="utf-8"))
          provenance = json.loads((out / "kernel-provenance.json").read_text(encoding="utf-8"))
          fragment = root / source["configuration"]["fragment"]
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          version = source["version"]
          expected_files = {
              "kernel-provenance.json", "SHA256SUMS",
              f"vmlinuz-{version}", f"kernel-modules-{version}.tar",
              f"kernel-{version}.config",
          }
          if (set(path.name for path in out.iterdir()) != expected_files
              or any(path.is_symlink() or not path.is_file() for path in out.iterdir())
              or provenance.get("source_commit") != os.environ["ORDAX_SOURCE_COMMIT"]
              or provenance.get("source_contract_sha256") != sha(source_path)
              or provenance.get("fragment_sha256") != sha(fragment)
              or provenance.get("kernel_version") != version
              or provenance.get("upstream_authentication", {}).get("status") != "verified"
              or provenance.get("physical_artifact_authorized") is not False):
              raise SystemExit("kernel artifact identity, source lock, or authenticated provenance mismatch")
          '
          printf 'reused=true\n' >> "$GITHUB_OUTPUT"
      - name: Require a previously verified kernel for Stable candidate
        if: env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp'
        env:
          ORDAX_STABLE_KERNEL_CACHE_HIT: ${{ steps.kernel-cache.outputs.cache-hit }}
          ORDAX_VERIFIED_KERNEL_ARTIFACT_REUSED: ${{ steps.kernel-artifact.outputs.reused }}
          # Only this explicitly marked integration-branch commit may seed a
          # missing kernel cache once. Ordinary Stable, dispatch, PR and
          # subsequent unmarked commits remain strictly cache-only.
          ORDAX_EXPLICIT_STABLE_KERNEL_BOOTSTRAP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/dev-usb-buildroot-surface-20261024' && contains(github.event.head_commit.message, '[stable-mvp-bootstrap-kernel]') }}
        run: |
          set -euo pipefail
          if [ "$ORDAX_STABLE_KERNEL_CACHE_HIT" != true ] && [ "$ORDAX_VERIFIED_KERNEL_ARTIFACT_REUSED" != true ]; then
            if [ "$ORDAX_EXPLICIT_STABLE_KERNEL_BOOTSTRAP" != true ]; then
              echo 'Stable candidate must reuse an existing verified kernel; no recompilation authorized' >&2
              exit 1
            fi
            echo 'ORDAX_EXPLICIT_STABLE_KERNEL_CACHE_SEED=AUTHORIZED'
          fi
      - name: Build canonical OrdaX kernel on verified cache miss
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' && steps.kernel-artifact.outputs.reused != 'true' && (env.ORDAX_INDEPENDENT_PROFILE != 'stable-mvp' || (github.event_name == 'push' && github.ref == 'refs/heads/integration/dev-usb-buildroot-surface-20261024' && contains(github.event.head_commit.message, '[stable-mvp-bootstrap-kernel]'))) }}
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 bootstrap/kernel/build.py build \
            --work-dir "$RUNNER_TEMP/ordax-kernel-work" \
            --out-dir "$RUNNER_TEMP/portable-v2-qemu/kernel" --jobs 4
      - name: Verify kernel component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          kernel_dir="$RUNNER_TEMP/portable-v2-qemu/kernel"
          metadata="$RUNNER_TEMP/portable-v2-qemu/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python3 bootstrap/kernel/verify.py "$kernel_dir"
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir "$kernel_dir" \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          # The reused CI artifact was independently verified, but did not
          # come from actions/cache; record its true reuse in the SSOT receipt.
          if [ '${{ steps.kernel-artifact.outputs.reused }}' = 'true' ]; then
            cache_hit=true
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir "$kernel_dir" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"
      - name: Save verified kernel component
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}
      - name: Resolve verified kernel module archive
        run: |
          set -euo pipefail
          kernel_version=$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("bootstrap/kernel/source.json").read_text(encoding="utf-8"))["version"])')
          module_archive="$RUNNER_TEMP/portable-v2-qemu/kernel/kernel-modules-$kernel_version.tar"
          test -f "$module_archive"
          receipt_root="$RUNNER_TEMP/ordax-independent"
          test ! -L "$receipt_root"
          install -d -m 0700 -- "$receipt_root"
          test -d "$receipt_root"
          test ! -L "$receipt_root"
          printf 'ORDAX_HOST_PYTHON=%s\n' "$(command -v python3)" >> "$GITHUB_ENV"
          printf 'ORDAX_KERNEL_MODULES_ARCHIVE=%s\n' "$module_archive" >> "$GITHUB_ENV"
          printf 'ORDAX_KERNEL_MODULES_RECEIPT=%s\n' "$receipt_root/kernel-module-selection.json" >> "$GITHUB_ENV"
          printf 'ORDAX_FIRMWARE_COVERAGE_RECEIPT=%s\n' "$receipt_root/firmware-coverage.json" >> "$GITHUB_ENV"
      # Both profile fingerprints pin actual Buildroot inputs; Owner additionally
      # binds Dev helpers, firmware and the independently verified kernel.
      # All cache hits must be reverified against the current checkout.
      - name: Restore verified independent base component
        if: env.ORDAX_INDEPENDENT_PROFILE == 'minimal'
        id: independent-base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v2-${{ runner.os }}-${{ runner.arch }}-independent-base-${{ steps.component-fingerprints.outputs.independent_base }}-${{ steps.component-fingerprints.outputs.kernel }}-${{ hashFiles('bootstrap/kernel/module_archive.py', 'bootstrap/independent-base/module_parity.py', 'docs/contracts/hardware-support-matrix.json') }}
      - name: Restore verified Owner Buildroot component
        if: env.ORDAX_INDEPENDENT_PROFILE == 'owner-development'
        id: independent-owner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v2-${{ runner.os }}-${{ runner.arch }}-independent-base-owner-${{ steps.component-fingerprints.outputs.independent_base_owner }}-${{ steps.component-fingerprints.outputs.kernel }}-${{ hashFiles('bootstrap/kernel/module_archive.py', 'bootstrap/independent-base/module_parity.py', 'docs/contracts/hardware-support-matrix.json') }}
      - name: Restore verified Stable Buildroot component
        if: env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp'
        id: independent-stable-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v2-${{ runner.os }}-${{ runner.arch }}-independent-base-stable-${{ steps.component-fingerprints.outputs.independent_base_stable }}-${{ steps.component-fingerprints.outputs.kernel }}-${{ hashFiles('bootstrap/kernel/module_archive.py', 'bootstrap/independent-base/module_parity.py', 'docs/contracts/hardware-support-matrix.json') }}
      - name: Restore Buildroot sources and package downloads
        if: (env.ORDAX_INDEPENDENT_PROFILE == 'minimal' && steps.independent-base-cache.outputs.cache-hit != 'true') || (env.ORDAX_INDEPENDENT_PROFILE == 'owner-development' && steps.independent-owner-cache.outputs.cache-hit != 'true') || (env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp' && steps.independent-stable-cache.outputs.cache-hit != 'true')
        id: buildroot-download-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent-cache
          key: ordax-buildroot-download-v1-${{ runner.os }}-${{ hashFiles('bootstrap/independent-base/source.json', 'bootstrap/independent-base/configs/**', 'bootstrap/independent-base/patches/**') }}
      - name: Build rootfs from official Buildroot source with verified kernel modules
        if: (env.ORDAX_INDEPENDENT_PROFILE == 'minimal' && steps.independent-base-cache.outputs.cache-hit != 'true') || (env.ORDAX_INDEPENDENT_PROFILE == 'owner-development' && steps.independent-owner-cache.outputs.cache-hit != 'true') || (env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp' && steps.independent-stable-cache.outputs.cache-hit != 'true')
        run: |
          set -euo pipefail
          test -f "${ORDAX_KERNEL_MODULES_ARCHIVE:?}"
          test ! -L "$ORDAX_KERNEL_MODULES_ARCHIVE"
          export ORDAX_HOST_PYTHON="$(command -v python3)"
          export ORDAX_KERNEL_MODULES_RECEIPT="$RUNNER_TEMP/ordax-independent/kernel-module-selection.json"
          python3 bootstrap/independent-base/build.py build \
            --profile "$ORDAX_INDEPENDENT_PROFILE" \
            --out "$RUNNER_TEMP/ordax-independent" \
            --cache "$RUNNER_TEMP/ordax-independent-cache" --jobs 4
      - name: Save Buildroot source/package download cache
        if: steps.buildroot-download-cache.outputs.cache-hit != 'true' && ((env.ORDAX_INDEPENDENT_PROFILE == 'minimal' && steps.independent-base-cache.outputs.cache-hit != 'true') || (env.ORDAX_INDEPENDENT_PROFILE == 'owner-development' && steps.independent-owner-cache.outputs.cache-hit != 'true') || (env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp' && steps.independent-stable-cache.outputs.cache-hit != 'true'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent-cache
          key: ordax-buildroot-download-v1-${{ runner.os }}-${{ hashFiles('bootstrap/independent-base/source.json', 'bootstrap/independent-base/configs/**', 'bootstrap/independent-base/patches/**') }}
      - name: Verify independent base component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/ordax-independent"
          metadata="$RUNNER_TEMP/portable-v2-qemu/metadata"
          python3 bootstrap/independent-base/build.py verify \
            --profile "$ORDAX_INDEPENDENT_PROFILE" --out "$base_dir"
          test -s "$base_dir/kernel-module-selection.json"
          test ! -L "$base_dir/kernel-module-parity.json"
          rm -f "$base_dir/kernel-module-parity.json"
          python3 bootstrap/independent-base/module_parity.py verify \
            --kernel-modules "${ORDAX_KERNEL_MODULES_ARCHIVE:?}" \
            --selection-receipt "$base_dir/kernel-module-selection.json" \
            --rootfs-tar "$base_dir/rootfs.tar" \
            --base-provenance "$base_dir/provenance.json" \
            --out "$base_dir/kernel-module-parity.json"
          # Strict provenance and kernel-module closure are verified above.
          # An integration receipt binds reused bytes to this HEAD without
          # modifying the original signed/source-bound producer provenance.
          if [ "$ORDAX_INDEPENDENT_PROFILE" = minimal ]; then
            cache_hit='${{ steps.independent-base-cache.outputs.cache-hit }}'
            if [ "$cache_hit" != true ]; then cache_hit=false; fi
            python3 bootstrap/independent-base/verify_rootfs.py \
              "$base_dir/rootfs.tar" > "$metadata/independent-rootfs-inventory.json"
            if [ "$cache_hit" = false ]; then
              python3 tools/ci/portable_component_cache.py record \
                --component independent-base \
                --out-dir "$base_dir" \
                --source-commit "$ORDAX_SOURCE_COMMIT" \
                > "$metadata/independent-base-cache-record.json"
            fi
            python3 tools/ci/portable_component_cache.py verify \
              --component independent-base \
              --out-dir "$base_dir" \
              --integration-commit "$ORDAX_SOURCE_COMMIT" \
              --cache-hit "$cache_hit" \
              --receipt "$metadata/independent-base-component-reuse.json"
          elif [ "$ORDAX_INDEPENDENT_PROFILE" = owner-development ]; then
            cache_hit='${{ steps.independent-owner-cache.outputs.cache-hit }}'
            if [ "$cache_hit" != true ]; then cache_hit=false; fi
            if [ "$cache_hit" = false ]; then
              python3 tools/ci/portable_component_cache.py record \
                --component independent-base-owner \
                --out-dir "$base_dir" --source-commit "$ORDAX_SOURCE_COMMIT" \
                > "$metadata/independent-owner-cache-record.json"
            fi
            python3 tools/ci/portable_component_cache.py verify \
              --component independent-base-owner --out-dir "$base_dir" \
              --integration-commit "$ORDAX_SOURCE_COMMIT" --cache-hit "$cache_hit" \
              --receipt "$metadata/independent-owner-component-reuse.json"
            echo "ORDAX_OWNER_BASE_CACHE_HIT=$cache_hit"
          elif [ "$ORDAX_INDEPENDENT_PROFILE" = stable-mvp ]; then
            cache_hit='${{ steps.independent-stable-cache.outputs.cache-hit }}'
            if [ "$cache_hit" != true ]; then cache_hit=false; fi
            if [ "$cache_hit" = false ]; then
              python3 tools/ci/portable_component_cache.py record \
                --component independent-base-stable \
                --out-dir "$base_dir" --source-commit "$ORDAX_SOURCE_COMMIT" \
                > "$metadata/independent-stable-cache-record.json"
            fi
            python3 tools/ci/portable_component_cache.py verify \
              --component independent-base-stable --out-dir "$base_dir" \
              --integration-commit "$ORDAX_SOURCE_COMMIT" --cache-hit "$cache_hit" \
              --receipt "$metadata/independent-stable-component-reuse.json"
            echo "ORDAX_STABLE_BASE_CACHE_HIT=$cache_hit"
          else
            echo "unsupported Independent Base profile: $ORDAX_INDEPENDENT_PROFILE" >&2
            exit 1
          fi
      - name: Save verified independent base component
        if: env.ORDAX_INDEPENDENT_PROFILE == 'minimal' && steps.independent-base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v2-${{ runner.os }}-${{ runner.arch }}-independent-base-${{ steps.component-fingerprints.outputs.independent_base }}-${{ steps.component-fingerprints.outputs.kernel }}-${{ hashFiles('bootstrap/kernel/module_archive.py', 'bootstrap/independent-base/module_parity.py', 'docs/contracts/hardware-support-matrix.json') }}
      - name: Save verified Owner Buildroot component
        if: env.ORDAX_INDEPENDENT_PROFILE == 'owner-development' && steps.independent-owner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v2-${{ runner.os }}-${{ runner.arch }}-independent-base-owner-${{ steps.component-fingerprints.outputs.independent_base_owner }}-${{ steps.component-fingerprints.outputs.kernel }}-${{ hashFiles('bootstrap/kernel/module_archive.py', 'bootstrap/independent-base/module_parity.py', 'docs/contracts/hardware-support-matrix.json') }}
      - name: Save verified Stable Buildroot component
        if: env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp' && steps.independent-stable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v2-${{ runner.os }}-${{ runner.arch }}-independent-base-stable-${{ steps.component-fingerprints.outputs.independent_base_stable }}-${{ steps.component-fingerprints.outputs.kernel }}-${{ hashFiles('bootstrap/kernel/module_archive.py', 'bootstrap/independent-base/module_parity.py', 'docs/contracts/hardware-support-matrix.json') }}
      - name: Export complete verified Stable component for PR cache reuse
        if: env.ORDAX_INDEPENDENT_PROFILE == 'stable-mvp' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # A pull_request cannot see the integration-branch actions/cache entry.
          # Export the exact already verified bytes, including the immutable
          # .ordax-component-cache.json, without producing a second Buildroot.
          name: ordax-stable-cache-${{ steps.component-fingerprints.outputs.independent_base_stable }}-${{ github.sha }}
          path: ${{ runner.temp }}/ordax-independent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Prove Owner rootfs against the real Dev Channel consumer
        if: env.ORDAX_INDEPENDENT_PROFILE == 'owner-development'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/dev-base-channel/prove_independent_rootfs.py \
            --rootfs "$RUNNER_TEMP/ordax-independent/rootfs.tar" \
            --provenance "$RUNNER_TEMP/ordax-independent/provenance.json" \
            --expected-commit "$ORDAX_SOURCE_COMMIT" \
            --reuse-receipt "$RUNNER_TEMP/portable-v2-qemu/metadata/independent-owner-component-reuse.json" \
            --receipt "$RUNNER_TEMP/ordax-independent/dev-channel-rootfs-compatibility.json"
      - name: QEMU real kernel, EROFS and ext4 persistence/recovery
        run: |
          python3 bootstrap/independent-base/qemu_proof.py \
            --out "$RUNNER_TEMP/ordax-independent" \
            --kernel-dir "$RUNNER_TEMP/portable-v2-qemu/kernel" \
            --result "$RUNNER_TEMP/ordax-independent-qemu-result.json"
      - name: Upload candidate/provenance and observed QEMU result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-independent-base-${{ env.ORDAX_INDEPENDENT_PROFILE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ordax-independent/provenance.json
            ${{ runner.temp }}/ordax-independent/kernel-module-selection.json
            ${{ runner.temp }}/ordax-independent/kernel-module-parity.json
            ${{ runner.temp }}/ordax-independent/firmware-coverage.json
            ${{ runner.temp }}/ordax-independent/dev-channel-rootfs-compatibility.json
            ${{ runner.temp }}/ordax-independent/independent-base.erofs
            ${{ runner.temp }}/ordax-independent/rootfs.cpio.gz
            ${{ runner.temp }}/portable-v2-qemu/kernel/kernel-provenance.json
            ${{ runner.temp }}/portable-v2-qemu/metadata/kernel-component-reuse.json
            ${{ runner.temp }}/portable-v2-qemu/metadata/independent-stable-component-reuse.json
            ${{ runner.temp }}/ordax-independent-qemu-result.json
            ${{ runner.temp }}/ordax-independent-qemu-result-serial/*.serial.log
          if-no-files-found: warn
          retention-days: 7

  private-native-python:
    name: Compile private Buildroot Python component (no USB install)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/dev-usb-buildroot-surface-20261024') || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python for pinned Buildroot owner and provenance
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Buildroot host compilers and ELF inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-13 g++ bc perl bison flex libssl-dev \
            gawk cpio unzip rsync file binutils wget curl patch git \
            xz-utils python3
      - name: Prove native component source and isolation before compilation
        run: |
          python3 bootstrap/independent-base/build.py check-component
          python3 -m unittest tests.test_independent_native_component -v
      - name: Compile actual pinned musl Python / TLS / zlib closure
        run: |
          set -euo pipefail
          python3 bootstrap/independent-base/build.py build-component \
            --out "$RUNNER_TEMP/ordax-native-python-proof" \
            --cache "$RUNNER_TEMP/ordax-independent-buildroot-cache" --jobs 4 \
            --export-private-build-input --export-private-sdk \
            > "$RUNNER_TEMP/native-python-build.log"
          python3 bootstrap/independent-base/build.py verify-component \
            --out "$RUNNER_TEMP/ordax-native-python-proof"
      - name: Publish only non-installable Runtime build input and ABI evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-independent-python-abi-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ordax-native-python-proof/native-python-provenance.json
            ${{ runner.temp }}/ordax-native-python-proof/native-python-build-input.rootfs.tar
            ${{ runner.temp }}/ordax-native-python-proof/ordax-native-product-runtime-sdk.tar.gz
          if-no-files-found: error
          retention-days: 14
