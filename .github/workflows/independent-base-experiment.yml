name: Independent Base Experiment

on:
  pull_request:
    paths:
      - 'bootstrap/independent-base/source.json'
      - 'bootstrap/independent-base/build.py'
      - 'bootstrap/independent-base/ci_artifacts.py'
      - 'bootstrap/independent-base/post-build.sh'
      - 'bootstrap/independent-base/qemu_proof.py'
      - 'bootstrap/independent-base/healthy_services_proof.py'
      - 'bootstrap/independent-base/configs/**'
      - 'bootstrap/independent-base/overlay/**'
      - 'bootstrap/network/**'
      - 'bootstrap/kernel/source.json'
      - 'bootstrap/kernel/build.py'
      - 'bootstrap/kernel/verify.py'
      - 'bootstrap/kernel/config/**'
      - 'bootstrap/stable-base/ordax-stable-init'
      - 'bootstrap/stable-base/source.json'
      - 'system/entrypoint'
      - 'system/supervisor'
      # The actual signed Surface release is a required cold-health input.
      # Re-run the authentic portable QEMU proof for owner Surface changes.
      - 'system/composition/native/**'
      - 'system/surface/runtime/**'
      - 'system/adapters/native/update-runtime.mjs'
      - 'system/adapters/native/surface-heartbeat.mjs'
      - '.github/workflows/independent-base-experiment.yml'
      - '.github/workflows/portable-v2-qemu-boot-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Do not kill a 30-minute verified build merely because a doc/test commit arrived.
  # A later run is queued and may reuse its sealed cache by exact input SHA.
  cancel-in-progress: false

jobs:
  buildroot-qemu:
    runs-on: ubuntu-24.04
    outputs:
      do_heavy: ${{ steps.scope.outputs.do_heavy }}
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python for pinned build and QEMU proof
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Determine whether the synchronized change modified functional inputs
        id: scope
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PREVIOUS_HEAD: ${{ github.event.before }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Newly opened PRs, workflow_dispatch, unavailable previous commits
          # and unknown event payloads must execute every real proof.
          if [ "$EVENT_ACTION" != synchronize ] ||
             ! [[ "$PREVIOUS_HEAD" =~ ^[a-f0-9]{40}$ ]] ||
             ! git cat-file -e "$PREVIOUS_HEAD^{commit}" 2>/dev/null; then
            echo do_heavy=true >> "$GITHUB_OUTPUT"
            echo 'ORDAX_INDEPENDENT_CHANGED_INPUTS=FULL_OR_UNRESOLVED'
            exit 0
          fi
          changed="$(git diff --name-only "$PREVIOUS_HEAD" "$CURRENT_HEAD" --)"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              docs/contracts/portable-boot-handoff.json) ;;
              tests/*|*.md) continue ;;
              *) ;;
            esac
            echo do_heavy=true >> "$GITHUB_OUTPUT"
            echo "ORDAX_INDEPENDENT_CHANGED_INPUTS=FUNCTIONAL:$file"
            exit 0
          done <<< "$changed"
          echo do_heavy=false >> "$GITHUB_OUTPUT"
          echo 'ORDAX_INDEPENDENT_CHANGED_INPUTS=ONLY_TESTS_OR_MARKDOWN'
      - name: Install Linux build, EROFS and QEMU tools
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-13 g++ bc perl bison flex openssl libssl-dev \
            libelf-dev dwarves kmod xz-utils pkg-config \
            gawk cpio unzip rsync file wget curl patch git \
            erofs-utils e2fsprogs util-linux qemu-system-x86
      - name: Bind cache keys to exact canonical inputs and toolchain
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        id: inputs
        run: |
          set -euo pipefail
          echo "kernel=$(python3 bootstrap/independent-base/ci_artifacts.py key --kind kernel)" >> "$GITHUB_OUTPUT"
          echo "base=$(python3 bootstrap/independent-base/ci_artifacts.py key --kind base)" >> "$GITHUB_OUTPUT"
      - name: Restore verified kernel cache by exact SHA-256
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        id: kernel-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ordax-kernel
          key: ordax-independent-kernel-${{ steps.inputs.outputs.kernel }}
      - name: Restore verified Buildroot cache by exact SHA-256
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        id: base-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-independent-base-${{ steps.inputs.outputs.base }}
      - name: Verify isolated contract and regressions
        run: |
          python3 -m unittest tests.test_independent_base_experiment tests.test_independent_ci_artifacts -v
          python3 -m py_compile bootstrap/independent-base/build.py bootstrap/independent-base/qemu_proof.py
          sh -n bootstrap/independent-base/post-build.sh
          sh -n bootstrap/independent-base/overlay/sbin/ordax-independent-probe-init
      - name: Build rootfs from official Buildroot source
        if: ${{ steps.scope.outputs.do_heavy == 'true' && steps.base-cache.outputs.cache-hit != 'true' }}
        run: |
          python3 bootstrap/independent-base/build.py build \
            --out "$RUNNER_TEMP/ordax-independent" \
            --cache "$RUNNER_TEMP/ordax-independent-cache" --jobs 4
          python3 bootstrap/independent-base/build.py verify --out "$RUNNER_TEMP/ordax-independent"
          python3 bootstrap/independent-base/ci_artifacts.py seal --kind base --directory "$RUNNER_TEMP/ordax-independent"
      - name: Build canonical OrdaX kernel without modifying kernel source
        if: ${{ steps.scope.outputs.do_heavy == 'true' && steps.kernel-cache.outputs.cache-hit != 'true' }}
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 bootstrap/kernel/build.py build \
            --work-dir "$RUNNER_TEMP/ordax-kernel-work" \
            --out-dir "$RUNNER_TEMP/ordax-kernel" --jobs 4
          python3 bootstrap/kernel/verify.py "$RUNNER_TEMP/ordax-kernel"
          python3 bootstrap/independent-base/ci_artifacts.py seal --kind kernel --directory "$RUNNER_TEMP/ordax-kernel"
      - name: Verify original provenance and bind current exact checkout to both binaries
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        run: |
          set -euo pipefail
          python3 bootstrap/independent-base/ci_artifacts.py bind --kind kernel             --directory "$RUNNER_TEMP/ordax-kernel" --receipt "$RUNNER_TEMP/current-kernel-binding.json"
          python3 bootstrap/independent-base/ci_artifacts.py bind --kind base             --directory "$RUNNER_TEMP/ordax-independent" --receipt "$RUNNER_TEMP/current-base-binding.json"
      - name: Cache kernel only after canonical integrity verification
        if: ${{ success() && steps.scope.outputs.do_heavy == 'true' && steps.kernel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ordax-kernel
          key: ordax-independent-kernel-${{ steps.inputs.outputs.kernel }}
      - name: Cache Buildroot only after canonical integrity verification
        if: ${{ success() && steps.scope.outputs.do_heavy == 'true' && steps.base-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-independent-base-${{ steps.inputs.outputs.base }}
      - name: QEMU real kernel, EROFS and ext4 persistence/recovery
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        run: |
          python3 bootstrap/independent-base/qemu_proof.py \
            --out "$RUNNER_TEMP/ordax-independent" \
            --kernel-dir "$RUNNER_TEMP/ordax-kernel" \
            --result "$RUNNER_TEMP/ordax-independent-qemu-result.json"
      - name: Upload immutable build inputs for official portable QEMU
        if: ${{ steps.scope.outputs.do_heavy == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-independent-verified-inputs
          path: |
            ${{ runner.temp }}/ordax-kernel/
            ${{ runner.temp }}/ordax-independent/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload candidate/provenance and observed QEMU result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-independent-base-experiment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ordax-independent/provenance.json
            ${{ runner.temp }}/ordax-independent/independent-base.erofs
            ${{ runner.temp }}/ordax-independent/rootfs.cpio.gz
            ${{ runner.temp }}/ordax-kernel/kernel-provenance.json
            ${{ runner.temp }}/ordax-independent-qemu-result.json
            ${{ runner.temp }}/ordax-independent-qemu-result-serial/*.serial.log
          if-no-files-found: warn
          retention-days: 7

  portable-signed-qemu:
    needs: buildroot-qemu
    if: ${{ needs.buildroot-qemu.outputs.do_heavy == 'true' }}
    uses: ./.github/workflows/portable-v2-qemu-boot-proof.yml
    with:
      base_source: independent
      shared_inputs: true
      independent_cold_health_diagnostic: true
    permissions:
      contents: read
