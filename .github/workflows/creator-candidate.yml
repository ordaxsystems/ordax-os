name: Creator Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'docs/contracts/minimal-bootstrap.json'
      - '.github/workflows/creator-candidate.yml'
  pull_request:
    paths:
      - '.github/actions/resolve-creator-source/**'
      - 'docs/contracts/native-release-assembly.json'
      - 'docs/contracts/minimal-bootstrap.json'
      - '.github/workflows/creator-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve exact standalone Creator source (no OS source copy)
        uses: ./.github/actions/resolve-creator-source
        with:
          checkout-root: ${{ runner.temp }}/ordax-creator-candidate-source

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test Creator Core and host policies against canonical OS contracts
        env:
          ORDAX_OS_CONTRACTS_DIR: ${{ github.workspace }}/docs/contracts
        working-directory: ${{ runner.temp }}/ordax-creator-candidate-source
        run: |
          set -euo pipefail
          test "$ORDAX_CREATOR_SOURCE_REPOSITORY" = "ordaxsystems/ordax-creator"
          test "$(git rev-parse HEAD)" = "$ORDAX_CREATOR_SOURCE_COMMIT"
          go test -count=1 ./...

      - name: Verify canonical manifest stays fail-closed
        working-directory: ${{ runner.temp }}/ordax-creator-candidate-source
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/docs/contracts/minimal-bootstrap.json"
          go run ./cmd/ordax-creator check --manifest "$manifest"

          if go run ./cmd/ordax-creator plan --manifest "$manifest"; then
            echo 'creator unexpectedly produced a destructive write plan' >&2
            exit 1
          fi

          payload_root="$(mktemp -d)"
          output_root="$(mktemp -d)"
          if go run ./cmd/ordax-creator stage-tree \
            --manifest "$manifest" \
            --payload-root "$payload_root" \
            --output-root "$output_root"; then
            echo 'creator unexpectedly staged an unresolved canonical payload' >&2
            exit 1
          fi
          test -z "$(find "$output_root" -mindepth 1 -print -quit)"

      - name: Assert public Creator excludes physical apply and raw backend build
        working-directory: ${{ runner.temp }}/ordax-creator-candidate-source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('cmd/ordax-creator/main.go').read_text(encoding='utf-8')
          forbidden = [
              'case "apply"',
              'case "write"',
              'case "flash"',
              'applyRawDiskInternal',
              'windowsRawDiskRuntimeUnbound',
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f'public Creator command exposes forbidden physical route markers: {found}')
          print('CREATOR_PUBLIC_PHYSICAL_APPLY=BLOCKED')
          PY

          deps="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -deps ./cmd/ordax-creator)"
          if grep -qx 'github.com/ordaxsystems/ordax-creator/host/windows' <<<"$deps"; then
            echo 'public Windows Creator unexpectedly links the native raw-disk host package' >&2
            exit 1
          fi

          public_files="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -f '{{range .GoFiles}}{{println .}}{{end}}' ./host/windows)"
          tagged_files="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -tags ordax_raw_backend -f '{{range .GoFiles}}{{println .}}{{end}}' ./host/windows)"
          for file in \
            raw_handle_write_windows.go \
            volume_lease_windows.go \
            elevation_windows.go \
            raw_runtime_windows.go; do
            if grep -qx "$file" <<<"$public_files"; then
              echo "public Windows build unexpectedly includes tagged raw backend file: $file" >&2
              exit 1
            fi
            if ! grep -qx "$file" <<<"$tagged_files"; then
              echo "tagged Windows raw backend build is missing expected file: $file" >&2
              exit 1
            fi
          done

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go test -c -tags ordax_raw_backend \
            -o "$RUNNER_TEMP/ordax-raw-backend.test.exe" ./host/windows
          rm -f "$RUNNER_TEMP/ordax-raw-backend.test.exe"
          echo 'CREATOR_PUBLIC_BINARY_LINKS_NATIVE_RAW_BACKEND=NO'
          echo 'CREATOR_RAW_BACKEND_BUILD_TAG_ISOLATION=PASS'

      - name: Build Windows and Linux candidates
        working-directory: ${{ runner.temp }}/ordax-creator-candidate-source
        run: |
          set -euo pipefail
          mkdir -p $GITHUB_WORKSPACE/out/creator/windows-amd64 $GITHUB_WORKSPACE/out/creator/linux-amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o $GITHUB_WORKSPACE/out/creator/windows-amd64/ordax-creator.exe ./cmd/ordax-creator
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o $GITHUB_WORKSPACE/out/creator/windows-amd64/ordax-creator-targets.exe ./cmd/ordax-creator-targets
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o $GITHUB_WORKSPACE/out/creator/linux-amd64/ordax-creator ./cmd/ordax-creator
          sha256sum \
            $GITHUB_WORKSPACE/out/creator/windows-amd64/ordax-creator.exe \
            $GITHUB_WORKSPACE/out/creator/windows-amd64/ordax-creator-targets.exe \
            $GITHUB_WORKSPACE/out/creator/linux-amd64/ordax-creator \
            > $GITHUB_WORKSPACE/out/creator/SHA256SUMS

      - name: Emit candidate provenance
        working-directory: ${{ runner.temp }}/ordax-creator-candidate-source
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, os, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'out/creator'
          def digest(path):
              h = hashlib.sha256()
              h.update(path.read_bytes())
              return h.hexdigest()
          data = {
              '$schema': 'prototype-ordax.creator-provenance/4',
              'status': 'candidate',
              'native_windows_raw_disk_backend_source_implemented': True,
              'native_windows_raw_disk_backend_build_tag': 'ordax_raw_backend',
              'native_windows_raw_disk_backend_in_public_build': False,
              'native_windows_raw_disk_backend_publicly_reachable': False,
              'public_creator_binary_links_native_raw_backend': False,
              'public_physical_apply_implemented': False,
              'physical_write_authorized': False,
              'windows_writable_physicaldrive_open_implemented_unbound': True,
              'windows_volume_lock_dismount_implemented_unbound': True,
              'windows_process_elevation_probe_implemented': True,
              'windows_target_discovery_implemented': True,
              'windows_target_discovery_mode': 'read-only-usb-physicaldrive',
              'windows_fixed_media_usb_supported': True,
              'windows_usb_transport_verification': True,
              'windows_system_disk_exclusion': True,
              'target_reenumeration_confirmation': True,
              'blocked_raw_disk_plan_implemented': True,
              'raw_disk_plan_schema': 'prototype-ordax.creator-windows-raw-disk-plan/2',
              'raw_disk_plan_strategy': 'verified-full-disk-image',
              'disposable_tree_staging_implemented': True,
              'gpt_filesystem_proof_implemented': True,
              'source_commit': os.environ['ORDAX_CREATOR_SOURCE_COMMIT'],
              'source_repository': os.environ['ORDAX_CREATOR_SOURCE_REPOSITORY'],
              'source_tree': os.environ['ORDAX_CREATOR_SOURCE_TREE'],
              'os_consumer_commit': os.environ['GITHUB_SHA'],
              'go_version': subprocess.check_output(['go', 'version'], text=True).strip(),
              'artifacts': {
                  'windows-amd64': {
                      'name': 'ordax-creator.exe',
                      'sha256': digest(root / 'windows-amd64' / 'ordax-creator.exe'),
                  },
                  'windows-target-discovery-amd64': {
                      'name': 'ordax-creator-targets.exe',
                      'sha256': digest(root / 'windows-amd64' / 'ordax-creator-targets.exe'),
                  },
                  'linux-amd64': {
                      'name': 'ordax-creator',
                      'sha256': digest(root / 'linux-amd64' / 'ordax-creator'),
                  },
              },
          }
          (root / 'provenance.json').write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload Creator candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-creator-${{ github.sha }}
          path: out/creator/
          if-no-files-found: error
          retention-days: 14
