name: Windows Compatibility Runtime Candidate

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/**'
      - 'tests/test_windows_compat_runtime_source.py'
      - '.github/workflows/windows-compat-runtime-lock-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install bounded runtime build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot erofs-utils util-linux
          proot --version
          docker version
          docker info >/dev/null
          command -v mkfs.erofs
          command -v fsck.erofs
          command -v blkid

      - name: Validate pinned non-executable source contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_windows_compat_runtime_source -v
          python -m py_compile \
            bootstrap/windows-compat-runtime/discover_lock.py \
            bootstrap/windows-compat-runtime/build.py

      - name: Verify upstream Wine bytes and revalidate exact Alpine closures
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/windows-compat-runtime"
          rm -rf "$work"
          mkdir -p "$work/cache"
          python bootstrap/windows-compat-runtime/discover_lock.py \
            --out "$work/windows-compat-runtime-lock.json" \
            --cache-dir "$work/cache"

          python - "$work/windows-compat-runtime-lock.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['$schema'] == 'prototype-ordax.windows-compat-runtime-lock-discovery/1'
          assert data['status'] == 'verified-pinned-lock'
          assert data['wine_source']['sha256'] == 'c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701'
          assert data['wine_source']['size_bytes'] == 33172240
          assert data['build_apk_package_lock_count'] == len(data['build_apk_package_lock']) == 239
          assert data['runtime_apk_package_lock_count'] == len(data['runtime_apk_package_lock']) == 97
          assert data['execution_adapter_connected'] is False
          assert data['installation_adapter_connected'] is False
          assert data['physical_artifact_authorized'] is False
          PY

      - name: Compile Wine and build isolated EROFS candidate
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/windows-compat-runtime"
          python bootstrap/windows-compat-runtime/build.py build \
            --cache-dir "$work/cache" \
            --out-dir "$work/build" \
            --jobs 2
          python bootstrap/windows-compat-runtime/build.py verify \
            --out-dir "$work/build"

      - name: Validate candidate remains non-executable and non-promotional
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/windows-compat-runtime"
          python - "$work/build/windows-compat-runtime-provenance.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['$schema'] == 'prototype-ordax.windows-compat-runtime-provenance/1'
          assert data['status'] == 'owner-development-candidate-not-executable'
          assert data['runtime_id'] == 'wine-11.0-wow64-x86_64-v1'
          assert data['compile_executor'] == 'docker-imported-pinned-alpine-rootfs'
          assert data['compile_network'] == 'none'
          assert data['compile_capabilities'] == 'none'
          assert data['wine_runtime']['version'] == 'wine-11.0'
          assert data['wine_runtime']['forbidden_unix_drivers_present'] is False
          assert data['build_apk_package_lock_count'] == 239
          assert data['runtime_apk_package_lock_count'] == 97
          for field in (
              'execution_adapter_connected',
              'installation_adapter_connected',
              'stable_mvp_enabled',
              'public_availability',
              'release_manifest_connected',
              'component_slot_connected',
              'physical_artifact_authorized',
          ):
              assert data[field] is False, field
          print('WINDOWS_COMPAT_RUNTIME_COMPILE=PASS')
          print('WINDOWS_COMPAT_RUNTIME_EXECUTION_AVAILABLE=NO')
          print('WINDOWS_COMPAT_RUNTIME_PROMOTABLE=NO')
          PY

      - name: Remove unproven runtime image bytes
        if: always()
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/windows-compat-runtime/build"
          rm -f "$work/windows-compat-runtime.erofs"
          test ! -e "$work/windows-compat-runtime.erofs"

      - name: Upload lock evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-runtime-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/windows-compat-runtime/windows-compat-runtime-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload successful candidate metadata only
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-runtime-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-runtime/build/windows-compat-runtime-provenance.json
            ${{ runner.temp }}/windows-compat-runtime/build/windows-compat-runtime-tree.json
          if-no-files-found: error
          retention-days: 7
