name: Supabase Migration Name Proof

on:
  pull_request:
    paths:
      - '.github/workflows/supabase-migration-name-proof.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate migration filename with official Supabase CLI
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 migration new network_direct_create_v2
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_network_direct_create_v2.sql' -printf '%f\n' | sort)"
          test "$(printf '%s\n' "$generated" | sed '/^$/d' | wc -l)" -eq 1
          printf 'ORDAX_SUPABASE_GENERATED_MIGRATION=%s\n' "$generated"
