name: Release Agent Refresh Asset

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/release-acquisition/**'
      - 'system/services/base-update/release-agent-refresh.json'
      - '.github/workflows/release-agent-refresh.yml'
  pull_request:
    paths:
      - 'bootstrap/release-acquisition/**'
      - 'system/services/base-update/release-agent-refresh.json'
      - '.github/workflows/release-agent-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Build and bind exact refresh bytes
        run: |
          set -euo pipefail
          mkdir -p out/release-agent-refresh
          (
            cd bootstrap/release-acquisition
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-agent-refresh/ordax-release-agent .
          )
          python3 - <<'PY'
          import hashlib, json, pathlib
          descriptor = json.loads(pathlib.Path(
              'system/services/base-update/release-agent-refresh.json'
          ).read_text(encoding='utf-8'))
          artifact = pathlib.Path('out/release-agent-refresh/ordax-release-agent')
          data = artifact.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          size = len(data)
          expected_url = (
              'https://github.com/ordaxsystems/ordax-os/releases/download/'
              f'ordax-release-agent-{digest}/ordax-release-agent'
          )
          print('RELEASE_AGENT_REFRESH_SHA256=' + digest)
          print('RELEASE_AGENT_REFRESH_SIZE=' + str(size))
          assert descriptor['$schema'] == 'prototype-ordax.release-agent-refresh/1'
          assert descriptor['status'] == 'development-git-migration'
          assert descriptor['target_sha256'] == digest, (descriptor['target_sha256'], digest)
          assert descriptor['target_size'] == size, (descriptor['target_size'], size)
          assert descriptor['download_url'] == expected_url
          assert descriptor['target_path'] == '/ordax/bootstrap/release-acquisition/ordax-release-agent'
          assert descriptor['raw_device_write_allowed'] is False
          assert descriptor['physical_media_rewrite_required'] is False
          assert descriptor['unknown_installed_hash_policy'] == 'block'
          PY

  # Manual read-only attestation of the already published migration target.
  # This is intentionally independent from the source rebuild check: a newly
  # compiled agent may differ after a repository owner/module-path change.
  # A passing audit NEVER licenses publishing the new compiler output.
  audit-published-target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout descriptor without repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm immutable repository and pinned descriptor
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = '1371063347'
          test "$GITHUB_REPOSITORY" = 'ordaxsystems/ordax-os'
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, re, sys
          descriptor = json.loads(pathlib.Path(
              "system/services/base-update/release-agent-refresh.json"
          ).read_text(encoding="utf-8"))
          digest = descriptor["target_sha256"]
          size = descriptor["target_size"]
          if not isinstance(digest, str) or not re.fullmatch(r"[a-f0-9]{64}", digest):
              raise SystemExit("release-agent target digest is invalid")
          if type(size) is not int or not 0 < size < 100 * 1024 * 1024:
              raise SystemExit("release-agent target size is invalid")
          if (descriptor["raw_device_write_allowed"] is not False or
              descriptor["physical_media_rewrite_required"] is not False or
              descriptor["unknown_installed_hash_policy"] != "block"):
              raise SystemExit("release-agent refresh authorization is not fail-closed")
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\nsize={size}\n")
          PY
      - name: Verify previously published asset bytes without modifying releases
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_SHA256: ${{ steps.target.outputs.sha256 }}
          PINNED_SIZE: ${{ steps.target.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/verified-release-agent-target"
          mkdir -p "$destination"
          gh release download "ordax-release-agent-$PINNED_SHA256" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ordax-release-agent' \
            --dir "$destination"
          test -f "$destination/ordax-release-agent"
          test ! -L "$destination/ordax-release-agent"
          echo "$PINNED_SHA256  $destination/ordax-release-agent" | sha256sum --check --status
          test "$(stat -c '%s' "$destination/ordax-release-agent")" = "$PINNED_SIZE"
          echo 'RELEASE_AGENT_PUBLISHED_TARGET_SHA256=VERIFIED'
          echo 'RELEASE_AGENT_PUBLISHED_TARGET_SIZE=VERIFIED'
          echo 'RELEASE_AGENT_PUBLISHED_TARGET_REPOSITORY_ID=1371063347'
          echo 'RELEASE_AGENT_NEW_BUILD_AUTHORIZED=NO'
          echo 'RELEASE_AGENT_SIGNING_PERFORMED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ordaxsystems/ordax-os'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Enforce immutable repository identity before release publication
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ordaxsystems/ordax-os'
          test "$GITHUB_REPOSITORY_ID" = '1371063347'

      - name: Rebuild exact immutable asset
        run: |
          set -euo pipefail
          mkdir -p out/release-agent-refresh
          (
            cd bootstrap/release-acquisition
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-agent-refresh/ordax-release-agent .
          )
          python3 - <<'PY'
          import hashlib, json, pathlib
          descriptor = json.loads(pathlib.Path(
              'system/services/base-update/release-agent-refresh.json'
          ).read_text(encoding='utf-8'))
          artifact = pathlib.Path('out/release-agent-refresh/ordax-release-agent')
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if digest != descriptor['target_sha256']:
              raise SystemExit('rebuilt release-agent does not match pinned refresh hash')
          if artifact.stat().st_size != descriptor['target_size']:
              raise SystemExit('rebuilt release-agent size does not match refresh descriptor')
          PY

      - name: Publish immutable hash-addressed asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='ordaxsystems/ordax-os'
          descriptor='system/services/base-update/release-agent-refresh.json'
          digest="$(python3 -c "import json; print(json.load(open('$descriptor'))['target_sha256'])")"
          tag="ordax-release-agent-$digest"
          artifact='out/release-agent-refresh/ordax-release-agent'
          expected="$(sha256sum "$artifact" | awk '{print $1}')"
          test "$expected" = "$digest"

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" \
              --title "OrdaX Release Agent $digest" --prerelease \
              --notes 'Hash-addressed bootstrap component migration asset. Authenticity for the live development owner is the source-controlled SHA-256 binding.'
          fi

          if ! gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' \
              | grep -Fxq 'ordax-release-agent'; then
            gh release upload "$tag" "$artifact#ordax-release-agent" --repo "$repo"
          fi

          # Read back the immutable asset from GitHub even on the first upload.
          # A successful upload response alone is not evidence of published bytes.
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          gh release download "$tag" --repo "$repo" \
            --pattern 'ordax-release-agent' --dir "$verification_dir"
          published="$verification_dir/ordax-release-agent"
          test -f "$published"
          test ! -L "$published"
          test "$(sha256sum "$published" | awk '{print $1}')" = "$digest"
          test "$(stat -c '%s' "$published")" = "$(stat -c '%s' "$artifact")"
          echo 'RELEASE_AGENT_PUBLISHED_ASSET_READBACK=VERIFIED'

          echo "RELEASE_AGENT_REFRESH_TAG=$tag"
          echo "RELEASE_AGENT_REFRESH_MUTABLE_OVERWRITE=NO"
