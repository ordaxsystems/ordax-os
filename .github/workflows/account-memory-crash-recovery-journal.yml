name: Account Memory Crash Recovery Journal

on:
  pull_request:
    paths:
      - 'system/contracts/identity-session.mjs'
      - 'system/contracts/memory.mjs'
      - 'system/contracts/sync-state-store.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-crash-recovery-journal.mjs'
      - 'tests/test_account_memory_crash_recovery_journal.mjs'
      - 'tests/test_account_memory_crash_recovery_device_durability.mjs'
      - '.github/workflows/account-memory-crash-recovery-journal.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/identity-session.mjs'
      - 'system/contracts/memory.mjs'
      - 'system/contracts/sync-state-store.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-crash-recovery-journal.mjs'
      - 'tests/test_account_memory_crash_recovery_journal.mjs'
      - 'tests/test_account_memory_crash_recovery_device_durability.mjs'
      - '.github/workflows/account-memory-crash-recovery-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crash-recovery-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check system/services/sync/account-memory-crash-recovery-journal.mjs
          node --check tests/test_account_memory_crash_recovery_journal.mjs
          node --check tests/test_account_memory_crash_recovery_device_durability.mjs

      - name: Prove crash recovery ownership and durability ordering
        run: |
          set -euo pipefail
          node --test \
            tests/test_account_memory_crash_recovery_journal.mjs \
            tests/test_account_memory_crash_recovery_device_durability.mjs
