name: Account Lovable Source Candidate

on:
  pull_request:
    paths:
      - 'sites/account-ui/**'
      - '.github/workflows/account-lovable-source-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify immutable original assets and snapshots
        run: |
          set -euo pipefail
          python sites/account-ui/verify_source.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'
      - name: Install source dependencies from original lockfile
        working-directory: sites/account-ui/lovable-original
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile copied Lovable components
        working-directory: sites/account-ui/lovable-original
        run: bunx --no-install vite build --config vite.config.account.ts
      - name: Check standalone build and deterministic hash
        run: |
          set -euo pipefail
          test -s sites/account-ui/candidate-dist/index.html
          find sites/account-ui/candidate-dist -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/account-build-a.sha"
          cd sites/account-ui/lovable-original
          bunx --no-install vite build --config vite.config.account.ts
          cd ../../..
          find sites/account-ui/candidate-dist -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/account-build-b.sha"
          diff -u "$RUNNER_TEMP/account-build-a.sha" "$RUNNER_TEMP/account-build-b.sha"
          echo 'ORDAX_LOVABLE_ORIGINAL_BUILD=PASS'
          echo 'PRODUCTION_ACTIVATION=BLOCKED_UNTIL_OFFICIAL_SESSION_ADAPTER_AND_E2E'
