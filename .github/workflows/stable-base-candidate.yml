name: Stable MVP Base Candidate (Buildroot verified reuse)

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/base/**'
      - '!bootstrap/base/**/*.md'
      - 'bootstrap/stable-base/**'
      - '!bootstrap/stable-base/**/*.md'
      - 'bootstrap/independent-base/**'
      - '!bootstrap/independent-base/**/*.md'
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - '!bootstrap/kernel/**/*.md'
      - 'docs/contracts/distribution-profiles.json'
      - 'docs/contracts/portable-bootstrap-v2.json'
      - 'tools/ci/portable_component_cache.py'
      - '.github/workflows/stable-base-candidate.yml'
  pull_request:
    paths:
      - 'bootstrap/base/**'
      - '!bootstrap/base/**/*.md'
      - 'bootstrap/stable-base/**'
      - '!bootstrap/stable-base/**/*.md'
      - 'bootstrap/independent-base/**'
      - '!bootstrap/independent-base/**/*.md'
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - '!bootstrap/kernel/**/*.md'
      - 'docs/contracts/distribution-profiles.json'
      - 'docs/contracts/portable-bootstrap-v2.json'
      - 'tools/ci/portable_component_cache.py'
      - '.github/workflows/stable-base-candidate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read  # Only to fetch a canonical successful Stable producer artifact.

jobs:
  stable-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate Stable Buildroot source without compiling
        run: |
          set -euo pipefail
          python3 bootstrap/independent-base/build.py check --profile stable-mvp
          python3 -m unittest tests.test_independent_owner_profile -v

      - name: Resolve canonical kernel ABI for build artifacts
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/ci_env.py --github-env "$GITHUB_ENV"

      - name: Resolve exact reusable kernel and Stable fingerprints
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/portable-v2-qemu/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-v2-qemu/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Verify previously built kernel; never rebuild on cache miss
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ORDAX_KERNEL_CACHE_HIT: ${{ steps.kernel-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$ORDAX_KERNEL_CACHE_HIT" != true ]; then
            echo 'No verified kernel cache for Stable candidate; use the canonical independent producer first' >&2
            exit 1
          fi
          kernel_dir="$RUNNER_TEMP/portable-v2-qemu/kernel"
          test -s "$kernel_dir/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          test ! -L "$kernel_dir/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          python3 bootstrap/kernel/verify.py "$kernel_dir"
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel --out-dir "$kernel_dir" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" --cache-hit true \
            --receipt "$RUNNER_TEMP/portable-v2-qemu/metadata/kernel-component-reuse.json"

      - name: Restore verified Stable Buildroot component
        id: independent-stable-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-independent-base-stable-${{ steps.component-fingerprints.outputs.independent_base_stable }}

      - name: Restore verified Stable producer artifact on scoped cache miss
        id: stable-artifact
        if: steps.independent-stable-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ORDAX_STABLE_FINGERPRINT: ${{ steps.component-fingerprints.outputs.independent_base_stable }}
        run: |
          set -euo pipefail
          # A full producer artifact is required: a partial evidence export
          # cannot substitute for the canonical cache manifest and all bytes.
          artifact_name="ordax-stable-cache-${ORDAX_STABLE_FINGERPRINT}-${ORDAX_SOURCE_COMMIT}"
          export ORDAX_STABLE_ARTIFACT_NAME="$artifact_name"
          artifact_list="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f "name=${artifact_name}" -F per_page=100)"
          run_id="$(printf '%s' "$artifact_list" | python3 -c '
          import json, os, sys
          records = json.load(sys.stdin).get("artifacts", [])
          matches = [a for a in records
                     if a.get("name") == os.environ["ORDAX_STABLE_ARTIFACT_NAME"]
                     and a.get("expired") is False
                     and (a.get("workflow_run") or {}).get("head_sha") == os.environ["ORDAX_SOURCE_COMMIT"]]
          if len(matches) != 1:
              raise SystemExit("need exactly one unexpired exact stable producer artifact")
          print(matches[0]["workflow_run"]["id"])
          ')"
          run_info="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          printf '%s' "$run_info" | python3 -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if (run.get("head_sha") != os.environ["ORDAX_SOURCE_COMMIT"]
              or run.get("path") != ".github/workflows/independent-base-experiment.yml"
              or run.get("event") != "workflow_dispatch"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or (run.get("repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]):
              raise SystemExit("Stable artifact did not come from successful canonical producer")
          '
          base_dir="$RUNNER_TEMP/ordax-independent"
          test ! -e "$base_dir" && test ! -L "$base_dir"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$base_dir"
          python3 tools/ci/portable_component_cache.py verify \
            --component independent-base-stable --out-dir "$base_dir" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" --cache-hit true \
            --receipt "$RUNNER_TEMP/portable-v2-qemu/metadata/stable-artifact-reuse.json"
          printf 'reused=true\n' >> "$GITHUB_OUTPUT"

      - name: Verify Stable Buildroot candidate without rebuilding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ORDAX_STABLE_CACHE_HIT: ${{ steps.independent-stable-cache.outputs.cache-hit }}
          ORDAX_STABLE_ARTIFACT_REUSED: ${{ steps.stable-artifact.outputs.reused }}
        run: |
          set -euo pipefail
          if [ "$ORDAX_STABLE_CACHE_HIT" != true ] && [ "$ORDAX_STABLE_ARTIFACT_REUSED" != true ]; then
            echo 'No verified stable-mvp Buildroot component; run the existing Independent Base producer first' >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils
          base_dir="$RUNNER_TEMP/ordax-independent"
          test -s "$base_dir/independent-base.erofs"
          python3 bootstrap/independent-base/build.py verify --profile stable-mvp --out "$base_dir"
          python3 tools/ci/portable_component_cache.py verify \
            --component independent-base-stable --out-dir "$base_dir" \
            --integration-commit "$ORDAX_SOURCE_COMMIT" --cache-hit true \
            --receipt "$RUNNER_TEMP/portable-v2-qemu/metadata/stable-component-reuse.json"
          python3 - "$base_dir/provenance.json" <<'PY'
          import json
          import pathlib
          import sys
          p = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert p['$schema'] == 'prototype-ordax.independent-base-provenance/1'
          assert p['status'] == 'candidate-build-only'
          assert p['profile'] == 'stable-mvp'
          assert p['owner_development_capabilities_verified'] is False
          assert p['physical_artifact_authorized'] is False
          assert p['signed_release_equivalence_proven'] is False
          assert p['qemu_boot_proven'] is False
          print('STABLE_BASE_BUILDROOT_VERIFIED=PASS')
          print('STABLE_BASE_PHYSICAL_AUTHORIZED=NO')
          PY

      - name: Save verified Stable component into current PR cache scope
        if: steps.stable-artifact.outputs.reused == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordax-independent
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-independent-base-stable-${{ steps.component-fingerprints.outputs.independent_base_stable }}

      - name: Retain verified Stable receipts for review only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stable-mvp-buildroot-receipts-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ordax-independent/provenance.json
            ${{ runner.temp }}/portable-v2-qemu/metadata/kernel-component-reuse.json
            ${{ runner.temp }}/portable-v2-qemu/metadata/stable-component-reuse.json
          if-no-files-found: error
          retention-days: 7
