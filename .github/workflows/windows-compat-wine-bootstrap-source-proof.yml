name: Windows Compatibility Wine Bootstrap Source Proof

on:
  pull_request:
    paths:
      - 'bootstrap/windows-compat-runtime/source.json'
      - 'bootstrap/windows-compat-runtime/build.py'
      - 'bootstrap/windows-compat-runtime/runtime-dependency-discovery.json'
      - 'bootstrap/windows-compat-runtime/wine_bootstrap_source_probe.py'
      - 'tests/test_windows_compat_wine_bootstrap_source_proof.py'
      - '.github/workflows/windows-compat-wine-bootstrap-source-proof.yml'
  push:
    branches: [main]
    paths:
      - 'bootstrap/windows-compat-runtime/source.json'
      - 'bootstrap/windows-compat-runtime/build.py'
      - 'bootstrap/windows-compat-runtime/runtime-dependency-discovery.json'
      - 'bootstrap/windows-compat-runtime/wine_bootstrap_source_probe.py'
      - 'tests/test_windows_compat_wine_bootstrap_source_proof.py'
      - '.github/workflows/windows-compat-wine-bootstrap-source-proof.yml'

permissions:
  contents: read

jobs:
  bootstrap-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate bootstrap source proof boundaries
        run: |
          set -euo pipefail
          python bootstrap/windows-compat-runtime/build.py check
          python bootstrap/windows-compat-runtime/wine_bootstrap_source_probe.py check
          python -m unittest tests.test_windows_compat_wine_bootstrap_source_proof -v

      - name: Fetch and prove exact Wine bootstrap source
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-wine-bootstrap-source-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"

          python bootstrap/windows-compat-runtime/build.py fetch-source \
            --cache-dir "$work/source-cache" \
            --proof-out "$proof_dir/source-proof.json"

          python bootstrap/windows-compat-runtime/wine_bootstrap_source_probe.py verify \
            --source-archive "$work/source-cache/wine-11.0.tar.xz" \
            --out "$proof_dir/wine-bootstrap-source-proof.json"

          python - <<'PY' "$proof_dir/wine-bootstrap-source-proof.json"
          import json
          import pathlib
          import re
          import sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['$schema'] == 'prototype-ordax.windows-compat-wine-bootstrap-source-proof/1'
          assert proof['runtime_id'] == 'wine-11.0-wow64-x86_64-candidate'
          assert proof['wine_version'] == '11.0'
          assert proof['archive_sha256'] == 'c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701'
          assert proof['source_path'] == 'tools/wine/wine.c'
          assert re.fullmatch(r'[0-9a-f]{64}', proof['source_file_sha256'])
          assert re.fullmatch(r'[0-9a-f]{64}', proof['evidence_sha256'])
          assert proof['behavior'] == {
              'load_ntdll_function_present': True,
              'installed_arch_ntdll_uses_rtld_now': True,
              'main_resolves_wine_main_from_load_ntdll': True,
          }
          gates = proof['gates']
          for gate in ('source_lock_verified', 'source_archive_verified', 'wine_bootstrap_source_behavior_verified'):
              assert gates[gate] is True, gate
          for gate in (
              'runtime_dependency_inventory_complete',
              'runtime_package_content_hashes_pinned',
              'binary_artifact_pinned',
              'activation_authorized',
              'execution_authorized',
              'wine_executed',
              'windows_payload_executed',
          ):
              assert gates[gate] is False, gate
          print('Wine bootstrap source authority: PASS')
          print('wine.c sha256:', proof['source_file_sha256'])
          print('evidence:', proof['evidence_sha256'])
          PY

      - name: Upload source metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-wine-bootstrap-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-compat-wine-bootstrap-source-proof/source-proof.json
            ${{ runner.temp }}/windows-compat-wine-bootstrap-source-proof/wine-bootstrap-source-proof.json
          if-no-files-found: error
