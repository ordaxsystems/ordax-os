name: Release Signing Tooling

on:
  push:
    branches: [main]
    paths:
      - 'tools/release-signing/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/trust/README.md'
      - 'docs/RELEASE-SIGNING.md'
      - 'docs/RELEASE-BUNDLE.md'
      - 'docs/RELEASE-PIPELINE.md'
      - 'docs/contracts/portable-v4-signing-handoff.json'
      - 'tests/test_release_v4_signing_runbook.py'
      - 'tests/test_canonical_v4_operator_inputs.py'
      - 'tests/test_canonical_v4_proof_receipt.py'
      - 'tools/creator/bind_canonical_v4_release_proof.py'
      - '.github/workflows/portable-release-image.yml'
      - '.github/workflows/surface-runtime-lock-discovery.yml'
      - '.github/workflows/local-ai-runtime-candidate.yml'
      - '.github/workflows/canonical-v4-materialization.yml'
      - '.github/workflows/release-signing.yml'
  pull_request:
    paths:
      - 'tools/release-signing/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/trust/README.md'
      - 'docs/RELEASE-SIGNING.md'
      - 'docs/contracts/portable-v4-signing-handoff.json'
      - 'tests/test_release_v4_signing_runbook.py'
      - 'tests/test_canonical_v4_operator_inputs.py'
      - 'tests/test_canonical_v4_proof_receipt.py'
      - 'tools/creator/bind_canonical_v4_release_proof.py'
      - '.github/workflows/portable-release-image.yml'
      - '.github/workflows/surface-runtime-lock-discovery.yml'
      - '.github/workflows/local-ai-runtime-candidate.yml'
      - '.github/workflows/canonical-v4-materialization.yml'
      - '.github/workflows/release-signing.yml'

permissions:
  contents: read

jobs:
  canonical-receipt-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false
      - name: Exercise canonical receipt with Windows PowerShell and PowerShell Core
        run: python -m unittest discover -s tests -p 'test_canonical_v4_proof_receipt.py' -v

  signing-tooling:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test release signing boundary
        working-directory: tools/release-signing
        run: go test -count=1 ./...

      - name: Test canonical v4 signing runbook contract
        run: python3 -m unittest tests.test_release_v4_signing_runbook -v

      - name: Test manual-only canonical v4 operator input export
        run: python3 -m unittest tests.test_canonical_v4_operator_inputs -v

      - name: Parse Windows v4 signing runbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'tools/release-signing/windows/Preflight-PortableV4-Canonical.ps1',
            'tools/release-signing/windows/3-Prepare-PortableV4-SigningHandoff.ps1',
            'tools/release-signing/windows/4-Sign-Initial-OrdaXRelease.ps1',
            'tools/release-signing/windows/5-Verify-PortableV4-SignedHandoff.ps1'
            'tools/release-signing/windows/6-Materialize-Verify-PortableV4-Canonical.ps1'
            'tools/release-signing/windows/7-Verify-PortableV4-Canonical-Proof.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
          }
          Write-Host 'PORTABLE_V4_SIGNING_RUNBOOK_POWERSHELL_PARSE=PASS'

      - name: Exercise canonical v4 operator preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'canonical-v4-preflight-test'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $files = @(
            'system.erofs',
            'native-surface-runtime.erofs',
            'local-ai-runtime.erofs',
            'ordax-release-manifest.exe',
            'ordax-release-signing.exe',
            'ordax-release-agent.exe',
            'private.pem'
          )
          foreach ($name in $files) {
            "fixture-$name" | Set-Content -LiteralPath (Join-Path $work $name) -Encoding UTF8
          }
          @{
            '$schema' = 'prototype-ordax.release-trust/1'
            key_id = 'ordax-prototype-release-v1'
            public_key_base64 = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $work 'trust.json') -Encoding UTF8
          @{
            '$schema' = 'prototype-ordax.local-ai-source-lock/1'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $work 'source-lock.json') -Encoding UTF8

          python tools/release-signing/operator_receipt.py `
            --kind system `
            --source-commit 0123456789abcdef0123456789abcdef01234567 `
            --file "system.erofs=$work/system.erofs" `
            --out "$work/system-receipt.json"
          python tools/release-signing/operator_receipt.py `
            --kind surface `
            --source-commit 0123456789abcdef0123456789abcdef01234567 `
            --file "native-surface-runtime.erofs=$work/native-surface-runtime.erofs" `
            --out "$work/surface-receipt.json"
          python tools/release-signing/operator_receipt.py `
            --kind local-ai `
            --source-commit 0123456789abcdef0123456789abcdef01234567 `
            --file "local-ai-runtime.erofs=$work/local-ai-runtime.erofs" `
            --file "source-lock.json=$work/source-lock.json" `
            --out "$work/local-ai-receipt.json"

          $args = @{
            SystemImagePath = Join-Path $work 'system.erofs'
            SurfaceRuntimePath = Join-Path $work 'native-surface-runtime.erofs'
            LocalAiRuntimePath = Join-Path $work 'local-ai-runtime.erofs'
            LocalAiSourceLockPath = Join-Path $work 'source-lock.json'
            SystemReceiptPath = Join-Path $work 'system-receipt.json'
            SurfaceReceiptPath = Join-Path $work 'surface-receipt.json'
            LocalAiReceiptPath = Join-Path $work 'local-ai-receipt.json'
            SourceCommit = '0123456789abcdef0123456789abcdef01234567'
            SystemArtifactUrl = 'https://releases.example.invalid/system.erofs'
            SurfaceArtifactUrl = 'https://releases.example.invalid/native-surface-runtime.erofs'
            LocalAiArtifactUrl = 'https://releases.example.invalid/local-ai-runtime.erofs'
            ManifestToolPath = Join-Path $work 'ordax-release-manifest.exe'
            SignerPath = Join-Path $work 'ordax-release-signing.exe'
            ReleaseAgentPath = Join-Path $work 'ordax-release-agent.exe'
            TrustPath = Join-Path $work 'trust.json'
            PrivateKeyPath = Join-Path $work 'private.pem'
          }
          & ./tools/release-signing/windows/Preflight-PortableV4-Canonical.ps1 @args

          $failedClosed = $false
          try {
            $args.SystemArtifactUrl = 'https://releases.example.invalid/system.erofs?temporary=1'
            & ./tools/release-signing/windows/Preflight-PortableV4-Canonical.ps1 @args
          } catch {
            $failedClosed = $true
          }
          if (-not $failedClosed) { throw 'preflight accepted an unstable artifact URL' }

          $args.SystemArtifactUrl = 'https://releases.example.invalid/system.erofs'
          $systemReceiptPath = Join-Path $work 'system-receipt.json'
          $systemReceipt = Get-Content -LiteralPath $systemReceiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $systemReceipt.source_commit = 'fedcba9876543210fedcba9876543210fedcba98'
          $systemReceipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $systemReceiptPath -Encoding UTF8
          $failedClosed = $false
          try {
            & ./tools/release-signing/windows/Preflight-PortableV4-Canonical.ps1 @args
          } catch {
            $failedClosed = $true
          }
          if (-not $failedClosed) { throw 'preflight accepted an operator receipt from another source commit' }

          python tools/release-signing/operator_receipt.py `
            --kind system `
            --source-commit 0123456789abcdef0123456789abcdef01234567 `
            --file "system.erofs=$work/system.erofs" `
            --out "$work/system-receipt.json"
          'tampered-after-receipt' | Add-Content -LiteralPath (Join-Path $work 'system.erofs') -Encoding UTF8
          $failedClosed = $false
          try {
            & ./tools/release-signing/windows/Preflight-PortableV4-Canonical.ps1 @args
          } catch {
            $failedClosed = $true
          }
          if (-not $failedClosed) { throw 'preflight accepted bytes changed after the operator receipt was created' }

          Write-Host 'CANONICAL_V4_OPERATOR_PREFLIGHT_TEST=PASS'
          Write-Host 'OPERATOR_RECEIPT_WRONG_COMMIT_REJECTED=YES'
          Write-Host 'OPERATOR_RECEIPT_BYTE_TAMPER_REJECTED=YES'
          Write-Host 'PRIVATE_KEY_CONTENT_USED=NO'
          Write-Host 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Exercise canonical v4 proof receipt aggregator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'canonical-v4-proof-test'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $commit = '0123456789abcdef0123456789abcdef01234567'
          $trust = Join-Path $work 'release-ed25519.json'
          '{"schema":"test-trust"}' | Set-Content -LiteralPath $trust -Encoding UTF8
          $trustSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $trust).Hash.ToLowerInvariant()
          $manifestSha = 'a' * 64
          $envelopeSha = 'b' * 64
          $systemSha = 'c' * 64
          $surfaceSha = 'd' * 64
          $aiSha = 'e' * 64

          $signed = [ordered]@{
            schema = 'prototype-ordax.portable-v4-signed-handoff-verification/1'
            source_commit = $commit
            release_manifest_sha256 = $manifestSha
            release_envelope_sha256 = $envelopeSha
            canonical_trust_sha256 = $trustSha
            artifacts = [ordered]@{
              'system.erofs' = [ordered]@{ sha256 = $systemSha; size = 11 }
              'native-surface-runtime.erofs' = [ordered]@{ sha256 = $surfaceSha; size = 22 }
              'local-ai-runtime.erofs' = [ordered]@{ sha256 = $aiSha; size = 33 }
            }
            signature_verified_by_release_agent = $true
            signed_payload_matches_manifest_bytes = $true
            local_artifacts_match_signed_manifest = $true
            release_published = $false
            release_activated = $false
            portable_materialization_performed = $false
            physical_target_selected = $false
            physical_write_authorized_by_this_step = $false
            physical_write_performed = $false
          }
          $materialized = [ordered]@{
            schema = 'prototype-ordax.portable-v4-canonical-materialization-verification/1'
            source_commit = $commit
            canonical_envelope_url = 'https://releases.example.invalid/release-envelope.json'
            canonical_trust_sha256 = $trustSha
            release_manifest_sha256 = $manifestSha
            release_envelope_sha256 = $envelopeSha
            artifacts = [ordered]@{
              'system.erofs' = $systemSha
              'native-surface-runtime.erofs' = $surfaceSha
              'local-ai-runtime.erofs' = $aiSha
            }
            release_agent_materialize_portable_v4 = $true
            release_agent_verify_portable_v4_exact = $true
            current_pointer_created = $false
            known_good_pointer_created = $false
            candidate_created = $false
            activation_transaction_created = $false
            release_activated = $false
            physical_target_selected = $false
            physical_write_authorized_by_this_step = $false
            physical_write_performed = $false
          }

          $signedPath = Join-Path $work 'signed.json'
          $materializedPath = Join-Path $work 'materialized.json'
          $proofPath = Join-Path $work 'proof.json'
          $signed | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $signedPath -Encoding UTF8
          $materialized | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $materializedPath -Encoding UTF8

          & ./tools/release-signing/windows/7-Verify-PortableV4-Canonical-Proof.ps1 `
            -ExpectedCommit $commit `
            -SignedHandoffReceiptPath $signedPath `
            -MaterializationReceiptPath $materializedPath `
            -TrustPath $trust `
            -ReceiptPath $proofPath

          $proof = Get-Content -LiteralPath $proofPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($proof.schema -cne 'prototype-ordax.portable-v4-canonical-release-proof/1') { throw 'proof schema mismatch' }
          if ($proof.source_commit -cne $commit) { throw 'proof source commit mismatch' }
          if ($proof.canonical_trust_sha256 -cne $trustSha) { throw 'proof trust mismatch' }
          if ($proof.physical_write_authorized -ne $false -or $proof.physical_write_performed -ne $false) {
            throw 'proof unexpectedly grants physical authority'
          }

          $materialized.artifacts.'system.erofs' = 'f' * 64
          $tamperedPath = Join-Path $work 'materialized-tampered.json'
          $materialized | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $tamperedPath -Encoding UTF8
          $failedClosed = $false
          try {
            & ./tools/release-signing/windows/7-Verify-PortableV4-Canonical-Proof.ps1 `
              -ExpectedCommit $commit `
              -SignedHandoffReceiptPath $signedPath `
              -MaterializationReceiptPath $tamperedPath `
              -TrustPath $trust `
              -ReceiptPath (Join-Path $work 'tampered-proof.json')
          } catch {
            $failedClosed = $true
          }
          if (-not $failedClosed) { throw 'tampered materialization receipt was accepted' }

      - name: Build signer and verifier candidates
        run: |
          set -euo pipefail
          mkdir -p out/release-signing
          (
            cd tools/release-signing
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-signing-linux-amd64 .
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-signing-windows-amd64.exe .
          )
          (
            cd bootstrap/release-acquisition
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-agent-linux-amd64 .
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-agent-windows-amd64.exe .
          )

      - name: Prove signer and release agent protocol compatibility
        run: |
          set -euo pipefail
          signer="$PWD/out/release-signing/ordax-release-signing-linux-amd64"
          agent="$PWD/out/release-signing/ordax-release-agent-linux-amd64"
          work="$RUNNER_TEMP/release-signing-proof"
          mkdir -p "$work"
          chmod 0700 "$work"
          cat > "$work/release-manifest.json" <<'JSON'
          {
            "$schema": "prototype-ordax.release-manifest/1",
            "source_repository": "ordaxsystems/ordax-os",
            "source_commit": "0123456789abcdef0123456789abcdef01234567",
            "release_id": "0123456789abcdef0123456789abcdef01234567",
            "created_from_ci_recipe": "release/native/1",
            "artifacts": [
              {
                "name": "system.tar",
                "role": "system",
                "url": "https://example.invalid/system.tar",
                "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                "size": 123
              }
            ]
          }
          JSON
          "$signer" generate-key \
            --private-key "$work/private.pem" \
            --trust "$work/trust.json" \
            --key-id ci-test-1
          "$signer" sign \
            --manifest "$work/release-manifest.json" \
            --private-key "$work/private.pem" \
            --trust "$work/trust.json" \
            --key-id ci-test-1 \
            --out "$work/release-envelope.json"
          "$signer" derive-trust \
            --private-key "$work/private.pem" \
            --key-id ci-test-1 \
            --out "$work/derived-trust.json"
          cmp "$work/trust.json" "$work/derived-trust.json"
          test "$(stat -c '%a' "$work/private.pem")" = 600
          "$signer" generate-key \
            --private-key "$work/next-private.pem" \
            --trust "$work/next-trust.json" \
            --key-id ci-test-2
          "$signer" sign-trust-transition \
            --current-private-key "$work/private.pem" \
            --current-trust "$work/trust.json" \
            --next-trust "$work/next-trust.json" \
            --sequence 1 \
            --out "$work/trust-transition.json"
          transition_output="$("$agent" verify-trust-transition \
            --envelope "$work/trust-transition.json" \
            --current-trust "$work/trust.json" \
            --expected-sequence 1 \
            --out-next-trust "$work/verified-next-trust.json")"
          printf '%s\n' "$transition_output"
          grep -q '"status": "trust-transition-verified"' <<<"$transition_output"
          grep -q '"sequence": 1' <<<"$transition_output"
          grep -q '"next_key_id": "ci-test-2"' <<<"$transition_output"
          cmp "$work/next-trust.json" "$work/verified-next-trust.json"
          verify_output="$("$agent" verify-envelope \
            --envelope "$work/release-envelope.json" \
            --trust "$work/trust.json")"
          printf '%s\n' "$verify_output"
          grep -q '"status": "verified"' <<<"$verify_output"
          grep -q '"source_commit": "0123456789abcdef0123456789abcdef01234567"' <<<"$verify_output"
          rm -f "$work/private.pem" "$work/next-private.pem"
          test ! -e "$work/private.pem"
          test ! -e "$work/next-private.pem"
          echo 'SIGNER_TRUST_MATCH=PASS'
          echo 'TRUST_TRANSITION_PROTOCOL=PASS'
          echo 'SIGNER_AGENT_PROTOCOL=PASS'
          echo 'CI_TEST_KEY_REMOVED=YES'
          echo 'CANONICAL_TRUST_ANCHOR=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Upload public tooling candidates only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-signing-tooling-${{ github.sha }}
          path: |
            out/release-signing/ordax-release-signing-linux-amd64
            out/release-signing/ordax-release-signing-windows-amd64.exe
            out/release-signing/ordax-release-agent-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14
