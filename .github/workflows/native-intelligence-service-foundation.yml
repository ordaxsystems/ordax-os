name: Native Intelligence Service Foundation

on:
  push:
    branches: [main]
    paths:
      - 'system/services/intelligence/native-service.mjs'
      - 'system/composition/native/intelligence-host-bridge.mjs'
      - 'system/surface/runtime/native_intelligence_ipc.py'
      - 'system/surface/runtime/ordax_browser_host.py'
      - 'tests/test_native_intelligence_service.mjs'
      - 'tests/test_native_intelligence_host_bridge.mjs'
      - 'tests/test_native_intelligence_ipc.py'
      - 'docs/plans/NATIVE-INTELLIGENCE-SERVICE-BOUNDARY-2026-10-14.md'
      - '.github/workflows/native-intelligence-service-foundation.yml'
  pull_request:
    paths:
      - 'system/services/intelligence/native-service.mjs'
      - 'system/composition/native/intelligence-host-bridge.mjs'
      - 'system/surface/runtime/native_intelligence_ipc.py'
      - 'system/surface/runtime/ordax_browser_host.py'
      - 'tests/test_native_intelligence_service.mjs'
      - 'tests/test_native_intelligence_host_bridge.mjs'
      - 'tests/test_native_intelligence_ipc.py'
      - 'docs/plans/NATIVE-INTELLIGENCE-SERVICE-BOUNDARY-2026-10-14.md'
      - '.github/workflows/native-intelligence-service-foundation.yml'

permissions:
  contents: read

jobs:
  native-intelligence-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate runner runtimes
        run: |
          node --version
          python3 --version

      - name: Validate Native Intelligence source syntax
        run: |
          node --check system/services/intelligence/native-service.mjs
          node --check system/composition/native/intelligence-host-bridge.mjs
          python3 -m py_compile system/surface/runtime/native_intelligence_ipc.py system/surface/runtime/ordax_browser_host.py

      - name: Run Native Intelligence JavaScript contracts
        run: node --test tests/test_native_intelligence_service.mjs tests/test_native_intelligence_host_bridge.mjs

      - name: Run Native Intelligence private IPC contracts
        run: python3 tests/test_native_intelligence_ipc.py
