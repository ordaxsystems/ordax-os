name: Windows Compatibility APK Relock Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  apk-relock-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install bounded proof host dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot

      - name: Reproduce current configure proof
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-apk-relock-diagnostic"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          python bootstrap/windows-compat-runtime/configure_probe.py probe \
            --work-dir "$work" \
            --proof-out "$proof_dir/configure-proof.json"
          python - <<'PY' "$proof_dir/configure-proof.json"
          import hashlib
          import json
          import pathlib
          import sys

          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['configure_proof_passed'] is True
          assert proof['package_versions_pinned'] is False
          assert proof['full_build_proof_passed'] is False
          assert proof['binary_artifact_pinned'] is False
          assert proof['activation_authorized'] is False
          assert proof['execution_authorized'] is False
          packages = proof['resolved_installed_packages']
          assert len(packages) == 342
          canonical = json.dumps(packages, sort_keys=True, separators=(',', ':')).encode('utf-8')
          digest = hashlib.sha256(canonical).hexdigest()
          assert digest == '99f0881664ee6a089755baa74e71513a671d8073e91a8256d36ef2c4c303243e', digest
          assert packages['libpng'] == '1.6.59-r0'
          assert packages['libpng-dev'] == '1.6.59-r0'
          for name in ('python3', 'python3-pyc', 'python3-pycache-pyc0', 'pyc'):
              assert packages[name] == '3.12.15-r0', (name, packages[name])
          print('configure closure sha256:', digest)
          PY

      - name: Apply current observed closure only in runner workspace
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('bootstrap/windows-compat-runtime/build-version-lock.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          assert value['resolved_closure']['package_count'] == 342
          assert value['resolved_closure']['canonical_json_sha256'] == 'f54136e53b42482dc4f68159c12eb3d9af3533ad1c3d76aa6f1b274d24fff3ff'
          assert value['gates']['apk_content_hashes_pinned'] is False
          assert value['gates']['full_build_proof_passed'] is False
          assert value['gates']['activation_authorized'] is False
          assert value['gates']['execution_authorized'] is False
          value['resolved_closure']['canonical_json_sha256'] = '99f0881664ee6a089755baa74e71513a671d8073e91a8256d36ef2c4c303243e'
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Reproduce current closure and hash exact APK bytes
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          proof_dir="${RUNNER_TEMP}/windows-compat-apk-relock-diagnostic"
          python bootstrap/windows-compat-runtime/discover_apk_content.py discover \
            --work-dir "$work" \
            --out "$proof_dir/apk-content-discovery.json"
          python - <<'PY' "$proof_dir/apk-content-discovery.json"
          import hashlib
          import json
          import pathlib
          import sys

          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = '99f0881664ee6a089755baa74e71513a671d8073e91a8256d36ef2c4c303243e'
          assert proof['resolved_package_count'] == 342
          assert proof['resolved_closure_sha256'] == expected
          assert proof['offline_replay_closure_sha256'] == expected
          assert proof['external_apk_package_count'] == 326
          assert proof['gates']['apk_content_hashes_pinned'] is False
          assert proof['gates']['full_build_proof_passed'] is False
          assert proof['gates']['activation_authorized'] is False
          assert proof['gates']['execution_authorized'] is False

          manifest = proof['external_apk_manifest']
          assert manifest['libpng']['version'] == '1.6.59-r0'
          assert manifest['libpng-dev']['version'] == '1.6.59-r0'
          for name in ('python3', 'python3-pyc', 'python3-pycache-pyc0', 'pyc'):
              assert manifest[name]['version'] == '3.12.15-r0', (name, manifest[name])
          canonical = json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode('utf-8')
          summary = {
              'resolved_closure_sha256': expected,
              'external_apk_package_count': len(manifest),
              'external_apk_total_size_bytes': sum(item['size_bytes'] for item in manifest.values()),
              'external_apk_canonical_manifest_sha256': hashlib.sha256(canonical).hexdigest(),
              'changed_inputs': {
                  name: manifest[name]
                  for name in ('libpng', 'libpng-dev', 'python3', 'python3-pyc', 'python3-pycache-pyc0', 'pyc')
              },
          }
          assert summary['external_apk_total_size_bytes'] == 595141970
          assert summary['external_apk_canonical_manifest_sha256'] == '9ecad632554f9f164294a803af9cfe8ccbfba525c71e1cd61c7cbd9fc7e8d7bf'
          (pathlib.Path(sys.argv[1]).parent / 'relock-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload diagnostic metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-compat-apk-relock-diagnostic-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/windows-compat-apk-relock-diagnostic/
          if-no-files-found: error
