name: Account Memory Local Continuity Flush

on:
  pull_request:
    paths:
      - 'system/contracts/sync-state-store.mjs'
      - 'system/services/sync/state-store-registry.mjs'
      - 'system/services/sync/account-memory-deferred-intents.mjs'
      - 'system/services/sync/account-memory-authorized-composition.mjs'
      - 'tests/test_sync_state_namespace_durability.mjs'
      - 'tests/test_account_memory_local_continuity_flush.mjs'
      - 'tests/test_account_memory_authorized_composition.mjs'
      - '.github/workflows/account-memory-local-continuity-flush.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/sync-state-store.mjs'
      - 'system/services/sync/state-store-registry.mjs'
      - 'system/services/sync/account-memory-deferred-intents.mjs'
      - 'system/services/sync/account-memory-authorized-composition.mjs'
      - 'tests/test_sync_state_namespace_durability.mjs'
      - 'tests/test_account_memory_local_continuity_flush.mjs'
      - 'tests/test_account_memory_authorized_composition.mjs'
      - '.github/workflows/account-memory-local-continuity-flush.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-continuity-flush:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check system/services/sync/state-store-registry.mjs
          node --check system/services/sync/account-memory-deferred-intents.mjs
          node --check system/services/sync/account-memory-authorized-composition.mjs
          node --check tests/test_sync_state_namespace_durability.mjs
          node --check tests/test_account_memory_local_continuity_flush.mjs

      - name: Prove namespace and Memory continuity durability
        run: |
          set -euo pipefail
          node --test \
            tests/test_sync_state_namespace_durability.mjs \
            tests/test_account_memory_local_continuity_flush.mjs \
            tests/test_account_memory_authorized_composition.mjs
