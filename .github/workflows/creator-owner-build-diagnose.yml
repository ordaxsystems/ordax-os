name: Diagnose Creator Git USB build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-owner-build-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Resolve canonical active kernel artifact filenames
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/ci_env.py --github-env "$GITHUB_ENV"

      - name: Resolve reusable kernel fingerprint
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/owner-dev-diagnose/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Install tools for pinned kernel UAPI and Development Base
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Required even on a verified kernel-cache hit: the native Owner
          # mountattr helper is compiled with musl-gcc against the canonical
          # initramfs-exported kernel UAPI. Do not assume cached headers exist.
          sudo apt-get install -y --no-install-recommends \
            proot gcc make perl musl-tools binutils gpg gpg-agent

      - name: Install kernel build dependencies on cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools binutils bzip2

      - name: Build kernel candidate on verified cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/owner-dev-diagnose/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py out/kernel
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir out/kernel \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir out/kernel \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Verify kernel modules input for development base
        run: |
          set -euo pipefail
          modules="out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          test -s "$modules"
          stat "$modules"
          tar -tf "$modules" >/dev/null
          echo 'DEV_BASE_KERNEL_MODULES_INPUT=PASS'

      - name: Export and verify canonical pinned kernel UAPI
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The SSOT Owner Creator/Dev Base build also runs this exact builder
          # before compiling its native ext4 mountattr helper.
          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify
          test -f out/initramfs-work/kernel-uapi-install/include/linux/mount.h

      - name: Verify PRoot device virtualization
        run: |
          set -euo pipefail
          proot --version
          sudo proot -r / -b /dev:/mnt -w / /bin/sh -ec 'test -c /mnt/null'
          echo 'DEV_BASE_PROOT_DEV=PASS'

      - name: Verify Alpine development seed access
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request

          version = '3.22.5'
          base = 'https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64'
          archive = f'alpine-minirootfs-{version}-x86_64.tar.gz'
          checksum_url = f'{base}/{archive}.sha256'
          with urllib.request.urlopen(checksum_url, timeout=120) as response:
              text = response.read().decode('utf-8')
          assert re.search(r'\b[0-9a-fA-F]{64}\b', text), text
          print('DEV_BASE_ALPINE_SEED=PASS')
          PY

      - name: Build and verify Git development base
        run: |
          set -euo pipefail
          mkdir -p out/diagnostic
          sudo -E python bootstrap/dev-base/build.py \
            --kernel-modules "out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar" \
            --out-dir out/dev-base \
            2>&1 | tee out/diagnostic/dev-base-build.log
          rootfs=out/dev-base/rootfs
          sudo touch "$rootfs/dev/null"
          cleanup_dev_null() {
            sudo rm -f "$rootfs/dev/null"
          }
          trap cleanup_dev_null EXIT
          sudo chroot "$rootfs" /usr/bin/git --version
          cleanup_dev_null
          trap - EXIT
          test -x out/dev-base/rootfs/sbin/ordax-dev-init
          test -x out/dev-base/rootfs/usr/local/bin/ordax-pull
          test -z "$(sudo find out/dev-base/rootfs/dev -mindepth 1 -print -quit)"
          python - <<'PY'
          import json
          import pathlib

          provenance = json.loads(pathlib.Path('out/dev-base/provenance.json').read_text(encoding='utf-8'))
          assert provenance['build_device_strategy'] == 'proot-bind-host-dev'
          assert provenance['source_checkout_preseeded'] is False
          assert provenance['git_client_preseeded'] is True
          print('DEV_BASE_NO_STATIC_DEVICES=PASS')
          PY

      - name: Upload development base diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dev-base-diagnostic-${{ github.sha }}
          path: out/diagnostic/dev-base-build.log
          if-no-files-found: warn
