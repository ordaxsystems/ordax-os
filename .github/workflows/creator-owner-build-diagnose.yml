name: Diagnose Creator Git USB build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-owner-build-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Resolve canonical active kernel artifact filenames
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/ci_env.py --github-env "$GITHUB_ENV"

      - name: Resolve reusable kernel fingerprint
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/owner-dev-diagnose/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Install tools for pinned kernel UAPI and Development Base
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # The canonical Owner rootfs is built by the same verified
          # Buildroot/musl producer as Creator and the Dev Base channel.
          sudo apt-get install -y --no-install-recommends \
            gcc make perl binutils gpg gpg-agent \
            erofs-utils e2fsprogs util-linux gawk cpio unzip rsync \
            file wget curl patch gettext

      - name: Install kernel build dependencies on cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools binutils bzip2

      - name: Build kernel candidate on verified cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/owner-dev-diagnose/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py out/kernel
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir out/kernel \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir out/kernel \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Verify kernel modules input for development base
        run: |
          set -euo pipefail
          modules="out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          test -s "$modules"
          stat "$modules"
          tar -tf "$modules" >/dev/null
          echo 'DEV_BASE_KERNEL_MODULES_INPUT=PASS'

      - name: Export and verify canonical pinned kernel UAPI
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The SSOT Owner Creator/Dev Base build also runs this exact builder
          # before compiling its native ext4 mountattr helper.
          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify
          test -f out/initramfs-work/kernel-uapi-install/include/linux/mount.h

      - name: Build and verify Git development base
        run: |
          set -euo pipefail
          mkdir -p out/diagnostic
          export ORDAX_SOURCE_COMMIT="$GITHUB_SHA"
          export ORDAX_HOST_PYTHON="$(command -v python3)"
          export ORDAX_KERNEL_MODULES_ARCHIVE="$PWD/out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          export ORDAX_KERNEL_MODULES_RECEIPT="$RUNNER_TEMP/owner-dev-diagnose/kernel-module-payload.json"
          export ORDAX_FIRMWARE_COVERAGE_RECEIPT="$RUNNER_TEMP/owner-dev-diagnose/firmware-coverage.json"
          sudo -E python3 bootstrap/independent-base/build.py build \
            --profile owner-development \
            --out "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base" \
            --cache "$RUNNER_TEMP/owner-dev-diagnose/buildroot-cache" --jobs 4 \
            2>&1 | tee out/diagnostic/dev-base-build.log
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base"
          python3 bootstrap/independent-base/build.py verify \
            --profile owner-development \
            --out "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base"
          python3 tools/dev-base-channel/prove_independent_rootfs.py \
            --rootfs "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base/rootfs.tar" \
            --provenance "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base/provenance.json" \
            --expected-commit "$GITHUB_SHA" \
            --receipt out/diagnostic/independent-rootfs-receipt.json
          test -s out/diagnostic/independent-rootfs-receipt.json
          sudo -E python3 tools/dev-base-channel/independent_rootfs.py materialize \
            --rootfs "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base/rootfs.tar" \
            --provenance "$RUNNER_TEMP/owner-dev-diagnose/buildroot-base/provenance.json" \
            --expected-commit "$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/owner-dev-diagnose/materialized-rootfs"
          rootfs="$RUNNER_TEMP/owner-dev-diagnose/materialized-rootfs"
          test ! -e "$rootfs/etc/alpine-release"
          test ! -e "$rootfs/sbin/apk"
          test -x "$rootfs/usr/bin/git"
          test -x "$rootfs/sbin/ordax-dev-init"
          test -x "$rootfs/usr/local/bin/ordax-pull"
          sudo touch "$rootfs/dev/null"
          trap 'sudo rm -f "$rootfs/dev/null"' EXIT
          sudo chroot "$rootfs" /usr/bin/git --version
          echo 'DEV_BASE_ALPINE_FREE_DIAGNOSTIC=PASS'

      - name: Upload development base diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dev-base-diagnostic-${{ github.sha }}
          path: out/diagnostic/dev-base-build.log
          if-no-files-found: warn
