name: Diagnose Creator Git USB build

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/base/firmware_policy.py'
      - 'bootstrap/base/kernel_module_payload.py'
      - 'bootstrap/independent-base/**'
      - '!bootstrap/independent-base/**/*.md'
      - 'bootstrap/kernel/**'
      - '!bootstrap/kernel/candidates/**'
      - '!bootstrap/kernel/candidate_pipeline.py'
      - '!bootstrap/kernel/update_engine.py'
      - '!bootstrap/kernel/module_archive.py'
      - 'bootstrap/dev-base/ordax-dev-init'
      - 'bootstrap/dev-base/ordax-diagnose'
      - 'bootstrap/dev-base/ordax-network'
      - 'bootstrap/dev-base/ordax-pull'
      - 'bootstrap/dev-base/ordax-rollback'
      - 'bootstrap/dev-base/ordax-run'
      - 'bootstrap/recovery/entrypoint'
      - 'docs/contracts/hardware-support-matrix.json'
      - 'system/services/base-update/dev_channel.py'
      - 'tools/dev-base-channel/**'
      - 'tools/ci/portable_component_cache.py'
      - 'tests/test_independent_dev_channel_compatibility.py'
      - 'tests/test_creator_kernel_reuse_workflows.py'
      - '.github/workflows/creator-owner-build-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-owner-build-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Resolve canonical active kernel artifact filenames
        run: |
          set -euo pipefail
          python3 bootstrap/kernel/ci_env.py --github-env "$GITHUB_ENV"

      - name: Install Independent Base build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-13 g++ bc perl bison flex openssl libssl-dev \
            libelf-dev dwarves kmod xz-utils pkg-config gawk cpio unzip rsync \
            file binutils wget curl patch git erofs-utils e2fsprogs util-linux

      - name: Resolve reusable kernel fingerprint
        id: component-fingerprints
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          export ORDAX_COMPONENT_CACHE_ENVIRONMENT="${RUNNER_OS:?}/${RUNNER_ARCH:?}/${ImageOS}/${ImageVersion}"
          printf 'ORDAX_COMPONENT_CACHE_ENVIRONMENT=%s\n' "$ORDAX_COMPONENT_CACHE_ENVIRONMENT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/owner-dev-diagnose/metadata"
          python3 tools/ci/portable_component_cache.py fingerprints --github-output "$GITHUB_OUTPUT"

      - name: Restore verified kernel component
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Build kernel candidate on verified cache miss
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel component and exact integration binding
        env:
          ORDAX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/owner-dev-diagnose/metadata"
          cache_hit='${{ steps.kernel-cache.outputs.cache-hit }}'
          if [ "$cache_hit" != 'true' ]; then
            cache_hit=false
          fi
          python bootstrap/kernel/verify.py out/kernel
          if [ "$cache_hit" = 'false' ]; then
            python3 tools/ci/portable_component_cache.py record \
              --component kernel \
              --out-dir out/kernel \
              --source-commit "$ORDAX_SOURCE_COMMIT" \
              > "$metadata/kernel-cache-record.json"
          fi
          python3 tools/ci/portable_component_cache.py verify \
            --component kernel \
            --out-dir out/kernel \
            --integration-commit "$ORDAX_SOURCE_COMMIT" \
            --cache-hit "$cache_hit" \
            --receipt "$metadata/kernel-component-reuse.json"

      - name: Save verified kernel component
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: ordax-portable-component-v1-${{ runner.os }}-${{ runner.arch }}-kernel-${{ steps.component-fingerprints.outputs.kernel }}

      - name: Verify kernel modules input for Independent Base
        run: |
          set -euo pipefail
          modules="out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          test -f "$modules"
          test ! -L "$modules"
          test -s "$modules"
          tar -tf "$modules" >/dev/null
          echo 'INDEPENDENT_BASE_KERNEL_MODULES_INPUT=PASS'

      - name: Build and verify Owner Independent Base
        run: |
          set -euo pipefail
          independent="$RUNNER_TEMP/owner-dev-diagnose/independent"
          modules="out/kernel/kernel-modules-$ORDAX_KERNEL_VERSION.tar"
          mkdir -p out/diagnostic out/dev-base

          export ORDAX_HOST_PYTHON="$(command -v python3)"
          export ORDAX_KERNEL_MODULES_ARCHIVE="$modules"
          export ORDAX_KERNEL_MODULES_RECEIPT="$independent/kernel-module-payload.json"
          export ORDAX_FIRMWARE_COVERAGE_RECEIPT="$independent/firmware-coverage.json"

          python3 bootstrap/independent-base/build.py build \
            --profile owner-development \
            --out "$independent" \
            --cache "$RUNNER_TEMP/owner-dev-diagnose/buildroot-cache" \
            --jobs 4 \
            2>&1 | tee out/diagnostic/independent-base-build.log
          python3 bootstrap/independent-base/build.py verify \
            --profile owner-development \
            --out "$independent"
          python3 tools/dev-base-channel/prove_independent_rootfs.py \
            --rootfs "$independent/rootfs.tar" \
            --provenance "$independent/provenance.json" \
            --expected-commit "$GITHUB_SHA" \
            --receipt "$independent/dev-channel-rootfs-compatibility.json"
          python3 tools/dev-base-channel/independent_rootfs.py materialize \
            --rootfs "$independent/rootfs.tar" \
            --provenance "$independent/provenance.json" \
            --expected-commit "$GITHUB_SHA" \
            --destination out/dev-base/rootfs

          rootfs=out/dev-base/rootfs
          sudo chroot "$rootfs" /usr/bin/git --version
          test -x "$rootfs/sbin/ordax-dev-init"
          test -x "$rootfs/usr/local/bin/ordax-pull"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "owner-dev-diagnose"
                  / "independent"
                  / "provenance.json"
              ).read_text(encoding="utf-8")
          )
          assert provenance["profile"] == "owner-development"
          assert provenance["owner_development_capabilities_verified"] is True
          assert provenance["physical_artifact_authorized"] is False
          assert provenance["signed_release_equivalence_proven"] is False
          print("OWNER_INDEPENDENT_BASE=PASS")
          print("OWNER_INDEPENDENT_BASE_PHYSICAL_AUTHORIZATION=NO")
          PY

      - name: Upload Independent Base diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: independent-base-diagnostic-${{ github.sha }}
          path: out/diagnostic/independent-base-build.log
          if-no-files-found: warn
