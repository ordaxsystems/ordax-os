name: Account Memory Protected Mutation Port

on:
  pull_request:
    paths:
      - 'system/contracts/memory.mjs'
      - 'system/contracts/sync-state-store.mjs'
      - 'system/services/memory/runtime.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-crash-recovery-journal.mjs'
      - 'system/services/sync/account-memory-protected-mutation-port.mjs'
      - 'tests/test_account_memory_protected_mutation_port.mjs'
      - '.github/workflows/account-memory-protected-mutation-port.yml'
  push:
    branches: [main]
    paths:
      - 'system/contracts/memory.mjs'
      - 'system/contracts/sync-state-store.mjs'
      - 'system/services/memory/runtime.mjs'
      - 'system/services/sync/account-memory-runtime.mjs'
      - 'system/services/sync/account-memory-crash-recovery-journal.mjs'
      - 'system/services/sync/account-memory-protected-mutation-port.mjs'
      - 'tests/test_account_memory_protected_mutation_port.mjs'
      - '.github/workflows/account-memory-protected-mutation-port.yml'

permissions:
  contents: read

jobs:
  protected-mutation-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check system/services/sync/account-memory-protected-mutation-port.mjs
          node --check tests/test_account_memory_protected_mutation_port.mjs

      - name: Prove protected mutation ordering and fail-closed durability
        run: |
          set -euo pipefail
          node --test tests/test_account_memory_protected_mutation_port.mjs
