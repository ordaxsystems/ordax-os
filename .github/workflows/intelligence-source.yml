name: Intelligence cross-repository source gate
on:
  pull_request:
    paths:
      - 'docs/contracts/intelligence-source.json'
      - 'tools/intelligence-source/**'
      - 'tests/test_intelligence_composed_runtime.mjs'
      - 'tests/test_intelligence_source_gate.py'
      - 'tests/test_intelligence_external_integration.mjs'
      - '.github/workflows/intelligence-source.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/intelligence-source.json'
      - 'tools/intelligence-source/**'
      - 'tests/test_intelligence_composed_runtime.mjs'
      - 'tests/test_intelligence_source_gate.py'
      - '.github/workflows/intelligence-source.yml'
permissions:
  contents: read
jobs:
  verify-external-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ordaxsystems/ordax-intelligence
          ref: c3dbb73e7f3cdf9a2043b059d7376fb0a06a1272
          path: _upstream/intelligence
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_intelligence_source_gate.py' -v
      - run: python tools/intelligence-source/materialize.py verify --source-dir _upstream/intelligence
      - run: python tools/intelligence-source/materialize.py stage --source-dir _upstream/intelligence --out-dir "${RUNNER_TEMP}/ordax-intelligence-stage"
      - name: Prove portable runtime binds real OS public contracts
        env:
          ORDAX_INTELLIGENCE_STAGE: ${{ runner.temp }}/ordax-intelligence-stage
        run: node --test tests/test_intelligence_external_integration.mjs
      - name: Assemble pinned Surface using its canonical OS-owned action
        uses: ./.github/actions/assemble-surface
        with:
          source-root: .
          out-root: ${{ runner.temp }}/ordax-surface-assembled
      - name: Compose provisional Native runtime using verified Intelligence and OS-owned ports
        run: |
          python tools/intelligence-source/compose.py \
            --os-root "${RUNNER_TEMP}/ordax-surface-assembled" \
            --intelligence-stage "${RUNNER_TEMP}/ordax-intelligence-stage" \
            --out-root "${RUNNER_TEMP}/ordax-intelligence-composed"
      - name: Prove Native components use external source without bundled legacy bodies
        env:
          ORDAX_INTELLIGENCE_COMPOSED_ROOT: ${{ runner.temp }}/ordax-intelligence-composed
        run: node --test tests/test_intelligence_composed_runtime.mjs
      - name: Prove tampered source stage cannot reach Native candidate
        run: |
          cp -a "${RUNNER_TEMP}/ordax-intelligence-stage" "${RUNNER_TEMP}/ordax-intelligence-tampered"
          printf '/* tamper */' >> "${RUNNER_TEMP}/ordax-intelligence-tampered/system/intelligence-source/src/index.mjs"
          if python tools/intelligence-source/compose.py \
            --os-root "${RUNNER_TEMP}/ordax-surface-assembled" \
            --intelligence-stage "${RUNNER_TEMP}/ordax-intelligence-tampered" \
            --out-root "${RUNNER_TEMP}/should-not-exist"; then
            echo "::error::Modified source was accepted" >&2
            exit 1
          fi
          test ! -e "${RUNNER_TEMP}/should-not-exist"
      - name: Refuse staging into assembled Surface source
        run: |
          if python tools/intelligence-source/compose.py \
            --os-root "${RUNNER_TEMP}/ordax-surface-assembled" \
            --intelligence-stage "${RUNNER_TEMP}/ordax-intelligence-stage" \
            --out-root "${RUNNER_TEMP}/ordax-surface-assembled/.intelligence-forbidden-output"; then
            echo "::error::Source checkout was modified" >&2
            exit 1
          fi
          test ! -e "${RUNNER_TEMP}/ordax-surface-assembled/.intelligence-forbidden-output"
          git diff --exit-code -- system/
      - name: Verify no external source tracked in OS, no engine or model and exact receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("${{ runner.temp }}/ordax-intelligence-stage")
          receipt=json.loads((root/"intelligence-source-receipt.json").read_text())
          assert receipt["source_file_count"] == 8
          assert receipt["source_commit"] == "c3dbb73e7f3cdf9a2043b059d7376fb0a06a1272"
          assert receipt["engine_included"] is False and receipt["model_included"] is False
          assert receipt["activation_authorized"] is False
          for path in ("index.mjs","intelligence/runtime.mjs","local-ai/runtime.mjs"):
              assert (root/"system/intelligence-source/src"/path).is_file()
          assert (root/"system/intelligence-source/tools/inference-builder/build.py").is_file()
          assert not Path("system/intelligence-source").exists()
          PY
