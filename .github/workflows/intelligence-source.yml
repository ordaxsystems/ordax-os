name: Same-commit OrdaX Intelligence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'system/intelligence/**'
      - 'system/services/intelligence/runtime.mjs'
      - 'system/services/intelligence/model-router.mjs'
      - 'system/services/local-ai/*.mjs'
      - 'docs/contracts/intelligence-source.json'
      - 'tests/test_intelligence_windows_artifact_distribution.py'
      - '.github/workflows/windows-desktop-dev.yml'
      - 'system/services/local-ai/source-lock.json'
      - 'tools/intelligence/**'
      - '.github/actions/assemble-intelligence/**'
      - '.github/actions/resolve-intelligence-builder/**'
      - '.github/workflows/intelligence-source.yml'
  pull_request:
    paths:
      - 'system/intelligence/**'
      - 'system/services/intelligence/runtime.mjs'
      - 'system/services/intelligence/model-router.mjs'
      - 'system/services/local-ai/*.mjs'
      - 'docs/contracts/intelligence-source.json'
      - 'tests/test_intelligence_windows_artifact_distribution.py'
      - '.github/workflows/windows-desktop-dev.yml'
      - 'system/services/local-ai/source-lock.json'
      - 'tools/intelligence/**'
      - '.github/actions/assemble-intelligence/**'
      - '.github/actions/resolve-intelligence-builder/**'
      - '.github/workflows/intelligence-source.yml'
permissions:
  contents: read
jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify same OS commit source and execution safety
        run: |
          python3 tools/intelligence/verify.py
          python -m unittest discover -s tests -p 'test_intelligence_canonical_integrity.py' -v
          python -m unittest discover -s tests -p 'test_intelligence_windows_artifact_distribution.py' -v
          /bin/sh -n system/intelligence/owner-stage.sh
          python -m unittest discover -s system/intelligence/tests -p 'test_inference_builder_isolation.py' -v
          python -m unittest discover -s system/intelligence/tests -p 'test_windows_inference_candidate.py' -v
          python -m unittest discover -s system/intelligence/tests -p 'test_local_http_benchmark.py' -v
      - name: Test portable inference, routing, streaming and OS integration
        run: |
          npm --prefix system/intelligence run ci
          npm --prefix system/intelligence run test:compat
          node --test tests/test_intelligence_runtime.mjs tests/test_local_ai_runtime.mjs tests/test_application_intelligence_context.mjs tests/test_native_intelligence_service.mjs
