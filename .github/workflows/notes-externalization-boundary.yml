name: Notes Platform Absence

on:
  pull_request:
    paths:
      - 'system/apps/**'
      - 'system/adapters/**'
      - 'system/contracts/**'
      - 'system/composition/**'
      - 'system/services/apps/**'
      - 'system/services/i18n/**'
      - 'system/surface/**'
      - 'docs/contracts/first-party-app-delivery.json'
      - 'tests/test_notes_platform_absence.py'
      - '.github/workflows/notes-externalization-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'system/apps/**'
      - 'system/adapters/**'
      - 'system/contracts/**'
      - 'system/composition/**'
      - 'system/services/apps/**'
      - 'system/services/i18n/**'
      - 'system/surface/**'
      - 'docs/contracts/first-party-app-delivery.json'
      - 'tests/test_notes_platform_absence.py'
      - '.github/workflows/notes-externalization-boundary.yml'

permissions:
  contents: read

jobs:
  notes-platform-absence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prove remove-first Gate A
        run: |
          set -euo pipefail
          python tests/test_notes_platform_absence.py
