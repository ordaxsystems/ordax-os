name: Public Auth Provider Live Proof

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Canonical public HTTPS origin to verify
        required: true
        type: string
      scope:
        description: Active Auth owner or read-only destination pre-cutover proof
        required: true
        type: choice
        options:
          - active
          - destination
        default: active

permissions:
  contents: read

jobs:
  prove-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORDAX_REQUESTED_ORIGIN: ${{ inputs.origin }}
      ORDAX_PROBE_SCOPE: ${{ inputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require official repository and reviewed main commit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ordaxsystems/ordax-os"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Resolve scoped Auth authority and origin from source contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/public-site/resolve_auth_provider_target.py \
            --origin "${ORDAX_REQUESTED_ORIGIN}" \
            --scope "${ORDAX_PROBE_SCOPE}" >> "${GITHUB_ENV}"

      - name: Require provider-management credential without printing it
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo 'SUPABASE_ACCESS_TOKEN repository secret is required.' >&2
            exit 2
          }
          echo 'PUBLIC_AUTH_PROVIDER_PROOF_CREDENTIAL_PRESENT=YES'
          echo 'PUBLIC_AUTH_PROVIDER_PROOF_CREDENTIAL_PRINTED=NO'

      - name: Probe hosted Supabase Auth configuration
        id: provider_probe
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ORDAX_PROVIDER_PROOF_PATH: ${{ runner.temp }}/auth-provider-proof.json
        run: |
          set -euo pipefail
          python tools/public-site/probe_auth_provider.py --live > "${RUNNER_TEMP}/probe.out"
          head -n 1 "${RUNNER_TEMP}/probe.out" > "${ORDAX_PROVIDER_PROOF_PATH}"
          rm -f "${RUNNER_TEMP}/probe.out"

      - name: Validate sanitized proof
        shell: bash
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/auth-provider-proof.json" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["$schema"] == "prototype-ordax.auth-provider-proof/2"
          assert data["provider"] == "supabase"
          assert data["project_ref"] == "redacted"
          expected_binding = hashlib.sha256(
              ("supabase-auth-project/1:" + os.environ["SUPABASE_PROJECT_REF"]).encode("ascii")
          ).hexdigest()
          assert data["project_binding"] == expected_binding
          assert data["source_commit"] == os.environ["GITHUB_SHA"]
          assert type(data["ready"]) is bool
          assert isinstance(data["checks"], dict)
          assert set(data["checks"]) == {
              "confirm_email", "password_policy", "production_origin",
              "redirect_allowlist", "recovery_template",
              "resend_smtp_settings", "branded_confirmation_template",
          }
          assert all(type(value) is bool for value in data["checks"].values())
          assert data["ready"] is all(data["checks"].values())
          serialized = json.dumps(data, sort_keys=True).lower()
          for forbidden in ("supabase_access_token", "authorization", "service_role_key", "secret_key", "bearer "):
              assert forbidden not in serialized
          print("PUBLIC_AUTH_PROVIDER_PROOF=SANITIZED")
          PY

      - name: Upload sanitized provider proof only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: auth-provider-proof-${{ inputs.scope }}-${{ github.sha }}
          path: ${{ runner.temp }}/auth-provider-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed when hosted provider is not ready
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.provider_probe.outcome }}
        run: |
          set -euo pipefail
          test "${PROBE_OUTCOME}" = "success" || {
            echo "PUBLIC_AUTH_PROVIDER_PROOF=BLOCKED" >&2
            exit 2
          }
