name: Portable QEMU Impact Contract

on:
  pull_request:
    paths:
      - "tools/ci/portable_qemu_impact.py"
      - "tests/test_portable_qemu_impact.py"
      - "tests/test_independent_surface_qemu_binding.py"
      - "tests/test_portable_component_reuse_workflow.py"
      - ".github/workflows/portable-qemu-impact-contract.yml"
  push:
    branches: [main]
    paths:
      - "tools/ci/portable_qemu_impact.py"
      - "tests/test_portable_qemu_impact.py"
      - "tests/test_independent_surface_qemu_binding.py"
      - "tests/test_portable_component_reuse_workflow.py"
      - ".github/workflows/portable-qemu-impact-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-qemu-impact-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify causal impact policy and QEMU workflow contract
        run: |
          python3 -m unittest tests.test_portable_qemu_impact tests.test_portable_component_reuse_workflow tests.test_independent_surface_qemu_binding -v

      - name: Verify classifier and contract sources compile
        run: python3 -m py_compile tools/ci/portable_qemu_impact.py tests/test_portable_qemu_impact.py tests/test_independent_surface_qemu_binding.py tests/test_portable_component_reuse_workflow.py
