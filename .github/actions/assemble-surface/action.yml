name: Assemble canonical OrdaX Surface
description: Assemble the Surface from the same committed OS Git tree, without external checkout
inputs:
  out-root:
    description: New absolute disposable release source directory
    required: true
  source-root:
    description: OS source checkout
    required: false
    default: '.'
outputs:
  root:
    description: Verified release root
    value: ${{ steps.assemble.outputs.root }}
runs:
  using: composite
  steps:
    - name: Assemble same-commit OS and Surface
      id: assemble
      shell: bash
      working-directory: ${{ inputs.source-root }}
      env:
        ORDAX_OUTPUT_ROOT: ${{ inputs.out-root }}
      run: |
        set -euo pipefail
        case "$ORDAX_OUTPUT_ROOT" in
          /*) ;;
          *) echo "::error::absolute staging path required" >&2; exit 1 ;;
        esac
        python3 tools/surface-source/materialize.py verify --os-root "$PWD"
        python3 tools/surface-source/assemble.py --os-root "$PWD" --out-root "$ORDAX_OUTPUT_ROOT"
        python3 - "$ORDAX_OUTPUT_ROOT" <<'PY'
        import json, pathlib, subprocess, sys
        root=pathlib.Path(sys.argv[1])
        receipt=json.loads((root/"system/surface/source-provenance.json").read_text())
        sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
        assert receipt["os_commit"] == sha
        assert receipt["surface_source_commit"] == sha
        assert receipt["surface_source_repository"] == "ordaxsystems/ordax-os"
        assert receipt["single_visual_source"] is True
        assert (root/"system/surface/ui/surface.mjs").is_file()
        assert (root/"system/surface/workspace").is_dir()
        print("SAME_COMMIT_SURFACE=VERIFIED",sha)
        PY
        echo "root=$ORDAX_OUTPUT_ROOT" >> "$GITHUB_OUTPUT"
