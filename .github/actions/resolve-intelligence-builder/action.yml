name: Resolve canonical OS Intelligence inference builder
description: Verify same-commit OS source; never clone or build an inference engine
outputs:
  builder:
    description: Verified same-commit builder
    value: ${{ steps.resolve.outputs.builder }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python3 tools/intelligence/verify.py --root "$GITHUB_WORKSPACE"
        builder="$GITHUB_WORKSPACE/system/intelligence/tools/inference-builder/build.py"
        python3 - "$builder" <<'PY'
        from pathlib import Path
        import sys
        target=Path(sys.argv[1])
        compile(target.read_text(encoding="utf-8"),str(target),"exec")
        PY
        echo "builder=$builder" >> "$GITHUB_OUTPUT"
        echo "ORDAX_AI_BUILDER=$builder" >> "$GITHUB_ENV"
