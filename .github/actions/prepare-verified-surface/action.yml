name: Verify canonical Surface in OS checkout
description: Validate committed UI and Workspace without a source clone or staging copy
runs:
  using: composite
  steps:
    - name: Verify Surface Git blobs in current OS commit
      shell: bash
      run: |
        set -euo pipefail
        test -f system/surface/ui/surface.mjs
        test -d system/surface/workspace
        python3 tools/surface-source/materialize.py verify --os-root "$PWD"
        echo "ORDAX_VISUAL_SOURCE=OS_COMMIT"
