name: Resolve canonical Creator module
description: Verify creator/ at the exact current ordax-os Git commit without external source checkout

inputs:
  source-root:
    description: Path to checkout containing the Creator module
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Verify same-commit Creator source
      shell: bash
      working-directory: ${{ inputs.source-root }}
      env:
        GITHUB_EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        root="$(git rev-parse --show-toplevel)"
        source="$root/creator"
        test -f "$source/go.mod"
        test -f "$source/cmd/ordax-creator-native-targets/main.go"
        test "$(head -n 1 "$source/go.mod")" = 'module github.com/ordaxsystems/ordax-os/creator'
        # A pull_request may check out either the event's synthetic merge
        # SHA or its immutable head SHA. A workflow may also explicitly
        # bind ORDAX_OWNER_SOURCE_COMMIT. Accept only these event-owned
        # identities, never an arbitrary checkout or a mutable branch ref.
        source_commit="$(git rev-parse HEAD)"
        event_head_sha="${GITHUB_EVENT_PR_HEAD_SHA:-}"
        [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
        case "$source_commit" in
          "$GITHUB_SHA") ;;
          "$event_head_sha") [ -n "$event_head_sha" ] || exit 1 ;;
          "${ORDAX_OWNER_SOURCE_COMMIT:-}") [ -n "${ORDAX_OWNER_SOURCE_COMMIT:-}" ] || exit 1 ;;
          *) echo 'Creator checkout differs from exact GitHub event identities' >&2; exit 1 ;;
        esac
        if [ -n "${ORDAX_OWNER_SOURCE_COMMIT:-}" ]; then
          test "$source_commit" = "$ORDAX_OWNER_SOURCE_COMMIT"
        fi
        test -z "$(git status --porcelain --untracked-files=all -- creator)"
        python3 - <<'PY'
        import json
        from pathlib import Path
        pin=json.loads(Path('docs/contracts/native-release-assembly.json').read_text(encoding='utf-8'))['creator_source']
        assert pin['repository']=='ordaxsystems/ordax-os'
        assert pin['path']=='creator'
        assert pin['module']=='github.com/ordaxsystems/ordax-os/creator'
        assert pin['physical_apply_authorized'] is False
        assert pin['publisher_authority']=='ordaxsystems/ordax-os'
        assert 'commit' not in pin and 'tree' not in pin
        PY
        tree="$(git rev-parse 'HEAD:creator')"
        test -n "$tree"
        printf '%s\n' "ORDAX_CREATOR_NATIVE_SOURCE=$source" "ORDAX_CREATOR_SOURCE_COMMIT=$source_commit" "ORDAX_CREATOR_SOURCE_TREE=$tree" "ORDAX_CREATOR_SOURCE_REPOSITORY=ordaxsystems/ordax-os" >> "$GITHUB_ENV"
        echo "CREATOR_MONOREPO_COMMIT=$source_commit"
        echo "CREATOR_MONOREPO_TREE=$tree"
        echo 'CREATOR_SOURCE_PHYSICAL_WRITE_AUTHORIZED=NO'
