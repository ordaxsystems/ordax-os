name: Compose verified OrdaX Intelligence from same OS commit
description: Copy and verify the canonical Intelligence module without external checkout or activation
inputs:
  source-root:
    description: Absolute existing same-commit OS+Surface stage
    required: true
  out-root:
    description: New disposable candidate staging root
    required: true
outputs:
  root:
    description: Validated disposable candidate
    value: ${{ steps.compose.outputs.root }}
runs:
  using: composite
  steps:
    - id: compose
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ORDAX_INPUT_ROOT: ${{ inputs.source-root }}
        ORDAX_OUTPUT_ROOT: ${{ inputs.out-root }}
      run: |
        set -euo pipefail
        case "$ORDAX_INPUT_ROOT" in /*) ;; *) exit 1 ;; esac
        case "$ORDAX_OUTPUT_ROOT" in /*) ;; *) exit 1 ;; esac
        test -f "$ORDAX_INPUT_ROOT/system/surface/source-provenance.json"
        test ! -e "$ORDAX_OUTPUT_ROOT"
        python3 tools/intelligence/verify.py --root "$ORDAX_INPUT_ROOT"
        mkdir -p "$ORDAX_OUTPUT_ROOT"
        cp -a "$ORDAX_INPUT_ROOT/." "$ORDAX_OUTPUT_ROOT/"
        python3 tools/intelligence/verify.py --root "$ORDAX_OUTPUT_ROOT" --write-receipt
        python3 tools/intelligence/verify.py --root "$ORDAX_OUTPUT_ROOT" --require-receipt
        echo "root=$ORDAX_OUTPUT_ROOT" >> "$GITHUB_OUTPUT"
