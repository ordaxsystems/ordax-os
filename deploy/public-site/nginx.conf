worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    # The TLS terminator is required to run on the same host and append the
    # real client address to X-Forwarded-For. Trust only loopback; arbitrary
    # Internet clients cannot choose the address used by the rate limiter.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map "$request_method:$uri" $ordax_credential_rate_key {
        default "";
        ~^POST:/auth/(login|register)$ $binary_remote_addr;
    }

    map "$request_method:$uri" $ordax_recovery_request_rate_key {
        default "";
        "POST:/auth/recover" $binary_remote_addr;
    }

    map "$request_method:$uri" $ordax_recovery_completion_rate_key {
        default "";
        ~^(GET:/auth/recover/verify|POST:/auth/recover/complete)$ $binary_remote_addr;
    }

    limit_req_zone $ordax_credential_rate_key zone=ordax_auth_credentials:10m rate=10r/m;
    limit_req_zone $ordax_recovery_request_rate_key zone=ordax_auth_recovery_request:10m rate=3r/m;
    limit_req_zone $ordax_recovery_completion_rate_key zone=ordax_auth_recovery_completion:10m rate=10r/m;

    map $uri $ordax_cache_control {
        default "public, max-age=300";
        ~/$ "no-cache";
        ~\.html$ "no-cache";
        /config/public-site.json "no-store";
        /releases/catalog.json "no-store";
        ~^/(auth|account|sync|network)/ "no-store";
    }

    server {
        # The public TLS terminator must proxy to this loopback listener.
        # Never expose this HTTP listener directly to the Internet.
        listen 127.0.0.1:8080;
        server_name _;

        root /srv/ordax-public-site;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control $ordax_cache_control always;

        # Return an explicit client-throttling status instead of Nginx's
        # default 503 when an account abuse limit is exceeded.
        limit_req_status 429;
        limit_req_log_level warn;

        # This generic host adapter has no production workload identity equivalent
        # to Vercel OIDC. Sensitive account traffic therefore fails closed here
        # instead of forwarding directly to the internal Supabase function.
        location ~ ^/(auth|account|sync|network)/ {
            default_type application/json;
            return 503 '{"$schema":"prototype-ordax.public-site-proxy-error/1","error":"trusted-account-boundary-required"}';
        }

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}
