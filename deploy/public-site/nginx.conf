worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    # The TLS terminator is required to run on the same host and append the
    # real client address to X-Forwarded-For. Trust only loopback; arbitrary
    # Internet clients cannot choose the address used by the rate limiter.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map "$request_method:$uri" $ordax_credential_rate_key {
        default "";
        ~^POST:/auth/(login|register)$ $binary_remote_addr;
    }

    map "$request_method:$uri" $ordax_recovery_request_rate_key {
        default "";
        "POST:/auth/recover" $binary_remote_addr;
    }

    map "$request_method:$uri" $ordax_recovery_completion_rate_key {
        default "";
        ~^(GET:/auth/recover/verify|POST:/auth/recover/complete)$ $binary_remote_addr;
    }

    map "$request_method:$uri" $ordax_account_sensitive_rate_key {
        default "";
        ~^POST:/account/close$ $binary_remote_addr;
    }

    limit_req_zone $ordax_credential_rate_key zone=ordax_auth_credentials:10m rate=10r/m;
    limit_req_zone $ordax_recovery_request_rate_key zone=ordax_auth_recovery_request:10m rate=3r/m;
    limit_req_zone $ordax_recovery_completion_rate_key zone=ordax_auth_recovery_completion:10m rate=10r/m;
    limit_req_zone $ordax_account_sensitive_rate_key zone=ordax_account_sensitive:10m rate=5r/m;

    map $uri $ordax_cache_control {
        default "public, max-age=300";
        ~/$ "no-cache";
        ~\.html$ "no-cache";
        /config/public-site.json "no-store";
        /releases/catalog.json "no-store";
        ~^/(auth|sync|account)/ "no-store";
    }

    server {
        # The public TLS terminator must proxy to this loopback listener.
        # Never expose this HTTP listener directly to the Internet.
        listen 127.0.0.1:8080;
        server_name _;

        root /srv/ordax-public-site;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control $ordax_cache_control always;

        # Return an explicit client-throttling status instead of Nginx's
        # default 503 when an account abuse limit is exceeded.
        limit_req_status 429;
        limit_req_log_level warn;

        location ~ ^/(auth|sync|account)/ {
            limit_req zone=ordax_auth_credentials burst=5 nodelay;
            limit_req zone=ordax_auth_recovery_request burst=2 nodelay;
            limit_req zone=ordax_auth_recovery_completion burst=5 nodelay;
            limit_req zone=ordax_account_sensitive burst=2 nodelay;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name eobcxuyvhkvdmkbaihwh.supabase.co;
            proxy_set_header Host eobcxuyvhkvdmkbaihwh.supabase.co;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # $remote_addr is the restored real client address because only
            # the loopback TLS terminator is trusted above.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-OrdaX-Public-Site 1;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Cache-Control;
            rewrite ^(/(?:auth|sync|account)/.*)$ /functions/v1/ordax-account-gateway$1 break;
            proxy_pass https://eobcxuyvhkvdmkbaihwh.supabase.co;
        }

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}
